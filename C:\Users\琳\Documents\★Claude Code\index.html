};

/* ============================== UI ============================== */
const CAT_LABELS = {'2L30':'2L30','2L50':'2L50','L50':'L','その他':'その他'};
const CAT_COLORVAR = {'2L30':'var(--chart-2l30)','2L50':'var(--chart-2l50)','L50':'var(--chart-l50)','その他':'var(--chart-other)'};
// 品種を色分けする際の系列色（将来5品種まで対応）
const SERIES_COLORS = ['var(--chart-blue)','var(--accent)','var(--warn)','var(--primary)','var(--ink-muted)'];

const UI = {
  themeMode(){ return localStorage.getItem('curcuma.theme') || 'auto'; },
  setThemeMode(mode){
    try{ localStorage.setItem('curcuma.theme', mode); }catch(e){}
    UI.applyTheme();
  },
  applyTheme(){
    const mode = UI.themeMode();
    const root = document.documentElement;
    if(mode==='auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', mode);
    const btn = document.getElementById('theme-btn');
    if(btn){
      btn.innerHTML = mode==='dark' ? Icon.moon : mode==='light' ? Icon.sun : Icon.auto;
      btn.setAttribute('aria-label', 'テーマ: ' + (mode==='auto'?'自動':mode==='dark'?'ダーク':'ライト'));
    }
  },
  cycleTheme(){
    const order = ['auto','light','dark'];
    const cur = UI.themeMode();
    const next = order[(order.indexOf(cur)+1)%order.length];
    UI.setThemeMode(next);
  },

  renderAppBar(){
    document.getElementById('data-chip').textContent = `産地${Store.sanchi.size}件・自分${Store.jibun.length}件`;
    const region = document.getElementById('storage-banner-region');
    if(Store.loadError){
      region.innerHTML = `<div class="storage-banner">⚠ 前回の保存データを読み込めませんでした（破損の可能性）。壊れたデータは退避しました。「保存」タブのバックアップから復元してください。</div>`;
    } else if(!Store.available){
      region.innerHTML = `<div class="storage-banner">この端末では自動保存が効きません。作業内容は「保存」タブから都度バックアップしてください。</div>`;
    } else if(Store.saveError){
      region.innerHTML = `<div class="storage-banner">⚠ 自動保存に失敗しています（端末の容量オーバーの可能性）。「保存」タブからバックアップを書き出してください。</div>`;
    } else {
      region.innerHTML = '';
    }
  },

  renderTabs(){
    const tabs = [
      {id:'sanchi', label:'産地', icon:Icon.origin},
      {id:'mine', label:'自分', icon:Icon.mine},
      {id:'import', label:'取込', icon:Icon.import},
      {id:'backup', label:'保存', icon:Icon.backup}
    ];
    const bar = document.getElementById('tabbar');
    bar.setAttribute('role','tablist');
    bar.innerHTML = tabs.map(t=>`
      <button class="tab" role="tab" aria-selected="${State.tab===t.id}" data-action="switch-tab" data-tab="${t.id}">
        ${t.icon}<span>${t.label}</span>
      </button>`).join('');
  },

  route(tab){
    State.tab = tab;
    UI.renderTabs();
    UI.renderMain();
  },

  renderMain(){
    const main = document.getElementById('main');
    UI.renderAppBar();
    if(Store.sanchi.size===0 && Store.jibun.length===0 && State.tab!=='import' && State.tab!=='backup'){
      State.tab = 'import';
      UI.renderTabs();
    }
    if(State.tab==='sanchi') main.innerHTML = UI.screenSanchi();
    else if(State.tab==='mine') main.innerHTML = UI.screenMine();
    else if(State.tab==='import') main.innerHTML = UI.screenImport();
    else main.innerHTML = UI.screenBackup();
    UI.afterRender();
  },

  afterRender(){
    if(State.tab==='sanchi'){
      const lineWrap = document.querySelector('[data-line-wrap]');
      if(lineWrap) UI.wireLineTooltip(lineWrap);
      const multiWrap = document.querySelector('[data-multiline-wrap]');
      if(multiWrap) UI.wireMultiLineTooltip(multiWrap);
      // 折れ線は初期表示を最新日（右端）に。左スクロールで過去へ遡れる。
      const scroller = document.querySelector('#main .chart-scroll');
      if(scroller) scroller.scrollLeft = scroller.scrollWidth;
    }
    if(State.tab==='mine'){
      const barWrap = document.querySelector('[data-bar-wrap]');
      if(barWrap) UI.wireBarTooltip(barWrap);
    }
    if(State.tab==='import'){
      const seg = document.getElementById('mine-mode-csv-panel');
      const seg2 = document.getElementById('mine-mode-manual-panel');
      if(seg && seg2){
        seg.classList.toggle('hidden', State.mineMode!=='csv');
        seg2.classList.toggle('hidden', State.mineMode!=='manual');
      }
    }
  },

  /* ---------- Screen: 産地分析 ---------- */
  donutLegendHTML(cats, total){
    return Object.keys(cats).map(cat=>{
      const val = cats[cat];
      return `<div class="legend-item" data-action="legend-toggle" data-cat="${cat}" data-active="${State.donutHighlight===cat}">
        <span class="legend-dot" style="background:${CAT_COLORVAR[cat]}"></span>
        <span class="legend-label">${CAT_LABELS[cat]}</span>
        <span class="legend-val tnum">${Fmt.num(val)}</span>
      </div>`;
    }).join('');
  },
  screenSanchi(){
    State.multiMeta = null;
    const list = Compute.varietyList();
    if(list.length===0){
      return `<h1 class="screen-title">産地分析</h1>` + UI.emptyState('産地データがまだありません', '産地CSVを取込むと、品種ごとの規格構成と価格推移を確認できます。', '取込へ進む', 'import');
    }
    // 日付の既定＝最新日
    if(!State.selectedDate) State.selectedDate = Compute.latestDate();
    // 品種の既定＝主要5品種。単一品種が消えた場合のみリセット
    if(State.selectedVariety !== MAJOR_VARIETY_KEY && !list.find(v=>v.variety===State.selectedVariety)){
      State.selectedVariety = MAJOR_VARIETY_KEY;
    }
    const isMajor = State.selectedVariety === MAJOR_VARIETY_KEY;
    const selDate = State.selectedDate;

    // セレクタ（日付＋品種の横並び）。プルダウン上部を指定順に並べ、残りは既存順のまま。
    const VARIETY_TOP_ORDER = ['バンコクスプリーム','ホワイト','ピアノホワイト','シャローム','エメラルドチョコゼブラ','チェリープリンセスデーン','パルビフローラ','リボン'];
    const isMix = (name)=> name.includes('ミックス'); // 「ミックス」を含む品種は最下部へ
    const restList = list.filter(v=>!VARIETY_TOP_ORDER.includes(v.variety));
    const orderedList = [
      ...VARIETY_TOP_ORDER.map(name=>list.find(v=>v.variety===name)).filter(Boolean),
      ...restList.filter(v=>!isMix(v.variety)),
      ...restList.filter(v=>isMix(v.variety))
    ];
    const varietyOptions =
      `<option value="${MAJOR_VARIETY_KEY}" ${isMajor?'selected':''}>主要5品種</option>` +
      orderedList.map(v=>`<option value="${Fmt.esc(v.variety)}" ${v.variety===State.selectedVariety?'selected':''}>${Fmt.esc(v.variety)}</option>`).join('');
    const selectorCard = `
      <div class="card">
        <div class="selector-row">
          <div class="field date-field">日付
            <div class="date-nav">
              <button type="button" class="date-step" data-action="date-step-prev" aria-label="前の出荷日へ" ${Compute.stepDate(selDate,-1)?'':'disabled'}>‹</button>
              <button type="button" class="date-trigger" id="sanchi-date-trigger" data-action="toggle-calendar">
                <span>${Fmt.esc(Fmt.mmdd(selDate))}</span><span class="caret">▾</span>
              </button>
              <button type="button" class="date-step" data-action="date-step-next" aria-label="次の出荷日へ" ${Compute.stepDate(selDate,1)?'':'disabled'}>›</button>
            </div>
            ${State.calendarOpen ? UI.calendarHTML() : ''}
          </div>
          <label class="field variety-field">品種
            <div class="select-wrap">
              <select id="variety-select">${varietyOptions}</select>
            </div>
          </label>
        </div>
      </div>`;

    let donutCard, lineCard;

    if(isMajor){
      // 主要5品種では規格構成（ドーナツ）は非表示。価格推移をメインに。
      donutCard = '';

      // 折れ線＝主要5品種を色分けして重ねる。凡例タップで各品種の表示ON/OFF。
      const allSeries = MAJOR_VARIETIES.map((variety,i)=>({variety, color:SERIES_COLORS[i%SERIES_COLORS.length], points:Compute.lineDataDense(variety)}));
      const anyData = allSeries.some(s=>s.points.some(p=>p.price!=null));
      if(!anyData){
        lineCard = `
          <div class="card">
            <div class="card-head"><h2 class="card-title">価格推移（50本換算 箱単価・主要5品種）</h2></div>
            <div class="empty-state"><p>主要5品種の価格データがまだありません。</p></div>
          </div>`;
      } else {
        // 凡例タップ＝絞り込み。選択が空なら全表示（初期状態）
        const sel = State.selectedSeries || [];
        const isFiltered = sel.length > 0;
        State.seriesSelectable = allSeries.filter(s=>s.points.some(p=>p.price!=null)).map(s=>s.variety);
        const seriesLegend = allSeries.map(s=>{
          const has = s.points.some(p=>p.price!=null);
          const off = isFiltered && !sel.includes(s.variety);
          return `<div class="legend-item ${has?'':'series-muted'} ${off?'series-off':''}"${has?` data-action="series-toggle" data-variety="${Fmt.esc(s.variety)}" role="button"`:''}>
            <span class="series-dot" style="background:${s.color}"></span>
            <span class="legend-label">${Fmt.esc(s.variety)}</span>
            <span class="legend-val">${has?(off?'非表示':''):'データなし'}</span>
          </div>`;
        }).join('');
        // 軸は常に5品種ぶんで固定し、非選択の品種は線だけ消す
        const chartSeries = allSeries.map(s=>({...s, hidden: isFiltered && !sel.includes(s.variety)}));
        const anyShown = chartSeries.some(s=> !s.hidden && s.points.some(p=>p.price!=null));
        let chartInner, isolatedNote='';
        if(anyShown){
          const {svg, isolated, ptMeta, w, yAxis} = Charts.multiLineSVG(chartSeries);
          State.multiMeta = {ptMeta, w};
          chartInner = `<div class="chart-wrap" data-multiline-wrap><div class="chart-scroll">${svg}</div>${yAxis?`<div class="chart-yaxis">${yAxis}</div>`:''}</div>
            <div class="chart-detail" id="line-detail" data-empty="true">プロットをタップすると詳細を表示します</div>`;
          if(isolated) isolatedNote = `<p class="chart-caption">連続データが少ないため、一部は単独の点のみ表示しています（データ不足）。</p>`;
        } else {
          State.multiMeta = null;
          chartInner = `<div class="empty-state"><p>表示する品種がありません。凡例をタップして表示してください。</p></div>`;
        }
        lineCard = `
          <div class="card">
            <div class="card-head"><h2 class="card-title">価格推移（50本換算 箱単価・主要5品種）</h2></div>
            ${chartInner}
            <div class="series-legend">${seriesLegend}</div>
            ${isolatedNote}
          </div>`;
      }
    } else {
      // 単一品種：ドーナツは選択日の箱数内訳。折れ線は全期間。
      const variety = State.selectedVariety;
      const {cats, total} = Compute.donutDataForDay([variety], selDate);
      const donutBody = total>0
        ? `<div class="donut-row">${Charts.donutSVG(cats, total, CAT_COLORVAR, 180)}<div class="legend legend-flex">${UI.donutLegendHTML(cats, total)}</div></div>`
        : `<div class="empty-state"><p>${Fmt.esc(Fmt.date(selDate))} の${Fmt.esc(variety)}のデータがありません。日付を変えてお試しください。</p></div>`;
      donutCard = `
        <div class="card">
          <div class="card-head"><h2 class="card-title">規格構成（${Fmt.esc(Fmt.date(selDate))} <span class="${Fmt.wdClass(selDate)}">${Fmt.esc(Fmt.wd(selDate))}</span>）</h2></div>
          ${donutBody}
        </div>`;

      const points = Compute.lineDataDense(variety);
      const withData = points.filter(p=>p.price!=null);
      let lineBlock;
      if(withData.length===0){
        lineBlock = `<div class="empty-state"><p>この品種の価格データがまだありません。</p></div>`;
      } else {
        const {svg, isolated, yAxis} = Charts.lineSVG(points);
        lineBlock = `
          <div class="chart-wrap" data-line-wrap data-variety="${Fmt.esc(variety)}"><div class="chart-scroll">${svg}</div>${yAxis?`<div class="chart-yaxis">${yAxis}</div>`:''}</div>
          <div class="chart-detail" id="line-detail" data-empty="true">プロットをタップすると詳細を表示します</div>
          ${isolated ? `<p class="chart-caption">連続データが少ないため、一部は単独の点のみ表示しています（データ不足）。</p>` : ''}
        `;
      }
      lineCard = `
        <div class="card">
          <div class="card-head"><h2 class="card-title">価格推移（50本換算 箱単価）</h2></div>
          ${lineBlock}
        </div>`;
    }

    const seasonYear = (selDate||'').slice(0,4);
    return `
      <h1 class="screen-title">産地分析${seasonYear ? ` <span class="muted" style="font-weight:400">${seasonYear}</span>` : ''}</h1>
      ${selectorCard}
      ${donutCard}
      ${lineCard}
    `;
  },

  calendarHTML(){
    const ym = State.calendarMonth || (State.selectedDate||'').slice(0,7);
    const parts = ym.split('-');
    const y = parseInt(parts[0],10), m = parseInt(parts[1],10);
    if(!y || !m) return '';
    const first = new Date(y, m-1, 1);
    const startWD = first.getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const wds = ['日','月','火','水','木','金','土'];
    const dataDates = Compute.datesWithData(); // 産地データのある日だけ選択可
    const wdColor = (wd)=> wd===0 ? 'cal-sun' : wd===6 ? 'cal-sat' : '';
    let cells = '';
    for(let i=0;i<startWD;i++) cells += `<span class="cal-day empty"></span>`;
    for(let d=1; d<=daysInMonth; d++){
      const wd = new Date(y, m-1, d).getDay();
      const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isSel = iso === State.selectedDate;
      const wc = wdColor(wd);
      if(dataDates.has(iso)){
        cells += `<button type="button" class="cal-day enabled ${wc} ${isSel?'selected':''}" data-action="cal-pick" data-date="${iso}">${d}</button>`;
      } else {
        cells += `<span class="cal-day disabled ${wc}">${d}</span>`;
      }
    }
    const wdRow = wds.map((w,i)=>`<div class="cal-wd ${wdColor(i)}">${w}</div>`).join('');
    return `
      <div class="cal-backdrop" data-action="close-calendar"></div>
      <div class="cal-pop">
        <div class="cal-head">
          <button type="button" data-action="cal-prev" aria-label="前の月">‹</button>
          <span class="cal-title">${y}年${m}月</span>
          <button type="button" data-action="cal-next" aria-label="次の月">›</button>
        </div>
        <div class="cal-grid">${wdRow}${cells}</div>
      </div>`;
  },
  // 自分出荷手入力の日付ピッカー。産地カレンダーと同一スタイルだが、全日付が選択可（出荷日は自由）。
  mineCalendarHTML(){
    const today = new Date();
    const todayYm = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
    const ym = State.mineCalMonth || (State.mineDate||'').slice(0,7) || todayYm;
    const parts = ym.split('-');
    const y = parseInt(parts[0],10), m = parseInt(parts[1],10);
    if(!y || !m) return '';
    const first = new Date(y, m-1, 1);
    const startWD = first.getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const wds = ['日','月','火','水','木','金','土'];
    const wdColor = (wd)=> wd===0 ? 'cal-sun' : wd===6 ? 'cal-sat' : '';
    let cells = '';
    for(let i=0;i<startWD;i++) cells += `<span class="cal-day empty"></span>`;
    for(let d=1; d<=daysInMonth; d++){
      const wd = new Date(y, m-1, d).getDay();
      const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isSel = iso === State.mineDate;
      const wc = wdColor(wd);
      cells += `<button type="button" class="cal-day enabled ${wc} ${isSel?'selected':''}" data-action="mine-cal-pick" data-date="${iso}">${d}</button>`;
    }
    const wdRow = wds.map((w,i)=>`<div class="cal-wd ${wdColor(i)}">${w}</div>`).join('');
    return `
      <div class="cal-backdrop" data-action="close-mine-calendar"></div>
      <div class="cal-pop">
        <div class="cal-head">
          <button type="button" data-action="mine-cal-prev" aria-label="前の月">‹</button>
          <span class="cal-title">${y}年${m}月</span>
          <button type="button" data-action="mine-cal-next" aria-label="次の月">›</button>
        </div>
        <div class="cal-grid">${wdRow}${cells}</div>
      </div>`;
  },

  /* ---------- Screen: 自分の分析 ---------- */
  screenMine(){
    if(Store.jibun.length===0){
      return `<h1 class="screen-title">自分の分析</h1>` + UI.emptyState('出荷データがまだありません', '自分の出荷をCSVまたは手入力で追加すると、売上を自動集計します。', '取込へ進む', 'import');
    }
    const matched = Compute.matchJibun();
    const sum = Compute.jibunSummary(matched);

    // 今季作付設定の坪（総坪＋品種別坪）。未入力なら坪あたり系は「-」表示。
    const totalTsubo = Store.sakutsuke.reduce((s,r)=>s+(Number(r.tsubo)||0),0);
    const tsuboByVariety = {};
    Store.sakutsuke.forEach(r=>{ tsuboByVariety[r.variety]=(tsuboByVariety[r.variety]||0)+(Number(r.tsubo)||0); });

    const varietyRows = sum.varietyRows;
    // 品種→色番号：自分出荷データの出現順に割り当て（最大5色で循環）。マーカーとドーナツで共用。
    const markOrder = [];
    matched.forEach(r=>{ if(r.variety && !markOrder.includes(r.variety)) markOrder.push(r.variety); });
    const markMap = {}; markOrder.forEach((v,i)=>{ markMap[v] = (i%5)+1; });
    const cats = {};
    varietyRows.forEach((r)=>{ cats[r.variety] = r.amount; });
    const colorMap = {}; varietyRows.forEach((r)=>{ colorMap[r.variety] = `var(--dn${markMap[r.variety]||1})`; });
    const donutSvg = varietyRows.length ? Charts.donutSVG(cats, sum.total, colorMap, 150, true) : '';
    const varietyLegend = varietyRows.map(r=>{
      return `<div class="legend-item">
        <span class="legend-dot" style="background:${colorMap[r.variety]}"></span>
        <span class="legend-label">${Fmt.esc(r.variety)}</span>
        <span class="legend-val legend-val-strong tnum">${Fmt.yen(r.amount)}</span>
      </div>`;
    }).join('');

    const specText = (r)=> (r.betsuCount>0) ? `別 ${r.betsuCount}本` : App.specToStr(r.grade, r.count);
    // 規格の並び順（2L30→2L50→L→M→別）
    const specOrder = {'2L30':0,'2L50':1,'L':2,'M':3};
    const specRank = (r)=> r.betsuCount>0 ? 99 : (specOrder[App.specToStr(r.grade,r.count)] ?? 50);
    // 日付降順のまま、日付ごとにグループ化（新しい日付が上）
    // 日付は新しい順。同じ日の中は取込順（配列順）のまま＝品種の出現順を崩さない。
    // ※以前は addedAt の降順で並べていたが、取込中のミリ秒差で日内の順序が入れ替わることがあった。
    const sortedShip = matched.slice().sort((a,b)=> b.date.localeCompare(a.date));
    const shipGroups = [];
    sortedShip.forEach(r=>{
      let g = shipGroups.find(x=>x.date===r.date);
      if(!g){ g={date:r.date, rows:[]}; shipGroups.push(g); }
      g.rows.push(r);
    });
    const shipRows = shipGroups.map(g=>{
      // 日付内で品種ごとに1枠にまとめる（規格は枠内に明細行として並べる）
      const byVar = [];
      g.rows.forEach(r=>{
        let v = byVar.find(x=>x.variety===r.variety);
        if(!v){ v={variety:r.variety, rows:[], amount:0}; byVar.push(v); }
        v.rows.push(r);
        if(r.matched && !r.pending) v.amount += r.amount; // pendingは金額nullなので売上合計に足さない
      });
      const blocks = byVar.map(v=>{
        v.rows.sort((a,b)=> specRank(a)-specRank(b));
        const specLines = v.rows.map(r=>`
          <div class="sv-spec">
            <div class="sv-spec-main">
              <span class="sv-grade">${specText(r)}</span>
              <span class="sv-boxes tnum">${r.boxQty}箱</span>
            </div>
            ${r.matched && r.pending
              ? `<div class="sv-spec-sub"><span class="badge badge-pending">未確定</span><button class="btn-fill" data-action="fill-price" data-key="${Fmt.esc(r.sanchiKey)}">金額入力</button></div>`
              : r.matched
                ? `<div class="sv-spec-sub"><span>${Fmt.yen(r.boxPrice)}<span class="u">/箱</span></span><span class="sv-dot">・</span><span>${Fmt.yen(r.perStem)}<span class="u">/本</span></span></div>`
                : `<div class="sv-spec-sub"><span class="badge badge-nomatch">未マッチ</span></div>`}
            <button class="sv-del" data-action="delete-mine-row" data-id="${r.id}" aria-label="この規格を削除">${Icon.trash}</button>
          </div>`).join('');
        return `
          <div class="ship-variety-block">
            <div class="sv-head">
              <span class="ship-name mk mk${markMap[v.variety]||1}">${Fmt.esc(v.variety)}</span>
              ${v.amount>0 ? `<span class="ship-amount tnum">${Fmt.yen(v.amount)}</span>` : ''}
            </div>
            <div class="sv-specs">${specLines}</div>
          </div>`;
      }).join('');
      // 見出し用の曜日（土=青/日=赤）＋その日の売上合計（マッチ分）
      const dt = new Date(g.date + 'T00:00:00');
      const wd = dt.getDay();
      const wdName = ['日','月','火','水','木','金','土'][wd];
      const wdCls = wd===0 ? 'cal-sun' : wd===6 ? 'cal-sat' : '';
      const dayTotal = byVar.reduce((s,v)=>s+v.amount, 0);
      const dayBoxes = g.rows.reduce((s,r)=>s+(r.boxQty||0), 0);
      return `
        <div class="ship-day-card">
          <div class="ship-date-head">
            <span class="ship-date-md">${Fmt.date(g.date)}</span>
            <span class="ship-date-wd ${wdCls}">(${wdName})</span>
            <span class="ship-date-boxes tnum">${Fmt.num(dayBoxes)}箱</span>
            ${dayTotal>0 ? `<span class="ship-date-total tnum">${Fmt.yen(dayTotal)}</span>` : ''}
          </div>
          ${blocks}
        </div>`;
    }).join('');

    const unmatchedBlock = sum.unmatchedRows.length ? `
      <details class="collapse">
        <summary>未マッチ（${sum.unmatchedRows.length}件）<span class="badge badge-nomatch">合計から除外</span></summary>
        <div class="stack" style="margin-top:var(--sp3)">
          <p class="muted" style="font-size:0.8125rem">産地データに一致する行（別行は同日・同品種の「別」）が見つからない行です。表記ゆれや産地データ未取込の可能性があります。</p>
          ${sum.unmatchedRows.map(r=>`
            <div class="ship-row">
              <div class="ship-main">
                <span class="ship-date tnum">${Fmt.date(r.date)}</span>
                <span class="ship-name">${Fmt.esc(r.variety)}${r.betsuCount>0?' <span class="tag-betsu">別</span>':''}</span>
                <span class="ship-detail">${specText(r)}　箱数${r.boxQty}</span>
              </div>
              <button class="ship-del" data-action="delete-mine-row" data-id="${r.id}" aria-label="この行を削除">${Icon.trash}</button>
            </div>`).join('')}
        </div>
      </details>
    ` : '';

    // 金額未確定（要入力）カード：市況の箱単価が未確定の出荷を一覧。埋め忘れ防止＋その場で金額入力へ。
    const pendingBlock = sum.pendingRows.length ? `
      <div class="card card-pending">
        <div class="card-head"><h2 class="card-title">金額未確定（要入力）<span class="badge badge-pending">${sum.pendingRows.length}件</span></h2></div>
        <p class="muted" style="font-size:0.8125rem">市況の箱単価がまだ「未確定」の出荷です。箱数・本数には算入していますが、売上・平均単価には未反映です。精算書で金額が分かったら入力してください。</p>
        <div class="stack" style="margin-top:var(--sp3)">
          ${sum.pendingRows.map(r=>`
            <div class="ship-row">
              <div class="ship-main">
                <span class="ship-date tnum">${Fmt.date(r.date)}</span>
                <span class="ship-name">${Fmt.esc(r.variety)}${r.betsuCount>0?' <span class="tag-betsu">別</span>':''}</span>
                <span class="ship-detail">${specText(r)}　箱数${r.boxQty}</span>
              </div>
              <button class="btn-fill" data-action="fill-price" data-key="${Fmt.esc(r.sanchiKey)}">金額入力</button>
            </div>`).join('')}
        </div>
      </div>
    ` : '';

    // 新植/据置 未割当カード（両区分を作っている品種の未割当出荷）
    const unassignedRows = Compute.unassignedAllocRows();
    const allocBlock = unassignedRows.length ? `
      <div class="card card-alloc">
        <div class="card-head"><h2 class="card-title">新植/据置 未割当（要割り当て）<span class="badge badge-alloc">${unassignedRows.length}件</span></h2></div>
        <p class="muted" style="font-size:0.8125rem">新植と据置の両方を作っている品種の出荷です。どちらから作った箱かを割り当てると、品種別売上内訳で区分別に見られます。混在は据置の本数比率を入力。</p>
        <div class="stack" style="margin-top:var(--sp3)">${UI.allocRowsHTML(unassignedRows)}</div>
      </div>
    ` : '';

    return `
      <h1 class="screen-title">自分の分析</h1>
      <div class="card kpi-card">
        <span class="kpi-label">今シーズン累計 売り立て</span>
        <span class="kpi-value tnum">${Fmt.yen(sum.total)}</span>
        ${sum.avgPerStem!=null ? `<div class="kpi-secondary">
          <span class="kpi-sec-label">平均1本単価</span>
          <span class="kpi-sec-value tnum">${Fmt.yen(sum.avgPerStem)}<small>/本</small></span>
        </div>` : ''}
        <div class="kpi-secondary">
          <span class="kpi-sec-label">坪あたり売上</span>
          <span class="kpi-sec-value tnum">${totalTsubo>0 ? `${Fmt.yen(sum.total/totalTsubo)}<small>/坪</small>` : '-'}</span>
        </div>
        <div class="kpi-sub">
          <span>出荷箱数計 <b class="tnum">${Fmt.num(sum.totalBoxes)}</b>箱</span>
          <span>総本数 <b class="tnum">${Fmt.num(sum.totalStems)}</b>本</span>
        </div>
      </div>
      ${pendingBlock}
      ${allocBlock}
      <div class="card">
        <div class="card-head"><h2 class="card-title">品種別売上内訳</h2></div>
        ${varietyRows.length ? `
        <div class="donut-col">${donutSvg}<div class="legend">${varietyLegend}</div></div>
        <ul class="vm-list">${varietyRows.map(r=>{
          const vt=tsuboByVariety[r.variety]||0;
          const perT=vt>0?Fmt.yen(r.amount/vt):null;
          const mk=markMap[r.variety]||1;
          // 新植/据置の区分別詳細（比較バー＋坪売上・1本単価）
          const sp=r.split, shin=sp.shinshoku, sue=sp.sueoki;
          const showShin = shin.stems>0 || shin.tsubo>0;
          const showSue  = sue.stems>0  || sue.tsubo>0;
          const maxStems = Math.max(shin.stems, sue.stems, 1);
          const barRow=(label,cls,s)=>`<div class="pt-bar-row"><span class="pt-bar-label ${cls}">${label}</span><div class="pt-bar-track"><div class="pt-bar-fill ${cls}" style="width:${Math.max(0,Math.min(100,s.stems/maxStems*100)).toFixed(1)}%"></div></div><span class="pt-bar-val tnum">${Fmt.num(Math.round(s.stems))}<span class="vm-unit">本</span></span></div>`;
          const metricRow=(label,cls,s)=>`<div class="pt-metric"><span class="pt-metric-label ${cls}">${label}</span><span class="pt-metric-cell"><span class="pt-metric-k">坪売上</span><span class="pt-metric-v${s.perTsubo!=null?'':' is-empty'}">${s.perTsubo!=null?`${Fmt.yen(s.perTsubo)}<span class="vm-unit">/坪</span>`:'-'}</span></span><span class="pt-metric-cell"><span class="pt-metric-k">1本単価</span><span class="pt-metric-v${s.perStem!=null?'':' is-empty'}">${s.perStem!=null?`${Fmt.yen(s.perStem)}<span class="vm-unit">/本</span>`:'-'}</span></span></div>`;
          const detail = (!showShin && !showSue)
            ? `<p class="muted" style="font-size:0.8125rem">作付設定（新植/据置）が未登録のため、区分別の表示はできません。取込タブの「今季作付設定」で登録できます。</p>`
            : `<div class="pt-bars">${showShin?barRow('新植','pt-shin',shin):''}${showSue?barRow('据置','pt-sue',sue):''}</div>
               <div class="pt-metrics">${showShin?metricRow('新植','pt-shin',shin):''}${showSue?metricRow('据置','pt-sue',sue):''}</div>
               ${sp.unassigned.stems>0?`<p class="pt-unassigned">未割当 ${Fmt.num(Math.round(sp.unassigned.stems))}本 — 下の「未割当」カードから割り当てできます</p>`:''}`;
          return `<li class="vm-item"><details class="vm-details">
            <summary class="vm-summary">
              <div class="vm-name"><span class="ship-name mk mk${mk}">${Fmt.esc(r.variety)}</span><span class="vm-amount">${Fmt.yen(r.amount)}</span><span class="vm-caret">▾</span></div>
              <div class="vm-grid">
                <div class="vm-cell"><span class="vm-label">箱数</span><span class="vm-val">${Fmt.num(r.boxes)}<span class="vm-unit">箱</span></span></div>
                <div class="vm-cell"><span class="vm-label">累計本数</span><span class="vm-val">${Fmt.num(r.stems)}<span class="vm-unit">本</span></span></div>
                <div class="vm-cell"><span class="vm-label">坪売上</span><span class="vm-val${perT?'':' is-empty'}">${perT?`${perT}<span class="vm-unit">/坪</span>`:'-'}</span></div>
                <div class="vm-cell"><span class="vm-label">単価</span><span class="vm-val${r.perStem!=null?'':' is-empty'}">${r.perStem!=null?`${Fmt.yen(r.perStem)}<span class="vm-unit">/本</span>`:'—'}</span></div>
              </div>
            </summary>
            <div class="vm-detail"><div class="vm-detail-head">新植 / 据置の内訳</div>${detail}</div>
          </details></li>`;
        }).join('')}</ul>` : `<p class="muted">一致した出荷がまだありません。</p>`}
      </div>
      <div class="card">
        <div class="card-head"><h2 class="card-title">出荷明細一覧</h2></div>
        <div class="stack">${shipRows}</div>
        ${unmatchedBlock}
      </div>
    `;
  },

  /* ---------- Screen: 取込 ---------- */
  screenImport(){
    const zeroData = Store.sanchi.size===0 && Store.jibun.length===0;
    const onboard = zeroData ? `
      <div class="card">
        <h2 class="card-title">はじめに（3ステップ）</h2>
        <div class="stack">
          <div class="onboard-step"><span class="onboard-num">1</span><div class="onboard-text"><b>産地CSVを取込む</b><span>市場から届いた産地全体データ（日付,品目,品種,規格,本数,箱数量,箱単価）</span></div></div>
          <div class="onboard-step"><span class="onboard-num">2</span><div class="onboard-text"><b>自分の出荷を追加</b><span>CSV取込、または手入力フォームで1件ずつ追加</span></div></div>
          <div class="onboard-step"><span class="onboard-num">3</span><div class="onboard-text"><b>分析タブで確認</b><span>「産地」「自分」タブで規格構成・価格推移・売上が見られます</span></div></div>
        </div>
      </div>` : '';

    // 手入力の品種プルダウン＝今季作付設定で登録した品種（＋末尾に「その他（自由入力）」）
    const mineVarieties = Array.from(new Set(Store.sakutsuke.map(r=>r.variety).filter(Boolean)));
    const selMineV = State.mineVariety; // 直前に選んだ品種を復元（連続入力のため）
    const varietyOpts = mineVarieties.map(v=>`<option value="${Fmt.esc(v)}" ${v===selMineV?'selected':''}>${Fmt.esc(v)}</option>`).join('')
      + `<option value="__other__">その他（自由入力）</option>`;

    // ---- 今季作付設定 ----
    const fmtTsubo = (n)=> (Number(n)||0).toLocaleString('ja-JP');
    // 品種名の入力補助（産地・自分の既存品種をユニーク化）
    const varietySuggest = Array.from(new Set([
      ...Array.from(Store.sanchi.values()).map(r=>r.variety),
      ...Store.jibun.map(r=>r.variety)
    ].filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ja'));
    const varietyDatalist = `<datalist id="variety-suggest">${varietySuggest.map(v=>`<option value="${Fmt.esc(v)}"></option>`).join('')}</datalist>`;

    // 編集用の登録済み行（追加順）
    const sakuEditRows = Store.sakutsuke.map(r=>`
      <div class="ship-row">
        <div class="ship-main">
          <span class="ship-name">${Fmt.esc(r.variety)} <span class="tag-betsu">${Fmt.esc(r.type)}</span></span>
          <span class="ship-detail">${fmtTsubo(r.tsubo)}坪</span>
        </div>
        <button class="ship-del" data-action="delete-sakutsuke-row" data-id="${r.id}" aria-label="削除">${Icon.trash}</button>
      </div>`).join('');

    // 内容カード用：品種ごとに新植/据置を集計（表示は品種単位でまとめる）
    const sakuByVariety = [];
    Store.sakutsuke.forEach(r=>{
      let g = sakuByVariety.find(x=>x.variety===r.variety);
      if(!g){ g = {variety:r.variety, shinshoku:0, sueoki:0}; sakuByVariety.push(g); }
      if(r.type==='据置') g.sueoki += (Number(r.tsubo)||0); else g.shinshoku += (Number(r.tsubo)||0);
    });
    const sakuTotal = sakuByVariety.reduce((s,g)=>s + g.shinshoku + g.sueoki, 0);
    const sakuContentRows = sakuByVariety.map(g=>{
      const parts = [];
      if(g.shinshoku>0) parts.push(`新植 ${fmtTsubo(g.shinshoku)}坪`);
      if(g.sueoki>0) parts.push(`据置 ${fmtTsubo(g.sueoki)}坪`);
      const detail = parts.join(' ・ ') || '—';
      return `
      <div class="ship-row">
        <div class="ship-main">
          <span class="ship-name">${Fmt.esc(g.variety)}</span>
          <span class="ship-detail">${detail}</span>
        </div>
        <div class="ship-amount tnum">計 ${fmtTsubo(g.shinshoku + g.sueoki)}坪</div>
      </div>`;

    return `
      <h1 class="screen-title">データ取込</h1>
      ${onboard}
      <div class="card">
        <div class="card-head"><h2 class="card-title">産地データCSV</h2></div>

        <label class="dropzone" for="sanchi-file-input">
          ${Icon.upload}
          <strong>タップしてCSVを選択</strong>

          <button type="button" class="btn btn-secondary btn-sm" data-action="import-sanchi-paste">貼り付けた内容を取込</button>
        </div>
        <div id="sanchi-import-summary">${State.sanchiImportSummary || ''}</div>
      </div>
      <div class="card">
        <div class="card-head"><h2 class="card-title">自分の出荷</h2></div>
        <div class="segmented" role="tablist">
          <button role="tab" aria-selected="${State.mineMode==='csv'}" data-action="toggle-mine-mode" data-mode="csv">CSVで取込</button>
          <button role="tab" aria-selected="${State.mineMode==='manual'}" data-action="toggle-mine-mode" data-mode="manual">手入力で追加</button>
        </div>
        <div id="mine-mode-csv-panel">
          <p class="card-caption">ヘッダ: 出荷日,品種名,規格,箱数,別本数（規格=2L30/2L50/L/M。別扱いの箱は別本数に本数を入れる）</p>
          <label class="dropzone" for="mine-file-input">
            ${Icon.upload}
            <strong>タップしてCSVを選択</strong>
          </label>
          <input type="file" id="mine-file-input" accept=".csv,text/csv" data-action="import-mine-file">
          <div class="paste-row">
            <textarea class="csv-text csv-paste" id="mine-paste" placeholder="またはCSVを貼り付け（ヘッダ行を含めてOK）"></textarea>
            <button type="button" class="btn btn-secondary btn-sm" data-action="import-mine-paste">貼り付けた内容を取込</button>
          </div>
          <div id="mine-import-summary">${State.mineImportSummary || ''}</div>
        </div>
        <form id="mine-mode-manual-panel" data-action="submit-manual" class="stack">
          <div class="field date-field">日付
            <button type="button" class="date-trigger" id="mine-date-trigger" data-action="toggle-mine-calendar">
              <span id="mine-date-label">${State.mineDate ? Fmt.esc(Fmt.mmdd(State.mineDate)) : '日付を選択'}</span><span class="caret">▾</span>
            </button>
            <div id="mine-cal-mount"></div>
          </div>
          <input type="hidden" name="date" id="mine-date-value" value="${State.mineDate||''}">
          <label class="field">品種
            <div class="select-wrap"><select name="variety" required>${varietyOpts}</select></div>
          </label>
          <div id="variety-other-wrap" class="${mineVarieties.length ? 'hidden' : ''}">
            <label class="field">品種名（自由入力）
              <input type="text" name="varietyOther" list="variety-suggest" placeholder="例: シャローム" autocomplete="off">
            </label>
            ${varietyDatalist}
          </div>
          <label class="field">規格
            <div class="select-wrap"><select name="spec" required>
              <option value="2L30">2L30</option>
              <option value="2L50">2L50</option>
              <option value="L">L</option>
              <option value="M">M</option>
              <option value="別">別</option>
            </select></div>
          </label>
          <div id="betsu-wrap" class="hidden"><label class="field">別本数（1箱あたりの本数）<input type="number" name="betsuCount" inputmode="numeric" min="1" placeholder="例: 30"></label></div>
          <label class="field">箱数
            <div class="stepper">
              <button type="button" data-action="step-boxqty" data-dir="-1" aria-label="減らす">−</button>
              <input type="number" name="boxQty" value="1" min="1" inputmode="numeric">
              <button type="button" data-action="step-boxqty" data-dir="1" aria-label="増やす">＋</button>
            </div>
          </label>
          <button type="submit" class="btn btn-primary">追加する</button>
        </form>
      </div>
      <div class="card">
        <div class="card-head"><h2 class="card-title">今季作付内容</h2></div>
        ${sakuByVariety.length ? `
          <div class="stack">${sakuContentRows}</div>
          <div class="row-between" style="margin-top:var(--sp3)">
            <span class="card-caption">合計作付面積</span>
            <span class="tnum" style="font-size:0.9375rem;font-weight:600">${fmtTsubo(sakuTotal)}坪</span>
          </div>
        ` : '<p class="muted">まだ登録がありません。下の「今季作付設定」から追加してください。</p>'}
      </div>
      <details class="card collapse">
        <summary style="font-size:1rem"><span>今季作付設定</span></summary>
        <p class="card-caption" style="margin-top:var(--sp2)">今シーズンの品種・作付面積（坪）を登録します。一度登録すれば以降ずっと保持されます。同じ品種で新植分・据置分が両方ある場合は、それぞれ1行ずつ登録してください。</p>
        <form id="sakutsuke-form" data-action="submit-sakutsuke" class="stack">
          <label class="field">品種
            <input type="text" name="variety" placeholder="例: バンコクスプリーム" autocomplete="off" required>
          </label>
          <label class="field">区分
            <div class="select-wrap"><select name="type" required>
              <option value="新植">新植</option>
              <option value="据置">据置</option>
            </select></div>
          </label>
          <label class="field">面積（坪）
            <input type="number" name="tsubo" inputmode="decimal" min="0" step="0.1" placeholder="例: 30" required>
          </label>
          <button type="submit" class="btn btn-primary">作付を追加</button>
        </form>
        ${Store.sakutsuke.length ? `<div class="stack" style="margin-top:var(--sp3)">${sakuEditRows}</div>` : ''}
      </details>
    `;
  },

  /* ---------- Screen: 保存 ---------- */
  screenBackup(){
    const last = Store.meta.lastBackupAt ? new Date(Store.meta.lastBackupAt).toLocaleString('ja-JP') : '未実施';
    return `
      <h1 class="screen-title">バックアップ</h1>
      ${!Store.available ? `<div class="err-box">この端末では自動保存(localStorage)が使えません。作業のたびに書き出しを行ってください。</div>` : ''}
      <div class="card">
        <div class="row-between">
          <span class="card-caption">最終バックアップ</span>
          <span class="tnum" style="font-size:0.875rem">${last}</span>
        </div>
        ${Store.dirtyCount>0 ? `<span class="badge badge-unmatched">未バックアップの変更 ${Store.dirtyCount}件</span>` : `<span class="badge badge-matched">バックアップ済み</span>`}
      </div>
      <div class="card stack">
        <h2 class="card-title">書き出し / 読み込み</h2>

        <p class="card-caption">産地データ・自分の出荷データを両方とも完全に削除します。事前にバックアップを書き出すことをおすすめします。</p>

        <h2 class="card-title">保存の仕組み</h2>
        <p class="card-caption">
          データは端末内（localStorage）に自動保存されますが、これは一時キャッシュです。ブラウザの設定やプライベートモードによっては消えることがあるため、
          こまめな「書き出し」による <b>バックアップJSON</b> を正としてご利用ください。

  emptyState(title, body, ctaLabel, ctaTab){
    return `<div class="card empty-state">
      ${Icon.import}
      <p style="font-weight:600;color:var(--ink)">${Fmt.esc(title)}</p>
      <p>${Fmt.esc(body)}</p>
      <div class="btn-row" style="justify-content:center; flex-wrap:wrap">
        <button class="btn btn-primary" style="width:auto" data-action="switch-tab" data-tab="${ctaTab}">${Fmt.esc(ctaLabel)}</button>
      </div>
    </div>`;
  },

  toast(msg, opts){
    opts = opts || {};
    const region = document.getElementById('toast-region');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span>${Fmt.esc(msg)}</span>${opts.actionLabel ? `<button data-toast-action>${Fmt.esc(opts.actionLabel)}</button>` : ''}`;
    region.appendChild(el);
    if(opts.actionLabel && opts.onAction){
      el.querySelector('[data-toast-action]').addEventListener('click', ()=>{
        opts.onAction();
        el.remove();
      });
    }
    setTimeout(()=>{ el.remove(); }, opts.duration || 4000);
  },

  modal(title, bodyHtml, opts){
    opts = opts || {};
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-sheet">
          <button class="modal-close" id="modal-x-btn" aria-label="閉じる">×</button>
          <h2 class="modal-title">${Fmt.esc(title)}</h2>
          <div class="modal-body">${bodyHtml}</div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="modal-cancel-btn">キャンセル</button>
            <button class="btn ${opts.danger?'btn-danger':'btn-primary'}" id="modal-confirm-btn">${Fmt.esc(opts.confirmLabel||'確認')}</button>
          </div>
        </div>
      </div>`;
    const backdrop = root.querySelector('.modal-backdrop');
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) UI.closeModal(); });
    root.querySelector('#modal-x-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-cancel-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-confirm-btn').addEventListener('click', ()=>{
      if(opts.onConfirm) opts.onConfirm();
      UI.closeModal();
    });
  },
  closeModal(){
    document.getElementById('modal-root').innerHTML = '';
  },
  csvExportModal(sections){
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-sheet">
          <button class="modal-close" id="modal-x-btn" aria-label="閉じる">×</button>
          <h2 class="modal-title">CSVで書き出し</h2>
          <div class="modal-body"><b>ダウンロード</b>を押すと保存の確認が出ます。使えない環境では、テキストを<b>コピー</b>して表計算ソフトに貼り付けてください。</div>
          ${sections.map((s,i)=>`
            <div class="stack" style="gap:var(--sp2)">
              <div class="row-between">
                <strong>${Fmt.esc(s.name)}（${s.rows}行）</strong>
                <div class="btn-row" style="width:auto; flex:0 0 auto">
                  <button class="btn btn-sm btn-secondary" data-csv-copy="${i}">コピー</button>
                  <button class="btn btn-sm btn-ghost" data-csv-dl="${i}">ダウンロード</button>
                </div>
              </div>
              <textarea class="csv-text" id="csv-text-${i}" readonly>${Fmt.esc(s.text)}</textarea>
            </div>`).join('')}
          <div class="modal-status" id="csv-status"></div>
          <div class="btn-row"><button class="btn btn-ghost" id="modal-cancel-btn">閉じる</button></div>
        </div>
      </div>`;
    const backdrop = root.querySelector('.modal-backdrop');
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) UI.closeModal(); });
    root.querySelector('#modal-x-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-cancel-btn').addEventListener('click', ()=>UI.closeModal());
    const status = root.querySelector('#csv-status');
    const setStatus = (msg, cls)=>{ status.textContent = msg; status.className = 'modal-status ' + (cls||'ok'); };
    sections.forEach((s,i)=>{
      root.querySelector(`[data-csv-dl="${i}"]`).addEventListener('click', async (e)=>{
        const btn = e.currentTarget;
        btn.disabled = true;
        setStatus('保存を確認しています…');
        const res = await App.saveFile(s.filename, s.text, {
          bom:true, mime:'text/csv;charset=utf-8',
          altName: s.filename.replace(/\.csv$/i, '.txt') // csv不可の環境では.txtで保存
        });
        btn.disabled = false;
        if(res.ok){
          setStatus(res.savedAs
            ? `⤓ 「${s.name}」を ${res.savedAs} として保存しました（拡張子を .csv に変えるとExcelで開けます）`
            : `⤓ 「${s.name}」を保存しました（保存先をご確認ください）`);
          UI.toast('保存しました');
        } else {
          setStatus(App.saveErrorMessage(res.code), 'warn');
        }
      });
      root.querySelector(`[data-csv-copy="${i}"]`).addEventListener('click', async ()=>{
        const ta = root.querySelector(`#csv-text-${i}`);
        ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try{ await navigator.clipboard.writeText(s.text); ok = true; }
        catch(_){ try{ ok = document.execCommand('copy'); }catch(__){ ok = false; } }
        if(ok){ setStatus(`✓ 「${s.name}」をコピーしました。表計算ソフトに貼り付けてください`); UI.toast('コピーしました'); }
        else{ setStatus('全選択しました。Ctrl+C（長押し→コピー）で取得してください', 'warn'); }
      });
    });
  },

  backupExportModal(text, filename){
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-sheet">
          <button class="modal-close" id="modal-x-btn" aria-label="閉じる">×</button>
          <h2 class="modal-title">バックアップ書き出し（JSON・完全）</h2>
          <div class="modal-body">この1ファイルに全データ（産地・自分・作付設定）が入っています。<b>ダウンロード</b>を押すと保存の確認が出ます。うまくいかない時は<b>コピー</b>を押し、メモ帳などに貼り付けて拡張子 <code>.json</code> で保存してください（ファイル名は自由。例：<code>${Fmt.esc(filename)}</code>）。</div>
          <div class="stack" style="gap:var(--sp2)">
            <div class="row-between">
              <strong>バックアップ全体</strong>
              <div class="btn-row" style="width:auto; flex:0 0 auto">
                <button class="btn btn-sm btn-secondary" id="backup-copy">コピー</button>
                <button class="btn btn-sm btn-ghost" id="backup-dl">ダウンロード</button>
              </div>
            </div>
            <textarea class="csv-text" id="backup-text" readonly>${Fmt.esc(text)}</textarea>
          </div>
          <div class="modal-status" id="backup-status"></div>
          <div class="btn-row"><button class="btn btn-ghost" id="modal-cancel-btn">閉じる</button></div>
        </div>
      </div>`;
    const backdrop = root.querySelector('.modal-backdrop');
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) UI.closeModal(); });
    root.querySelector('#modal-x-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-cancel-btn').addEventListener('click', ()=>UI.closeModal());
    const status = root.querySelector('#backup-status');
    const setStatus = (msg, cls)=>{ status.textContent = msg; status.className = 'modal-status ' + (cls||'ok'); };
    const markDone = ()=>{ Store.markBackedUp(); UI.renderMain(); };
    root.querySelector('#backup-dl').addEventListener('click', async (e)=>{
      const btn = e.currentTarget;
      btn.disabled = true;
      setStatus('保存を確認しています…');
      const res = await App.saveFile(filename, text, {mime:'application/json'});
      btn.disabled = false;
      if(res.ok){
        markDone();
        setStatus('⤓ 保存しました（保存先をご確認ください）');
        UI.toast('保存しました');
      } else {
        setStatus(App.saveErrorMessage(res.code), res.code==='declined' ? 'warn' : 'warn');
      }
    });
    root.querySelector('#backup-copy').addEventListener('click', async ()=>{
      const ta = root.querySelector('#backup-text');
      ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      let ok = false;
      try{ await navigator.clipboard.writeText(text); ok = true; }
      catch(_){ try{ ok = document.execCommand('copy'); }catch(__){ ok = false; } }
      if(ok){ markDone(); setStatus('✓ コピーしました。メモ帳などに貼り付けて .json で保存してください'); UI.toast('コピーしました'); }
      else { setStatus('全選択しました。Ctrl+C（長押し→コピー）で取得してください', 'warn'); }
    });

  moveHighlight(svg, x, y){
    const hl = svg.querySelector('.pt-highlight');
    if(!hl) return;
    hl.setAttribute('cx', x);
    hl.setAttribute('cy', y);
    hl.style.opacity = '1';
  },
  wireLineTooltip(wrap){
    const svg = wrap.querySelector('svg[data-line-chart]');
    if(!svg) return;
    const variety = wrap.getAttribute('data-variety');
    const points = Compute.lineDataDense(variety);
    const W = parseFloat(svg.getAttribute('data-w'));
    const x0 = parseFloat(svg.getAttribute('data-x0'));
    const x1 = parseFloat(svg.getAttribute('data-x1'));
    const n = points.length;
    const xScale = (i)=> n<=1 ? (x0+x1)/2 : x0 + ((x1-x0)*i)/(n-1);
    const detailHtml = (p)=> `<span class="cd-date">${Fmt.date(p.date)}</span><span class="cd-price">${Fmt.yen(p.price)}／箱</span><span class="cd-tag">${p.marker==='2L'?'2L換算':'L代替'}</span>`;
    const showAt = (i)=>{
      const m = svg.querySelector(`[data-pt="${i}"]`);
      if(m) UI.moveHighlight(svg, m.getAttribute('data-x'), m.getAttribute('data-y'));
      UI.showLineDetail(variety, detailHtml(points[i]), 'var(--primary)');
    };
    const handle = (evt)=>{
      const rect = svg.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const svgX = ((clientX - rect.left) / rect.width) * W;
      let nearestI = -1, best = Infinity;
      points.forEach((p,i)=>{
        if(p.price==null) return;
        const d = Math.abs(xScale(i) - svgX);
        if(d<best){ best=d; nearestI=i; }
      });
      if(nearestI<0) return;
      evt.stopPropagation();
      const p = points[nearestI];
      // タップした点の日付に、日付セレクタ・カレンダー・ドーナツ（規格構成）を連動させる。
      if(State.selectedDate !== p.date){
        State.selectedDate = p.date;
        State.calendarMonth = p.date.slice(0,7);
        State.lineDetailShow = {variety, date:p.date}; // 再描画後に詳細を復元
        UI.renderMain();
        return;
      }
      showAt(nearestI); // 同じ日なら詳細だけ更新
    };
    svg.addEventListener('click', handle);
    svg.addEventListener('touchstart', handle, {passive:true});
    // 日付連動による再描画直後は、対象日の詳細を復元表示（プロットの選択状態を維持）
    if(State.lineDetailShow && State.lineDetailShow.variety===variety){
      const idx = points.findIndex(p=>p.date===State.lineDetailShow.date && p.price!=null);
      if(idx>=0) showAt(idx);
      State.lineDetailShow = null;
    }
  },

  wireMultiLineTooltip(wrap){
    const svg = wrap.querySelector('svg[data-multiline-chart]');
    if(!svg || !State.multiMeta) return;
    const {ptMeta, w:W} = State.multiMeta;
    if(!ptMeta || ptMeta.length===0) return;
    const vb = svg.viewBox.baseVal;
    const handle = (evt)=>{
      const rect = svg.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      const svgX = ((clientX - rect.left) / rect.width) * W;
      const svgY = ((clientY - rect.top) / rect.height) * vb.height;
      let nearest = null, best = Infinity;
      ptMeta.forEach(m=>{
        const d = Math.hypot(m.x - svgX, m.y - svgY);
        if(d<best){ best=d; nearest=m; }
      });
      if(!nearest) return;
      UI.moveHighlight(svg, nearest.x, nearest.y);
      UI.showLineDetail(nearest.variety, `<span class="cd-date">${Fmt.date(nearest.date)}</span><span class="cd-price">${Fmt.yen(nearest.price)}／箱</span><span class="cd-tag">${nearest.marker==='2L'?'2L換算':'L代替'}</span>`, nearest.color);
      evt.stopPropagation();
    };
    svg.addEventListener('click', handle);
    svg.addEventListener('touchstart', handle, {passive:true});
  },

  wireBarTooltip(wrap){
    const svg = wrap.querySelector('svg[data-bar-chart]');
    if(!svg) return;
    const tooltip = wrap.querySelector('#bar-tooltip');
    svg.addEventListener('click', (evt)=>{
      const bar = evt.target.closest('[data-bar]');
      if(!bar) { tooltip.classList.add('hidden'); return; }
      const rect = svg.getBoundingClientRect();
      const bbox = bar.getBBox();
      const vb = svg.viewBox.baseVal;
      const px = ((bbox.x+bbox.width/2)/vb.width) * rect.width;
      tooltip.style.left = px + 'px';
      tooltip.style.top = '0px';
      tooltip.textContent = Fmt.yen(parseFloat(bar.getAttribute('data-val')));
      tooltip.classList.remove('hidden');
      evt.stopPropagation();
    });
    document.addEventListener('click', ()=>{ tooltip.classList.add('hidden'); });
  }
};

/* ============================== App / events ============================== */
const App = {
  init(){
    UI.applyTheme();
    Store.load();
    SelfTest.run();
    UI.renderTabs();
    UI.renderMain();
    App.bindEvents();
  },
  bindEvents(){
    document.addEventListener('click', App.onClick);
    document.addEventListener('change', App.onChange);
    document.addEventListener('submit', App.onSubmit);
    // モバイル: キーボードが出ると固定タブバーが持ち上げられるので、その分だけ下に押し戻す。
    // ＝タブの位置は変わらず、キーボードがタブの上に重なるだけになる。
    App.bindKeyboardShift();
  },
  // キーボード表示でタブバーが競り上がるのを打ち消す。
  // 入力にフォーカスがある時だけ、可視領域が縮んだ分（=キーボード高）を transform で戻す。
  bindKeyboardShift(){
    const vv = window.visualViewport;
    const tabbar = document.getElementById('tabbar');
    if(!vv || !tabbar) return; // 非対応環境は従来どおり
    let focused = false;
    const sync = ()=>{
      if(!focused){ tabbar.style.transform = ''; return; }
      // 競り上がり量 = レイアウト高 −(可視高 + 可視領域の上オフセット)
      const gap = Math.round(window.innerHeight - vv.height - vv.offsetTop);
      // キーボードと言える大きさの時だけ補正（誤検知でタブを飛ばさない）
      tabbar.style.transform = (gap > 120) ? `translateY(${gap}px)` : '';
    };
    document.addEventListener('focusin', (e)=>{
      if(e.target.closest('input, textarea, select')){ focused = true; sync(); }
    });
    document.addEventListener('focusout', (e)=>{
      if(e.target.closest('input, textarea, select')){
        focused = false;
        tabbar.style.transform = ''; // 位置を必ず戻す
      }
    });
    vv.addEventListener('resize', sync);
    vv.addEventListener('scroll', sync);
  },
  onClick(e){
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.getAttribute('data-action');
    switch(action){
      case 'switch-tab':
        UI.route(t.getAttribute('data-tab'));
        break;
      case 'theme-cycle':
        UI.cycleTheme();
        break;
      case 'legend-toggle':
        State.donutHighlight = (State.donutHighlight===t.getAttribute('data-cat')) ? null : t.getAttribute('data-cat');
        UI.renderMain();
        break;
      case 'series-toggle': {
        // 全表示→1品種のみ→タップごとに追加→全部そろったら全表示に戻る
        const v = t.getAttribute('data-variety');
        const sel = (State.selectedSeries || []).slice();
        const at = sel.indexOf(v);
        const selectableCount = (State.seriesSelectable && State.seriesSelectable.length) || MAJOR_VARIETIES.length;
        if(sel.length === 0){
          State.selectedSeries = [v];
        } else if(at >= 0){
          sel.splice(at, 1);
          State.selectedSeries = sel; // 空になれば全表示（初期状態）へ
        } else {
          sel.push(v);
          State.selectedSeries = (sel.length >= selectableCount) ? [] : sel;
        }
        UI.renderMain();
        break;
      }
      case 'import-sanchi-paste': {
        const ta = document.getElementById('sanchi-paste');
        const txt = ta ? ta.value : '';
        App.importSanchiText(txt, '貼り付け');
        break;
      }
      case 'import-mine-paste': {
        const ta = document.getElementById('mine-paste');
        const txt = ta ? ta.value : '';
        App.importMineText(txt, '貼り付け');
        break;
      }
      case 'toggle-mine-mode':
        State.mineMode = t.getAttribute('data-mode');
        UI.renderMain();
        break;
      case 'toggle-calendar':
        State.calendarOpen = !State.calendarOpen;
        if(State.calendarOpen) State.calendarMonth = (State.selectedDate || Compute.latestDate() || '').slice(0,7);
        UI.renderMain();
        break;
      case 'close-calendar':
        State.calendarOpen = false;
        UI.renderMain();
        break;
      case 'cal-prev':
      case 'cal-next': {
        const ym = (State.calendarMonth || (State.selectedDate||'').slice(0,7)).split('-');
        const d = new Date(parseInt(ym[0],10), parseInt(ym[1],10)-1 + (action==='cal-next'?1:-1), 1);
        State.calendarMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        UI.renderMain();
        break;
      }
      case 'cal-pick':
        State.selectedDate = t.getAttribute('data-date');
        State.calendarOpen = false;
        State.donutHighlight = null;
        UI.renderMain();
        break;
      case 'date-step-prev':
      case 'date-step-next': {
        const next = Compute.stepDate(State.selectedDate, action==='date-step-next' ? 1 : -1);
        if(next){
          State.selectedDate = next;
          State.donutHighlight = null;
          UI.renderMain();
        }
        break;
      }
      case 'toggle-mine-calendar': {
        // 手入力フォームの他項目を保持するため、再描画せずポップアップを直接開閉
        const mount = document.getElementById('mine-cal-mount');
        if(!mount) break;
        if(mount.innerHTML.trim()){ mount.innerHTML = ''; }
        else {
          const now = new Date();
          State.mineCalMonth = (State.mineDate || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`).slice(0,7);
          mount.innerHTML = UI.mineCalendarHTML();
        }
        break;
      }
      case 'close-mine-calendar': {
        const mount = document.getElementById('mine-cal-mount');
        if(mount) mount.innerHTML = '';
        break;
      }
      case 'mine-cal-prev':
      case 'mine-cal-next': {
        const now = new Date();
        const base = State.mineCalMonth || (State.mineDate||'').slice(0,7) || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        const ym = base.split('-');
        const d = new Date(parseInt(ym[0],10), parseInt(ym[1],10)-1 + (action==='mine-cal-next'?1:-1), 1);
        State.mineCalMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        const mount = document.getElementById('mine-cal-mount');
        if(mount) mount.innerHTML = UI.mineCalendarHTML();
        break;
      }
      case 'mine-cal-pick': {
        State.mineDate = t.getAttribute('data-date');
        const label = document.getElementById('mine-date-label');
        const val = document.getElementById('mine-date-value');
        if(label) label.textContent = Fmt.mmdd(State.mineDate);
        if(val) val.value = State.mineDate;
        const mount = document.getElementById('mine-cal-mount');
        if(mount) mount.innerHTML = '';
        break;
      }
      case 'delete-mine-row': {
        const id = t.getAttribute('data-id');
        const removed = Store.removeJibun(id);
        UI.renderMain();
        if(removed){
          UI.toast('削除しました', {actionLabel:'元に戻す', onAction:()=>{ Store.restoreJibun(removed.rec, removed.index); UI.renderMain(); }, duration:5000});
        }
        break;
      }
      case 'fill-price': {
        // 未確定だった市況行の箱単価を後から入力するモーダルを開く
        UI.fillPriceModal(t.getAttribute('data-key'));
        break;
      }
      case 'alloc-set': {
        // 出荷行を新植/据置に確定
        Store.setJibunPlant(t.getAttribute('data-id'), t.getAttribute('data-plant'), 0);
        UI.renderMain();
        if(document.querySelector('.alloc-modal')) UI.allocModal(); // モーダル表示中なら残りへ更新
        break;
      }
      case 'alloc-mix': {
        // 混在の据置比率入力モーダル（モーダル起点なら保存後に一覧へ戻す）
        const fromModal = !!document.querySelector('.alloc-modal');
        UI.mixRatioModal(t.getAttribute('data-id'), fromModal);
        break;
      }
      case 'open-alloc-modal': {
        UI.allocModal();
        break;
      }
      case 'delete-sakutsuke-row': {
        const id = t.getAttribute('data-id');
        const removed = Store.removeSakutsuke(id);
        UI.renderMain();
        if(removed){
          UI.toast('作付を削除しました', {actionLabel:'元に戻す', onAction:()=>{ Store.restoreSakutsuke(removed); UI.renderMain(); }, duration:5000});
        }
        break;
      }
      case 'export-backup':
        App.exportBackup();
        break;
      case 'export-csv':
        App.exportCSV();
        break;
      case 'open-reset-modal':
        UI.modal('全消去の確認', '産地データ・自分の出荷データを両方とも完全に削除します。この操作は取り消せません。事前にバックアップを書き出すことをおすすめします。', {
          danger:true, confirmLabel:'完全に消去する',
          onConfirm:()=>{ Store.resetAll(); UI.toast('全データを消去しました'); State.selectedVariety=MAJOR_VARIETY_KEY; State.selectedDate=null; UI.route('import'); }
        });
        break;
      case 'close-modal':
        UI.closeModal();
        break;
      case 'step-boxqty': {
        const input = document.querySelector('input[name="boxQty"]');
        if(input){
          const dir = parseInt(t.getAttribute('data-dir'),10);
          const v = Math.max(1, (parseInt(input.value,10)||1) + dir);
          input.value = v;
        }
        break;
      }
    }
  },
  onChange(e){
    if(e.target.id==='variety-select'){
      State.selectedVariety = e.target.value;
      State.donutHighlight = null;
      UI.renderMain();
      return;
    }
    if(e.target.id==='sanchi-file-input' && e.target.files[0]){
      App.handleSanchiFile(e.target.files[0]);
      e.target.value=''; // 同名ファイルを修正して選び直しても再取込できるように
      return;
    }
    if(e.target.id==='mine-file-input' && e.target.files[0]){
      App.handleMineFile(e.target.files[0]);
      e.target.value='';
      return;
    }
    if(e.target.id==='backup-file-input' && e.target.files[0]){
      App.handleBackupFile(e.target.files[0]);
      e.target.value='';
      return;
    }
    if(e.target.name==='spec'){
      // 「別」を選んだ時だけ別本数の入力を表示
      document.getElementById('betsu-wrap').classList.toggle('hidden', e.target.value!=='別');
    }
    if(e.target.name==='variety'){
      // 「その他（自由入力）」を選んだ時だけ品種名の入力欄を表示
      const wrap = document.getElementById('variety-other-wrap');
      if(wrap) wrap.classList.toggle('hidden', e.target.value!=='__other__');
    }
  },
  onSubmit(e){
    const act = e.target.getAttribute('data-action');
    if(act==='submit-manual'){
      e.preventDefault();
      App.submitManual(e.target);
    } else if(act==='submit-sakutsuke'){
      e.preventDefault();
      App.submitSakutsuke(e.target);
    }
  },

  async handleSanchiFile(file){
    const {text, encoding} = await Parse.readFileSmart(file);
    App.importSanchiText(text, encoding);
  },
  // 産地CSV取込の中核（ファイル・ペースト共通）。encoding は表示用ラベル
  importSanchiText(text, encoding){
    try{
      if(!text || !Norm.text(text)){ throw new Error('CSVが空です'); }
      const {records, errors, dupCount} = Parse.sanchiCSV(text);
      const {added, updated} = Store.mergeSanchi(records);
      SelfTest.run();
      State.sanchiImportSummary = `<div class="summary-box ${errors.length?'warn':''}">
          <span>取り込み元: ${Fmt.esc(encoding)}／取込行数: ${records.length}／更新: ${updated}／新規: ${added}${dupCount?`／ファイル内重複: ${dupCount}件（後勝ち上書き）`:''}${errors.length?`／エラー行: ${errors.length}件`:''}</span>
        </div>`;
      UI.renderMain();
      UI.toast(`産地CSVを取込みました（新規${added}・更新${updated}）`);
    }catch(err){
      State.sanchiImportSummary = `<div class="err-box">取込エラー: ${Fmt.esc(err.message)}</div>`;
      UI.renderMain();
    }
  },
  async handleMineFile(file){
    const {text, encoding} = await Parse.readFileSmart(file);
    App.importMineText(text, encoding);
  },
  // 自分CSV取込の中核（ファイル・ペースト共通）
  importMineText(text, encoding){
    try{
      if(!text || !Norm.text(text)){ throw new Error('CSVが空です'); }
      const {records, errors} = Parse.jibunCSV(text);
      const {added, skipped} = Store.mergeJibun(records, 'csv');
      State.mineImportSummary = `<div class="summary-box ${errors.length||skipped?'warn':''}">
          <span>取り込み元: ${Fmt.esc(encoding)}／取込行数: ${records.length}／追加: ${added}${skipped?`／重複スキップ: ${skipped}件`:''}${errors.length?`／エラー行: ${errors.length}件`:''}</span>
        </div>`;
      UI.renderMain();
      UI.toast(`自分の出荷CSVを取込みました（追加${added}）`);
      // 取込直後：新植/据置の両方を作っている品種に未割当があれば、その場で割り当てを促す
      if(added>0 && Compute.unassignedAllocRows().length>0){ UI.allocModal(); }
    }catch(err){
      State.mineImportSummary = `<div class="err-box">取込エラー: ${Fmt.esc(err.message)}</div>`;
      UI.renderMain();
    }
  },
  async handleBackupFile(file){
    try{
      const {text} = await Parse.readFileSmart(file);
      const data = JSON.parse(text);
      State.pendingBackup = data;
      const sCount = (data.sanchi||[]).length, jCount = (data.jibun||[]).length;
      UI.modal('バックアップから復元', `産地データ ${sCount}件・自分の出荷 ${jCount}件を読み込みます。現在の端末内データはすべて置き換えられます。よろしいですか？`, {
        confirmLabel:'復元する',
        onConfirm:()=>{
          Store.importBackup(State.pendingBackup);
          SelfTest.run();
          State.selectedVariety = MAJOR_VARIETY_KEY;
          State.selectedDate = null;
          UI.route('sanchi');
          UI.toast('バックアップから復元しました');
        }
      });
    }catch(err){
      UI.toast('読み込みに失敗しました: ' + err.message);
    }
  },
  exportBackup(){
    const payload = Store.exportBackup();
    const text = JSON.stringify(payload, null, 2);
    const ts = payload.exportedAt.slice(0,10);
    // ダウンロードはサンドボックス（Artifactプレビュー）では無言でブロックされるため、
    // コピー/ダウンロードのモーダルを出し、実際に取得できた時だけ「バックアップ済み」にする。
    UI.backupExportModal(text, `curcuma-backup-${ts}.json`);
  },
  // ファイル保存の共通ルート。
  // Artifact内では <a download> が黙って無視されるため、あればホストの保存機能を使う。
  // 戻り値: {ok:true} / {ok:false, code:'declined'|'unavailable'|...}
  async saveFile(name, text, opts){
    opts = opts || {};
    const data = opts.bom ? '﻿' + text : text;
    const dl = (typeof window !== 'undefined') && window.claude && window.claude.downloads;
    if(dl && typeof dl.save === 'function'){
      try{
        await dl.save({filename:name, data});
        return {ok:true};
      }catch(err){
        const code = (err && err.code) || 'unavailable';
        // csv等は環境により未対応。拡張子違いの代替名があれば一度だけ再試行
        if(code === 'extension_not_enabled' && opts.altName){
          try{
            await dl.save({filename:opts.altName, data});
            return {ok:true, savedAs:opts.altName};
          }catch(err2){
            return {ok:false, code:(err2 && err2.code) || 'unavailable'};
          }
        }
        return {ok:false, code};
      }
    }
    // ファイルを直接開いている場合の従来ルート
    try{
      const blob = new Blob([data], {type: opts.mime || 'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      return {ok:true};
    }catch(e){
      return {ok:false, code:'unavailable'};
    }
  },
  // 保存失敗時の案内文（コピー導線に誘導）
  saveErrorMessage(code){
    switch(code){
      case 'declined': return 'キャンセルしました';
      case 'rate_limited': return '保存の確認が混み合っています。少し待ってからもう一度お試しください';
      case 'too_large': return 'ファイルが大きすぎて保存できません。コピーをお使いください';
      case 'extension_not_enabled':
      case 'rejected_extension': return 'この形式は保存できません。コピーをお使いください';
      default: return 'この環境では保存できませんでした。コピーをお使いください';
    }
  },
  csvCell(v){
    const s = (v==null ? '' : String(v));
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  },
  // 保存されている grade+本数 を取込CSVの規格表記に戻す（2Lは常に本数付き、他は50以外のみ付与）
  specToStr(grade, count){
    const letter = String(grade).replace(/^秀/,'');
    if(letter==='2L') return '2L' + count;
    return letter + (Number(count)!==50 ? count : '');
  },
  buildSanchiCSV(){
    const head = '日付,品種,規格,本数,箱数量,箱単価';
    const rows = Array.from(Store.sanchi.values())
      .sort((a,b)=> a.date.localeCompare(b.date) || a.variety.localeCompare(b.variety))
      .map(r=>[r.date, r.variety, r.grade, r.count, r.boxQty, (r.boxPrice==null ? '未確定' : r.boxPrice)].map(App.csvCell).join(','));
    return {text:[head, ...rows].join('\r\n'), rows:rows.length};
  },
  buildJibunCSV(){
    const head = '出荷日,品種名,規格,箱数,別本数';
    const rows = Store.jibun.slice()
      .sort((a,b)=> a.date.localeCompare(b.date) || a.variety.localeCompare(b.variety))
      .map(r=>{
        const spec = r.betsuCount>0 ? '別' : App.specToStr(r.grade, r.count);
        const betsu = r.betsuCount>0 ? r.betsuCount : '';
        return [r.date, r.variety, spec, r.boxQty, betsu].map(App.csvCell).join(',');
      });
    return {text:[head, ...rows].join('\r\n'), rows:rows.length};
  },
  exportCSV(){
    if(Store.sanchi.size===0 && Store.jibun.length===0){ UI.toast('書き出すデータがありません'); return; }
    const ts = new Date().toISOString().slice(0,10);
    const sections = [];
    if(Store.sanchi.size>0){ const s = App.buildSanchiCSV(); sections.push({name:'産地データ', filename:`curcuma-産地-${ts}.csv`, text:s.text, rows:s.rows}); }
    if(Store.jibun.length>0){ const j = App.buildJibunCSV(); sections.push({name:'自分の出荷', filename:`curcuma-自分-${ts}.csv`, text:j.text, rows:j.rows}); }
    UI.csvExportModal(sections);
  },
  submitManual(form){
    const fd = new FormData(form);
    let variety = Norm.text(fd.get('variety'));
    if(variety==='__other__'){ variety = Norm.text(fd.get('varietyOther')); } // 「その他」選択時は自由入力欄を採用
    const specRaw = Norm.text(fd.get('spec'));
    const date = Norm.date(fd.get('date'));
    const boxQty = Norm.num(fd.get('boxQty'));
    let grade, count, betsuCount = 0;
    if(specRaw==='別'){
      grade = '別'; count = 0; betsuCount = Norm.num(fd.get('betsuCount'));
      if(!(betsuCount>0)){ UI.toast('別本数を入力してください'); return; }
    } else {
      const spec = Parse.parseSpec(specRaw);
      if(spec){ grade = spec.grade; count = spec.count; }
    }
    if(!date || !variety || !grade || Number.isNaN(boxQty) || boxQty<=0){
      UI.toast('入力内容を確認してください');
      return;
    }
    const {added, skipped} = Store.mergeJibun([{date, variety, grade, count, boxQty, betsuCount}], 'manual');
    // 追加後も日付と品種は保持（同じ日・同じ品種で規格違いを連続入力しやすく）。規格・箱数は再描画で既定に戻る。
    if(added){
      // プルダウンにある品種のみ復元（「その他」自由入力は既定へ戻す）
      const registered = new Set(Store.sakutsuke.map(r=>r.variety).filter(Boolean));
      State.mineVariety = registered.has(variety) ? variety : null;
    }
    UI.renderMain();
    UI.toast(added ? '追加しました' : '同じ内容が既に登録されています');
  },
  submitSakutsuke(form){
    const fd = new FormData(form);
    const variety = Norm.text(fd.get('variety'));
    const type = Norm.text(fd.get('type'))==='据置' ? '据置' : '新植';
    const tsubo = Norm.num(fd.get('tsubo'));
    if(!variety || !(tsubo>0)){
      UI.toast('品種と面積（坪）を入力してください');
      return;
    }
    Store.addSakutsuke({variety, type, tsubo});
    UI.renderMain();
    UI.toast('作付を追加しました');
  }
};

App.init();

// 開発用の隠しフック（画面には出ない）。価格計算の回帰チェック用にサンプルを読み込む。
// 使い方（DevToolsコンソール）: __curcumaDev.loadSample()  → コンソールに [SelfTest] OK が出れば計算は正常。
window.__curcumaDev = {
  loadSample(){
    Store.loadSample();
    SelfTest.run();
    State.selectedVariety = MAJOR_VARIETY_KEY;
    State.selectedDate = null;
    State.sanchiImportSummary = '';
    State.mineImportSummary = '';
    UI.route('sanchi');
    return 'サンプルを読み込みました（開発用）';
  },
  selfTest(){ SelfTest.run(); }
};
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}</script>
