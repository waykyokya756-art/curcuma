<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F8F4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10130F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="クルクマ市場分析">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>🌸 クルクマ市場分析</title>
<style>
:root{
  --bg:#F6F8F4; --surface:#FFFFFF; --surface-2:#EFF3EC; --ink:#17201B; --ink-muted:#4C574E;
  --border:#E2E8DD; --primary:#2E7D5B; --primary-soft:#DCEDE3; --accent:#C2568A; --accent-soft:#F6E2ED;
  --warn:#C77A2A; --warn-soft:#F7E9D4; --danger:#C0453B; --danger-soft:#F8DEDB;
  --accent-text:#9E3F70; --warn-text:#9A5B18; --danger-text:#A6392F;
  --chart-2l30:#2E7D5B; --chart-2l50:#7FC4A0; --chart-l50:#E0A458; --chart-other:#B8BDC2;
  --cal-sun:#D64541; --cal-sat:#2F6DB5; --chart-blue:#2F6DB5;
  --mk1:#D6EBDF; --mk2:#F6E6C8; --mk3:#F6DCE9; --mk4:#D9E7F4; --mk5:#E7DDF1;
  --dn1:#3C9A6B; --dn2:#D89A3C; --dn3:#D06B98; --dn4:#4784C6; --dn5:#8A72C2;
  --shadow:0 1px 2px rgba(20,40,30,.06), 0 4px 16px rgba(20,40,30,.05);
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px; --sp8:32px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --font: -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
  --dur:190ms;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10130F; --surface:#191E18; --surface-2:#212820; --ink:#E8EDE6; --ink-muted:#9AA79C;
    --border:#2C342B; --primary:#5BB98A; --primary-soft:#1E3A2C; --accent:#E58BB6; --accent-soft:#3A2430;
    --warn:#E0A458; --warn-soft:#3A2E1B; --danger:#E27469; --danger-soft:#3A211E;
    --accent-text:#E58BB6; --warn-text:#E0A458; --danger-text:#E27469;
    --chart-2l30:#4FA97C; --chart-2l50:#8FD4B4; --chart-l50:#E0A458; --chart-other:#8A9088;
  --cal-sun:#E27469; --cal-sat:#6FA8E0; --chart-blue:#6FA8E0;
    --mk1:#24402F; --mk2:#3A2E1B; --mk3:#3A2430; --mk4:#1E3140; --mk5:#2E2741;
    --dn1:#5BB98A; --dn2:#E0A458; --dn3:#E58BB6; --dn4:#6FA8E0; --dn5:#B79BE8;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#10130F; --surface:#191E18; --surface-2:#212820; --ink:#E8EDE6; --ink-muted:#9AA79C;
  --border:#2C342B; --primary:#5BB98A; --primary-soft:#1E3A2C; --accent:#E58BB6; --accent-soft:#3A2430;
  --warn:#E0A458; --warn-soft:#3A2E1B; --danger:#E27469; --danger-soft:#3A211E;
  --accent-text:#E58BB6; --warn-text:#E0A458; --danger-text:#E27469;
  --chart-2l30:#4FA97C; --chart-2l50:#8FD4B4; --chart-l50:#E0A458; --chart-other:#8A9088;
  --cal-sun:#E27469; --cal-sat:#6FA8E0; --chart-blue:#6FA8E0;
  --mk1:#24402F; --mk2:#3A2E1B; --mk3:#3A2430; --mk4:#1E3140; --mk5:#2E2741;
  --dn1:#5BB98A; --dn2:#E0A458; --dn3:#E58BB6; --dn4:#6FA8E0; --dn5:#B79BE8;
  --shadow:none;
}
:root[data-theme="light"]{
  --bg:#F6F8F4; --surface:#FFFFFF; --surface-2:#EFF3EC; --ink:#17201B; --ink-muted:#4C574E;
  --border:#E2E8DD; --primary:#2E7D5B; --primary-soft:#DCEDE3; --accent:#C2568A; --accent-soft:#F6E2ED;
  --warn:#C77A2A; --warn-soft:#F7E9D4; --danger:#C0453B; --danger-soft:#F8DEDB;
  --accent-text:#9E3F70; --warn-text:#9A5B18; --danger-text:#A6392F;
  --chart-2l30:#2E7D5B; --chart-2l50:#7FC4A0; --chart-l50:#E0A458; --chart-other:#B8BDC2;
  --cal-sun:#D64541; --cal-sat:#2F6DB5; --chart-blue:#2F6DB5;
  --mk1:#D6EBDF; --mk2:#F6E6C8; --mk3:#F6DCE9; --mk4:#D9E7F4; --mk5:#E7DDF1;
  --dn1:#3C9A6B; --dn2:#D89A3C; --dn3:#D06B98; --dn4:#4784C6; --dn5:#8A72C2;
  --shadow:0 1px 2px rgba(20,40,30,.06), 0 4px 16px rgba(20,40,30,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{font-size:112.5%; -webkit-text-size-adjust:100%; text-size-adjust:100%;} /* 既定16px→18px。文字の自動リサイズで再レイアウトが起きないよう固定 */
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  font-size:0.9375rem; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit; color:inherit;}
h1,h2,h3,p{margin:0;}
.tnum{font-variant-numeric:tabular-nums;}
::selection{background:var(--primary-soft);}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* svh はキーボード開閉で値が変わらない（vh は環境により変動しページが揺れる） */
#app{min-height:100vh; min-height:100svh; padding-bottom:calc(64px + env(safe-area-inset-bottom) + 12px);}
/* 入力へフォーカスした時の自動スクロールが、上のヘッダー/下のタブバーと干渉して
   行ったり来たりしないよう、あらかじめ余白を確保しておく */
input, textarea, select{scroll-margin-top:72px; scroll-margin-bottom:96px;}

/* ---- App bar ---- */
#appbar{
  position:sticky; top:0; z-index:20; height:56px; display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--sp4); background:var(--surface); border-bottom:1px solid var(--border);
}
.wordmark{font-weight:700; font-size:1rem; display:flex; align-items:center; gap:var(--sp2); white-space:nowrap;}
.appbar-right{display:flex; align-items:center; gap:var(--sp2);}
.data-chip{
  font-size:0.75rem; color:var(--ink-muted); background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--r-pill); padding:4px 10px; white-space:nowrap;
}
.icon-btn{
  width:36px; height:36px; border-radius:var(--r-pill); border:1px solid var(--border); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.icon-btn svg{width:18px; height:18px;}
.storage-banner{
  background:var(--danger-soft); color:var(--danger-text); font-size:0.8125rem; padding:8px var(--sp4);
  text-align:center; border-bottom:1px solid var(--border);
}

/* ---- Main / layout ---- */
main{max-width:640px; margin:0 auto; padding:var(--sp4); display:flex; flex-direction:column; gap:var(--sp4);}

/* ---- Cards ---- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--sp4); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:var(--sp3);
}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:var(--sp2);}
.card-title{font-size:1rem; font-weight:600;}
.card-caption{font-size:0.75rem; color:var(--ink-muted);}
.screen-title{font-size:1.25rem; font-weight:700;}

/* ---- Buttons ---- */
.btn{
  min-height:48px; border-radius:var(--r-md); border:1px solid transparent; padding:0 var(--sp4);
  font-size:0.9375rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  gap:var(--sp2); transition:transform var(--dur) ease-out, opacity var(--dur) ease-out; width:100%;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-secondary{background:var(--primary-soft); color:var(--primary);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-sm{min-height:36px; width:auto; padding:0 var(--sp3); font-size:0.8125rem;}
.btn-row{display:flex; gap:var(--sp3);}

/* ---- Segmented control ---- */
.segmented{display:flex; background:var(--surface-2); border-radius:var(--r-md); padding:3px; gap:3px;}
.segmented button{
  flex:1; border:none; background:transparent; padding:10px; border-radius:var(--r-sm); font-size:0.875rem;
  font-weight:600; color:var(--ink-muted); cursor:pointer;
}
.segmented button[aria-selected="true"]{background:var(--surface); color:var(--primary); box-shadow:var(--shadow);}

/* ---- Chips / badges ---- */
.badge{display:inline-flex; align-items:center; gap:4px; border-radius:var(--r-pill); padding:3px 10px; font-size:0.75rem; font-weight:600;}
.badge-matched{background:var(--primary-soft); color:var(--primary);}
.badge-unmatched{background:var(--warn-soft); color:var(--warn-text);}
.badge-nomatch{background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--border);}

/* ---- Toast ---- */
#toast-region{position:fixed; left:0; right:0; bottom:calc(64px + env(safe-area-inset-bottom) + 8px); z-index:90; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
.toast{
  pointer-events:auto; background:var(--ink); color:var(--bg); border-radius:var(--r-md); padding:10px 14px;
  font-size:0.875rem; display:flex; align-items:center; gap:var(--sp3); box-shadow:var(--shadow);
  max-width:90vw; animation:toast-in var(--dur) ease-out;
}
:root[data-theme="dark"] .toast, @media (prefers-color-scheme:dark){ .toast{} }
.toast button{background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:0.875rem;}
@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---- Modal ---- */
.modal-backdrop{position:fixed; inset:0; background:rgba(10,15,10,.45); z-index:70; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{
  background:var(--surface); width:100%; max-width:640px; border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:var(--sp5); padding-bottom:calc(var(--sp5) + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:var(--sp4);
  animation:sheet-in var(--dur) ease-out; max-height:90vh; overflow-y:auto; position:relative;
}
.modal-close{position:absolute; top:8px; right:8px; width:40px; height:40px; border:none; background:transparent; color:var(--ink-muted); font-size:1.625rem; line-height:1; cursor:pointer; border-radius:var(--r-pill); display:inline-flex; align-items:center; justify-content:center;}
@keyframes sheet-in{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-title{font-size:1.0625rem; font-weight:700;}
.modal-body{color:var(--ink-muted); font-size:0.875rem;}
.modal-status{font-size:0.8125rem; font-weight:700; min-height:1.2em; text-align:center;}
.modal-status.ok{color:var(--primary);}
.modal-status.warn{color:var(--warn-text);}
/* font-size は 16px 以上を維持（iOSは16px未満の入力にフォーカスすると自動ズームする） */
.csv-text{width:100%; min-height:110px; max-height:200px; resize:vertical; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16px; line-height:1.5; white-space:pre; overflow:auto; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface-2); color:var(--ink); padding:8px;}

/* ---- Forms ---- */
label.field{display:flex; flex-direction:column; gap:6px; font-size:0.8125rem; color:var(--ink-muted); font-weight:500;}
.select-wrap{position:relative;}
select, input[type="date"], input[type="text"], input[type="number"]{
  width:100%; min-height:48px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2);
  color:var(--ink); padding:0 var(--sp3); font-size:0.9375rem; appearance:none; -webkit-appearance:none;
}
select{padding-right:36px; background-image:none;}
.select-wrap::after{
  content:""; position:absolute; right:14px; top:50%; width:8px; height:8px; border-right:2px solid var(--ink-muted);
  border-bottom:2px solid var(--ink-muted); transform:translateY(-70%) rotate(45deg); pointer-events:none;
}
.stepper{display:flex; align-items:center; gap:var(--sp2);}
.stepper button{width:44px; height:44px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2); font-size:1.25rem; cursor:pointer;}
.stepper input{text-align:center;}
.dropzone{
  display:flex; flex-direction:row; align-items:center; justify-content:center; gap:8px; text-align:center;
  border:1.5px dashed var(--border); border-radius:var(--r-md); padding:10px var(--sp3); cursor:pointer; color:var(--ink-muted);
  min-height:44px;
}
.dropzone strong{color:var(--ink); font-size:0.9375rem;}
.dropzone svg{width:20px; height:20px; color:var(--primary); flex-shrink:0;}
input[type="file"]{display:none;}

/* ---- Tabs (bottom nav) ---- */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50; height:calc(64px + env(safe-area-inset-bottom));
  background:var(--surface); border-top:1px solid var(--border); display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border:none; background:none; color:var(--ink-muted); cursor:pointer; min-height:44px;
}
.tab svg{width:22px; height:22px;}
.tab span{font-size:0.6875rem; font-weight:500;}
.tab[aria-selected="true"]{color:var(--primary);}
.tab[aria-selected="true"] span{font-weight:700;}
/* 入力中もタブバーの位置は動かさない（キーボードに覆われるだけにする）。
   持ち上がり分の打ち消しは JS が transform で行う */
#tabbar{will-change:transform;}

/* ペースト取込欄（コンパクト・常時表示） */
.paste-row{display:flex; flex-direction:column; gap:var(--sp2); margin-top:var(--sp2);}
.csv-paste{min-height:72px;}

/* ---- KPI ---- */
.kpi-card{border:1.5px solid var(--accent); background:var(--surface); position:relative; overflow:hidden;}
.kpi-label{font-size:0.75rem; color:var(--ink-muted); font-weight:600;}
.kpi-value{font-size:clamp(2rem,8vw,2.75rem); font-weight:700; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.kpi-sub{display:flex; gap:var(--sp4); font-size:0.8125rem; color:var(--ink-muted); flex-wrap:wrap;}
.kpi-sub b{color:var(--ink); font-weight:600;}
.kpi-secondary{display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp3); padding-top:var(--sp2); border-top:1px dashed var(--border);}
.kpi-sec-label{font-size:0.8125rem; color:var(--ink-muted); font-weight:600;}
.kpi-sec-value{font-size:1.5rem; font-weight:700; color:var(--accent-text);}
.kpi-sec-value small{font-size:0.875rem; font-weight:600; color:var(--ink-muted); margin-left:2px;}
.tag-betsu{display:inline-block; font-size:0.6875rem; font-weight:700; color:var(--warn-text); background:var(--warn-soft); border-radius:var(--r-sm); padding:1px 6px; vertical-align:middle;}

/* ---- Empty state ---- */
.empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; gap:var(--sp3); padding:var(--sp6) var(--sp4); color:var(--ink-muted);}
.empty-state svg{width:40px; height:40px; color:var(--border);}

/* ---- Legend ---- */
.legend{display:flex; flex-direction:column; gap:var(--sp2);}
.legend-item{display:flex; align-items:center; gap:var(--sp3); font-size:0.9375rem; padding:8px 6px; border-radius:var(--r-sm); cursor:pointer; border:1px solid transparent;}
.legend-item[data-active="true"]{border-color:var(--border); background:var(--surface-2);}
.legend-dot{width:16px; height:16px; border-radius:4px; flex-shrink:0;}
.legend-label{flex:1; font-weight:600;}
.legend-val{color:var(--ink-muted); font-size:0.875rem; white-space:nowrap;}
.legend-val-strong{color:var(--ink); font-weight:700;}
.donut-col{display:flex; flex-direction:column; align-items:center; gap:var(--sp3);}
.donut-col .legend{width:100%; gap:2px;}
.donut-col .legend-item{padding:4px 6px;}
.donut-col .legend-val{font-size:0.9375rem; font-weight:600;}
.donut-col .legend-val-strong{color:var(--ink-muted); font-weight:600;}

/* ---- Donut / chart wrap ---- */
.chart-wrap{position:relative; width:100%;}
.chart-wrap svg{width:100%; height:auto; display:block; overflow:visible;}
.chart-scroll{overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;}
.chart-wrap .chart-scroll svg{width:auto; max-width:none;}
/* 横スクロールしても左端に固定するY軸ラベル */
.chart-yaxis{position:absolute; left:0; top:0; z-index:2; pointer-events:none; background:var(--surface); border-right:1px solid var(--border);}
.chart-yaxis svg{display:block;}
.donut-row{display:flex; align-items:center; gap:var(--sp4); flex-wrap:nowrap;}
.donut-svg{width:150px; height:150px; flex-shrink:0; max-width:100%;}
.donut-center-num{font-size:1.25rem; font-weight:700; fill:var(--ink);}
.donut-center-lbl{font-size:0.625rem; fill:var(--ink-muted);}
.legend-flex{flex:1 1 auto; min-width:0;}

.tooltip{
  position:absolute; background:var(--ink); color:var(--bg); padding:6px 10px; border-radius:var(--r-sm);
  font-size:0.75rem; pointer-events:none; white-space:nowrap; transform:translate(-50%,-115%); z-index:5; box-shadow:var(--shadow);
}
.chart-caption{font-size:0.75rem; color:var(--warn-text); background:var(--warn-soft); border-radius:var(--r-sm); padding:6px 10px;}
/* 折れ線の詳細表示（固定位置。タップしたプロットの内容を表示） */
.chart-detail{display:flex; align-items:center; gap:10px; min-height:72px; padding:8px 12px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--border); color:var(--ink);}
.chart-detail[data-empty="true"]{color:var(--ink-muted); font-size:0.8125rem;}
.chart-detail .cd-dot{width:12px; height:12px; border-radius:3px; flex-shrink:0;}
.chart-detail .cd-body{display:flex; flex-direction:column; gap:2px; min-width:0;}
.chart-detail .cd-name{font-weight:700; font-size:0.9375rem;}
.chart-detail .cd-info{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:0.875rem; color:var(--ink-muted);}
.chart-detail .cd-price{font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
.chart-detail .cd-tag{font-size:0.75rem; color:var(--ink-muted); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-pill); padding:2px 8px;}
.chart-legend-row{display:flex; gap:var(--sp4); font-size:0.75rem; color:var(--ink-muted); flex-wrap:wrap;}
.chart-legend-row span{display:inline-flex; align-items:center; gap:4px;}
.selector-row{display:flex; gap:var(--sp3);}
.selector-row .field{min-width:0;}
.selector-row .date-field{flex:5;}
/* 「品種」ラベルの見た目を「日付」に合わせる（この行だけ） */
.selector-row .variety-field{flex:5; font-size:0.9375rem; color:var(--ink); font-weight:400; gap:0;}
.date-field{position:relative;}
.date-nav{display:flex; align-items:stretch; gap:4px;}
.date-nav .date-trigger{flex:1; min-width:0; padding:0 6px; justify-content:center; gap:2px;}
.date-step{width:32px; min-height:48px; flex-shrink:0; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:1rem; font-weight:700; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
.date-step:disabled{opacity:.35; cursor:default;}
.date-step:active:not(:disabled){background:var(--primary-soft);}
.date-trigger{
  width:100%; min-height:48px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2);
  color:var(--ink); padding:0 var(--sp3); font-size:0.9375rem; cursor:pointer; text-align:left;
  display:flex; align-items:center; justify-content:space-between; gap:6px; font-variant-numeric:tabular-nums;
}
.date-trigger .caret{color:var(--ink-muted); font-size:0.75rem;}
.cal-backdrop{position:fixed; inset:0; z-index:39;}
.cal-pop{
  position:absolute; top:calc(100% + 6px); left:0; z-index:40; width:330px; max-width:calc(100vw - 32px);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow); padding:var(--sp3);
}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp2);}
.cal-head button{width:44px; height:44px; border:none; background:var(--surface-2); border-radius:var(--r-sm); cursor:pointer; font-size:1.375rem; color:var(--ink);}
.cal-title{font-weight:700; font-size:1.0625rem;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
.cal-wd{text-align:center; font-size:0.8125rem; font-weight:600; color:var(--ink-muted); padding:5px 0;}
.cal-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:var(--r-sm); font-size:1.0625rem; font-weight:600; font-variant-numeric:tabular-nums; border:none; background:transparent; color:var(--ink); cursor:pointer; padding:0;}
.cal-day.enabled{color:var(--ink);}
.cal-day.enabled:active{background:var(--primary-soft);}
.cal-day.disabled{color:var(--ink-muted); opacity:0.4; font-weight:400; cursor:default;}
.cal-wd.cal-sun, .cal-day.cal-sun{color:var(--cal-sun);}
.cal-wd.cal-sat, .cal-day.cal-sat{color:var(--cal-sat);}
.cal-day.selected{background:var(--primary); color:#fff; font-weight:700;}
.cal-day.empty{visibility:hidden;}
.series-legend{display:flex; flex-direction:column; gap:2px;}
.series-legend .legend-item{cursor:default; font-size:0.9375rem; padding:6px; min-height:32px; border-radius:var(--r-sm);}
.series-legend .legend-item[data-action]{cursor:pointer;}
.series-legend .legend-item[data-action]:active{background:var(--surface-2);}
.series-legend .legend-item.series-off{opacity:0.4;}
.series-legend .legend-item.series-off .legend-label{text-decoration:line-through;}
.series-dot{width:28px; height:6px; border-radius:3px; flex-shrink:0;}
.series-muted{opacity:0.5;}

/* ---- Shipment list ---- */
.ship-row{display:flex; align-items:center; justify-content:space-between; gap:var(--sp3); padding:var(--sp3); border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface-2);}
.ship-row + .ship-row{margin-top:var(--sp2);}
.ship-day-card{padding:var(--sp3); border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface-2);}
.ship-day-card + .ship-day-card{margin-top:var(--sp3);}
.ship-date-head{display:flex; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums; padding-bottom:6px; margin-bottom:var(--sp2); border-bottom:2px solid var(--border);}
.ship-date-md{font-size:1.3125rem; font-weight:800; color:var(--ink);}
.ship-date-wd{font-size:0.9375rem; font-weight:700; color:var(--ink-muted);}
.ship-date-boxes{margin-left:auto; font-size:0.9375rem; font-weight:600; color:var(--ink-muted);}
.ship-date-total{margin-left:var(--sp3); font-size:1.125rem; font-weight:700; color:var(--ink);}
.ship-variety-block + .ship-variety-block{margin-top:6px; padding-top:6px; border-top:1px solid var(--border);}
.sv-head{display:flex; align-items:center; justify-content:space-between; gap:var(--sp3);}
.sv-head .ship-name{font-size:1.0625rem;}
.sv-head .ship-amount{font-size:1.0625rem;}
.ship-name.mk{padding:.08em .36em; border-radius:5px; box-decoration-break:clone; -webkit-box-decoration-break:clone; color:var(--ink);}
.ship-name.mk1{background:var(--mk1);}
.ship-name.mk2{background:var(--mk2);}
.ship-name.mk3{background:var(--mk3);}
.ship-name.mk4{background:var(--mk4);}
.ship-name.mk5{background:var(--mk5);}
.sv-specs{margin-top:4px;}
.sv-spec{position:relative; padding:8px 44px 8px 0; border-top:1px solid var(--border);}
.sv-spec:first-child{border-top:0; padding-top:2px;}
.sv-spec-main{display:flex; align-items:baseline; gap:10px; font-size:0.9375rem; color:var(--ink);}
.sv-grade{font-weight:600;}
.sv-boxes{margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums;}
.sv-spec-sub{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; margin-top:2px; font-size:0.8125rem; color:var(--ink-muted); font-variant-numeric:tabular-nums;}
.sv-spec-sub .u{font-size:0.6875rem; margin-left:1px;}
.sv-dot{opacity:.5;}
.sv-del{position:absolute; top:50%; right:0; transform:translateY(-50%); width:44px; height:44px; display:flex; align-items:center; justify-content:center; padding:0; border:0; background:transparent; color:var(--ink-muted); cursor:pointer; border-radius:8px;}
.sv-del svg{width:18px; height:18px;}
.sv-del:active{background:var(--surface-2);}
.ship-main{display:flex; flex-direction:column; gap:2px; min-width:0;}
.ship-date{font-size:0.75rem; color:var(--ink-muted);}
.ship-name{font-weight:600; font-size:0.9375rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ship-detail{font-size:0.75rem; color:var(--ink-muted);}
.ship-amount{font-weight:700; font-variant-numeric:tabular-nums; text-align:right; flex-shrink:0;}
.ship-del{width:44px; height:44px; border-radius:var(--r-pill); border:none; background:transparent; color:var(--ink-muted); cursor:pointer; flex-shrink:0;}
.ship-del svg{width:18px; height:18px;}

/* 未確定（要入力）：金額が後日確定する行のバッジ＋入力ボタン */
.badge-pending{background:var(--warn-soft); color:var(--warn-text);}
.btn-fill{min-height:32px; padding:0 12px; border-radius:var(--r-pill); border:1px solid var(--warn); background:var(--warn-soft); color:var(--warn-text); font-size:0.8125rem; font-weight:700; cursor:pointer; flex-shrink:0; white-space:nowrap;}
.btn-fill:active{background:var(--warn); color:#fff;}
.card-pending{border-color:var(--warn); background:var(--warn-soft);}
.card-pending .card-title{color:var(--warn-text);}
.card-pending .ship-row{background:var(--surface); border-radius:var(--r-sm); padding:8px 10px;}
/* 箱単価入力モーダル */
.fill-target{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px; padding:10px 12px; margin-bottom:var(--sp3); background:var(--surface-2); border-radius:var(--r-md); font-variant-numeric:tabular-nums;}
.fill-target .fill-date{font-weight:700; color:var(--ink);}
.fill-target .fill-name{font-weight:700; color:var(--ink);}
.fill-target .fill-spec{color:var(--ink-muted); font-size:0.9375rem;}
.fill-input-row{display:flex; align-items:center; gap:8px; margin-top:var(--sp3);}
.fill-input-label{font-weight:600; color:var(--ink); flex-shrink:0;}
.fill-input{flex:1; min-width:0; min-height:48px; padding:0 12px; font-size:1.125rem; text-align:right; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); color:var(--ink); font-variant-numeric:tabular-nums;}
.fill-input:focus{outline:2px solid var(--primary); outline-offset:1px;}
.fill-input-unit{color:var(--ink-muted); flex-shrink:0;}

/* 品種別指標：品種ごとの label:value スタック（桁数が増えても崩れない） */
.vm-list{list-style:none; margin:0; padding:0;}
.vm-item{padding:12px 0; border-top:1px solid var(--border);}
.vm-item:first-child{border-top:0; padding-top:2px;}
.vm-name{display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp3); margin-bottom:8px;}
.vm-name .ship-name{white-space:normal; overflow:visible; text-overflow:clip; font-size:1.0625rem; font-weight:600; min-width:0;}
.vm-amount{flex-shrink:0; font-size:1.1875rem; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
.vm-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px;}
.vm-cell{display:flex; flex-direction:column; gap:2px; padding:6px 10px; border-radius:8px; background:var(--surface-2);}
.vm-label{font-size:0.6875rem; color:var(--ink-muted);}
.vm-val{font-size:1rem; font-weight:600; line-height:1.2; font-variant-numeric:tabular-nums;}
.vm-val.is-empty{color:var(--ink-muted); font-weight:500;}
.vm-unit{font-size:0.75rem; font-weight:500; color:var(--ink-muted); margin-left:1px;}
@media (min-width:480px){ .vm-grid{grid-template-columns:repeat(4,1fr);} }

/* 品種別内訳の展開（新植/据置の内訳） */
.vm-details > summary{list-style:none; cursor:pointer;}
.vm-details > summary::-webkit-details-marker{display:none;}
.vm-summary .ship-name{flex:1 1 auto;}
.vm-caret{flex:0 0 auto; color:var(--ink-muted); font-size:0.8125rem; transition:transform var(--dur);}
.vm-details[open] .vm-caret{transform:rotate(180deg);}
.vm-detail{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
.vm-detail-head{font-size:0.75rem; font-weight:700; color:var(--ink-muted); margin-bottom:8px;}
.pt-bars{display:flex; flex-direction:column; gap:8px;}
.pt-bar-row{display:flex; align-items:center; gap:8px;}
.pt-bar-label{flex:0 0 40px; font-size:0.8125rem; font-weight:700;}
.pt-bar-label.pt-shin{color:var(--primary);}
.pt-bar-label.pt-sue{color:var(--accent-text);}
.pt-bar-track{flex:1; height:16px; background:var(--surface-2); border-radius:var(--r-pill); overflow:hidden;}
.pt-bar-fill{height:100%; border-radius:var(--r-pill); min-width:2px;}
.pt-bar-fill.pt-shin{background:var(--primary);}
.pt-bar-fill.pt-sue{background:var(--accent);}
.pt-bar-val{flex:0 0 auto; min-width:56px; text-align:right; font-size:0.875rem; font-weight:600; font-variant-numeric:tabular-nums;}
.pt-metrics{display:flex; flex-direction:column; gap:6px; margin-top:12px;}
.pt-metric{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.pt-metric-label{flex:0 0 40px; font-size:0.8125rem; font-weight:700;}
.pt-metric-label.pt-shin{color:var(--primary);}
.pt-metric-label.pt-sue{color:var(--accent-text);}
.pt-metric-cell{display:flex; flex-direction:column; gap:1px; padding:4px 10px; background:var(--surface-2); border-radius:8px;}
.pt-metric-k{font-size:0.6875rem; color:var(--ink-muted);}
.pt-metric-v{font-size:0.9375rem; font-weight:600; font-variant-numeric:tabular-nums;}
.pt-metric-v.is-empty{color:var(--ink-muted); font-weight:500;}
.pt-unassigned{margin-top:10px; font-size:0.8125rem; color:var(--warn-text);}

/* 新植/据置 割り当てカード・行 */
.badge-alloc{background:var(--accent-soft); color:var(--accent-text);}
.card-alloc{border-color:var(--accent); background:var(--accent-soft);}
.card-alloc .card-title{color:var(--accent-text);}
.alloc-row{display:flex; flex-direction:column; gap:8px; padding:10px; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface);}
.alloc-main{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; font-variant-numeric:tabular-nums;}
.alloc-btns{display:flex; gap:6px;}
.btn-plant{flex:1; min-height:40px; padding:0 8px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:0.875rem; font-weight:700; cursor:pointer; white-space:nowrap;}
.btn-plant:active{background:var(--border);}
.btn-plant.is-on{border-color:var(--primary); background:var(--primary-soft); color:var(--primary);}

details.collapse summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:var(--sp2); font-weight:600; font-size:0.875rem;}
details.collapse summary::-webkit-details-marker{display:none;}
details.collapse summary::before{content:"▸"; color:var(--ink-muted); transition:transform var(--dur);}
details.collapse[open] summary::before{transform:rotate(90deg);}

.onboard-step{display:flex; gap:var(--sp3); align-items:flex-start;}
.onboard-num{width:26px; height:26px; border-radius:var(--r-pill); background:var(--primary-soft); color:var(--primary); font-weight:700; font-size:0.8125rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.onboard-text{font-size:0.875rem;}
.onboard-text b{display:block; margin-bottom:2px;}
.onboard-text span{color:var(--ink-muted); font-size:0.8125rem;}

.summary-box{background:var(--primary-soft); color:var(--primary); border-radius:var(--r-md); padding:var(--sp3); font-size:0.8125rem; display:flex; flex-direction:column; gap:4px;}
.summary-box.warn{background:var(--warn-soft); color:var(--warn-text);}
.err-box{background:var(--danger-soft); color:var(--danger-text); border-radius:var(--r-md); padding:var(--sp3); font-size:0.75rem;}

.hidden{display:none !important;}
.muted{color:var(--ink-muted);}
.stack{display:flex; flex-direction:column; gap:var(--sp3);}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:var(--sp3);}
</style>
</head>
<body>

<div id="app">
  <header id="appbar">
    <div class="wordmark">🌸 クルクマ市場分析</div>
    <div class="appbar-right">
      <span class="data-chip" id="data-chip">産地0件・自分0件</span>
      <button class="icon-btn" id="theme-btn" data-action="theme-cycle" aria-label="テーマ切替"></button>
    </div>
  </header>
  <div id="storage-banner-region"></div>
  <main id="main"></main>
  <nav id="tabbar" role="tablist" aria-label="画面切替"></nav>
  <div id="toast-region" aria-live="polite"></div>
  <div id="modal-root"></div>
</div>

<script type="module">
'use strict';

/* ============================== Icon ============================== */
const Icon = {
  origin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8" stroke="currentColor" stroke-width="2"/></svg>',
  mine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="19" x2="5" y2="10"/><line x1="12" y1="19" x2="12" y2="5"/><line x1="19" y1="19" x2="19" y2="13"/></svg>',
  import:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/><polyline points="7 9 12 14 17 9"/><line x1="12" y1="14" x2="12" y2="3"/></svg>',
  backup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v6c0 5-3 8-7 11-4-3-7-6-7-11V5z"/><polyline points="9 12 11 14 15 10"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>',
  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'
};

/* ============================== Fmt ============================== */
const Fmt = {
  yen(n){ if(n==null||Number.isNaN(n)) return '¥0'; return '¥' + Math.round(n).toLocaleString('ja-JP'); },
  num(n){ if(n==null||Number.isNaN(n)) return '0'; return Math.round(n).toLocaleString('ja-JP'); },
  pct(n){ if(n==null||Number.isNaN(n)) return '0.0%'; return n.toFixed(1) + '%'; },
  date(iso){
    if(!iso) return '';
    const p = iso.split('-'); if(p.length!==3) return iso;
    return `${parseInt(p[1],10)}/${parseInt(p[2],10)}`;
  },
  mmdd(iso){
    if(!iso) return '--/--';
    const p = iso.split('-'); if(p.length!==3) return iso;
    return `${p[1]}/${p[2]}`;
  },
  wd(iso){
    if(!iso) return '';
    const dt = new Date(iso + 'T00:00:00');
    if(Number.isNaN(dt.getTime())) return '';
    return ['日','月','火','水','木','金','土'][dt.getDay()];
  },
  wdClass(iso){
    if(!iso) return '';
    const dt = new Date(iso + 'T00:00:00');
    if(Number.isNaN(dt.getTime())) return '';
    const d = dt.getDay();
    return d===0 ? 'cal-sun' : d===6 ? 'cal-sat' : '';
  },
  esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
};

/* ============================== Norm ============================== */
const Norm = {
  text(s){ return (s==null?'':String(s)).normalize('NFKC').trim(); },
  grade(s){
    const t = Norm.text(s);
    if(t==='') return '';
    if(t==='別') return '別';
    const core = t.replace(/^秀/,'').toUpperCase();
    if(['2L','L','M','S'].includes(core)) return '秀'+core;
    return t;
  },
  date(s){
    let t = Norm.text(s);
    if(t==='') return '';
    const parts = t.split(/[\/\-.年月]/).map(p=>p.replace(/日$/,'').trim()).filter(p=>p!=='');
    if(parts.length===3){
      const y = parts[0].padStart(4,'0');
      const m = parts[1].padStart(2,'0');
      const d = parts[2].padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    return t;
  },
  num(s){
    if(typeof s === 'number') return s;
    let t = Norm.text(s).replace(/[,，]/g,'');
    if(t==='') return NaN;
    const n = Number(t);
    return n;
  },
  key(date, variety, grade, count){
    return JSON.stringify([Norm.date(date), Norm.text(variety), Norm.grade(grade), Norm.num(count)]);
  }
};

/* ============================== Parse ============================== */
const Parse = {
  async readFileSmart(file){
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    let encoding = 'UTF-8';
    if(text.includes('\uFFFD')){
      try{
        const alt = new TextDecoder('shift_jis').decode(buf);
        text = alt; encoding = 'Shift_JIS';
      }catch(e){ /* keep utf-8 fallback */ }
    }
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    return {text, encoding};
  },
  csv(text){
    const norm = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    const rows = []; let row = []; let field = ''; let inQ = false;
    for(let i=0;i<norm.length;i++){
      const c = norm[i];
      if(inQ){
        if(c === '"'){
          if(norm[i+1] === '"'){ field += '"'; i++; } else { inQ = false; }
        } else field += c;
      } else {
        if(c === '"') inQ = true;
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else field += c;
      }
    }
    if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
    return rows.filter(r => !(r.length===1 && Norm.text(r[0])===''));
  },
  headerIndex(headerRow){
    const idx = {};
    headerRow.forEach((h,i)=>{ idx[Norm.text(h)] = i; });
    return idx;
  },
  sanchiCSV(text){
    const rows = Parse.csv(text);
    if(rows.length===0) return {records:[], errors:[], dupCount:0};
    const idx = Parse.headerIndex(rows[0]);
    const need = ['日付','品種','規格','本数','箱数量','箱単価'];
    const missing = need.filter(k=>!(k in idx));
    if(missing.length) throw new Error('必須列が見つかりません: ' + missing.join('、'));
    const records = []; const errors = []; const seen = new Set(); let dupCount = 0;
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      if(row.every(f=>Norm.text(f)==='')) continue;
      const date = Norm.date(row[idx['日付']]);
      const variety = Norm.text(row[idx['品種']]);
      const grade = Norm.grade(row[idx['規格']]);
      const count = Norm.num(row[idx['本数']]);
      const boxQty = Norm.num(row[idx['箱数量']]);
      // 箱単価は「未確定」(文字列)を許容＝pendingとしてnullで保持。空欄・ゴミ数値は従来どおりエラー。
      const priceRaw = Norm.text(row[idx['箱単価']]);
      const boxPrice = (priceRaw === '未確定') ? null : Norm.num(priceRaw);
      if(!date || !variety || !grade || Number.isNaN(count) || Number.isNaN(boxQty) || (boxPrice!==null && Number.isNaN(boxPrice))){
        errors.push({line:r+1, raw:row.join(',')});
        continue;
      }
      const key = Norm.key(date, variety, grade, count);
      if(seen.has(key)) dupCount++;
      seen.add(key);
      records.push({date, variety, grade, count, boxQty, boxPrice, key});
    }
    return {records, errors, dupCount};
  },
  // 「2L30」→{秀2L,30}, 「2L50」→{秀2L,50}, 「L」→{秀L,50}, 「M」→{秀M,50}
  parseSpec(raw){
    const t = Norm.text(raw).toUpperCase().replace(/秀/g,'').replace(/\s/g,'');
    const m = t.match(/^(2L|L|M|S)(\d+)?$/);
    if(!m) return null;
    return {grade:'秀'+m[1], count: m[2] ? parseInt(m[2],10) : 50};
  },
  // 出荷日が m/d のみなら産地のシーズン年を補完
  resolveShipDate(raw, seasonYear){
    const t = Norm.text(raw);
    const full = Norm.date(t);
    if(/^\d{4}-\d{2}-\d{2}$/.test(full)) return full;
    const parts = t.split(/[\/\-.年月]/).map(p=>p.replace(/日$/,'').trim()).filter(p=>p!=='');
    if(parts.length===2){
      return `${seasonYear}-${parts[0].padStart(2,'0')}-${parts[1].padStart(2,'0')}`;
    }
    return full;
  },
  jibunCSV(text){
    const rows = Parse.csv(text);
    if(rows.length===0) return {records:[], errors:[]};
    const idx = Parse.headerIndex(rows[0]);
    const need = ['出荷日','品種名','規格','箱数'];
    const missing = need.filter(k=>!(k in idx));
    if(missing.length) throw new Error('必須列が見つかりません: ' + missing.join('、'));
    const hasBetsu = '別本数' in idx;
    const seasonYear = (Compute.latestDate() || (new Date().getFullYear()+'')).slice(0,4);
    const records = []; const errors = [];
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      if(row.every(f=>Norm.text(f)==='')) continue;
      const date = Parse.resolveShipDate(row[idx['出荷日']], seasonYear);
      const variety = Norm.text(row[idx['品種名']]);
      const boxQty = Norm.num(row[idx['箱数']]);
      const betsuRaw = hasBetsu ? Norm.num(row[idx['別本数']]) : NaN;
      let grade, count, betsuCount = 0;
      if(!Number.isNaN(betsuRaw) && betsuRaw>0){
        // 別扱い：産地の「別（本数0）」の箱単価にマッチさせる。規格ラベルは本数換算に使わない
        grade = '別'; count = 0; betsuCount = betsuRaw;
      } else {
        const spec = Parse.parseSpec(row[idx['規格']]);
        if(spec){ grade = spec.grade; count = spec.count; }
      }
      if(!date || !variety || !grade || Number.isNaN(boxQty) || boxQty<=0){
        errors.push({line:r+1, raw:row.join(',')});
        continue;
      }
      records.push({date, variety, grade, count, boxQty, betsuCount});
    }
    return {records, errors};
  }
};

const STORAGE_KEY = 'curcuma.v1';
const Store = {
  available: false,
  dirtyCount: 0,
  saveError: false, // 自動保存(localStorage)が失敗しているか（容量オーバー等）
  loadError: false, // 起動時の読み込みに失敗したか（保存データ破損等）
  sanchi: new Map(), // key -> {date,variety,grade,count,boxQty,boxPrice}
  jibun: [], // {id,date,variety,grade,count,boxQty,source,addedAt}
  sakutsuke: [], // {id,variety,type:'新植'|'据置',tsubo} 今季作付設定（坪）
  meta: {lastBackupAt: null},

  detect(){
    try{
      const t = '__curcuma_test__';
      localStorage.setItem(t,'1'); localStorage.removeItem(t);
      Store.available = true;
    }catch(e){ Store.available = false; }
    return Store.available;
  },
  load(){
    Store.detect();
    if(!Store.available) return;
    let raw = null;
    try{
      raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      Store.sanchi = new Map();
      (data.sanchi||[]).forEach(rec=>{
        const key = Norm.key(rec.date, rec.variety, rec.grade, rec.count);
        // 未確定は null で保持（旧データに文字列「未確定」が混じっていても null に正規化）
        const boxPrice = (rec.boxPrice==null || rec.boxPrice==='未確定') ? null : rec.boxPrice;
        Store.sanchi.set(key, {date:rec.date, variety:rec.variety, grade:rec.grade, count:rec.count, boxQty:rec.boxQty, boxPrice});
      });
      Store.jibun = (data.jibun||[]).map(r=>({...r}));
      Store.sakutsuke = (data.sakutsuke||[]).map(r=>({...r}));
      Store.meta = data.meta || {lastBackupAt:null};
      Store.dirtyCount = data.dirtyCount || 0;
    }catch(e){
      console.warn('load failed', e);
      // 壊れたデータを無言で失わないよう、別キーへ退避してから警告（次の保存で上書きされる前に保全）
      try{ if(raw) localStorage.setItem(STORAGE_KEY + '.corrupt', raw); }catch(_){}
      Store.loadError = true;
    }
  },
  persist(){
    if(!Store.available) return;
    try{
      const payload = {
        version:1,
        sanchi: Array.from(Store.sanchi.values()),
        jibun: Store.jibun,
        sakutsuke: Store.sakutsuke,
        meta: Store.meta,
        dirtyCount: Store.dirtyCount
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      Store.saveError = false;
    }catch(e){
      console.warn('persist failed', e);
      const firstTime = !Store.saveError;
      Store.saveError = true;
      // 無反応でデータ喪失に化けないよう、最初の失敗時にはっきり通知する
      if(firstTime){ try{ UI.toast('⚠ 自動保存に失敗しました（端末の空き容量オーバーの可能性）。「保存」タブからバックアップを書き出してください', {duration:7000}); }catch(_){} }
    }
  },
  mergeSanchi(records){
    let added=0, updated=0;
    records.forEach(rec=>{
      if(Store.sanchi.has(rec.key)) updated++; else added++;
      Store.sanchi.set(rec.key, {date:rec.date, variety:rec.variety, grade:rec.grade, count:rec.count, boxQty:rec.boxQty, boxPrice:rec.boxPrice});
    });
    if(added+updated>0){ Store.dirtyCount += (added+updated); Store.persist(); }
    return {added, updated};
  },
  // 未確定だった市況行の箱単価を後から確定させる（keyで特定→数値をセット）。以降の再描画でmySalesが自動再計算される。
  setSanchiPrice(key, price){
    const rec = Store.sanchi.get(key);
    if(!rec) return false;
    rec.boxPrice = price;
    Store.dirtyCount += 1;
    Store.persist();
    return true;
  },
  jibunExists(rec){
    return Store.jibun.some(r => r.date===rec.date && r.variety===rec.variety && r.grade===rec.grade && r.count===rec.count && r.boxQty===rec.boxQty && (r.betsuCount||0)===(rec.betsuCount||0));
  },
  mergeJibun(records, source){
    let added=0, skipped=0;
    records.forEach(rec=>{
      if(Store.jibunExists(rec)){ skipped++; return; }
      Store.jibun.push({
        id: 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        date:rec.date, variety:rec.variety, grade:rec.grade, count:rec.count, boxQty:rec.boxQty, betsuCount:rec.betsuCount||0,
        source, addedAt: new Date().toISOString(),
        plant: (rec.plant==='新植'||rec.plant==='据置'||rec.plant==='mix') ? rec.plant : null, sueokiRatio: rec.sueokiRatio||0
      });
      added++;
    });
    if(added>0){ Store.dirtyCount += added; Store.persist(); }
    return {added, skipped};
  },
  removeJibun(id){
    const i = Store.jibun.findIndex(r=>r.id===id);
    if(i<0) return null;
    const [removed] = Store.jibun.splice(i,1);
    Store.dirtyCount += 1;
    Store.persist();
    return {rec:removed, index:i};
  },
  restoreJibun(rec, index){
    // 元の位置に戻す（末尾に足すと日内の品種の出現順・マーカー色が変わってしまうため）
    const i = (typeof index === 'number' && index >= 0 && index <= Store.jibun.length) ? index : Store.jibun.length;
    Store.jibun.splice(i, 0, rec);
    Store.persist();
  },
  // 出荷行の新植/据置の割り当てをセット（plant='新植'|'据置'|'mix'、mixのみ sueokiRatio 0..1）
  setJibunPlant(id, plant, sueokiRatio){
    const rec = Store.jibun.find(r=>r.id===id);
    if(!rec) return false;
    rec.plant = plant;
    rec.sueokiRatio = (plant==='mix') ? (Number(sueokiRatio)||0) : 0;
    Store.dirtyCount += 1;
    Store.persist();
    return true;
  },
  addSakutsuke(rec){
    const row = {
      id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      variety: rec.variety, type: rec.type, tsubo: rec.tsubo
    };
    Store.sakutsuke.push(row);
    Store.dirtyCount += 1;
    Store.persist();
    return row;
  },
  removeSakutsuke(id){
    const i = Store.sakutsuke.findIndex(r=>r.id===id);
    if(i<0) return null;
    const [removed] = Store.sakutsuke.splice(i,1);
    Store.dirtyCount += 1;
    Store.persist();
    return removed;
  },
  restoreSakutsuke(rec){
    Store.sakutsuke.push(rec);
    Store.dirtyCount += 1;
    Store.persist();
  },
  resetAll(){
    Store.sanchi = new Map();
    Store.jibun = [];
    Store.sakutsuke = [];
    Store.meta = {lastBackupAt:null};
    Store.dirtyCount = 0;
    Store.persist();
    if(!Store.available){ /* memory mode: nothing to clear in localStorage */ }
  },
  exportBackup(){
    const payload = {
      version:1,
      exportedAt: new Date().toISOString(),
      sanchi: Array.from(Store.sanchi.values()),
      jibun: Store.jibun,
      sakutsuke: Store.sakutsuke
    };
    return payload;
  },
  importBackup(data){
    const sanchi = new Map();
    (data.sanchi||[]).forEach(rec=>{
      const date = Norm.date(rec.date), variety = Norm.text(rec.variety), grade = Norm.grade(rec.grade), count = Norm.num(rec.count);
      const key = Norm.key(date, variety, grade, count);
      // 箱単価は未確定(null/「未確定」)をnullのまま保持。NaN化させない。
      const boxPrice = (rec.boxPrice==null || rec.boxPrice==='未確定') ? null : Norm.num(rec.boxPrice);
      sanchi.set(key, {date, variety, grade, count, boxQty:Norm.num(rec.boxQty), boxPrice});
    });
    const jibun = (data.jibun||[]).map((r,i)=>({
      id: r.id || ('j'+Date.now().toString(36)+i),
      date: Norm.date(r.date), variety: Norm.text(r.variety), grade: Norm.grade(r.grade), count: Norm.num(r.count),
      boxQty: Norm.num(r.boxQty), betsuCount: Norm.num(r.betsuCount)||0, source: r.source||'csv', addedAt: r.addedAt || new Date().toISOString(),
      // 新植/据置の割り当て（未割当は null）。混在の据置本数比率のみ保持。
      plant: (r.plant==='新植'||r.plant==='据置'||r.plant==='mix') ? r.plant : null,
      sueokiRatio: Norm.num(r.sueokiRatio)||0
    }));
    const sakutsuke = (data.sakutsuke||[]).map((r,i)=>({
      id: r.id || ('s'+Date.now().toString(36)+i),
      variety: Norm.text(r.variety),
      type: (r.type==='据置') ? '据置' : '新植',
      tsubo: Norm.num(r.tsubo)||0
    })).filter(r=>r.variety);
    Store.sanchi = sanchi;
    Store.jibun = jibun;
    Store.sakutsuke = sakutsuke;
    Store.dirtyCount = 0;
    Store.meta.lastBackupAt = new Date().toISOString();
    Store.persist();
  },
  markBackedUp(){
    Store.meta.lastBackupAt = new Date().toISOString();
    Store.dirtyCount = 0;
    Store.persist();
  },
  loadSample(){
    Store.resetAll();
    const {records} = Parse.sanchiCSV(SAMPLE_SANCHI_CSV);
    Store.mergeSanchi(records);
    Store.mergeJibun(SAMPLE_JIBUN.map(r=>({...r})), 'sample');
  }
};

/* ============================== Compute ============================== */
const Compute = {
  classify(grade, count){
    if(grade==='秀2L' && count===30) return '2L30';
    if(grade==='秀2L' && count===50) return '2L50';
    if(grade==='秀L' && count===50) return 'L50';
    return 'その他';
  },
  varietyList(){
    const agg = new Map(); // variety -> {boxes, days:Set}
    Store.sanchi.forEach(rec=>{
      if(!agg.has(rec.variety)) agg.set(rec.variety, {boxes:0, days:new Set()});
      const a = agg.get(rec.variety);
      a.boxes += rec.boxQty;
      a.days.add(rec.date);
    });
    return Array.from(agg.entries()).map(([variety,a])=>({variety, boxes:a.boxes, days:a.days.size}))
      .sort((a,b)=>b.boxes-a.boxes);
  },
  donutData(variety){
    const cats = {'2L30':0,'2L50':0,'L50':0,'その他':0};
    let total = 0;
    Store.sanchi.forEach(rec=>{
      if(rec.variety !== variety) return;
      const c = Compute.classify(rec.grade, rec.count);
      cats[c] += rec.boxQty;
      total += rec.boxQty;
    });
    return {cats, total};
  },
  latestDate(){
    let latest = null;
    Store.sanchi.forEach(rec=>{
      if(latest===null || rec.date > latest) latest = rec.date;
    });
    return latest;
  },
  datesWithData(){
    // 産地データで出荷情報が取れた日付の集合（カレンダーの選択可否に使用）
    const s = new Set();
    Store.sanchi.forEach(rec=> s.add(rec.date));
    return s;
  },
  sortedDates(){
    // データのある日付の昇順配列（前後移動ボタンに使用）
    return Array.from(Compute.datesWithData()).sort();
  },
  stepDate(current, dir){
    // dir=-1で前、+1で次のデータのある日。端なら null
    const arr = Compute.sortedDates();
    const i = arr.indexOf(current);
    if(i < 0) return null;
    const j = i + dir;
    return (j >= 0 && j < arr.length) ? arr[j] : null;
  },
  marketDatesInRange(firstD, lastD){
    // 産地データに存在する日付（＝市場日）のうち [firstD, lastD] の範囲を昇順で返す
    return Array.from(Compute.datesWithData()).sort().filter(d=> d>=firstD && d<=lastD);
  },
  lineDataDense(variety){
    // lineData（出荷のあった日のみ）を、初出荷日〜最終出荷日の全市場日に密化。
    // 出荷の無い市場日は price=null（プロット無し・線は接続側で跨ぐ）。
    const base = Compute.lineData(variety);
    if(base.length===0) return [];
    const byDate = new Map(base.map(p=>[p.date, p]));
    const axis = Compute.marketDatesInRange(base[0].date, base[base.length-1].date);
    return axis.map(d=>{
      const p = byDate.get(d);
      return p ? {date:d, price:p.price, marker:p.marker} : {date:d, price:null, marker:null};
    });
  },
  donutDataForDay(varieties, date){
    const cats = {'2L30':0,'2L50':0,'L50':0,'その他':0};
    let total = 0;
    const set = new Set(varieties);
    Store.sanchi.forEach(rec=>{
      if(rec.date !== date) return;
      if(!set.has(rec.variety)) return;
      const c = Compute.classify(rec.grade, rec.count);
      cats[c] += rec.boxQty;
      total += rec.boxQty;
    });
    return {cats, total};
  },
  lineData(variety){
    const byDate = new Map(); // date -> array of records
    Store.sanchi.forEach(rec=>{
      if(rec.variety !== variety) return;
      if(!byDate.has(rec.date)) byDate.set(rec.date, []);
      byDate.get(rec.date).push(rec);
    });
    const dates = Array.from(byDate.keys()).sort();
    const points = dates.map(date=>{
      const rows = byDate.get(date);
      const calc = (grade)=>{
        // 価格未確定(boxPrice=null)は平均計算から除外。数量集計(donut/varietyList)には別途算入される。
        const rs = rows.filter(r=>r.grade===grade && r.boxPrice!=null);
        if(rs.length===0) return null;
        const numerator = rs.reduce((s,r)=>s + r.boxPrice*r.boxQty, 0);
        const denomBoxes = rs.reduce((s,r)=>s + r.count*r.boxQty, 0) / 50;
        if(!(denomBoxes > 0)) return null;
        return numerator / denomBoxes;
      };
      let price = calc('秀2L'); let marker = '2L';
      if(price==null){ price = calc('秀L'); marker = 'L'; }
      if(price==null) return {date, price:null, marker:null};
      return {date, price, marker};
    });
    return points;
  },
  // 作付設定から、品種ごとの区分有無と区分別坪を集計
  allocInfo(){
    const typesByVariety = new Map(); // variety -> {新植:bool, 据置:bool}
    const tsuboByType = new Map();    // variety -> {新植:tsubo, 据置:tsubo}
    Store.sakutsuke.forEach(r=>{
      const v = r.variety; if(!v) return;
      const t = (r.type==='据置') ? '据置' : '新植';
      if(!typesByVariety.has(v)) typesByVariety.set(v, {新植:false, 据置:false});
      if(!tsuboByType.has(v)) tsuboByType.set(v, {新植:0, 据置:0});
      if((Number(r.tsubo)||0) > 0 || true) typesByVariety.get(v)[t] = true; // 登録があれば区分ありとみなす
      tsuboByType.get(v)[t] += (Number(r.tsubo)||0);
    });
    return {typesByVariety, tsuboByType};
  },
  // 品種が両区分ありのとき、割り当てが要る（plant=null）行を返す。単区分・未登録品種は対象外＝入力不要。
  unassignedAllocRows(){
    const {typesByVariety} = Compute.allocInfo();
    return Store.jibun.filter(r=>{
      const t = typesByVariety.get(r.variety);
      return t && t.新植 && t.据置 && !(r.plant==='新植'||r.plant==='据置'||r.plant==='mix');
    });
  },
  // 行の実効「据置比率」f を返す。{f, unassigned, categorized}
  //  両区分: 新植→0 / 据置→1 / mix→ratio / null→未割当  単区分: その区分に自動確定  未登録: 未分類
  allocFraction(row, typesByVariety){
    const t = typesByVariety.get(row.variety);
    if(!t) return {f:0, unassigned:false, categorized:false};        // 作付設定なし＝分割対象外
    if(t.新植 && t.据置){
      if(row.plant==='据置') return {f:1, unassigned:false, categorized:true};
      if(row.plant==='新植') return {f:0, unassigned:false, categorized:true};
      if(row.plant==='mix')  return {f:Math.max(0,Math.min(1,Number(row.sueokiRatio)||0)), unassigned:false, categorized:true};
      return {f:0, unassigned:true, categorized:true};               // 両区分だが未割当
    }
    if(t.据置) return {f:1, unassigned:false, categorized:true};      // 据置のみ→自動
    return {f:0, unassigned:false, categorized:true};                // 新植のみ→自動
  },
  matchJibun(){
    return Store.jibun.map(row=>{
      const isBetsu = row.betsuCount>0;
      // 別行は産地の「別（本数0）」の箱単価にマッチ。標準行は従来どおり規格×本数でマッチ
      const key = isBetsu
        ? Norm.key(row.date, row.variety, '別', 0)
        : Norm.key(row.date, row.variety, row.grade, row.count);
      const stemsPerBox = isBetsu ? row.betsuCount : row.count; // 1箱あたりの本数
      const s = Store.sanchi.get(key);
      if(s){
        const pending = (s.boxPrice==null); // 市況の箱単価が未確定＝金額は出せない
        const stems = stemsPerBox * row.boxQty;
        const perStem = (!pending && stemsPerBox>0) ? s.boxPrice / stemsPerBox : null; // 1本単価＝箱単価÷1箱本数
        return {...row, isBetsu, matched:true, pending, sanchiKey:key, boxPrice: pending?null:s.boxPrice, amount: pending?null:(s.boxPrice * row.boxQty), stems, perStem};
      }
      return {...row, isBetsu, matched:false, pending:false, sanchiKey:key, boxPrice:null, amount:0, stems: stemsPerBox * row.boxQty, perStem:null};
    });
  },
  jibunSummary(matched){
    // matched を confirmed(金額確定) / pending(市況が未確定) / unmatched に3分割
    const ok = matched.filter(r=>r.matched && !r.pending);   // 売上・平均・内訳は confirmed のみ
    const pend = matched.filter(r=>r.matched && r.pending);  // 数量には算入、売上は未確定
    const bad = matched.filter(r=>!r.matched);
    const total = ok.reduce((s,r)=>s+r.amount,0);
    const confirmedStems = ok.reduce((s,r)=>s+(r.stems||0),0);
    // KPIの出荷量（箱数・本数）は実出荷量なので pending も算入
    const totalBoxes = ok.reduce((s,r)=>s+r.boxQty,0) + pend.reduce((s,r)=>s+r.boxQty,0);
    const totalStems = confirmedStems + pend.reduce((s,r)=>s+(r.stems||0),0);
    const avgPerStem = confirmedStems>0 ? total/confirmedStems : null; // 平均1本単価＝確定売上÷確定本数
    // 未確定行は同一市況行(sanchiKey)ごとに1件へ重複排除（複数出荷が同じ市況価格に紐づく場合）
    const pendingSeen = new Set();
    const pendingRows = [];
    pend.forEach(r=>{ if(pendingSeen.has(r.sanchiKey)) return; pendingSeen.add(r.sanchiKey); pendingRows.push(r); });
    // 新植/据置の区分別按分（stems・amount）。既存の品種合計は維持しつつ split を追加。
    const {typesByVariety, tsuboByType} = Compute.allocInfo();
    const zeroSplit = ()=>({shinshoku:{stems:0,amount:0}, sueoki:{stems:0,amount:0}, unassigned:{stems:0,amount:0}});
    const byVariety = new Map();
    ok.forEach(r=>{
      if(!byVariety.has(r.variety)) byVariety.set(r.variety, {amount:0, boxes:0, stems:0, split:zeroSplit()});
      const v = byVariety.get(r.variety);
      v.amount += r.amount; v.boxes += r.boxQty; v.stems += (r.stems||0);
      const st = r.stems||0, am = r.amount||0;
      const {f, unassigned} = Compute.allocFraction(r, typesByVariety);
      if(unassigned){ v.split.unassigned.stems += st; v.split.unassigned.amount += am; }
      else {
        v.split.sueoki.stems += f*st;      v.split.sueoki.amount += f*am;
        v.split.shinshoku.stems += (1-f)*st; v.split.shinshoku.amount += (1-f)*am;
      }
    });
    const varietyRows = Array.from(byVariety.entries()).map(([variety,v])=>{
      const tt = tsuboByType.get(variety) || {新植:0, 据置:0};
      const perT = (amount, tsubo)=> tsubo>0 ? amount/tsubo : null;
      const perS = (amount, stems)=> stems>0 ? amount/stems : null;
      return {variety, amount:v.amount, boxes:v.boxes, stems:v.stems, perStem: v.stems>0 ? v.amount/v.stems : null,
        split:{
          shinshoku:{...v.split.shinshoku, tsubo:tt.新植, perTsubo:perT(v.split.shinshoku.amount, tt.新植), perStem:perS(v.split.shinshoku.amount, v.split.shinshoku.stems)},
          sueoki:   {...v.split.sueoki,    tsubo:tt.据置, perTsubo:perT(v.split.sueoki.amount, tt.据置),       perStem:perS(v.split.sueoki.amount, v.split.sueoki.stems)},
          unassigned: v.split.unassigned,
          hasBoth: !!(typesByVariety.get(variety) && typesByVariety.get(variety).新植 && typesByVariety.get(variety).据置)
        }};
    }).sort((a,b)=>b.amount-a.amount);
    const allocUnassignedCount = Compute.unassignedAllocRows().length;
    const byDate = new Map();
    ok.forEach(r=>{
      byDate.set(r.date, (byDate.get(r.date)||0) + r.amount);
    });
    const dateRows = Array.from(byDate.entries()).map(([date,amount])=>({date, amount})).sort((a,b)=>a.date.localeCompare(b.date));
    let recentAmount = 0, recentDate = null;
    if(dateRows.length){
      recentDate = dateRows[dateRows.length-1].date;
      recentAmount = dateRows[dateRows.length-1].amount;
    }
    return {total, totalBoxes, totalStems, avgPerStem, matchedCount:ok.length, pendingCount:pendingRows.length, unmatchedCount:bad.length, allocUnassignedCount, varietyRows, dateRows, pendingRows, unmatchedRows:bad, recentAmount, recentDate};
  },
  optionsForForm(){
    const varieties = Compute.varietyList().map(v=>v.variety);
    const gradesByVariety = new Map();
    const countsByVariety = new Map();
    const allGrades = new Set(); const allCounts = new Set();
    Store.sanchi.forEach(rec=>{
      allGrades.add(rec.grade); allCounts.add(rec.count);
      if(!gradesByVariety.has(rec.variety)) gradesByVariety.set(rec.variety, new Set());
      gradesByVariety.get(rec.variety).add(rec.grade);
      if(!countsByVariety.has(rec.variety)) countsByVariety.set(rec.variety, new Set());
      countsByVariety.get(rec.variety).add(rec.count);
    });
    return {varieties, gradesByVariety, countsByVariety, allGrades:Array.from(allGrades), allCounts:Array.from(allCounts).sort((a,b)=>a-b)};
  }
};

/* ============================== Charts ============================== */
const PX_PER_1000 = 44; // 1000円あたりの縦ピクセル（品種が変わっても固定。変動幅が大きいほど縦に伸びる）
const Charts = {
  // 実データの最小～最大を1000円単位に丸めて、キリのよい目盛りとチャート高さを返す
  niceYAxis(prices, padT, padB){
    const dMin = Math.min(...prices), dMax = Math.max(...prices);
    let loY = Math.floor(dMin/1000)*1000;
    let hiY = Math.ceil(dMax/1000)*1000;
    if(hiY<=loY) hiY = loY + 1000;
    const units = (hiY-loY)/1000;
    const innerH = units * PX_PER_1000;
    const H = padT + innerH + padB;
    const yScale = (v)=> padT + innerH - ((v-loY)/(hiY-loY))*innerH;
    return {loY, hiY, units, innerH, H, yScale};
  },
  // 横スクロールしても左端に固定するY軸ラベル（別レイヤーSVG）
  yAxisSVG(loY, hiY, yScale, padL, H){
    let g = '';
    for(let v=loY; v<=hiY+0.5; v+=1000){
      const y = yScale(v);
      g += `<text x="${padL-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--ink-muted)">${Fmt.num(v)}</text>`;
    }
    return `<svg class="yaxis-svg" viewBox="0 0 ${padL} ${H}" width="${padL}" height="${H}" style="width:${padL}px;height:${H}px">${g}</svg>`;
  },
  isSunday(iso){ return new Date(iso+'T00:00:00').getDay()===0; },
  // 日曜の列に薄赤の縦線＋日付ラベルの薄赤背景（週の起点マーカー）
  sundayMarks(isoAt, n, xScale, padT, innerH, H){
    let s = '';
    for(let i=0;i<n;i++){
      if(!Charts.isSunday(isoAt(i))) continue;
      const x = xScale(i);
      s += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${(padT+innerH).toFixed(1)}" stroke="var(--cal-sun)" stroke-width="1.5" stroke-opacity="0.4"/>`;
      s += `<rect x="${(x-16).toFixed(1)}" y="${H-19}" width="32" height="15" rx="4" fill="var(--cal-sun)" fill-opacity="0.15"/>`;
    }
    return s;
  },
  donutSVG(cats, total, colorMap, size, hideCenter){
    size = size || 150;
    const r = size*0.36, cx = size/2, cy = size/2, sw = size*0.22;
    const circumference = 2*Math.PI*r;
    let offset = 0;
    const order = Object.keys(cats);
    let arcs = '';
    let labels = '';
    let cumFrac = 0;
    order.forEach(cat=>{
      const val = cats[cat];
      if(val<=0) return;
      const frac = total>0 ? val/total : 0;
      let len = frac*circumference;
      if(len>0 && len<2) len = 2;
      const gap = circumference - len;
      arcs += `<circle class="donut-seg" data-cat="${Fmt.esc(cat)}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorMap[cat]}" stroke-width="${sw}" stroke-dasharray="${len} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" />`;
      // スライス上に%を表示（小さすぎるスライスは凡例に任せる）
      const pct = frac*100;
      if(pct >= 7){
        const midFrac = cumFrac + frac/2;
        const ang = (-90 + midFrac*360) * Math.PI/180;
        const lx = cx + r*Math.cos(ang);
        const ly = cy + r*Math.sin(ang);
        labels += `<text x="${lx.toFixed(1)}" y="${(ly+size*0.03).toFixed(1)}" text-anchor="middle" class="donut-slice-lbl" fill="#fff" stroke="rgba(0,0,0,.38)" stroke-width="${(size*0.018).toFixed(1)}" paint-order="stroke" style="font-size:${(size*0.085).toFixed(1)}px;font-weight:700">${Math.round(pct)}%</text>`;
      }
      offset += len;
      cumFrac += frac;
    });
    return `<svg class="donut-svg" style="width:${size}px;height:${size}px" viewBox="0 0 ${size} ${size}" role="img" aria-label="規格構成ドーナツ">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/>
      ${arcs}
      ${labels}
      ${hideCenter ? '' : `<text x="${cx}" y="${cy-2}" text-anchor="middle" class="donut-center-num tnum" style="font-size:${(size*0.16).toFixed(1)}px">${Fmt.num(total)}</text>
      <text x="${cx}" y="${(cy+size*0.11).toFixed(1)}" text-anchor="middle" class="donut-center-lbl" style="font-size:${(size*0.06).toFixed(1)}px">総箱数</text>`}
    </svg>`;
  },
  lineSVG(points, opts){
    opts = opts||{};
    const padL = 46, padR = 16, padT = 16, padB = 30, COLGAP = 36;
    const n = points.length;
    const W = Math.max(320, padL + padR + Math.max(1,n-1)*COLGAP);
    const innerW = W-padL-padR;
    const withPrice = points.filter(p=>p.price!=null);
    if(withPrice.length===0){
      const H = 160;
      return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--ink-muted)" font-size="13">価格データがありません</text></svg>`, isolated:false, yAxis:''};
    }
    const prices = withPrice.map(p=>p.price);
    const {loY, hiY, innerH, H, yScale} = Charts.niceYAxis(prices, padT, padB);
    // 最初の点をY軸（固定ラベル）から離すため左に18pxインセット
    const x0 = padL + 18, x1 = W - padR - 4;
    const xScale = (i)=> n<=1 ? (x0+x1)/2 : x0 + ((x1-x0)*i)/(n-1);

    // gridlines（1000円刻み。Y軸ラベルは固定レイヤー側で描画）
    let grid = '';
    for(let v=loY; v<=hiY+0.5; v+=1000){
      const y = yScale(v);
      grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    }
    // 日曜マーカー（縦線＋ラベル背景）
    const sunday = Charts.sundayMarks((i)=>points[i].date, n, xScale, padT, innerH, H);
    // x labels（全ての日付。日曜は赤）
    let xlabels = '';
    for(let i=0;i<n;i++){
      const sun = Charts.isSunday(points[i].date);
      xlabels += `<text x="${xScale(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${sun?'var(--cal-sun)':'var(--ink-muted)'}">${Fmt.date(points[i].date)}</text>`;
    }
    // 価格のある点を全て一本の線でつなぐ（出荷の無い日／2L・L欠測日は跨いで接続）
    const pricedIdx = [];
    points.forEach((p,i)=>{ if(p.price!=null) pricedIdx.push(i); });
    let paths = '';
    let isolated = pricedIdx.length===1;
    if(pricedIdx.length>=2){
      const d = pricedIdx.map((i,k)=>`${k===0?'M':'L'} ${xScale(i).toFixed(1)} ${yScale(points[i].price).toFixed(1)}`).join(' ');
      paths += `<path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    let markers = '';
    points.forEach((p,i)=>{
      if(p.price==null) return;
      const x = xScale(i), y = yScale(p.price);
      if(p.marker==='2L'){
        markers += `<circle cx="${x}" cy="${y}" r="6" fill="var(--primary)" stroke="var(--surface)" stroke-width="2" data-pt="${i}" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}"/>`;
      } else {
        markers += `<rect x="${x-6}" y="${y-6}" width="12" height="12" fill="var(--surface)" stroke="var(--warn)" stroke-width="2.5" transform="rotate(45 ${x} ${y})" data-pt="${i}" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}"/>`;
      }
    });
    // 選択中プロットの縁取り（初期は非表示。タップ時に位置を移動して表示）
    const highlight = `<circle class="pt-highlight" r="10" fill="none" stroke="var(--ink)" stroke-width="2.5" style="opacity:0" pointer-events="none"/>`;
    const hitLayer = `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" data-hit="line"/>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="価格推移" data-line-chart data-padl="${padL}" data-padr="${padR}" data-w="${W}" data-n="${n}" data-x0="${x0}" data-x1="${x1}">
      ${grid}${sunday}${paths}${markers}${highlight}${xlabels}${hitLayer}
    </svg>`;
    return {svg, isolated, points, xScale, yAxis:Charts.yAxisSVG(loY, hiY, yScale, padL, H)};
  },
  multiLineSVG(series){
    // series = [{variety, color, points, hidden}], points = Compute.lineData output
    // hidden:true の系列は線を描かないが、日付軸・価格軸の計算には含める（絞り込みで軸が動かないように）
    const padL = 46, padR = 16, padT = 16, padB = 30, COLGAP = 36;
    const dateSet = new Set();
    series.forEach(s=> s.points.forEach(p=> dateSet.add(p.date)));
    const dates = Array.from(dateSet).sort();
    const n = dates.length;
    const W = Math.max(320, padL + padR + Math.max(1,n-1)*COLGAP);
    const innerW = W-padL-padR;
    const dateIndex = new Map(dates.map((d,i)=>[d,i]));
    const allPrices = [];
    series.forEach(s=> s.points.forEach(p=>{ if(p.price!=null) allPrices.push(p.price); }));
    if(allPrices.length===0){
      const H = 160;
      return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--ink-muted)" font-size="13">価格データがありません</text></svg>`, isolated:false, ptMeta:[], w:W, yAxis:''};
    }
    const {loY, hiY, innerH, H, yScale} = Charts.niceYAxis(allPrices, padT, padB);
    // 最初の点をY軸（固定ラベル）から離すため左に18pxインセット
    const x0 = padL + 18, x1 = W - padR - 4;
    const xScale = (i)=> n<=1 ? (x0+x1)/2 : x0 + ((x1-x0)*i)/(n-1);

    let grid = '';
    for(let v=loY; v<=hiY+0.5; v+=1000){
      const y = yScale(v);
      grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    }
    // 日曜マーカー（縦線＋ラベル背景）
    const sunday = Charts.sundayMarks((i)=>dates[i], n, xScale, padT, innerH, H);
    let xlabels = '';
    for(let i=0;i<n;i++){
      const sun = Charts.isSunday(dates[i]);
      xlabels += `<text x="${xScale(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${sun?'var(--cal-sun)':'var(--ink-muted)'}">${Fmt.date(dates[i])}</text>`;
    }
    let paths = '', markers = '', isolated = false;
    const ptMeta = [];
    series.forEach(s=>{
      if(s.hidden) return; // 軸は維持したまま線・点だけ非表示
      const pts = s.points.filter(p=>p.price!=null).map(p=>({i:dateIndex.get(p.date), p})).sort((a,b)=>a.i-b.i);
      // 価格のある点を全て一本の線でつなぐ（欠測日は跨いで接続）
      if(pts.length>=2){
        const d = pts.map((it,k)=>`${k===0?'M':'L'} ${xScale(it.i).toFixed(1)} ${yScale(it.p.price).toFixed(1)}`).join(' ');
        paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
      } else if(pts.length===1){ isolated = true; }
      pts.forEach(({i,p})=>{
        const x = xScale(i), y = yScale(p.price);
        if(p.marker==='2L') markers += `<circle cx="${x}" cy="${y}" r="6" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
        else markers += `<rect x="${x-6}" y="${y-6}" width="12" height="12" fill="var(--surface)" stroke="${s.color}" stroke-width="2.5" transform="rotate(45 ${x} ${y})"/>`;
        ptMeta.push({x, y, date:p.date, price:p.price, marker:p.marker, variety:s.variety, color:s.color});
      });
    });
    // 選択中プロットの縁取り
    const highlight = `<circle class="pt-highlight" r="10" fill="none" stroke="var(--ink)" stroke-width="2.5" style="opacity:0" pointer-events="none"/>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="主要品種の価格推移" data-multiline-chart data-w="${W}">
      ${grid}${sunday}${paths}${markers}${highlight}${xlabels}<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg>`;
    return {svg, isolated, ptMeta, w:W, yAxis:Charts.yAxisSVG(loY, hiY, yScale, padL, H)};
  },
  barSVG(rows, opts){
    opts = opts||{};
    const W = 320, H = 170, padL = 8, padR = 8, padT = 10, padB = 24;
    const innerW = W-padL-padR, innerH = H-padT-padB;
    const n = rows.length;
    if(n===0) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--ink-muted)" font-size="12">データがありません</text></svg>`;
    const max = Math.max(...rows.map(r=>r.amount), 1);
    const bw = Math.min(28, innerW/n*0.6);
    const gap = innerW/n;
    let bars = '';
    let xlabels = '';
    const maxLabels = 6;
    const step = Math.max(1, Math.ceil(n/maxLabels));
    rows.forEach((r,i)=>{
      const h = (r.amount/max) * innerH;
      const x = padL + gap*i + (gap-bw)/2;
      const y = padT + innerH - h;
      const rad = Math.min(6, bw/2, h);
      const d = `M ${x} ${y+rad} A ${rad} ${rad} 0 0 1 ${x+rad} ${y} L ${x+bw-rad} ${y} A ${rad} ${rad} 0 0 1 ${x+bw} ${y+rad} L ${x+bw} ${y+h} L ${x} ${y+h} Z`;
      bars += `<path d="${d}" fill="var(--primary)" data-bar="${i}" data-val="${r.amount}"/>`;
      if(i%step===0) xlabels += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-muted)">${Fmt.date(r.date)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日別売上" data-bar-chart>${bars}${xlabels}</svg>`;
  }
};

/* ============================== State ============================== */

const MAJOR_VARIETIES = ['バンコクスプリーム','ホワイト','ピアノホワイト','シャローム','エメラルドチョコゼブラ'];

const State = {
  tab: 'sanchi',

  calendarMonth: null,
  mineDate: null,        // 自分出荷手入力の選択日付（産地と同じ自作カレンダー）
  mineVariety: null,     // 手入力で最後に選んだ品種（連続入力のため保持）
  mineCalMonth: null,    // 手入力カレンダーの表示月

  seriesSelectable: [],   // 凡例をタップできる品種（データのあるもの）

  mineImportSummary: '',
