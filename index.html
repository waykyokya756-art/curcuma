  // 「プロットをタップ」と「スクロールのために掴む」を区別する。
  // 以前は touchstart で即発火していたため、横スクロールしようと指を置いた時点で
  // 日付が切り替わり→全再描画→右端（最新日）へ戻る、で左へ遡れなかった。
  // pointerdown で起点を覚え、指がほとんど動かないまま離された時だけタップとみなす。
  // スクロールが始まると iOS/Chrome は pointercancel を出すので、そこで確実に取り消す。
  tapOnly(el, cb){
    const TAP_MOVE = 10;   // px：これ以上動いたら「掴んで動かす」＝スクロール操作
    const TAP_MS = 700;    // ms：長押しはタップ扱いしない
    let st = null;
    const cancel = ()=>{ st = null; };
    el.addEventListener('pointerdown', e=>{
      if(e.pointerType === 'mouse' && e.button !== 0){ st = null; return; }
      st = {x:e.clientX, y:e.clientY, t:Date.now(), id:e.pointerId};
    });
    el.addEventListener('pointermove', e=>{
      if(!st || e.pointerId !== st.id) return;
      if(Math.abs(e.clientX-st.x) > TAP_MOVE || Math.abs(e.clientY-st.y) > TAP_MOVE) cancel();
    });
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('pointerleave', cancel);
    el.addEventListener('pointerup', e=>{
      if(!st || e.pointerId !== st.id) return;
      const moved = Math.abs(e.clientX-st.x) > TAP_MOVE || Math.abs(e.clientY-st.y) > TAP_MOVE;
      const quick = (Date.now() - st.t) <= TAP_MS;
      cancel();
      if(moved || !quick) return;
      cb(e);
    });
  },
  moveHighlight(svg, x, y){
    const hl = svg.querySelector('.pt-highlight');
    if(!hl) return;
    hl.setAttribute('cx', x);
    hl.setAttribute('cy', y);
    hl.style.opacity = '1';
  },
  wireLineTooltip(wrap){
    const svg = wrap.querySelector('svg[data-line-chart]');
    if(!svg) return;
    const variety = wrap.getAttribute('data-variety');
    const points = Compute.lineDataDense(variety);
    const W = parseFloat(svg.getAttribute('data-w'));
    const x0 = parseFloat(svg.getAttribute('data-x0'));
    const x1 = parseFloat(svg.getAttribute('data-x1'));
    const n = points.length;
    const xScale = (i)=> n<=1 ? (x0+x1)/2 : x0 + ((x1-x0)*i)/(n-1);
    const detailHtml = (p)=> `<span class="cd-date">${Fmt.date(p.date)}</span><span class="cd-price">${Fmt.yen(p.price)}／箱</span><span class="cd-tag">${p.marker==='2L'?'2L換算':'L代替'}</span>`;
    const showAt = (i)=>{
      const m = svg.querySelector(`[data-pt="${i}"]`);
      if(m) UI.moveHighlight(svg, m.getAttribute('data-x'), m.getAttribute('data-y'));
      UI.showLineDetail(variety, detailHtml(points[i]), 'var(--primary)');
    };
    const handle = (evt)=>{
      const rect = svg.getBoundingClientRect();
      const svgX = ((evt.clientX - rect.left) / rect.width) * W;
      let nearestI = -1, best = Infinity;
      points.forEach((p,i)=>{
        if(p.price==null) return;
        const d = Math.abs(xScale(i) - svgX);
        if(d<best){ best=d; nearestI=i; }
      });
      if(nearestI<0) return;
      evt.stopPropagation();
      const p = points[nearestI];
      // タップした点の日付に、日付セレクタ・カレンダー・ドーナツ（規格構成）を連動させる。
      if(State.selectedDate !== p.date){
        State.selectedDate = p.date;
        State.calendarMonth = p.date.slice(0,7);
        State.lineDetailShow = {variety, date:p.date}; // 再描画後に詳細を復元
        const sc = wrap.querySelector('.chart-scroll');
        if(sc) State.chartScrollLeft = sc.scrollLeft; // 再描画で右端に戻さない
        UI.renderMain();
        return;
      }
      showAt(nearestI); // 同じ日なら詳細だけ更新
    };
    UI.tapOnly(svg, handle);
    // 日付連動による再描画直後は、対象日の詳細を復元表示（プロットの選択状態を維持）
    if(State.lineDetailShow && State.lineDetailShow.variety===variety){
      const idx = points.findIndex(p=>p.date===State.lineDetailShow.date && p.price!=null);
      if(idx>=0) showAt(idx);
      State.lineDetailShow = null;
    }
  },

  wireMultiLineTooltip(wrap){
    const svg = wrap.querySelector('svg[data-multiline-chart]');
    if(!svg || !State.multiMeta) return;
    const {ptMeta, w:W} = State.multiMeta;
    if(!ptMeta || ptMeta.length===0) return;
    const vb = svg.viewBox.baseVal;
    const handle = (evt)=>{
      const rect = svg.getBoundingClientRect();
      const svgX = ((evt.clientX - rect.left) / rect.width) * W;
      const svgY = ((evt.clientY - rect.top) / rect.height) * vb.height;
      let nearest = null, best = Infinity;
      ptMeta.forEach(m=>{
        const d = Math.hypot(m.x - svgX, m.y - svgY);
        if(d<best){ best=d; nearest=m; }
      });
      if(!nearest) return;
      UI.moveHighlight(svg, nearest.x, nearest.y);
      UI.showLineDetail(nearest.variety, `<span class="cd-date">${Fmt.date(nearest.date)}</span><span class="cd-price">${Fmt.yen(nearest.price)}／箱</span><span class="cd-tag">${nearest.marker==='2L'?'2L換算':'L代替'}</span>`, nearest.color);
      evt.stopPropagation();
    };
    UI.tapOnly(svg, handle);
  },

  wireBarTooltip(wrap){
    const svg = wrap.querySelector('svg[data-bar-chart]');
    if(!svg) return;
    const tooltip = wrap.querySelector('#bar-tooltip');
    svg.addEventListener('click', (evt)=>{
      const bar = evt.target.closest('[data-bar]');
      if(!bar) { tooltip.classList.add('hidden'); return; }
      const rect = svg.getBoundingClientRect();
      const bbox = bar.getBBox();
      const vb = svg.viewBox.baseVal;
      const px = ((bbox.x+bbox.width/2)/vb.width) * rect.width;
      tooltip.style.left = px + 'px';
      tooltip.style.top = '0px';
      tooltip.textContent = Fmt.yen(parseFloat(bar.getAttribute('data-val')));
      tooltip.classList.remove('hidden');
      evt.stopPropagation();
    });
    document.addEventListener('click', ()=>{ tooltip.classList.add('hidden'); });
  }
};

/* ============================== App / events ============================== */
const App = {
  init(){
    UI.applyTheme();
    // アプリバーの設定ボタンは静的HTML。アイコンはテーマボタンと同じくJSで入れる
    const sBtn = document.getElementById('settings-btn');
    if(sBtn) sBtn.innerHTML = Icon.gear;
    Store.load();
    UI.ensureScope(); // 集計は年度×品目の絞り込み経由なので、SelfTest より先に対象を決めておく
    SelfTest.run();
    UI.renderTabs();
    UI.renderMain();
    App.bindEvents();
    if(Store.migratedFrom){
      UI.toast('年度・品目に対応しました。既存のデータはすべて「クルクマ」として引き継いでいます', {duration:7000});
    }
  },
  bindEvents(){
    document.addEventListener('click', App.onClick);
    document.addEventListener('change', App.onChange);
    document.addEventListener('submit', App.onSubmit);
    // モバイル: キーボードが出ると固定タブバーが持ち上げられるので、その分だけ下に押し戻す。
    // ＝タブの位置は変わらず、キーボードがタブの上に重なるだけになる。
    App.bindKeyboardShift();
  },
  // キーボード表示でタブバーが競り上がるのを打ち消す。
  // 入力にフォーカスがある時だけ、可視領域が縮んだ分（=キーボード高）を transform で戻す。
  bindKeyboardShift(){
    const vv = window.visualViewport;
    const tabbar = document.getElementById('tabbar');
    if(!vv || !tabbar) return; // 非対応環境は従来どおり
    let focused = false;
    const sync = ()=>{
      if(!focused){ tabbar.style.transform = ''; return; }
      // 競り上がり量 = レイアウト高 −(可視高 + 可視領域の上オフセット)
      const gap = Math.round(window.innerHeight - vv.height - vv.offsetTop);
      // キーボードと言える大きさの時だけ補正（誤検知でタブを飛ばさない）
      tabbar.style.transform = (gap > 120) ? `translateY(${gap}px)` : '';
    };
    document.addEventListener('focusin', (e)=>{
      if(e.target.closest('input, textarea, select')){ focused = true; sync(); }
    });
    document.addEventListener('focusout', (e)=>{
      if(e.target.closest('input, textarea, select')){
        focused = false;
        tabbar.style.transform = ''; // 位置を必ず戻す
      }
    });
    vv.addEventListener('resize', sync);
    vv.addEventListener('scroll', sync);
  },
  onClick(e){
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.getAttribute('data-action');
    switch(action){
      case 'switch-tab':
        UI.route(t.getAttribute('data-tab'));
        break;
      case 'theme-cycle':
        UI.cycleTheme();
        break;
      case 'open-settings':
        UI.settingsModal();
        break;
      case 'delete-item': {
        const name = t.getAttribute('data-name');
        const use = Store.itemUsage(name);
        // ボタンは disabled 済みだが、二重にガードしておく
        if(use.total>0){ UI.toast(`「${name}」にはデータがあるため削除できません`, {duration:5000}); break; }
        UI.modal('品目を削除', `「${Fmt.esc(name)}」を削除します。この品目にはまだデータがありません。`, {
          danger:true, confirmLabel:'削除する',
          onConfirm:()=>{
            const r = Store.removeItem(name);
            if(!r.ok){ UI.toast(r.msg); return; }
            UI.renderMain();      // ensureScope が選択中品目を立て直す
            UI.settingsModal();   // 一覧を出し直す
            UI.toast(`「${name}」を削除しました`);
          }
        });
        break;
      }
      case 'legend-toggle':
        State.donutHighlight = (State.donutHighlight===t.getAttribute('data-cat')) ? null : t.getAttribute('data-cat');
        UI.renderMain();
        break;
      case 'series-toggle': {
        // 全表示→1品種のみ→タップごとに追加→全部そろったら全表示に戻る
        const v = t.getAttribute('data-variety');
        const sel = (State.selectedSeries || []).slice();
        const at = sel.indexOf(v);
        const selectableCount = (State.seriesSelectable && State.seriesSelectable.length) || MAJOR_VARIETIES.length;
        if(sel.length === 0){
          State.selectedSeries = [v];
        } else if(at >= 0){
          sel.splice(at, 1);
          State.selectedSeries = sel; // 空になれば全表示（初期状態）へ
        } else {
          sel.push(v);
          State.selectedSeries = (sel.length >= selectableCount) ? [] : sel;
        }
        UI.renderMain();
        break;
      }
      case 'import-sanchi-paste': {
        const ta = document.getElementById('sanchi-paste');
        const txt = ta ? ta.value : '';
        App.importSanchiText(txt, '貼り付け');
        break;
      }
      case 'import-mine-paste': {
        const ta = document.getElementById('mine-paste');
        const txt = ta ? ta.value : '';
        App.importMineText(txt, '貼り付け');
        break;
      }
      case 'toggle-mine-mode':
        State.mineMode = t.getAttribute('data-mode');
        UI.renderMain();
        break;
      case 'toggle-calendar':
        State.calendarOpen = !State.calendarOpen;
        if(State.calendarOpen) State.calendarMonth = (State.selectedDate || Compute.latestDate() || '').slice(0,7);
        UI.renderMain();
        break;
      case 'close-calendar':
        State.calendarOpen = false;
        UI.renderMain();
        break;
      case 'cal-prev':
      case 'cal-next': {
        const ym = (State.calendarMonth || (State.selectedDate||'').slice(0,7)).split('-');
        const d = new Date(parseInt(ym[0],10), parseInt(ym[1],10)-1 + (action==='cal-next'?1:-1), 1);
        State.calendarMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        UI.renderMain();
        break;
      }
      case 'cal-pick':
        State.selectedDate = t.getAttribute('data-date');
        State.calendarOpen = false;
        State.donutHighlight = null;
        UI.renderMain();
        break;
      case 'date-step-prev':
      case 'date-step-next': {
        const next = Compute.stepDate(State.selectedDate, action==='date-step-next' ? 1 : -1);
        if(next){
          State.selectedDate = next;
          State.donutHighlight = null;
          UI.renderMain();
        }
        break;
      }
      case 'toggle-mine-calendar': {
        // 手入力フォームの他項目を保持するため、再描画せずポップアップを直接開閉
        const mount = document.getElementById('mine-cal-mount');
        if(!mount) break;
        if(mount.innerHTML.trim()){ mount.innerHTML = ''; }
        else {
          const now = new Date();
          State.mineCalMonth = (State.mineDate || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`).slice(0,7);
          mount.innerHTML = UI.mineCalendarHTML();
        }
        break;
      }
      case 'close-mine-calendar': {
        const mount = document.getElementById('mine-cal-mount');
        if(mount) mount.innerHTML = '';
        break;
      }
      case 'mine-cal-prev':
      case 'mine-cal-next': {
        const now = new Date();
        const base = State.mineCalMonth || (State.mineDate||'').slice(0,7) || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        const ym = base.split('-');
        const d = new Date(parseInt(ym[0],10), parseInt(ym[1],10)-1 + (action==='mine-cal-next'?1:-1), 1);
        State.mineCalMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        const mount = document.getElementById('mine-cal-mount');
        if(mount) mount.innerHTML = UI.mineCalendarHTML();
        break;
      }
      case 'mine-cal-pick': {
        State.mineDate = t.getAttribute('data-date');
        const label = document.getElementById('mine-date-label');
        const val = document.getElementById('mine-date-value');
        if(label) label.textContent = Fmt.mmdd(State.mineDate);
        if(val) val.value = State.mineDate;
        const mount = document.getElementById('mine-cal-mount');
        if(mount) mount.innerHTML = '';
        break;
      }
      case 'delete-mine-row': {
        const id = t.getAttribute('data-id');
        const removed = Store.removeJibun(id);
        UI.renderMain();
        if(removed){
          UI.toast('削除しました', {actionLabel:'元に戻す', onAction:()=>{ Store.restoreJibun(removed.rec, removed.index); UI.renderMain(); }, duration:5000});
        }
        break;
      }
      case 'fill-price': {
        // 未確定だった市況行の箱単価を後から入力するモーダルを開く
        UI.fillPriceModal(t.getAttribute('data-key'));
        break;
      }
      case 'alloc-set': {
        // 日付×品種×規格のグループを新植/据置に確定
        const g = Compute.unassignedAllocGroups().find(x=>x.key===t.getAttribute('data-key'));
        if(g) Store.setJibunPlantGroup(g.ids, t.getAttribute('data-plant'), 0);
        UI.renderMain();
        if(document.querySelector('.alloc-modal')) UI.allocModal(); // モーダル表示中なら残りへ更新
        break;
      }
      case 'alloc-mix': {
        // 混在の据置本数入力モーダル（モーダル起点なら保存後に一覧へ戻す）
        const fromModal = !!document.querySelector('.alloc-modal');
        UI.mixStemsModal(t.getAttribute('data-key'), fromModal);
        break;
      }
      case 'open-alloc-modal': {
        UI.allocModal();
        break;
      }
      case 'delete-sakutsuke-row': {
        const id = t.getAttribute('data-id');
        const removed = Store.removeSakutsuke(id);
        UI.renderMain();
        if(removed){
          UI.toast('作付を削除しました', {actionLabel:'元に戻す', onAction:()=>{ Store.restoreSakutsuke(removed); UI.renderMain(); }, duration:5000});
        }
        break;
      }
      case 'export-backup':
        App.exportBackup();
        break;
      case 'export-csv':
        App.exportCSV();
        break;
      case 'open-reset-modal':
        UI.modal('全消去の確認', '産地データ・自分の出荷データを両方とも完全に削除します。この操作は取り消せません。事前にバックアップを書き出すことをおすすめします。', {
          danger:true, confirmLabel:'完全に消去する',
          onConfirm:()=>{ Store.resetAll(); UI.toast('全データを消去しました'); State.selectedVariety=MAJOR_VARIETY_KEY; State.selectedDate=null; UI.route('import'); }
        });
        break;
      case 'close-modal':
        UI.closeModal();
        break;
      case 'step-boxqty': {
        const input = document.querySelector('input[name="boxQty"]');
        if(input){
          const dir = parseInt(t.getAttribute('data-dir'),10);
          const v = Math.max(1, (parseInt(input.value,10)||1) + dir);
          input.value = v;
        }
        break;
      }
    }
  },
  onChange(e){
    // 年度・品目を切り替えたら、その年度に無い品種などが選ばれたままにならないよう表示状態を初期化する
    if(e.target.id==='year-select' || e.target.id==='item-select'){
      if(e.target.id==='year-select'){
        State.selectedYear = e.target.value;
      } else {
        State.selectedItem = e.target.value;
        // 年度の選択肢は品目ごとに違う。切り替えた品目に無い年度を持ち越すと空の画面が開くので、
        // 年度を一度捨てて UI.ensureScope に「その品目のデータがある最新年度」を選ばせる。
        State.selectedYear = null;
      }
      State.selectedVariety = MAJOR_VARIETY_KEY;
      State.selectedDate = null;
      State.calendarOpen = false;
      State.calendarMonth = null;
      State.donutHighlight = null;
      State.selectedSeries = [];
      State.lineDetailShow = null;
      State.chartScrollLeft = null;
      State.shipMonthsOpen = [];
      State.mineDate = null; State.mineVariety = null; State.mineCalMonth = null;
      UI.renderMain();
      return;
    }
    if(e.target.id==='variety-select'){
      State.selectedVariety = e.target.value;
      State.donutHighlight = null;
      UI.renderMain();
      return;
    }
    if(e.target.id==='sanchi-file-input' && e.target.files[0]){
      App.handleSanchiFile(e.target.files[0]);
      e.target.value=''; // 同名ファイルを修正して選び直しても再取込できるように
      return;
    }
    if(e.target.id==='mine-file-input' && e.target.files[0]){
      App.handleMineFile(e.target.files[0]);
      e.target.value='';
      return;
    }
    if(e.target.id==='backup-file-input' && e.target.files[0]){
      App.handleBackupFile(e.target.files[0]);
      e.target.value='';
      return;
    }
    if(e.target.name==='spec'){
      // 「別」を選んだ時だけ別本数の入力を表示
      document.getElementById('betsu-wrap').classList.toggle('hidden', e.target.value!=='別');
    }
    if(e.target.name==='variety'){
      // 「その他（自由入力）」を選んだ時だけ品種名の入力欄を表示
      const wrap = document.getElementById('variety-other-wrap');
      if(wrap) wrap.classList.toggle('hidden', e.target.value!=='__other__');
    }
  },
  onSubmit(e){
    const act = e.target.getAttribute('data-action');
    if(act==='submit-manual'){
      e.preventDefault();
      App.submitManual(e.target);
    } else if(act==='submit-sakutsuke'){
      e.preventDefault();
      App.submitSakutsuke(e.target);
    } else if(act==='submit-item'){
      e.preventDefault();
      const f = e.target;
      const r = Store.addItem(f.name.value, f.startMonth.value);
      if(!r.ok){ UI.toast(r.msg, {duration:5000}); return; }
      UI.renderMain();      // 品目セレクタに反映
      UI.settingsModal();   // 一覧を出し直す（入力欄は空に戻る）
      UI.toast(`品目「${r.name}」を追加しました。上のセレクタで切り替えられます`, {duration:5000});
    }
  },

  async handleSanchiFile(file){
    const {text, encoding} = await Parse.readFileSmart(file);
    App.importSanchiText(text, encoding);
  },
  // 産地CSV取込の中核（ファイル・ペースト共通）。encoding は表示用ラベル
  importSanchiText(text, encoding){
    try{
      if(!text || !Norm.text(text)){ throw new Error('CSVが空です'); }
      const {records, errors, dupCount} = Parse.sanchiCSV(text);
      // 品目は選択中のものを付ける。CSVに品目列があって食い違う時だけ、取り込む前に確認する。
      const other = Array.from(new Set(records.map(r=>r.csvItem).filter(v=>v && v!==State.selectedItem)));
      if(other.length){
        UI.modal('品目が違うようです',
          `このCSVの品目は「${Fmt.esc(other.join('／'))}」ですが、いま選んでいる品目は「${Fmt.esc(State.selectedItem)}」です。`
          + `<br><br>このまま取り込むと、${records.length}件すべてが「${Fmt.esc(State.selectedItem)}」として保存されます。`
          + `<br>違う場合は、キャンセルして上の品目を切り替えてからやり直してください。`,
          {confirmLabel:'このまま取り込む', onConfirm:()=>App.finishSanchiImport(records, errors, dupCount, encoding)});
        return;
      }
      App.finishSanchiImport(records, errors, dupCount, encoding);
    }catch(err){
      State.sanchiImportSummary = `<div class="err-box">取込エラー: ${Fmt.esc(err.message)}</div>`;
      UI.renderMain();
    }
  },
  // 産地CSV取込の後半（品目の確認をはさむ場合があるので分けてある）
  finishSanchiImport(records, errors, dupCount, encoding){
    const {added, updated} = Store.mergeSanchi(records);
    SelfTest.run();
    // 取り込んだデータが選択中の年度の外にあると、画面に出ずに「消えた」と誤解されるので知らせる
    const years = Array.from(new Set(records.map(r=>Compute.seasonYear(r.date, State.selectedItem)).filter(Boolean)));
    const outside = years.filter(y=> y !== String(State.selectedYear));
    State.sanchiImportSummary = `<div class="summary-box ${errors.length||outside.length?'warn':''}">
        <span>取り込み元: ${Fmt.esc(encoding)}／品目: ${Fmt.esc(State.selectedItem)}／取込行数: ${records.length}／更新: ${updated}／新規: ${added}${dupCount?`／ファイル内重複: ${dupCount}件（後勝ち上書き）`:''}${errors.length?`／エラー行: ${errors.length}件`:''}</span>
        ${outside.length?`<span>※ ${Fmt.esc(outside.join('・'))}年のデータが含まれています。表示するには年度を切り替えてください。</span>`:''}
      </div>`;
    UI.renderMain();
    UI.toast(`産地CSVを取込みました（新規${added}・更新${updated}）`);
  },
  async handleMineFile(file){
    const {text, encoding} = await Parse.readFileSmart(file);
    App.importMineText(text, encoding);
  },
  // 自分CSV取込の中核（ファイル・ペースト共通）
  importMineText(text, encoding){
    try{
      if(!text || !Norm.text(text)){ throw new Error('CSVが空です'); }
      const {records, errors} = Parse.jibunCSV(text);
      // 産地CSVと同じく、CSVの品目列が選択中と食い違う時は取り込む前に確認する。
      // 自分CSVは月日だけの出荷日を「選択中の品目の開始月」で解決するので、
      // 品目を間違えたまま取り込むと日付そのものが1年ずれることがある。
      const other = Array.from(new Set(records.map(r=>r.csvItem).filter(v=>v && v!==State.selectedItem)));
      if(other.length){
        UI.modal('品目が違うようです',
          `このCSVの品目は「${Fmt.esc(other.join('／'))}」ですが、いま選んでいる品目は「${Fmt.esc(State.selectedItem)}」です。`
          + `<br><br>このまま取り込むと、${records.length}件すべてが「${Fmt.esc(State.selectedItem)}」として保存されます。`
          + `<br>月日だけの出荷日は「${Fmt.esc(State.selectedItem)}」のシーズンで年を補うため、日付がずれることもあります。`
          + `<br>違う場合は、キャンセルして上の品目を切り替えてからやり直してください。`,
          {confirmLabel:'このまま取り込む', onConfirm:()=>App.finishMineImport(records, errors, encoding)});
        return;
      }
      App.finishMineImport(records, errors, encoding);
    }catch(err){
      State.mineImportSummary = `<div class="err-box">取込エラー: ${Fmt.esc(err.message)}</div>`;
      UI.renderMain();
    }
  },
  // 自分CSV取込の後半（品目の確認をはさむ場合があるので分けてある）
  finishMineImport(records, errors, encoding){
    const {added, skipped} = Store.mergeJibun(records, 'csv');
    State.mineImportSummary = `<div class="summary-box ${errors.length||skipped?'warn':''}">
        <span>取り込み元: ${Fmt.esc(encoding)}／品目: ${Fmt.esc(State.selectedItem)}／取込行数: ${records.length}／追加: ${added}${skipped?`／重複スキップ: ${skipped}件`:''}${errors.length?`／エラー行: ${errors.length}件`:''}</span>
      </div>`;
    UI.renderMain();
    UI.toast(`自分の出荷CSVを取込みました（追加${added}）`);
    // 取込直後：新植/据置の両方を作っている品種に未割当があれば、その場で割り当てを促す
    if(added>0 && Compute.unassignedAllocRows().length>0){ UI.allocModal(); }
  },
  async handleBackupFile(file){

      State.pendingBackup = data;

  exportBackup(){
    const payload = Store.exportBackup();
    const text = JSON.stringify(payload, null, 2);
    const ts = payload.exportedAt.slice(0,10);
    // ダウンロードはサンドボックス（Artifactプレビュー）では無言でブロックされるため、
    // コピー/ダウンロードのモーダルを出し、実際に取得できた時だけ「バックアップ済み」にする。
    UI.backupExportModal(text, `curcuma-backup-${ts}.json`);
  },
  // ファイル保存の共通ルート。
  // Artifact内では <a download> が黙って無視されるため、あればホストの保存機能を使う。
  // 戻り値: {ok:true} / {ok:false, code:'declined'|'unavailable'|...}
  async saveFile(name, text, opts){
    opts = opts || {};
    const data = opts.bom ? '﻿' + text : text;
    const dl = (typeof window !== 'undefined') && window.claude && window.claude.downloads;
    if(dl && typeof dl.save === 'function'){
      try{
        await dl.save({filename:name, data});
        return {ok:true};
      }catch(err){
        const code = (err && err.code) || 'unavailable';
        // csv等は環境により未対応。拡張子違いの代替名があれば一度だけ再試行
        if(code === 'extension_not_enabled' && opts.altName){
          try{
            await dl.save({filename:opts.altName, data});
            return {ok:true, savedAs:opts.altName};
          }catch(err2){
            return {ok:false, code:(err2 && err2.code) || 'unavailable'};
          }
        }
        return {ok:false, code};
      }
    }
    // ファイルを直接開いている場合の従来ルート
    try{
      const blob = new Blob([data], {type: opts.mime || 'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      return {ok:true};
    }catch(e){
      return {ok:false, code:'unavailable'};
    }
  },
  // 保存失敗時の案内文（コピー導線に誘導）
  saveErrorMessage(code){
    switch(code){
      case 'declined': return 'キャンセルしました';
      case 'rate_limited': return '保存の確認が混み合っています。少し待ってからもう一度お試しください';
      case 'too_large': return 'ファイルが大きすぎて保存できません。コピーをお使いください';
      case 'extension_not_enabled':
      case 'rejected_extension': return 'この形式は保存できません。コピーをお使いください';
      default: return 'この環境では保存できませんでした。コピーをお使いください';
    }
  },
  csvCell(v){
    const s = (v==null ? '' : String(v));
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  },
  // 保存されている grade+本数 を取込CSVの規格表記に戻す（2Lは常に本数付き、他は50以外のみ付与）
  specToStr(grade, count){
    const letter = String(grade).replace(/^秀/,'');
    if(letter==='2L') return '2L' + count;
    return letter + (Number(count)!==50 ? count : '');
  },
  // 書き出しCSVには必ず品目列を入れる。入れずに書き出すと、別の品目を選んだ状態で
  // 読み戻したときに食い違い確認が働かず、丸ごと別品目のデータに化ける。
  buildSanchiCSV(){
    const head = '日付,品目,品種,規格,本数,箱数量,箱単価';
    const rows = Array.from(Compute.scopedSanchi().values())
      .sort((a,b)=> a.date.localeCompare(b.date) || a.variety.localeCompare(b.variety))
      .map(r=>[r.date, (r.item||DEFAULT_ITEM), r.variety, r.grade, r.count, r.boxQty, (r.boxPrice==null ? '未確定' : r.boxPrice)].map(App.csvCell).join(','));
    return {text:[head, ...rows].join('\r\n'), rows:rows.length};
  },
  buildJibunCSV(){
    const head = '出荷日,品目,品種名,規格,箱数,別本数';
    const rows = Compute.scopedJibun().slice()
      .sort((a,b)=> a.date.localeCompare(b.date) || a.variety.localeCompare(b.variety))
      .map(r=>{
        const spec = r.betsuCount>0 ? '別' : App.specToStr(r.grade, r.count);
        const betsu = r.betsuCount>0 ? r.betsuCount : '';
        return [r.date, (r.item||DEFAULT_ITEM), r.variety, spec, r.boxQty, betsu].map(App.csvCell).join(',');
      });
    return {text:[head, ...rows].join('\r\n'), rows:rows.length};
  },
  exportCSV(){
    if(Compute.scopedSanchi().size===0 && Compute.scopedJibun().length===0){ UI.toast('この年度・品目には書き出すデータがありません'); return; }
    const ts = new Date().toISOString().slice(0,10);
    const sections = [];
    if(Compute.scopedSanchi().size>0){ const s = App.buildSanchiCSV(); sections.push({name:'産地データ', filename:`curcuma-産地-${ts}.csv`, text:s.text, rows:s.rows}); }
    if(Compute.scopedJibun().length>0){ const j = App.buildJibunCSV(); sections.push({name:'自分の出荷', filename:`curcuma-自分-${ts}.csv`, text:j.text, rows:j.rows}); }
    UI.csvExportModal(sections);
  },
  submitManual(form){
    const fd = new FormData(form);
    let variety = Norm.text(fd.get('variety'));
    if(variety==='__other__'){ variety = Norm.text(fd.get('varietyOther')); } // 「その他」選択時は自由入力欄を採用
    const specRaw = Norm.text(fd.get('spec'));
    const date = Norm.date(fd.get('date'));
    const boxQty = Norm.num(fd.get('boxQty'));
    let grade, count, betsuCount = 0;
    if(specRaw==='別'){
      grade = '別'; count = 0; betsuCount = Norm.num(fd.get('betsuCount'));
      if(!(betsuCount>0)){ UI.toast('別本数を入力してください'); return; }
    } else {
      const spec = Parse.parseSpec(specRaw);
      if(spec){ grade = spec.grade; count = spec.count; }
    }
    if(!date || !variety || !grade || Number.isNaN(boxQty) || boxQty<=0){
      UI.toast('入力内容を確認してください');
      return;
    }
    const {added, skipped} = Store.mergeJibun([{date, variety, grade, count, boxQty, betsuCount}], 'manual');
    // 追加後も日付と品種は保持（同じ日・同じ品種で規格違いを連続入力しやすく）。規格・箱数は再描画で既定に戻る。
    if(added){
      // プルダウンにある品種のみ復元（「その他」自由入力は既定へ戻す）
      const registered = new Set(Compute.scopedSakutsuke().map(r=>r.variety).filter(Boolean));
      State.mineVariety = registered.has(variety) ? variety : null;
    }
    UI.renderMain();
    UI.toast(added ? '追加しました' : '同じ内容が既に登録されています');
  },
  submitSakutsuke(form){
    const fd = new FormData(form);
    const variety = Norm.text(fd.get('variety'));
    const type = Norm.text(fd.get('type'))==='据置' ? '据置' : '新植';
    const tsubo = Norm.num(fd.get('tsubo'));
    if(!variety || !(tsubo>0)){
      UI.toast('品種と面積（坪）を入力してください');
      return;
    }
    Store.addSakutsuke({variety, type, tsubo});
    UI.renderMain();
    UI.toast('作付を追加しました');
  }
};

App.init();

// 開発用の隠しフック（画面には出ない）。
// 使い方（DevToolsコンソール）:
//   __curcumaDev.selfTest()   → 価格計算の回帰チェック。[SelfTest] OK が出れば正常。
//   __curcumaDev.diag()       → 件数の一覧。改修の前後でこの数値が動かないことを確認する。
//   __curcumaDev.loadSample() → サンプル読込（※本番データを全消去するので注意）
window.__curcumaDev = {
  loadSample(){
    Store.loadSample();
    SelfTest.run();
    State.selectedVariety = MAJOR_VARIETY_KEY;
    State.selectedDate = null;
    State.sanchiImportSummary = '';
    State.mineImportSummary = '';
    UI.route('sanchi');
    return 'サンプルを読み込みました（開発用）';
  },
  selfTest(){ return SelfTest.run(); },
  // 改修の前後で突き合わせる基準値。matched/unmatched は表示中の年度×品目に対する値なので、
  // 比較するときは scope が同じであることを必ず確認する。
  diag(){
    const byItem = {};
    const bump = (kind, name)=>{
      const k = name || DEFAULT_ITEM;
      if(!byItem[k]) byItem[k] = {産地:0, 自分:0, 作付:0};
      byItem[k][kind]++;
    };
    Store.items.forEach(i=>{ if(!byItem[i.name]) byItem[i.name] = {産地:0, 自分:0, 作付:0}; });
    Store.sanchi.forEach(r=>bump('産地', r.item));
    Store.jibun.forEach(r=>bump('自分', r.item));
    Store.sakutsuke.forEach(r=>bump('作付', r.item));
    const m = Compute.matchJibun();
    const d = {
      build: APP_BUILD,
      schema: SCHEMA_VERSION,
      scope: `${State.selectedYear} / ${State.selectedItem}`,
      'sanchi.size': Store.sanchi.size,
      'jibun.length': Store.jibun.length,
      'sakutsuke.length': Store.sakutsuke.length,
      matched: m.filter(r=>r.matched).length,
      unmatched: m.filter(r=>!r.matched).length,
      pending: m.filter(r=>r.matched && r.pending).length
    };
    console.info('[diag]', d);
    console.table(byItem);
    return d;
  }
};
</script>
