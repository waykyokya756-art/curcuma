      arcs += `<circle class="donut-seg" data-cat="${Fmt.esc(cat)}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorMap[cat]}" stroke-width="${sw}" stroke-dasharray="${len} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" />`;
      // スライス上に%を表示（小さすぎるスライスは凡例に任せる）
      const pct = frac*100;
      if(pct >= 7){
        const midFrac = cumFrac + frac/2;
        const ang = (-90 + midFrac*360) * Math.PI/180;
        const lx = cx + r*Math.cos(ang);
        const ly = cy + r*Math.sin(ang);
        labels += `<text x="${lx.toFixed(1)}" y="${(ly+size*0.03).toFixed(1)}" text-anchor="middle" class="donut-slice-lbl" fill="#fff" stroke="rgba(0,0,0,.38)" stroke-width="${(size*0.018).toFixed(1)}" paint-order="stroke" style="font-size:${(size*0.085).toFixed(1)}px;font-weight:700">${Math.round(pct)}%</text>`;
      }
      offset += len;
      cumFrac += frac;
    });
    return `<svg class="donut-svg" style="width:${size}px;height:${size}px" viewBox="0 0 ${size} ${size}" role="img" aria-label="規格構成ドーナツ">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/>
      ${arcs}
      ${labels}
      ${hideCenter ? '' : `<text x="${cx}" y="${cy-2}" text-anchor="middle" class="donut-center-num tnum" style="font-size:${(size*0.16).toFixed(1)}px">${Fmt.num(total)}</text>
      <text x="${cx}" y="${(cy+size*0.11).toFixed(1)}" text-anchor="middle" class="donut-center-lbl" style="font-size:${(size*0.06).toFixed(1)}px">総箱数</text>`}
    </svg>`;
  },
  lineSVG(points, opts){
    opts = opts||{};
    const padL = 46, padR = 16, padT = 16, padB = 30, COLGAP = 36;
    const n = points.length;
    const W = Math.max(320, padL + padR + Math.max(1,n-1)*COLGAP);
    const innerW = W-padL-padR;
    const withPrice = points.filter(p=>p.price!=null);
    if(withPrice.length===0){
      const H = 160;
      return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--ink-muted)" font-size="13">価格データがありません</text></svg>`, isolated:false, yAxis:''};
    }
    const prices = withPrice.map(p=>p.price);
    const {loY, hiY, innerH, H, yScale} = Charts.niceYAxis(prices, padT, padB);
    // 最初の点をY軸（固定ラベル）から離すため左に18pxインセット
    const x0 = padL + 18, x1 = W - padR - 4;
    const xScale = (i)=> n<=1 ? (x0+x1)/2 : x0 + ((x1-x0)*i)/(n-1);

    // gridlines（1000円刻み。Y軸ラベルは固定レイヤー側で描画）
    let grid = '';
    for(let v=loY; v<=hiY+0.5; v+=1000){
      const y = yScale(v);
      grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    }
    // 日曜マーカー（縦線＋ラベル背景）
    const sunday = Charts.sundayMarks((i)=>points[i].date, n, xScale, padT, innerH, H);
    // x labels（全ての日付。日曜は赤）
    let xlabels = '';
    for(let i=0;i<n;i++){
      const sun = Charts.isSunday(points[i].date);
      xlabels += `<text x="${xScale(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${sun?'var(--cal-sun)':'var(--ink-muted)'}">${Fmt.date(points[i].date)}</text>`;
    }
    // 価格のある点を全て一本の線でつなぐ（出荷の無い日／2L・L欠測日は跨いで接続）
    const pricedIdx = [];
    points.forEach((p,i)=>{ if(p.price!=null) pricedIdx.push(i); });
    let paths = '';
    let isolated = pricedIdx.length===1;
    if(pricedIdx.length>=2){
      const d = pricedIdx.map((i,k)=>`${k===0?'M':'L'} ${xScale(i).toFixed(1)} ${yScale(points[i].price).toFixed(1)}`).join(' ');
      paths += `<path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    let markers = '';
    points.forEach((p,i)=>{
      if(p.price==null) return;
      const x = xScale(i), y = yScale(p.price);
      if(p.marker==='2L'){
        markers += `<circle cx="${x}" cy="${y}" r="6" fill="var(--primary)" stroke="var(--surface)" stroke-width="2" data-pt="${i}" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}"/>`;
      } else {
        markers += `<rect x="${x-6}" y="${y-6}" width="12" height="12" fill="var(--surface)" stroke="var(--warn)" stroke-width="2.5" transform="rotate(45 ${x} ${y})" data-pt="${i}" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}"/>`;
      }
    });
    // 選択中プロットの縁取り（初期は非表示。タップ時に位置を移動して表示）
    const highlight = `<circle class="pt-highlight" r="10" fill="none" stroke="var(--ink)" stroke-width="2.5" style="opacity:0" pointer-events="none"/>`;
    const hitLayer = `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" data-hit="line"/>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="価格推移" data-line-chart data-padl="${padL}" data-padr="${padR}" data-w="${W}" data-n="${n}" data-x0="${x0}" data-x1="${x1}">
      ${grid}${sunday}${paths}${markers}${highlight}${xlabels}${hitLayer}
    </svg>`;
    return {svg, isolated, points, xScale, yAxis:Charts.yAxisSVG(loY, hiY, yScale, padL, H)};
  },
  multiLineSVG(series){
    // series = [{variety, color, points, hidden}], points = Compute.lineData output
    // hidden:true の系列は線を描かないが、日付軸・価格軸の計算には含める（絞り込みで軸が動かないように）
    const padL = 46, padR = 16, padT = 16, padB = 30, COLGAP = 36;
    const dateSet = new Set();
    series.forEach(s=> s.points.forEach(p=> dateSet.add(p.date)));
    const dates = Array.from(dateSet).sort();
    const n = dates.length;
    const W = Math.max(320, padL + padR + Math.max(1,n-1)*COLGAP);
    const innerW = W-padL-padR;
    const dateIndex = new Map(dates.map((d,i)=>[d,i]));
    const allPrices = [];
    series.forEach(s=> s.points.forEach(p=>{ if(p.price!=null) allPrices.push(p.price); }));
    if(allPrices.length===0){
      const H = 160;
      return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--ink-muted)" font-size="13">価格データがありません</text></svg>`, isolated:false, ptMeta:[], w:W, yAxis:''};
    }
    const {loY, hiY, innerH, H, yScale} = Charts.niceYAxis(allPrices, padT, padB);
    // 最初の点をY軸（固定ラベル）から離すため左に18pxインセット
    const x0 = padL + 18, x1 = W - padR - 4;
    const xScale = (i)=> n<=1 ? (x0+x1)/2 : x0 + ((x1-x0)*i)/(n-1);

    let grid = '';
    for(let v=loY; v<=hiY+0.5; v+=1000){
      const y = yScale(v);
      grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    }
    // 日曜マーカー（縦線＋ラベル背景）
    const sunday = Charts.sundayMarks((i)=>dates[i], n, xScale, padT, innerH, H);
    let xlabels = '';
    for(let i=0;i<n;i++){
      const sun = Charts.isSunday(dates[i]);
      xlabels += `<text x="${xScale(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${sun?'var(--cal-sun)':'var(--ink-muted)'}">${Fmt.date(dates[i])}</text>`;
    }
    let paths = '', markers = '', isolated = false;
    const ptMeta = [];
    series.forEach(s=>{
      if(s.hidden) return; // 軸は維持したまま線・点だけ非表示
      const pts = s.points.filter(p=>p.price!=null).map(p=>({i:dateIndex.get(p.date), p})).sort((a,b)=>a.i-b.i);
      // 価格のある点を全て一本の線でつなぐ（欠測日は跨いで接続）
      if(pts.length>=2){
        const d = pts.map((it,k)=>`${k===0?'M':'L'} ${xScale(it.i).toFixed(1)} ${yScale(it.p.price).toFixed(1)}`).join(' ');
        paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
      } else if(pts.length===1){ isolated = true; }
      pts.forEach(({i,p})=>{
        const x = xScale(i), y = yScale(p.price);
        if(p.marker==='2L') markers += `<circle cx="${x}" cy="${y}" r="6" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
        else markers += `<rect x="${x-6}" y="${y-6}" width="12" height="12" fill="var(--surface)" stroke="${s.color}" stroke-width="2.5" transform="rotate(45 ${x} ${y})"/>`;
        ptMeta.push({x, y, date:p.date, price:p.price, marker:p.marker, variety:s.variety, color:s.color});
      });
    });
    // 選択中プロットの縁取り
    const highlight = `<circle class="pt-highlight" r="10" fill="none" stroke="var(--ink)" stroke-width="2.5" style="opacity:0" pointer-events="none"/>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="主要品種の価格推移" data-multiline-chart data-w="${W}">
      ${grid}${sunday}${paths}${markers}${highlight}${xlabels}<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg>`;
    return {svg, isolated, ptMeta, w:W, yAxis:Charts.yAxisSVG(loY, hiY, yScale, padL, H)};
  },
  barSVG(rows, opts){
    opts = opts||{};
    const W = 320, H = 170, padL = 8, padR = 8, padT = 10, padB = 24;
    const innerW = W-padL-padR, innerH = H-padT-padB;
    const n = rows.length;
    if(n===0) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--ink-muted)" font-size="12">データがありません</text></svg>`;
    const max = Math.max(...rows.map(r=>r.amount), 1);
    const bw = Math.min(28, innerW/n*0.6);
    const gap = innerW/n;
    let bars = '';
    let xlabels = '';
    const maxLabels = 6;
    const step = Math.max(1, Math.ceil(n/maxLabels));
    rows.forEach((r,i)=>{
      const h = (r.amount/max) * innerH;
      const x = padL + gap*i + (gap-bw)/2;
      const y = padT + innerH - h;
      const rad = Math.min(6, bw/2, h);
      const d = `M ${x} ${y+rad} A ${rad} ${rad} 0 0 1 ${x+rad} ${y} L ${x+bw-rad} ${y} A ${rad} ${rad} 0 0 1 ${x+bw} ${y+rad} L ${x+bw} ${y+h} L ${x} ${y+h} Z`;
      bars += `<path d="${d}" fill="var(--primary)" data-bar="${i}" data-val="${r.amount}"/>`;
      if(i%step===0) xlabels += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-muted)">${Fmt.date(r.date)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日別売上" data-bar-chart>${bars}${xlabels}</svg>`;
  }
};

/* ============================== State ============================== */
const MAJOR_VARIETY_KEY = '__major__';
// クルクマの主要品種。他の品目には当てはまらないので、実際に重ねる品種は
// UI.majorVarieties() が「この一覧のうち表示中の品目にあるもの」を選び、
// 1つも無ければ箱数の多い順に上位を代用する（品目を切り替えた直後に
// 既定の画面が空カードになって、アプリが壊れたように見えるのを防ぐ）。
const MAJOR_VARIETIES = ['バンコクスプリーム','ホワイト','ピアノホワイト','シャローム','エメラルドチョコゼブラ'];
const MAJOR_MAX = 5;

const State = {
  tab: 'sanchi',
  selectedYear: null,     // 表示中の年度（'YYYY'）。起動時に最新年度で初期化
  selectedItem: null,     // 表示中の品目名。起動時に品目マスタの先頭（＝クルクマ）で初期化
  selectedVariety: MAJOR_VARIETY_KEY,
  selectedDate: null,
  calendarOpen: false,
  calendarMonth: null,
  mineDate: null,        // 自分出荷手入力の選択日付（産地と同じ自作カレンダー）
  mineVariety: null,     // 手入力で最後に選んだ品種（連続入力のため保持）
  mineCalMonth: null,    // 手入力カレンダーの表示月
  mineMode: 'csv',
  donutHighlight: null,
  selectedSeries: [],     // 主要品種チャートで選択中の品種。空＝全表示（初期状態）
  seriesSelectable: [],   // 凡例をタップできる品種（データのあるもの）
  pendingBackup: null,
  pendingRemoved: null,
  undoTimer: null,
  sanchiImportSummary: '',
  mineImportSummary: '',
  multiMeta: null,
  lineDetailShow: null,   // プロットタップで日付連動→再描画後に詳細を復元するための一時保持 {variety,date}
  chartScrollLeft: null,  // 再描画をまたいで折れ線の横スクロール位置を保つ（nullなら右端＝最新日）
  shipMonthsOpen: []      // 出荷明細一覧で開いている月（'YYYY-MM'）。既定は全て閉じる
};

/* ============================== UI ============================== */
const CAT_LABELS = {'2L30':'2L30','2L50':'2L50','L50':'L','その他':'その他'};
const CAT_COLORVAR = {'2L30':'var(--chart-2l30)','2L50':'var(--chart-2l50)','L50':'var(--chart-l50)','その他':'var(--chart-other)'};
// 品種を色分けする際の系列色（将来5品種まで対応）
const SERIES_COLORS = ['var(--chart-blue)','var(--accent)','var(--warn)','var(--primary)','var(--ink-muted)'];

const UI = {
  // テーマは light / dark の2状態のみ。保存が無い（または旧 'auto'）なら、その場でOSの設定を見て
  // どちらかに確定させる＝以後は必ず1タップで切り替わる（3状態巡回だとダークまで最大3タップ必要だった）。
  themeMode(){
    const saved = localStorage.getItem('curcuma.theme');
    if(saved==='light' || saved==='dark') return saved;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  },
  setThemeMode(mode){
    try{ localStorage.setItem('curcuma.theme', mode); }catch(e){}
    UI.applyTheme();
  },
  applyTheme(){
    const mode = UI.themeMode();
    document.documentElement.setAttribute('data-theme', mode);
    const btn = document.getElementById('theme-btn');
    if(btn){
      // アイコンは「今の状態」ではなく「押した先」を出す＝何が起きるかが分かる
      btn.innerHTML = mode==='dark' ? Icon.sun : Icon.moon;
      btn.setAttribute('aria-label', mode==='dark' ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
    }
    // PWAのステータスバー色。prefers-color-scheme のメタはOSの設定にしか反応せず、
    // アプリ内でダークにしても端末がライトだと上端だけ明るいまま残るため、実効テーマで書き換える。
    let meta = document.getElementById('theme-color-meta');
    if(!meta){ // 生成前の素の curcuma-dashboard.html を直接開いた時のための保険
      meta = document.createElement('meta'); meta.id = 'theme-color-meta'; meta.name = 'theme-color';
      document.head.appendChild(meta);
    }
    meta.setAttribute('content', mode==='dark' ? '#10130F' : '#F6F8F4');
  },
  cycleTheme(){
    UI.setThemeMode(UI.themeMode()==='dark' ? 'light' : 'dark');
  },

  // 年度・品目の初期値を決める（起動時と、選択中の値が消えた時の立て直し）。品目を先に決めてから年度を決める。
  ensureScope(){
    Store.ensureItems();
    const items = Store.itemNames();
    if(!State.selectedItem || !items.includes(State.selectedItem)) State.selectedItem = items[0];
    const years = Store.years();
    if(!State.selectedYear || !years.includes(String(State.selectedYear))){
      // 既定は「その品目のデータがある最新年度」。今年を既定にすると、年が明けた直後に
      // 空の年度が開いて全部消えたように見えるため、実データのある年を優先する。
      const withData = new Set();
      const add = (r)=>{ if((r.item||DEFAULT_ITEM)===State.selectedItem){ const y=Compute.seasonYear(r.date, State.selectedItem); if(y) withData.add(y); } };
      Store.sanchi.forEach(add);
      Store.jibun.forEach(add);
      State.selectedYear = Array.from(withData).sort().pop() || Store.currentYear();
    }
  },
  renderAppBar(){
    UI.ensureScope();
    const ySel = document.getElementById('year-select');
    ySel.innerHTML = Store.years().map(y=>`<option value="${y}"${y===String(State.selectedYear)?' selected':''}>${y}年</option>`).join('');
    const iSel = document.getElementById('item-select');
    iSel.innerHTML = Store.itemNames().map(n=>`<option value="${Fmt.esc(n)}"${n===State.selectedItem?' selected':''}>${Fmt.esc(n)}</option>`).join('');
    const region = document.getElementById('storage-banner-region');
    if(Store.loadError){
      region.innerHTML = `<div class="storage-banner">⚠ 前回の保存データを読み込めませんでした（破損の可能性）。壊れたデータは退避しました。「保存」タブのバックアップから復元してください。</div>`;
    } else if(!Store.available){
      region.innerHTML = `<div class="storage-banner">この端末では自動保存が効きません。作業内容は「保存」タブから都度バックアップしてください。</div>`;
    } else if(Store.saveError){
      region.innerHTML = `<div class="storage-banner">⚠ 自動保存に失敗しています（端末の容量オーバーの可能性）。「保存」タブからバックアップを書き出してください。</div>`;
    } else {
      region.innerHTML = '';
    }
  },

  renderTabs(){
    const tabs = [
      {id:'sanchi', label:'産地', icon:Icon.origin},
      {id:'mine', label:'自分', icon:Icon.mine},
      {id:'import', label:'取込', icon:Icon.import},
      {id:'backup', label:'保存', icon:Icon.backup}
    ];
    const bar = document.getElementById('tabbar');
    bar.setAttribute('role','tablist');
    bar.innerHTML = tabs.map(t=>`
      <button class="tab" role="tab" aria-selected="${State.tab===t.id}" data-action="switch-tab" data-tab="${t.id}">
        ${t.icon}<span>${t.label}</span>
      </button>`).join('');
  },

  route(tab){
    State.tab = tab;
    UI.renderTabs();
    UI.renderMain();
  },

  renderMain(){
    const main = document.getElementById('main');
    UI.renderAppBar();
    if(Compute.scopedSanchi().size===0 && Compute.scopedJibun().length===0 && State.tab!=='import' && State.tab!=='backup'){
      State.tab = 'import';
      UI.renderTabs();
    }
    if(State.tab==='sanchi') main.innerHTML = UI.screenSanchi();
    else if(State.tab==='mine') main.innerHTML = UI.screenMine();
    else if(State.tab==='import') main.innerHTML = UI.screenImport();
    else main.innerHTML = UI.screenBackup();
    UI.afterRender();
  },

  afterRender(){
    if(State.tab==='sanchi'){
      const lineWrap = document.querySelector('[data-line-wrap]');
      if(lineWrap) UI.wireLineTooltip(lineWrap);
      const multiWrap = document.querySelector('[data-multiline-wrap]');
      if(multiWrap) UI.wireMultiLineTooltip(multiWrap);
      // 折れ線は初期表示を最新日（右端）に。左スクロールで過去へ遡れる。
      // ただしプロットのタップ由来の再描画では、見ていた位置をそのまま保つ。
      const scroller = document.querySelector('#main .chart-scroll');
      if(scroller){
        if(State.chartScrollLeft != null){
          scroller.scrollLeft = State.chartScrollLeft;
          State.chartScrollLeft = null;
        }else{
          scroller.scrollLeft = scroller.scrollWidth;
        }
      }
    }
    if(State.tab==='mine'){
      const barWrap = document.querySelector('[data-bar-wrap]');
      if(barWrap) UI.wireBarTooltip(barWrap);
      // 出荷明細一覧の月アコーディオン：開閉状態を State に控えて再描画をまたいで保つ
      document.querySelectorAll('#main details.ship-month').forEach(d=>{
        d.addEventListener('toggle', ()=>{
          const ym = d.getAttribute('data-ym');
          const i = State.shipMonthsOpen.indexOf(ym);
          if(d.open){ if(i<0) State.shipMonthsOpen.push(ym); }
          else if(i>=0) State.shipMonthsOpen.splice(i,1);
        });
      });
    }
    if(State.tab==='import'){
      const seg = document.getElementById('mine-mode-csv-panel');
      const seg2 = document.getElementById('mine-mode-manual-panel');
      if(seg && seg2){
        seg.classList.toggle('hidden', State.mineMode!=='csv');
        seg2.classList.toggle('hidden', State.mineMode!=='manual');
      }
    }
  },

  /* ---------- Screen: 産地分析 ---------- */
  donutLegendHTML(cats, total){
    return Object.keys(cats).map(cat=>{
      const val = cats[cat];
      return `<div class="legend-item" data-action="legend-toggle" data-cat="${cat}" data-active="${State.donutHighlight===cat}">
        <span class="legend-dot" style="background:${CAT_COLORVAR[cat]}"></span>
        <span class="legend-label">${CAT_LABELS[cat]}</span>
        <span class="legend-val tnum">${Fmt.num(val)}</span>
      </div>`;
    }).join('');
  },
  // 重ねて表示する品種。MAJOR_VARIETIES に載っていて実際にデータがあるものを優先し、
  // 1件も無い品目では箱数の多い順に上位を代用する。list は Compute.varietyList()（箱数降順）。
  majorVarieties(list){
    const names = list.map(v=>v.variety);
    const hit = MAJOR_VARIETIES.filter(v=>names.includes(v));
    return hit.length ? hit : names.slice(0, MAJOR_MAX);
  },
  screenSanchi(){
    State.multiMeta = null;
    const list = Compute.varietyList();
    if(list.length===0){
      return `<h1 class="screen-title">産地分析</h1>` + UI.emptyState('産地データがまだありません', '産地CSVを取込むと、品種ごとの規格構成と価格推移を確認できます。', '取込へ進む', 'import');
    }
    // 日付の既定＝最新日
    if(!State.selectedDate) State.selectedDate = Compute.latestDate();
    // 品種の既定＝主要品種。単一品種が消えた場合のみリセット
    if(State.selectedVariety !== MAJOR_VARIETY_KEY && !list.find(v=>v.variety===State.selectedVariety)){
      State.selectedVariety = MAJOR_VARIETY_KEY;
    }
    const isMajor = State.selectedVariety === MAJOR_VARIETY_KEY;
    const selDate = State.selectedDate;

    // セレクタ（日付＋品種の横並び）。プルダウン上部を指定順に並べ、残りは既存順のまま。
    const VARIETY_TOP_ORDER = ['バンコクスプリーム','ホワイト','ピアノホワイト','シャローム','エメラルドチョコゼブラ','チェリープリンセスデーン','パルビフローラ','リボン'];
    const isMix = (name)=> name.includes('ミックス'); // 「ミックス」を含む品種は最下部へ
    const restList = list.filter(v=>!VARIETY_TOP_ORDER.includes(v.variety));
    const orderedList = [
      ...VARIETY_TOP_ORDER.map(name=>list.find(v=>v.variety===name)).filter(Boolean),
      ...restList.filter(v=>!isMix(v.variety)),
      ...restList.filter(v=>isMix(v.variety))
    ];
    const varietyOptions =
      `<option value="${MAJOR_VARIETY_KEY}" ${isMajor?'selected':''}>主要品種</option>` +
      orderedList.map(v=>`<option value="${Fmt.esc(v.variety)}" ${v.variety===State.selectedVariety?'selected':''}>${Fmt.esc(v.variety)}</option>`).join('');
    const selectorCard = `
      <div class="card">
        <div class="selector-row">
          <div class="field date-field">日付
            <div class="date-nav">
              <button type="button" class="date-step" data-action="date-step-prev" aria-label="前の出荷日へ" ${Compute.stepDate(selDate,-1)?'':'disabled'}>‹</button>
              <button type="button" class="date-trigger" id="sanchi-date-trigger" data-action="toggle-calendar">
                <span>${Fmt.esc(Fmt.mmdd(selDate))}</span><span class="caret">▾</span>
              </button>
              <button type="button" class="date-step" data-action="date-step-next" aria-label="次の出荷日へ" ${Compute.stepDate(selDate,1)?'':'disabled'}>›</button>
            </div>
            ${State.calendarOpen ? UI.calendarHTML() : ''}
          </div>
          <label class="field variety-field">品種
            <div class="select-wrap">
              <select id="variety-select">${varietyOptions}</select>
            </div>
          </label>
        </div>
      </div>`;

    let donutCard, lineCard;

    if(isMajor){
      // 主要品種では規格構成（ドーナツ）は非表示。価格推移をメインに。
      donutCard = '';

      // 折れ線＝主要品種を色分けして重ねる。凡例タップで各品種の表示ON/OFF。
      const allSeries = UI.majorVarieties(list).map((variety,i)=>({variety, color:SERIES_COLORS[i%SERIES_COLORS.length], points:Compute.lineDataDense(variety)}));
      const anyData = allSeries.some(s=>s.points.some(p=>p.price!=null));
      if(!anyData){
        lineCard = `
          <div class="card">
            <div class="card-head"><h2 class="card-title">価格推移（50本換算 箱単価・主要品種）</h2></div>
            <div class="empty-state"><p>主要品種の価格データがまだありません。</p></div>
          </div>`;
      } else {
        // 凡例タップ＝絞り込み。選択が空なら全表示（初期状態）
        const sel = State.selectedSeries || [];
        const isFiltered = sel.length > 0;
        State.seriesSelectable = allSeries.filter(s=>s.points.some(p=>p.price!=null)).map(s=>s.variety);
        const seriesLegend = allSeries.map(s=>{
          const has = s.points.some(p=>p.price!=null);
          const off = isFiltered && !sel.includes(s.variety);
          return `<div class="legend-item ${has?'':'series-muted'} ${off?'series-off':''}"${has?` data-action="series-toggle" data-variety="${Fmt.esc(s.variety)}" role="button"`:''}>
            <span class="series-dot" style="background:${s.color}"></span>
            <span class="legend-label">${Fmt.esc(s.variety)}</span>
            <span class="legend-val">${has?(off?'非表示':''):'データなし'}</span>
          </div>`;
        }).join('');
        // 軸は常に5品種ぶんで固定し、非選択の品種は線だけ消す
        const chartSeries = allSeries.map(s=>({...s, hidden: isFiltered && !sel.includes(s.variety)}));
        const anyShown = chartSeries.some(s=> !s.hidden && s.points.some(p=>p.price!=null));
        let chartInner, isolatedNote='';
        if(anyShown){
          const {svg, isolated, ptMeta, w, yAxis} = Charts.multiLineSVG(chartSeries);
          State.multiMeta = {ptMeta, w};
          chartInner = `<div class="chart-wrap" data-multiline-wrap><div class="chart-scroll">${svg}</div>${yAxis?`<div class="chart-yaxis">${yAxis}</div>`:''}</div>
            <div class="chart-detail" id="line-detail" data-empty="true">プロットをタップすると詳細を表示します</div>`;
          if(isolated) isolatedNote = `<p class="chart-caption">連続データが少ないため、一部は単独の点のみ表示しています（データ不足）。</p>`;
        } else {
          State.multiMeta = null;
          chartInner = `<div class="empty-state"><p>表示する品種がありません。凡例をタップして表示してください。</p></div>`;
        }
        lineCard = `
          <div class="card">
            <div class="card-head"><h2 class="card-title">価格推移（50本換算 箱単価・主要品種）</h2></div>
            ${chartInner}
            <div class="series-legend">${seriesLegend}</div>
            ${isolatedNote}
          </div>`;
      }
    } else {
      // 単一品種：ドーナツは選択日の箱数内訳。折れ線は全期間。
      const variety = State.selectedVariety;
      const {cats, total} = Compute.donutDataForDay([variety], selDate);
      const donutBody = total>0
        ? `<div class="donut-row">${Charts.donutSVG(cats, total, CAT_COLORVAR, 180)}<div class="legend legend-flex">${UI.donutLegendHTML(cats, total)}</div></div>`
        : `<div class="empty-state"><p>${Fmt.esc(Fmt.date(selDate))} の${Fmt.esc(variety)}のデータがありません。日付を変えてお試しください。</p></div>`;
      donutCard = `
        <div class="card">
          <div class="card-head"><h2 class="card-title">規格構成（${Fmt.esc(Fmt.date(selDate))} <span class="${Fmt.wdClass(selDate)}">${Fmt.esc(Fmt.wd(selDate))}</span>）</h2></div>
          ${donutBody}
        </div>`;

      const points = Compute.lineDataDense(variety);
      const withData = points.filter(p=>p.price!=null);
      let lineBlock;
      if(withData.length===0){
        lineBlock = `<div class="empty-state"><p>この品種の価格データがまだありません。</p></div>`;
      } else {
        const {svg, isolated, yAxis} = Charts.lineSVG(points);
        lineBlock = `
          <div class="chart-wrap" data-line-wrap data-variety="${Fmt.esc(variety)}"><div class="chart-scroll">${svg}</div>${yAxis?`<div class="chart-yaxis">${yAxis}</div>`:''}</div>
          <div class="chart-detail" id="line-detail" data-empty="true">プロットをタップすると詳細を表示します</div>
          ${isolated ? `<p class="chart-caption">連続データが少ないため、一部は単独の点のみ表示しています（データ不足）。</p>` : ''}
        `;
      }
      lineCard = `
        <div class="card">
          <div class="card-head"><h2 class="card-title">価格推移（50本換算 箱単価）</h2></div>
          ${lineBlock}
        </div>`;
    }

    const seasonYear = Compute.seasonYear(selDate, State.selectedItem);
    return `
      <h1 class="screen-title">産地分析${seasonYear ? ` <span class="muted" style="font-weight:400">${seasonYear}</span>` : ''}</h1>
      ${selectorCard}
      ${donutCard}
      ${lineCard}
    `;
  },

  calendarHTML(){
    const ym = State.calendarMonth || (State.selectedDate||'').slice(0,7);
    const parts = ym.split('-');
    const y = parseInt(parts[0],10), m = parseInt(parts[1],10);
    if(!y || !m) return '';
    const first = new Date(y, m-1, 1);
    const startWD = first.getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const wds = ['日','月','火','水','木','金','土'];
    const dataDates = Compute.datesWithData(); // 産地データのある日だけ選択可
    const wdColor = (wd)=> wd===0 ? 'cal-sun' : wd===6 ? 'cal-sat' : '';
    let cells = '';
    for(let i=0;i<startWD;i++) cells += `<span class="cal-day empty"></span>`;
    for(let d=1; d<=daysInMonth; d++){
      const wd = new Date(y, m-1, d).getDay();
      const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isSel = iso === State.selectedDate;
      const wc = wdColor(wd);
      if(dataDates.has(iso)){
        cells += `<button type="button" class="cal-day enabled ${wc} ${isSel?'selected':''}" data-action="cal-pick" data-date="${iso}">${d}</button>`;
      } else {
        cells += `<span class="cal-day disabled ${wc}">${d}</span>`;
      }
    }
    const wdRow = wds.map((w,i)=>`<div class="cal-wd ${wdColor(i)}">${w}</div>`).join('');
    return `
      <div class="cal-backdrop" data-action="close-calendar"></div>
      <div class="cal-pop">
        <div class="cal-head">
          <button type="button" data-action="cal-prev" aria-label="前の月">‹</button>
          <span class="cal-title">${y}年${m}月</span>
          <button type="button" data-action="cal-next" aria-label="次の月">›</button>
        </div>
        <div class="cal-grid">${wdRow}${cells}</div>
      </div>`;
  },
  // 自分出荷手入力の日付ピッカー。産地カレンダーと同一スタイルだが、全日付が選択可（出荷日は自由）。
  mineCalendarHTML(){
    const today = new Date();
    const todayYm = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
    const ym = State.mineCalMonth || (State.mineDate||'').slice(0,7) || todayYm;
    const parts = ym.split('-');
    const y = parseInt(parts[0],10), m = parseInt(parts[1],10);
    if(!y || !m) return '';
    const first = new Date(y, m-1, 1);
    const startWD = first.getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const wds = ['日','月','火','水','木','金','土'];
    const wdColor = (wd)=> wd===0 ? 'cal-sun' : wd===6 ? 'cal-sat' : '';
    let cells = '';
    for(let i=0;i<startWD;i++) cells += `<span class="cal-day empty"></span>`;
    for(let d=1; d<=daysInMonth; d++){
      const wd = new Date(y, m-1, d).getDay();
      const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isSel = iso === State.mineDate;
      const wc = wdColor(wd);
      cells += `<button type="button" class="cal-day enabled ${wc} ${isSel?'selected':''}" data-action="mine-cal-pick" data-date="${iso}">${d}</button>`;
    }
    const wdRow = wds.map((w,i)=>`<div class="cal-wd ${wdColor(i)}">${w}</div>`).join('');
    return `
      <div class="cal-backdrop" data-action="close-mine-calendar"></div>
      <div class="cal-pop">
        <div class="cal-head">
          <button type="button" data-action="mine-cal-prev" aria-label="前の月">‹</button>
          <span class="cal-title">${y}年${m}月</span>
          <button type="button" data-action="mine-cal-next" aria-label="次の月">›</button>
        </div>
        <div class="cal-grid">${wdRow}${cells}</div>
      </div>`;
  },

  /* ---------- Screen: 自分の分析 ---------- */
  screenMine(){
    if(Compute.scopedJibun().length===0){
      return `<h1 class="screen-title">自分の分析</h1>` + UI.emptyState('出荷データがまだありません', '自分の出荷をCSVまたは手入力で追加すると、売上を自動集計します。', '取込へ進む', 'import');
    }
    const matched = Compute.matchJibun();
    const sum = Compute.jibunSummary(matched);

    // 今季作付設定の坪（総坪＋品種別坪）。未入力なら坪あたり系は「-」表示。
    const totalTsubo = Compute.scopedSakutsuke().reduce((s,r)=>s+(Number(r.tsubo)||0),0);
    const tsuboByVariety = {};
    Compute.scopedSakutsuke().forEach(r=>{ tsuboByVariety[r.variety]=(tsuboByVariety[r.variety]||0)+(Number(r.tsubo)||0); });

    // 品種→色番号：自分出荷データの出現順に割り当て（最大5色で循環）。マーカーとドーナツで共用。
    const markOrder = [];
    matched.forEach(r=>{ if(r.variety && !markOrder.includes(r.variety)) markOrder.push(r.variety); });
    const markMap = {}; markOrder.forEach((v,i)=>{ markMap[v] = (i%5)+1; });
    // ドーナツ・凡例・品種別内訳の並びは「出荷明細の出現順（日付降順→日内は取込順）」で固定＝金額順で入れ替えない
    const orderSeq = [];
    matched.slice().sort((a,b)=> b.date.localeCompare(a.date)).forEach(r=>{ if(r.variety && !orderSeq.includes(r.variety)) orderSeq.push(r.variety); });
    const varietyRows = sum.varietyRows.slice().sort((a,b)=> orderSeq.indexOf(a.variety) - orderSeq.indexOf(b.variety));
    const cats = {};
    varietyRows.forEach((r)=>{ cats[r.variety] = r.amount; });
    const colorMap = {}; varietyRows.forEach((r)=>{ colorMap[r.variety] = `var(--dn${markMap[r.variety]||1})`; });
    const donutSvg = varietyRows.length ? Charts.donutSVG(cats, sum.total, colorMap, 150, true) : '';
    const varietyLegend = varietyRows.map(r=>{
      return `<div class="legend-item">
        <span class="legend-dot" style="background:${colorMap[r.variety]}"></span>
        <span class="legend-label">${Fmt.esc(r.variety)}</span>
        <span class="legend-val legend-val-strong tnum">${Fmt.yen(r.amount)}</span>
      </div>`;
    }).join('');

    const specText = (r)=> (r.betsuCount>0) ? `別 ${r.betsuCount}本` : App.specToStr(r.grade, r.count);
    // 規格の並び順（2L30→2L50→L→M→別）
    const specOrder = {'2L30':0,'2L50':1,'L':2,'M':3};
    const specRank = (r)=> r.betsuCount>0 ? 99 : (specOrder[App.specToStr(r.grade,r.count)] ?? 50);
    // 日付降順のまま、日付ごとにグループ化（新しい日付が上）
    // 日付は新しい順。同じ日の中は取込順（配列順）のまま＝品種の出現順を崩さない。
    // ※以前は addedAt の降順で並べていたが、取込中のミリ秒差で日内の順序が入れ替わることがあった。
    const sortedShip = matched.slice().sort((a,b)=> b.date.localeCompare(a.date));
    const shipGroups = [];
    sortedShip.forEach(r=>{
      let g = shipGroups.find(x=>x.date===r.date);
      if(!g){ g={date:r.date, rows:[]}; shipGroups.push(g); }
      g.rows.push(r);
    });
    const shipDayCards = shipGroups.map(g=>{
      // 日付内で品種ごとに1枠にまとめる（規格は枠内に明細行として並べる）
      const byVar = [];
      g.rows.forEach(r=>{
        let v = byVar.find(x=>x.variety===r.variety);
        if(!v){ v={variety:r.variety, rows:[], amount:0}; byVar.push(v); }
        v.rows.push(r);
        if(r.matched && !r.pending) v.amount += r.amount; // pendingは金額nullなので売上合計に足さない
      });
      const blocks = byVar.map(v=>{
        v.rows.sort((a,b)=> specRank(a)-specRank(b));
        const specLines = v.rows.map(r=>`
          <div class="sv-spec">
            <div class="sv-spec-main">
              <span class="sv-grade">${specText(r)}</span>
              <span class="sv-boxes tnum">${r.boxQty}箱</span>
            </div>
            ${r.matched && r.pending
              ? `<div class="sv-spec-sub"><span class="badge badge-pending">未確定</span><button class="btn-fill" data-action="fill-price" data-key="${Fmt.esc(r.sanchiKey)}">金額入力</button></div>`
              : r.matched
                ? `<div class="sv-spec-sub"><span>${Fmt.yen(r.boxPrice)}<span class="u">/箱</span></span><span class="sv-dot">・</span><span>${Fmt.yen(r.perStem)}<span class="u">/本</span></span></div>`
                : `<div class="sv-spec-sub"><span class="badge badge-nomatch">未マッチ</span></div>`}
            <button class="sv-del" data-action="delete-mine-row" data-id="${r.id}" aria-label="この規格を削除">${Icon.trash}</button>
          </div>`).join('');
        return `
          <div class="ship-variety-block">
            <div class="sv-head">
              <span class="ship-name mk mk${markMap[v.variety]||1}">${Fmt.esc(v.variety)}</span>
              ${v.amount>0 ? `<span class="ship-amount tnum">${Fmt.yen(v.amount)}</span>` : ''}
            </div>
            <div class="sv-specs">${specLines}</div>
          </div>`;
      }).join('');
      // 見出し用の曜日（土=青/日=赤）＋その日の売上合計（マッチ分）
      const dt = new Date(g.date + 'T00:00:00');
      const wd = dt.getDay();
      const wdName = ['日','月','火','水','木','金','土'][wd];
      const wdCls = wd===0 ? 'cal-sun' : wd===6 ? 'cal-sat' : '';
      const dayTotal = byVar.reduce((s,v)=>s+v.amount, 0);
      const dayBoxes = g.rows.reduce((s,r)=>s+(r.boxQty||0), 0);
      const html = `
        <div class="ship-day-card">
          <div class="ship-date-head">
            <span class="ship-date-md">${Fmt.date(g.date)}</span>
            <span class="ship-date-wd ${wdCls}">(${wdName})</span>
            <span class="ship-date-boxes tnum">${Fmt.num(dayBoxes)}箱</span>
            ${dayTotal>0 ? `<span class="ship-date-total tnum">${Fmt.yen(dayTotal)}</span>` : ''}
          </div>
          ${blocks}
        </div>`;
      return {date:g.date, html, boxes:dayBoxes, total:dayTotal};
    });

    // 月ごとに格納（アコーディオン）。既定は全て閉じた状態＝一覧が長くならない。
    // 開閉は State.shipMonthsOpen に控えてあり、削除などの再描画をまたいでも保たれる。
    const shipMonths = [];
    shipDayCards.forEach(d=>{
      const ym = d.date.slice(0,7);
      let m = shipMonths.find(x=>x.ym===ym);
      if(!m){ m={ym, days:[], boxes:0, total:0}; shipMonths.push(m); }
      m.days.push(d);
      m.boxes += d.boxes;
      m.total += d.total;
    });
    // 一覧が単一年に収まっている間は見出しから年を省く（「8月」）。年をまたぐ時だけ「2026年8月」に戻す。
    // ＝スマホ幅で見出しを1行に収めるため。冗長な年を落とすのが一番効く。
    const shipYears = new Set(shipMonths.map(m=>m.ym.slice(0,4)));
    const singleYear = shipYears.size <= 1;
    const shipRows = shipMonths.map(m=>{
      const [y, mo] = m.ym.split('-');
      const open = State.shipMonthsOpen.includes(m.ym) ? ' open' : '';
      return `
        <details class="collapse ship-month" data-ym="${m.ym}"${open}>
          <summary>
            <span class="sm-title">${singleYear ? '' : `${Number(y)}年`}${Number(mo)}月</span>
            <span class="sm-meta tnum">${m.days.length}日・${Fmt.num(m.boxes)}箱</span>
            ${m.total>0 ? `<span class="sm-total tnum">${Fmt.yen(m.total)}</span>` : ''}
          </summary>
          <div class="stack" style="margin-top:var(--sp3)">${m.days.map(d=>d.html).join('')}</div>
        </details>`;
    }).join('');

    const unmatchedBlock = sum.unmatchedRows.length ? `
      <details class="collapse">
        <summary>未マッチ（${sum.unmatchedRows.length}件）<span class="badge badge-nomatch">合計から除外</span></summary>
        <div class="stack" style="margin-top:var(--sp3)">
          <p class="muted" style="font-size:0.8125rem">産地データに一致する行（別行は同日・同品種の「別」）が見つからない行です。表記ゆれや産地データ未取込の可能性があります。</p>
          ${sum.unmatchedRows.map(r=>`
            <div class="ship-row">
              <div class="ship-main">
                <span class="ship-date tnum">${Fmt.date(r.date)}</span>
                <span class="ship-name">${Fmt.esc(r.variety)}${r.betsuCount>0?' <span class="tag-betsu">別</span>':''}</span>
                <span class="ship-detail">${specText(r)}　箱数${r.boxQty}</span>
              </div>
              <button class="ship-del" data-action="delete-mine-row" data-id="${r.id}" aria-label="この行を削除">${Icon.trash}</button>
            </div>`).join('')}
        </div>
      </details>
    ` : '';

    // 金額未確定（要入力）カード：市況の箱単価が未確定の出荷を一覧。埋め忘れ防止＋その場で金額入力へ。
    const pendingBlock = sum.pendingRows.length ? `
      <div class="card card-pending">
        <div class="card-head"><h2 class="card-title">金額未確定（要入力）<span class="badge badge-pending">${sum.pendingRows.length}件</span></h2></div>
        <p class="muted" style="font-size:0.8125rem">市況の箱単価がまだ「未確定」の出荷です。箱数・本数には算入していますが、売上・平均単価には未反映です。精算書で金額が分かったら入力してください。</p>
        <div class="stack" style="margin-top:var(--sp3)">
          ${sum.pendingRows.map(r=>`
            <div class="ship-row">
              <div class="ship-main">
                <span class="ship-date tnum">${Fmt.date(r.date)}</span>
                <span class="ship-name">${Fmt.esc(r.variety)}${r.betsuCount>0?' <span class="tag-betsu">別</span>':''}</span>
                <span class="ship-detail">${specText(r)}　箱数${r.boxQty}</span>
              </div>
              <button class="btn-fill" data-action="fill-price" data-key="${Fmt.esc(r.sanchiKey)}">金額入力</button>
            </div>`).join('')}
        </div>
      </div>
    ` : '';

    // 作型 未割当カード（両区分を作っている品種の未割当出荷。日付×規格ごとに質問）
    const unassignedGroups = Compute.unassignedAllocGroups();
    const allocBlock = unassignedGroups.length ? `
      <div class="card card-alloc">
        <div class="card-head"><h2 class="card-title">作型 未割当（要割り当て）<span class="badge badge-alloc">${unassignedGroups.length}件</span></h2></div>
        <p class="muted" style="font-size:0.8125rem">新植と据置の両方を作っている品種の出荷です。日付・規格ごとに、どちらから作ったかを割り当ててください。混在は据置の本数を入力。</p>
        <div class="stack" style="margin-top:var(--sp3)">${UI.allocRowsHTML(unassignedGroups)}</div>
      </div>
    ` : '';

    return `
      <h1 class="screen-title">自分の分析</h1>
      <div class="card kpi-card">
        <span class="kpi-label">今シーズン累計 売り立て</span>
        <span class="kpi-value tnum">${Fmt.yen(sum.total)}</span>
        ${sum.avgPerStem!=null ? `<div class="kpi-secondary">
          <span class="kpi-sec-label">平均1本単価</span>
          <span class="kpi-sec-value tnum">${Fmt.yen(sum.avgPerStem)}<small>/本</small></span>
        </div>` : ''}
        <div class="kpi-secondary">
          <span class="kpi-sec-label">坪あたり売上</span>
          <span class="kpi-sec-value tnum">${totalTsubo>0 ? `${Fmt.yen(sum.total/totalTsubo)}<small>/坪</small>` : '-'}</span>
        </div>
        <div class="kpi-sub">
          <span>出荷箱数計 <b class="tnum">${Fmt.num(sum.totalBoxes)}</b>箱</span>
          <span>総本数 <b class="tnum">${Fmt.num(sum.totalStems)}</b>本</span>
        </div>
      </div>
      ${pendingBlock}
      ${allocBlock}
      <div class="card">
        <div class="card-head"><h2 class="card-title">品種別売上内訳</h2></div>
        ${varietyRows.length ? `
        <div class="donut-col">${donutSvg}<div class="legend">${varietyLegend}</div></div>
        <ul class="vm-list">${varietyRows.map(r=>{
          const vt=tsuboByVariety[r.variety]||0;
          const perT=vt>0?Fmt.yen(r.amount/vt):null;
          const mk=markMap[r.variety]||1;
          const category=r.category;
          const isKon=category==='混植';
          // 区分インジケータ（品種名行の右）：混植=色丸「混」（=見開きトグル）／新植・据置=薄い楕円チップ
          const indicator = isKon
            ? `<span class="vm-kon" style="color:var(--dn${mk});background:var(--mk${mk})">混</span>`
            : category==='新植' ? `<span class="plant-cat plant-cat-shin">新植</span>`
            : category==='据置' ? `<span class="plant-cat plant-cat-sue">据置</span>`
            : '';
          // 見出し＝1段目：品種名（1行・末尾は見切れ）＋右に区分。2段目：右詰の金額。下に指標カード。
          const head=`<div class="vm-head">
              <div class="vm-titlerow"><span class="ship-name mk mk${mk}">${Fmt.esc(r.variety)}</span>${indicator}</div>
              <div class="vm-amountrow"><span class="vm-amount tnum">${Fmt.yen(r.amount)}</span></div>
            </div>
            <div class="vm-grid">
              <div class="vm-cell"><span class="vm-label">箱数</span><span class="vm-val">${Fmt.num(r.boxes)}<span class="vm-unit">箱</span></span></div>
              <div class="vm-cell"><span class="vm-label">累計本数</span><span class="vm-val">${Fmt.num(r.stems)}<span class="vm-unit">本</span></span></div>
              <div class="vm-cell"><span class="vm-label">坪売上</span><span class="vm-val${perT?'':' is-empty'}">${perT?`${perT}<span class="vm-unit">/坪</span>`:'-'}</span></div>
              <div class="vm-cell"><span class="vm-label">単価</span><span class="vm-val${r.perStem!=null?'':' is-empty'}">${r.perStem!=null?`${Fmt.yen(r.perStem)}<span class="vm-unit">/本</span>`:'—'}</span></div>
            </div>`;
          if(!isKon){ return `<li class="vm-item"><div class="vm-summary">${head}</div></li>`; }
          // 混植：区分別カード（本数/坪売上/1本単価）
          const sp=r.split, shin=sp.shinshoku, sue=sp.sueoki, un=sp.unassigned;
          const card=(label,cls,s,metrics)=>`<div class="pt-cardrow">
              <span class="plant-cat ${cls}">${label}</span>
              <div class="pt-ccells">
                <div class="vm-cell"><span class="vm-label">本数</span><span class="vm-val">${Fmt.num(Math.round(s.stems))}<span class="vm-unit">本</span></span></div>
                <div class="vm-cell"><span class="vm-label">坪売上</span><span class="vm-val${metrics&&s.perTsubo!=null?'':' is-empty'}">${metrics&&s.perTsubo!=null?`${Fmt.yen(s.perTsubo)}<span class="vm-unit">/坪</span>`:'-'}</span></div>
                <div class="vm-cell"><span class="vm-label">1本単価</span><span class="vm-val${metrics&&s.perStem!=null?'':' is-empty'}">${metrics&&s.perStem!=null?`${Fmt.yen(s.perStem)}<span class="vm-unit">/本</span>`:'-'}</span></div>
              </div>
            </div>`;
          const cards=`<div class="pt-cards">${card('新植','plant-cat-shin',shin,true)}${card('据置','plant-cat-sue',sue,true)}${un.stems>0?card('未割当','plant-cat-kon',un,false):''}</div>`;
          const detail=`${cards}${un.stems>0?`<p class="pt-unassigned">未割当分は下の「未割当」カードから割り当てできます</p>`:''}`;
          return `<li class="vm-item"><details class="vm-details"><summary class="vm-summary">${head}</summary><div class="vm-detail">${detail}</div></details></li>`;
        }).join('')}</ul>` : `<p class="muted">一致した出荷がまだありません。</p>`}
      </div>
      <div class="card">
        <div class="card-head"><h2 class="card-title">出荷明細一覧</h2></div>
        <div class="stack">${shipRows}</div>
        ${unmatchedBlock}
      </div>
    `;
  },

  /* ---------- Screen: 取込 ---------- */
  screenImport(){
    const zeroData = Store.sanchi.size===0 && Store.jibun.length===0;
    const onboard = zeroData ? `
      <div class="card">
        <h2 class="card-title">はじめに（3ステップ）</h2>
        <div class="stack">
          <div class="onboard-step"><span class="onboard-num">1</span><div class="onboard-text"><b>産地CSVを取込む</b><span>市場から届いた産地全体データ（日付,品目,品種,規格,本数,箱数量,箱単価）</span></div></div>
          <div class="onboard-step"><span class="onboard-num">2</span><div class="onboard-text"><b>自分の出荷を追加</b><span>CSV取込、または手入力フォームで1件ずつ追加</span></div></div>
          <div class="onboard-step"><span class="onboard-num">3</span><div class="onboard-text"><b>分析タブで確認</b><span>「産地」「自分」タブで規格構成・価格推移・売上が見られます</span></div></div>
        </div>
      </div>` : '';

    // 手入力の品種プルダウン＝今季作付設定で登録した品種（＋末尾に「その他（自由入力）」）
    const mineVarieties = Array.from(new Set(Compute.scopedSakutsuke().map(r=>r.variety).filter(Boolean)));
    const selMineV = State.mineVariety; // 直前に選んだ品種を復元（連続入力のため）
    const varietyOpts = mineVarieties.map(v=>`<option value="${Fmt.esc(v)}" ${v===selMineV?'selected':''}>${Fmt.esc(v)}</option>`).join('')
      + `<option value="__other__">その他（自由入力）</option>`;

    // ---- 今季作付設定 ----
    const fmtTsubo = (n)=> (Number(n)||0).toLocaleString('ja-JP');
    // 品種名の入力補助（産地・自分の既存品種をユニーク化）
    const varietySuggest = Array.from(new Set([
      ...Array.from(Compute.scopedSanchi().values()).map(r=>r.variety),
      ...Compute.scopedJibun().map(r=>r.variety)
    ].filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ja'));
    const varietyDatalist = `<datalist id="variety-suggest">${varietySuggest.map(v=>`<option value="${Fmt.esc(v)}"></option>`).join('')}</datalist>`;

    // 編集用の登録済み行（追加順）
    const sakuEditRows = Compute.scopedSakutsuke().map(r=>`
      <div class="ship-row">
        <div class="ship-main">
          <span class="ship-name">${Fmt.esc(r.variety)} <span class="tag-betsu">${Fmt.esc(r.type)}</span></span>
          <span class="ship-detail">${fmtTsubo(r.tsubo)}坪</span>
        </div>
        <button class="ship-del" data-action="delete-sakutsuke-row" data-id="${r.id}" aria-label="削除">${Icon.trash}</button>
      </div>`).join('');

    // 内容カード用：品種ごとに新植/据置を集計（表示は品種単位でまとめる）
    const sakuByVariety = [];
    Compute.scopedSakutsuke().forEach(r=>{
      let g = sakuByVariety.find(x=>x.variety===r.variety);
      if(!g){ g = {variety:r.variety, shinshoku:0, sueoki:0}; sakuByVariety.push(g); }
      if(r.type==='据置') g.sueoki += (Number(r.tsubo)||0); else g.shinshoku += (Number(r.tsubo)||0);
    });
    const sakuTotal = sakuByVariety.reduce((s,g)=>s + g.shinshoku + g.sueoki, 0);
    const sakuContentRows = sakuByVariety.map(g=>{
      const parts = [];
      if(g.shinshoku>0) parts.push(`新植 ${fmtTsubo(g.shinshoku)}坪`);
      if(g.sueoki>0) parts.push(`据置 ${fmtTsubo(g.sueoki)}坪`);
      const detail = parts.join(' ・ ') || '—';
      return `
      <div class="ship-row">
        <div class="ship-main">
          <span class="ship-name">${Fmt.esc(g.variety)}</span>
          <span class="ship-detail">${detail}</span>
        </div>
        <div class="ship-amount tnum">計 ${fmtTsubo(g.shinshoku + g.sueoki)}坪</div>
      </div>`;
    }).join('');

    return `
      <h1 class="screen-title">データ取込</h1>
      ${onboard}
      <div class="card">
        <div class="card-head"><h2 class="card-title">産地データCSV</h2></div>
        <p class="card-caption">ヘッダ: 日付,品目,品種,規格,本数,箱数量,箱単価</p>
        <label class="dropzone" for="sanchi-file-input">
          ${Icon.upload}
          <strong>タップしてCSVを選択</strong>
        </label>
        <input type="file" id="sanchi-file-input" accept=".csv,text/csv" data-action="import-sanchi-file">
        <div class="paste-row">
          <textarea class="csv-text csv-paste" id="sanchi-paste" placeholder="またはCSVを貼り付け（ヘッダ行を含めてOK）"></textarea>
          <button type="button" class="btn btn-secondary btn-sm" data-action="import-sanchi-paste">貼り付けた内容を取込</button>
        </div>
        <div id="sanchi-import-summary">${State.sanchiImportSummary || ''}</div>
      </div>
      <div class="card">
        <div class="card-head"><h2 class="card-title">自分の出荷</h2></div>
        <div class="segmented" role="tablist">
          <button role="tab" aria-selected="${State.mineMode==='csv'}" data-action="toggle-mine-mode" data-mode="csv">CSVで取込</button>
          <button role="tab" aria-selected="${State.mineMode==='manual'}" data-action="toggle-mine-mode" data-mode="manual">手入力で追加</button>
        </div>
        <div id="mine-mode-csv-panel">
          <p class="card-caption">ヘッダ: 出荷日,品種名,規格,箱数,別本数（規格=2L30/2L50/L/M。別扱いの箱は別本数に本数を入れる）</p>
          <label class="dropzone" for="mine-file-input">
            ${Icon.upload}
            <strong>タップしてCSVを選択</strong>
          </label>
          <input type="file" id="mine-file-input" accept=".csv,text/csv" data-action="import-mine-file">
          <div class="paste-row">
            <textarea class="csv-text csv-paste" id="mine-paste" placeholder="またはCSVを貼り付け（ヘッダ行を含めてOK）"></textarea>
            <button type="button" class="btn btn-secondary btn-sm" data-action="import-mine-paste">貼り付けた内容を取込</button>
          </div>
          <div id="mine-import-summary">${State.mineImportSummary || ''}</div>
        </div>
        <form id="mine-mode-manual-panel" data-action="submit-manual" class="stack">
          <div class="field date-field">日付
            <button type="button" class="date-trigger" id="mine-date-trigger" data-action="toggle-mine-calendar">
              <span id="mine-date-label">${State.mineDate ? Fmt.esc(Fmt.mmdd(State.mineDate)) : '日付を選択'}</span><span class="caret">▾</span>
            </button>
            <div id="mine-cal-mount"></div>
          </div>
          <input type="hidden" name="date" id="mine-date-value" value="${State.mineDate||''}">
          <label class="field">品種
            <div class="select-wrap"><select name="variety" required>${varietyOpts}</select></div>
          </label>
          <div id="variety-other-wrap" class="${mineVarieties.length ? 'hidden' : ''}">
            <label class="field">品種名（自由入力）
              <input type="text" name="varietyOther" list="variety-suggest" placeholder="例: シャローム" autocomplete="off">
            </label>
            ${varietyDatalist}
          </div>
          <label class="field">規格
            <div class="select-wrap"><select name="spec" required>
              <option value="2L30">2L30</option>
              <option value="2L50">2L50</option>
              <option value="L">L</option>
              <option value="M">M</option>
              <option value="別">別</option>
            </select></div>
          </label>
          <div id="betsu-wrap" class="hidden"><label class="field">別本数（1箱あたりの本数）<input type="number" name="betsuCount" inputmode="numeric" min="1" placeholder="例: 30"></label></div>
          <label class="field">箱数
            <div class="stepper">
              <button type="button" data-action="step-boxqty" data-dir="-1" aria-label="減らす">−</button>
              <input type="number" name="boxQty" value="1" min="1" inputmode="numeric">
              <button type="button" data-action="step-boxqty" data-dir="1" aria-label="増やす">＋</button>
            </div>
          </label>
          <button type="submit" class="btn btn-primary">追加する</button>
        </form>
      </div>
      <div class="card">
        <div class="card-head"><h2 class="card-title">${Fmt.esc(String(State.selectedYear))}年の作付内容<span class="card-sub">${Fmt.esc(String(State.selectedItem))}</span></h2></div>
        ${(()=>{ const rng = Compute.seasonRange(State.selectedYear, State.selectedItem);
          // 暦年と違うシーズン（年をまたぐ品目）のときだけ、何月から何月までを指すのかを明示する
          return rng ? `<p class="card-caption" style="margin-bottom:var(--sp2)">この年度が指す期間: <b>${Fmt.esc(rng)}</b></p>` : ''; })()}
        ${sakuByVariety.length ? `
          <div class="stack">${sakuContentRows}</div>
          <div class="row-between" style="margin-top:var(--sp3)">
            <span class="card-caption">合計作付面積</span>
            <span class="tnum" style="font-size:0.9375rem;font-weight:600">${fmtTsubo(sakuTotal)}坪</span>
          </div>
        ` : '<p class="muted">この年度・品目の登録はまだありません。下の「作付設定」から追加してください。</p>'}
      </div>
      <details class="card collapse">
        <summary style="font-size:1rem"><span>${Fmt.esc(String(State.selectedYear))}年の作付設定（${Fmt.esc(String(State.selectedItem))}）</span></summary>
        <p class="card-caption" style="margin-top:var(--sp2)">この年度・この品目の品種と作付面積（坪）を登録します。<b>作付は年度ごと</b>なので、年度を切り替えると別の内容になります（新しい年度は空から入力）。同じ品種で新植分・据置分が両方ある場合は、それぞれ1行ずつ登録してください。</p>
        <form id="sakutsuke-form" data-action="submit-sakutsuke" class="stack">
          <label class="field">品種
            <input type="text" name="variety" placeholder="例: バンコクスプリーム" autocomplete="off" required>
          </label>
          <label class="field">区分
            <div class="select-wrap"><select name="type" required>
              <option value="新植">新植</option>
              <option value="据置">据置</option>
            </select></div>
          </label>
          <label class="field">面積（坪）
            <input type="number" name="tsubo" inputmode="decimal" min="0" step="0.1" placeholder="例: 30" required>
          </label>
          <button type="submit" class="btn btn-primary">作付を追加</button>
        </form>
        ${Compute.scopedSakutsuke().length ? `<div class="stack" style="margin-top:var(--sp3)">${sakuEditRows}</div>` : ''}
      </details>
    `;
  },

  /* ---------- Screen: 保存 ---------- */
  screenBackup(){
    const last = Store.meta.lastBackupAt ? new Date(Store.meta.lastBackupAt).toLocaleString('ja-JP') : '未実施';
    return `
      <div class="title-row">
        <h1 class="screen-title">バックアップ</h1>
        <span class="data-chip">産地${Store.sanchi.size}件・自分${Store.jibun.length}件</span>
      </div>
      ${!Store.available ? `<div class="err-box">この端末では自動保存(localStorage)が使えません。作業のたびに書き出しを行ってください。</div>` : ''}
      <div class="card">
        <div class="row-between">
          <span class="card-caption">最終バックアップ</span>
          <span class="tnum" style="font-size:0.875rem">${last}</span>
        </div>
        <div style="margin-top:var(--sp2)">
          ${Store.dirtyCount>0 ? `<span class="badge badge-unmatched">未バックアップの変更 ${Store.dirtyCount}件</span>` : `<span class="badge badge-matched">バックアップ済み</span>`}
        </div>
        <p class="card-caption" style="margin-top:var(--sp2)">見出し横の件数は全年度・全品目の合計です（表示中: ${Fmt.esc(String(State.selectedYear))}年 ${Fmt.esc(String(State.selectedItem))} は 産地${Compute.scopedSanchi().size}件・自分${Compute.scopedJibun().length}件）。</p>
      </div>
      <div class="card stack">
        <h2 class="card-title">書き出し / 読み込み</h2>
        <button class="btn btn-primary" data-action="export-backup">バックアップ書き出し（JSON・全年度）</button>
        <button class="btn btn-secondary" data-action="export-csv">CSVで書き出し（表示中の年度・品目）</button>
        <label class="btn btn-ghost" for="backup-file-input">読み込み（バックアップJSONから全復元）</label>
        <input type="file" id="backup-file-input" accept=".json,application/json" data-action="import-backup-file">
        <p class="card-caption">JSONは<b>全年度・全品目</b>を1ファイルに収める完全バックアップ（復元用）。読み込むと現在のデータは全て置き換わるため、常に全部を書き出します。CSVは<b>表示中の年度・品目だけ</b>を「産地」「自分」の2ファイルで書き出します（表計算での閲覧・再取込用）。</p>
      </div>
      <details class="card collapse">
        <summary style="font-size:1rem;color:var(--danger-text)"><span>危険ゾーン</span></summary>
        <button class="btn btn-danger" data-action="open-reset-modal" style="margin-top:var(--sp3)">全消去（新シーズン開始）</button>
        <p class="card-caption">産地データ・自分の出荷データを両方とも完全に削除します。事前にバックアップを書き出すことをおすすめします。</p>
      </details>
      <details class="card collapse">
        <summary style="font-size:1rem"><span>保存の仕組み</span></summary>
        <div class="save-how" style="margin-top:var(--sp3)">
          <p><b>データはこの端末の中だけにあります。</b>入力・取込のたびに、ブラウザの保存領域（localStorage・キー <code>curcuma.v1</code>）へ自動保存されます。サーバーには何も送っていません。</p>
          <p><b>アプリを更新してもデータは消えません。</b>ホーム画面のアプリ（GitHub Pages のPWA）は、プログラムとデータが別物です。新しい版に入れ替わっても、保存済みの産地・出荷データはそのまま残ります。</p>
          <p><b>端末をまたいだ共有はしません。</b>iPhoneとPCは別々の保存領域です。同じ内容を見たいときは、JSONを書き出して、もう一方で読み込んでください。</p>
          <p><b>消えることもあります。</b>ブラウザの「サイトデータを削除」、プライベートモード、端末の機種変更・初期化では失われます。だから <b>書き出したバックアップJSONが正本</b> です。区切りのいいところで書き出してください。</p>
          <p class="muted">保存に失敗したとき（容量超過など）と、読み込み時にデータが壊れていたときは、画面上部に警告を出します。壊れたデータは消さずに <code>curcuma.v1.corrupt</code> へ退避するので、黙って全部なくなることはありません。</p>
        </div>
      </details>
      <p class="app-build">版 ${APP_BUILD}　データ形式 v${SCHEMA_VERSION}</p>
    `;
  },

  emptyState(title, body, ctaLabel, ctaTab){
    return `<div class="card empty-state">
      ${Icon.import}
      <p style="font-weight:600;color:var(--ink)">${Fmt.esc(title)}</p>
      <p>${Fmt.esc(body)}</p>
      <div class="btn-row" style="justify-content:center; flex-wrap:wrap">
        <button class="btn btn-primary" style="width:auto" data-action="switch-tab" data-tab="${ctaTab}">${Fmt.esc(ctaLabel)}</button>
      </div>
    </div>`;
  },

  toast(msg, opts){
    opts = opts || {};
    const region = document.getElementById('toast-region');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span>${Fmt.esc(msg)}</span>${opts.actionLabel ? `<button data-toast-action>${Fmt.esc(opts.actionLabel)}</button>` : ''}`;
    region.appendChild(el);
    if(opts.actionLabel && opts.onAction){
      el.querySelector('[data-toast-action]').addEventListener('click', ()=>{
        opts.onAction();
        el.remove();
      });
    }
    setTimeout(()=>{ el.remove(); }, opts.duration || 4000);
  },

  modal(title, bodyHtml, opts){
    opts = opts || {};
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-sheet">
          <button class="modal-close" id="modal-x-btn" aria-label="閉じる">×</button>
          <h2 class="modal-title">${Fmt.esc(title)}</h2>
          <div class="modal-body">${bodyHtml}</div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="modal-cancel-btn">キャンセル</button>
            <button class="btn ${opts.danger?'btn-danger':'btn-primary'}" id="modal-confirm-btn">${Fmt.esc(opts.confirmLabel||'確認')}</button>
          </div>
        </div>
      </div>`;
    const backdrop = root.querySelector('.modal-backdrop');
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) UI.closeModal(); });
    root.querySelector('#modal-x-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-cancel-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-confirm-btn').addEventListener('click', ()=>{
      if(opts.onConfirm) opts.onConfirm();
      UI.closeModal();
    });
  },
  closeModal(){
    document.getElementById('modal-root').innerHTML = '';
  },
  csvExportModal(sections){
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-sheet">
          <button class="modal-close" id="modal-x-btn" aria-label="閉じる">×</button>
          <h2 class="modal-title">CSVで書き出し</h2>
          <div class="modal-body"><b>ダウンロード</b>を押すと保存の確認が出ます。使えない環境では、テキストを<b>コピー</b>して表計算ソフトに貼り付けてください。</div>
          ${sections.map((s,i)=>`
            <div class="stack" style="gap:var(--sp2)">
              <div class="row-between">
                <strong>${Fmt.esc(s.name)}（${s.rows}行）</strong>
                <div class="btn-row" style="width:auto; flex:0 0 auto">
                  <button class="btn btn-sm btn-secondary" data-csv-copy="${i}">コピー</button>
                  <button class="btn btn-sm btn-ghost" data-csv-dl="${i}">ダウンロード</button>
                </div>
              </div>
              <textarea class="csv-text" id="csv-text-${i}" readonly>${Fmt.esc(s.text)}</textarea>
            </div>`).join('')}
          <div class="modal-status" id="csv-status"></div>
          <div class="btn-row"><button class="btn btn-ghost" id="modal-cancel-btn">閉じる</button></div>
        </div>
      </div>`;
    const backdrop = root.querySelector('.modal-backdrop');
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) UI.closeModal(); });
    root.querySelector('#modal-x-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-cancel-btn').addEventListener('click', ()=>UI.closeModal());
    const status = root.querySelector('#csv-status');
    const setStatus = (msg, cls)=>{ status.textContent = msg; status.className = 'modal-status ' + (cls||'ok'); };
    sections.forEach((s,i)=>{
      root.querySelector(`[data-csv-dl="${i}"]`).addEventListener('click', async (e)=>{
        const btn = e.currentTarget;
        btn.disabled = true;
        setStatus('保存を確認しています…');
        const res = await App.saveFile(s.filename, s.text, {
          bom:true, mime:'text/csv;charset=utf-8',
          altName: s.filename.replace(/\.csv$/i, '.txt') // csv不可の環境では.txtで保存
        });
        btn.disabled = false;
        if(res.ok){
          setStatus(res.savedAs
            ? `⤓ 「${s.name}」を ${res.savedAs} として保存しました（拡張子を .csv に変えるとExcelで開けます）`
            : `⤓ 「${s.name}」を保存しました（保存先をご確認ください）`);
          UI.toast('保存しました');
        } else {
          setStatus(App.saveErrorMessage(res.code), 'warn');
        }
      });
      root.querySelector(`[data-csv-copy="${i}"]`).addEventListener('click', async ()=>{
        const ta = root.querySelector(`#csv-text-${i}`);
        ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try{ await navigator.clipboard.writeText(s.text); ok = true; }
        catch(_){ try{ ok = document.execCommand('copy'); }catch(__){ ok = false; } }
        if(ok){ setStatus(`✓ 「${s.name}」をコピーしました。表計算ソフトに貼り付けてください`); UI.toast('コピーしました'); }
        else{ setStatus('全選択しました。Ctrl+C（長押し→コピー）で取得してください', 'warn'); }
      });
    });
  },

  backupExportModal(text, filename){
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-sheet">
          <button class="modal-close" id="modal-x-btn" aria-label="閉じる">×</button>
          <h2 class="modal-title">バックアップ書き出し（JSON・完全）</h2>

            <textarea class="csv-text" id="backup-text" readonly>${Fmt.esc(text)}</textarea>

  showLineDetail(name, infoHtml, color){
    const detail = document.getElementById('line-detail');
    if(!detail) return;
