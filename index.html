/* ============================== UI ============================== */
// 品種を色分けする際の系列色（将来5品種まで対応）
const SERIES_COLORS = ['var(--chart-blue)','var(--accent)','var(--warn)','var(--primary)','var(--ink-muted)'];

const UI = {
  // テーマは light / dark の2状態のみ。保存が無い（または旧 'auto'）なら、その場でOSの設定を見て
  // どちらかに確定させる＝以後は必ず1タップで切り替わる（3状態巡回だとダークまで最大3タップ必要だった）。
  themeMode(){
    const saved = localStorage.getItem('curcuma.theme');
    if(saved==='light' || saved==='dark') return saved;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  },
  setThemeMode(mode){
    try{ localStorage.setItem('curcuma.theme', mode); }catch(e){}
    UI.applyTheme();
  },
  applyTheme(){
    const mode = UI.themeMode();
    document.documentElement.setAttribute('data-theme', mode);
    const btn = document.getElementById('theme-btn');
    if(btn){
      // アイコンは「今の状態」ではなく「押した先」を出す＝何が起きるかが分かる
      btn.innerHTML = mode==='dark' ? Icon.sun : Icon.moon;
      btn.setAttribute('aria-label', mode==='dark' ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
    }
    // PWAのステータスバー色。prefers-color-scheme のメタはOSの設定にしか反応せず、
    // アプリ内でダークにしても端末がライトだと上端だけ明るいまま残るため、実効テーマで書き換える。
    let meta = document.getElementById('theme-color-meta');
    if(!meta){ // 生成前の素の curcuma-dashboard.html を直接開いた時のための保険
      meta = document.createElement('meta'); meta.id = 'theme-color-meta'; meta.name = 'theme-color';
      document.head.appendChild(meta);
    }
    meta.setAttribute('content', mode==='dark' ? '#10130F' : '#F6F8F4');
  },
  cycleTheme(){
    UI.setThemeMode(UI.themeMode()==='dark' ? 'light' : 'dark');
  },

  // 年度・品目の初期値を決める（起動時と、選択中の値が消えた時の立て直し）。品目を先に決めてから年度を決める。
  ensureScope(){
    const items = Store.itemNames();
    if(!State.selectedItem || !items.includes(State.selectedItem)){
      // 起動時は前回最後に開いていた品目に戻す（夏はクルクマ・冬はスイピ、と季節で分かれる使い方のため）。
      // 覚え書きが無い／その品目がもう無いときだけ先頭に落とす。
      const last = Store.lastItem();
      State.selectedItem = (last && items.includes(last)) ? last : items[0];
    }
    const years = Store.years();
    if(!State.selectedYear || !years.includes(String(State.selectedYear))){
      // 既定は「その品目のデータがある最新年度」。今年を既定にすると、年が明けた直後に
      // 空の年度が開いて全部消えたように見えるため、実データのある年を優先する。
      const withData = new Set();
      const add = (r)=>{ if((r.item||DEFAULT_ITEM)===State.selectedItem){ const y=Compute.seasonYear(r.date, State.selectedItem); if(y) withData.add(y); } };
      Store.sanchi.forEach(add);
      Store.jibun.forEach(add);
      // 品目全体データしか入っていない年度も「データのある年度」に数える。
      // 入れないと、その資料だけ取り込んだ直後に空の年度が開いてグラフが出ない。
      Store.zentai.forEach(add);
      State.selectedYear = Array.from(withData).sort().pop() || Store.currentYear();
    }
  },
  renderAppBar(){
    UI.ensureScope();
    // 選択肢の中身が変わった時だけ作り直す。毎描画で innerHTML を差し替えると、
    // フォーカスが載ったままの select の子ノードを全消去することになり、
    // フォーカスとドロップダウンがリセットされて、そのたびに再フォーカス＝
    // ページのスクロールが起きていた。値だけ変わった時は value の代入で足りる。
    const syncSelect = (el, values, selected, label)=>{
      if(!el) return;
      const sig = values.join('\n');
      if(el.dataset.sig !== sig){
        el.innerHTML = values.map(v=>`<option value="${Fmt.esc(v)}">${Fmt.esc(label ? label(v) : v)}</option>`).join('');
        el.dataset.sig = sig;
      }
      const want = String(selected == null ? '' : selected);
      if(el.value !== want) el.value = want;
    };
    syncSelect(document.getElementById('item-select'), Store.itemNames(), State.selectedItem, null);
    // 見えている品目名はこのラベル（<select> は透明。理由は #item-select のCSSコメント）
    const itemLabel = document.getElementById('item-select-label');
    if(itemLabel) itemLabel.textContent = State.selectedItem || '';
    UI.renderYearBar();
    const region = document.getElementById('storage-banner-region');
    if(Store.loadError){
      region.innerHTML = `<div class="storage-banner">⚠ 前回の保存データを読み込めませんでした（破損の可能性）。壊れたデータは退避しました。「保存」タブのバックアップから復元してください。</div>`;
    } else if(!Store.available){
      region.innerHTML = `<div class="storage-banner">この端末では自動保存が効きません。作業内容は「保存」タブから都度バックアップしてください。</div>`;
    } else if(Store.saveError){
      region.innerHTML = `<div class="storage-banner">⚠ 自動保存に失敗しています（端末の容量オーバーの可能性）。「保存」タブからバックアップを書き出してください。</div>`;
    } else {
      region.innerHTML = '';
    }
  },

  /* ---------- 年度バー（アプリバー2段目） ----------
     年度は品目にぶら下がっている（選べる年度が品目ごとに違う）ので、品目の下の段に置く。
     取込・保存タブは特定の年度を指さないので、そこでは出さない。
     並びは古い年度が左・新しいのが右（時間軸と同じ向き）。Store.years() は新しい順なので反転する。 */
  renderYearBar(){
    const bar = document.getElementById('year-bar');
    if(!bar) return;
    const show = UI.yearScoped(State.tab);
    if(!show){
      // 取込・保存タブ。年度と文字だけを消し、段そのものは残す（高さは CSS の min-height）。
      // 高さごと消すとタブを行き来するたびに画面が上下に跳ねる。
      if(bar.dataset.shown !== '0'){ bar.innerHTML = ''; bar.dataset.sig = ''; bar.dataset.shown = '0'; }
      return;
    }
    // 中身が空の間は幅を測っても意味が無いので、戻した1回目は動かさずに置き直す。
    const wasHidden = bar.dataset.shown !== '1';
    bar.dataset.shown = '1';
    const years = Store.years().slice().reverse();
    const sig = years.join('\n');
    let rebuilt = false;
    if(bar.dataset.sig !== sig){
      bar.innerHTML = `<div class="year-track" id="year-track">`
        + years.map(y=>`<button type="button" class="year-item" role="tab" aria-selected="false" data-action="pick-year" data-year="${Fmt.esc(y)}">${Fmt.esc(y)}年</button>`).join('')
        + `</div>`;
      UI._yearOffset = null;   // 中身が変わったので、位置は測り直す
      bar.dataset.sig = sig;
      rebuilt = true;
    }
    UI.paintYearMark(String(State.selectedYear));
    // バー自身のスクロールで選ばれた時は、位置はもうスナップで合っているので触らない。
    // 触ると自分のスクロールと重なって動きが二重になる。
    if(UI._yearFromBar){ UI._yearFromBar = false; return; }
    const instant = rebuilt || wasHidden || bar.dataset.placed !== '1';
    UI.centerYear(String(State.selectedYear), !instant);
    bar.dataset.placed = '1';
  },
  // 品目と年度の両方にかかる画面か。取込・保存はアプリ全体の道具なので年度を指さない。
  yearScoped(tab){ return tab === 'sanchi' || tab === 'mine'; },
  // 下線と色だけを付け替える（画面は描き直さない）。指で動かしている最中も毎回呼ぶ。
  paintYearMark(y){
    const bar = document.getElementById('year-bar');
    if(!bar) return;
    bar.querySelectorAll('.year-item').forEach(el=>{
      const on = el.dataset.year === String(y);
      el.classList.toggle('is-on', on);
      el.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  },
  yearItems(bar){ const a = []; (bar||document).querySelectorAll('.year-item').forEach(n=>a.push(n)); return a; },
  /* 年度バーの寸法。年度は必ず4桁なので幅は全部同じ＝計算で位置を出せる。
     取れない時（まだ中身が無い等）は count 0 を返す。 */
  yearMetrics(){
    const bar = document.getElementById('year-bar');
    const items = bar ? UI.yearItems(bar) : [];
    return {bar, items, count: items.length,
            w: (items[0] && items[0].offsetWidth) || 96,
            barW: (bar && bar.clientWidth) || 0};
  },
  yearIndexOf(y){ return UI.yearItems().findIndex(n=>n.dataset.year === String(y)); },
  // i番目を中央に置くための、帯のずらし量
  yearOffsetFor(i){ const m = UI.yearMetrics(); return m.barW/2 - (i*m.w + m.w/2); },
  // いまのずらし量だと、中央に来ているのは何番目か
  yearIndexAt(offset){
    const m = UI.yearMetrics();
    if(!m.count) return -1;
    const i = Math.round((m.barW/2 - offset - m.w/2) / m.w);
    return Math.max(0, Math.min(m.count-1, i));
  },
  yearClampOffset(offset){
    const m = UI.yearMetrics();
    if(!m.count) return offset;
    const min = UI.yearOffsetFor(m.count-1), max = UI.yearOffsetFor(0);
    return Math.max(min, Math.min(max, offset));
  },
  // 帯を動かす。animate は CSS の transition に任せる（毎コマ自前で描かない）。
  setYearOffset(offset, animate){
    const track = document.getElementById('year-track');
    if(!track) return;
    track.classList.toggle('is-animating', !!animate);
    track.style.transform = `translateX(${Math.round(offset)}px)`;
    UI._yearOffset = offset;
  },
  centerYear(y, animate){
    const i = UI.yearIndexOf(y);
    if(i < 0) return;
    UI.setYearOffset(UI.yearOffsetFor(i), !!animate);
  },
  /* 指を離した時にどの年度で止めるか。ここが操作の決まりの本体（ユーザー指定）。
       ・素早く払った → 強さに関わらず【隣ひとつ】。行き過ぎてから戻る動きは見せない。
       ・ゆっくり動かした → 指を止めた場所そのまま。何コマでも動ける。
     純粋な計算なので node のテストから直接呼べる（tests/scope.js が見張る）。
     velocity は px/ms。指を左へ動かす＝負＝新しい年度側（右）へ進む。 */
  yearReleaseTarget(startIdx, nearIdx, velocity, count){
    if(!count) return startIdx;
    const FLICK = 0.4;
    const t = Math.abs(velocity) > FLICK ? startIdx + (velocity < 0 ? 1 : -1) : nearIdx;
    return Math.max(0, Math.min(count-1, t));
  },
  /* 指の動きをこちらで受け取る。ブラウザ任せの横スクロールをやめた理由は、
     勢いを止められないから＝強く払うと2つ3つ流れてしまい、あとから引き戻すしかなく、
     「行って戻る」動きが見えてしまう。自分で受ければ、払いは最初から隣で止まる。
     リスナーはバー本体に1回だけ付ける（中身を作り直しても本体は残る）。 */
  wireYearBar(){
    const bar = document.getElementById('year-bar');
    if(!bar || bar.dataset.wired === '1') return;
    bar.dataset.wired = '1';
    let dragging = false, moved = false, startX = 0, startOffset = 0, startIdx = 0,
        lastX = 0, lastT = 0, vel = 0;
    const now = (e)=> (e && e.timeStamp) || Date.now();
    const onDown = (e)=>{
      const m = UI.yearMetrics();
      if(!m.count) return;
      dragging = true; moved = false; vel = 0;
      startX = lastX = e.clientX; lastT = now(e);
      startOffset = (UI._yearOffset == null) ? UI.yearOffsetFor(Math.max(0, UI.yearIndexOf(State.selectedYear))) : UI._yearOffset;
      startIdx = UI.yearIndexAt(startOffset);
      const track = document.getElementById('year-track');
      if(track) track.classList.remove('is-animating');
      // 指がバーの外へ出ても操作を続ける（楽天カードの年月バーと同じ感触）
      try{ bar.setPointerCapture(e.pointerId); }catch(_){}
    };
    const onMove = (e)=>{
      if(!dragging) return;
      const x = e.clientX, t = now(e);
      if(Math.abs(x - startX) > 3) moved = true;
      if(t > lastT){ vel = (x - lastX) / (t - lastT); lastT = t; lastX = x; }
      const off = UI.yearClampOffset(startOffset + (x - startX));
      UI.setYearOffset(off, false);
      // 下線は動かすが、まだ決めない。決まるのは指を離した時だけ。
      const it = UI.yearItems(bar)[UI.yearIndexAt(off)];
      if(it) UI.paintYearMark(it.dataset.year);
    };
    const onUp = (e)=>{
      if(!dragging) return;
      dragging = false;
      try{ bar.releasePointerCapture(e.pointerId); }catch(_){}
      // 動かしていなければタップ。年度を決めるのは click 側（pick-year）に任せる。
      if(!moved){ UI.paintYearMark(String(State.selectedYear)); return; }
      const m = UI.yearMetrics();
      const target = UI.yearReleaseTarget(startIdx, UI.yearIndexAt(UI._yearOffset), vel, m.count);
      UI.setYearOffset(UI.yearOffsetFor(target), true);
      const y = m.items[target] && m.items[target].dataset.year;
      if(!y) return;
      UI.paintYearMark(y);
      if(y !== String(State.selectedYear)){
        UI._yearFromBar = true;   // 位置はもう合わせたので、描き直しで動かさない
        App.applyScopeChange(()=>{ State.selectedYear = y; });
      }
    };
    /* 操作が横から打ち切られた時は「決めずに元へ戻す」。決めてしまうと、指はまだ
       置いたままなのに勝手に年度が変わったように見える。 */
    const onCancel = ()=>{
      if(!dragging) return;
      dragging = false;
      UI.centerYear(String(State.selectedYear), true);
      UI.paintYearMark(String(State.selectedYear));
    };
    bar.addEventListener('pointerdown', onDown);
    bar.addEventListener('pointermove', onMove);
    bar.addEventListener('pointerup', onUp);
    bar.addEventListener('pointercancel', onCancel);
    /* パソコンの横スクロール（トラックパッドの2本指・横ホイール）。
       指と同じ決まりに揃えて、ひと操作につき隣ひとつだけ動かす。 */
    let wheelLock = false;
    bar.addEventListener('wheel', (e)=>{
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : 0;
      if(!d) return;
      e.preventDefault();
      if(wheelLock) return;
      wheelLock = true;
      setTimeout(()=>{ wheelLock = false; }, 280);
      UI.stepYear(d > 0 ? 1 : -1);
    }, {passive:false});
  },
  /* 一番上でさらに上へ引いた時、中身だけを少し伸ばす（上限 TOP_BOUNCE_MAX ＝約3mm）。
     ブラウザ標準の大きな伸びは overscroll-behavior で止めてあるので、ここが唯一の伸び。
     指を離すと CSS の transition でなめらかに戻る。
     ⚠ アプリバー・タブバー・横スクロールするグラフの上から始まった指の動きは対象外
     （年度バーの払いを縦の伸びと取り違えないため）。 */
  setTopBounce(px, animate){
    const main = document.getElementById('main');
    if(!main) return;
    main.classList.toggle('is-bouncing', !!animate);
    main.style.transform = px ? `translateY(${px}px)` : '';
  },
  bindTopBounce(){
    const MAX = 18, RESIST = 0.4;
    let startY = null, active = false;
    const stop = (animate)=>{ if(active){ UI.setTopBounce(0, animate); active = false; } startY = null; };
    document.addEventListener('touchstart', (e)=>{
      startY = null; active = false;
      if(!e.touches || e.touches.length !== 1) return;
      const t = e.target;
      if(t && t.closest && t.closest('#appbar, #tabbar, #modal-root, .chart-scroll')) return;
      if(window.scrollY > 0) return;
      startY = e.touches[0].clientY;
    }, {passive:true});
    document.addEventListener('touchmove', (e)=>{
      if(startY === null || !e.touches || e.touches.length !== 1) return;
      if(window.scrollY > 0){ stop(false); return; }
      const dy = e.touches[0].clientY - startY;
      if(dy <= 0){ if(active) UI.setTopBounce(0, false); active = false; return; }
      active = true;
      // 引くほど重くする。指の動きの一部だけが伸びに変わる。
      UI.setTopBounce(Math.min(MAX, dy * RESIST), false);
    }, {passive:true});
    document.addEventListener('touchend', ()=>stop(true), {passive:true});
    document.addEventListener('touchcancel', ()=>stop(true), {passive:true});
  },
  // 隣の年度へ1つ動かす（横ホイール用）。端では何もしない。
  stepYear(dir){
    const m = UI.yearMetrics();
    if(!m.count) return;
    const i = Math.max(0, UI.yearIndexOf(State.selectedYear));
    const t = Math.max(0, Math.min(m.count-1, i + dir));
    if(t === i) return;
    UI.setYearOffset(UI.yearOffsetFor(t), true);
    const y = m.items[t].dataset.year;
    UI.paintYearMark(y);
    UI._yearFromBar = true;
    App.applyScopeChange(()=>{ State.selectedYear = y; });
  },

  renderTabs(){
    const tabs = [
      {id:'sanchi', label:'産地', icon:Icon.origin},
      {id:'mine', label:'自分', icon:Icon.mine},
      {id:'import', label:'取込', icon:Icon.import},
      {id:'backup', label:'保存', icon:Icon.backup}
    ];
    const bar = document.getElementById('tabbar');
    bar.setAttribute('role','tablist');
    bar.innerHTML = tabs.map(t=>`
      <button class="tab" role="tab" aria-selected="${State.tab===t.id}" data-action="switch-tab" data-tab="${t.id}">
        ${t.icon}<span>${t.label}</span>
      </button>`).join('');
  },

  // タブの切り替えは必ずここを通る。切り替えたら毎回ページ先頭から見せる。
  // スクロール位置は window が持っていて #main の innerHTML を差し替えても残るので、
  // 何もしないと「前のタブで下にいた距離だけ、次のタブでも下にいる」状態で開く。
  // 画面ごとに長さが違うので位置に意味は無く、切り替え先が短ければブラウザが
  // 途中まで切り詰めてさらに中途半端な場所へ落ちる（年度・品目の切替と同じ現象）。
  // ※ 通常の再描画（削除・モーダル保存・凡例タップなど）は renderMain を直接呼ぶので、
  //   ここに置く限り「操作するたびに勝手に上へ飛ぶ」ことにはならない。
  route(tab){
    State.tab = tab;
    UI.renderTabs();
    UI.renderMain();
    window.scrollTo(0, 0);
  },

  renderMain(){
    const main = document.getElementById('main');
    // 対象（年度×品目）を先に確定させる。この下の「データが無ければ取込タブへ」の判定が
    // 絞り込み済みの件数を見るため。
    UI.ensureScope();
    /* まだ一件も入っていない時だけ、取込タブから始めてもらう（最初の案内のため）。
       ⚠ ここを「表示中の年度×品目が空なら」にしてはいけない。年度の一覧には必ず「今年」が
       入るので、中身の無い年度は普通に存在する。そこへ移った瞬間に取込タブへ飛ばされると、
       取込タブでは年度バーが出ない＝戻る手段が画面から消えて動けなくなる
       （2026-09-06 に実際に起きた。産地タブを押しても即座に押し戻された）。
       中身が無い年度は、空のまま見せて、そのまま隣の年度へ動けるようにする。 */
    if(Store.sanchi.size===0 && Store.jibun.length===0 && Store.zentai.size===0 && State.tab!=='import' && State.tab!=='backup'){
      State.tab = 'import';
      UI.renderTabs();
    }
    // アプリバーはタブが決まってから描く。年度バーを出すかどうかがタブで変わるので、
    // 先に描くと「取込タブなのに年度バーが残っている」状態になる。
    UI.renderAppBar();
    if(State.tab==='sanchi') main.innerHTML = UI.screenSanchi();
    else if(State.tab==='mine') main.innerHTML = UI.screenMine();
    else if(State.tab==='import') main.innerHTML = UI.screenImport();
    else main.innerHTML = UI.screenBackup();
    UI.afterRender();
  },

  afterRender(){
    // 打ち込む欄は中身の高さに合わせる（描き直しのたびに測り直す）
    document.querySelectorAll('#main .csv-edit').forEach(el=>App.autoGrowCsv(el));
    // 折りたたみの中にある欄は、閉じている間は高さを測れない。開いた時に測り直す。
    document.querySelectorAll('#main .import-errors').forEach(d=>{
      d.addEventListener('toggle', ()=>{ if(d.open) d.querySelectorAll('.csv-edit').forEach(el=>App.autoGrowCsv(el)); });
    });
    if(State.tab==='sanchi'){
      const lineWrap = document.querySelector('[data-line-wrap]');
      if(lineWrap) UI.wireLineTooltip(lineWrap);
      const multiWrap = document.querySelector('[data-multiline-wrap]');
      if(multiWrap) UI.wireMultiLineTooltip(multiWrap);
      const zentaiWrap = document.querySelector('[data-zentai-wrap]');
      if(zentaiWrap) UI.wireZentaiTooltip(zentaiWrap);
      const mixWrap = document.querySelector('[data-mix-wrap]');
      if(mixWrap) UI.wireMixTooltip(mixWrap);
      // グラフは初期表示を最新日（右端）に。左スクロールで過去へ遡れる。
      // ⚠ 1画面に2つ出ることがある（箱数＋規格の割合）ので、全部に当てる。
      //    ただし動かすのはここ（描いた直後）だけ。スクロール中に書き込むと払いが止まる。
      document.querySelectorAll('#main .chart-scroll').forEach(s=>{ s.scrollLeft = s.scrollWidth; });
    }
    if(State.tab==='mine'){
      /* 出荷明細一覧の月アコーディオン。開閉状態は State.shipMonthsOpen に控えて
         再描画をまたいで保つ。中身は閉じている間は作っていないので、開いた瞬間に
         その月だけ組み立てて差し込み、閉じたら捨てる（画面に残す部品を最小限に保つ）。 */
      document.querySelectorAll('#main details.ship-month').forEach(d=>{
        d.addEventListener('toggle', ()=>{
          const ym = d.getAttribute('data-ym');
          const body = d.querySelector('.lazy-body');
          const i = State.shipMonthsOpen.indexOf(ym);
          if(d.open){
            if(i<0) State.shipMonthsOpen.push(ym);
            if(body && !body.innerHTML.trim()) body.innerHTML = UI.shipMonthHTML(ym);
          } else {
            if(i>=0) State.shipMonthsOpen.splice(i,1);
            if(body) body.innerHTML = '';
          }
        });
      });
      // 未マッチも同じ仕組み（開閉は保持しない＝再描画で閉じる。従来どおりの挙動）
      document.querySelectorAll('#main details[data-lazy="unmatched"]').forEach(d=>{
        d.addEventListener('toggle', ()=>{
          const body = d.querySelector('.lazy-body');
          if(body) body.innerHTML = d.open ? UI.unmatchedRowsHTML() : '';
        });
      });
    }
    if(State.tab==='import'){
      const seg = document.getElementById('mine-mode-csv-panel');
      const seg2 = document.getElementById('mine-mode-manual-panel');
      if(seg && seg2){
        seg.classList.toggle('hidden', State.mineMode!=='csv');
        seg2.classList.toggle('hidden', State.mineMode!=='manual');
      }
    }
  },

  /* ---------- Screen: 産地分析 ---------- */
  /* 背景の規格バーの読み方（1行）。凡例と箱数は出さない（ユーザー判断 2026-09-06）が、
     色と規格の対応だけはどこかに要るので、ここで文にして済ませている。
     棒が無い品目では空文字＝改行も足さない。
     ⚠ 「その他」の言い方は品目で変わる。濃いまま出す品目（スイピ＝otherOpacity 1）では
        赤そのものが合図なので「赤は〜」、薄敷きのままの品目（クルクマ）では赤くないので
        「一番上が〜」と位置で言う。文言を1つに固定すると、片方で嘘になる。 */
  sizeBarNote(mix){
    if(!mix || !mix.order || mix.order.length===0) return '';
    const OTHER = Compute.SIZE_BAR_OTHER;
    const stack = mix.order.filter(k=>k!==OTHER).map(k=>mix.labels[k]).join('・');
    const emph = !!(mix.opacity && mix.opacity[OTHER] >= 1);
    return `\n          <p class="chart-note">棒＝その日の規格の割合（下から ${Fmt.esc(stack)}`
      + `、${emph ? '赤は' : '一番上が'}${Fmt.esc(mix.labels[OTHER])}）</p>`;
  },
  // 重ねて表示する品種。MAJOR_VARIETIES に載っていて実際にデータがあるものを優先し、
  // 1件も無い品目では箱数の多い順に上位を代用する。list は Compute.varietyList()（箱数降順）。
  majorVarieties(list){
    const names = list.map(v=>v.variety);
    const hit = MAJOR_VARIETIES.filter(v=>names.includes(v));
    return hit.length ? hit : names.slice(0, MAJOR_MAX);
  },
  screenSanchi(){
    State.multiMeta = null;
    State.zentaiMeta = null;
    const list = Compute.varietyList();
    const rule = itemRule(State.selectedItem || DEFAULT_ITEM);
    // 品目全体データを使う品目か。ITEM_RULES に zentai を書かなければ選択肢ごと出ない。
    const hasZentai = !!rule.zentai;
    if(list.length===0 && (!hasZentai || Compute.scopedZentai().length===0)){
      return `<h1 class="screen-title">産地分析</h1>` + UI.emptyState('産地データがまだありません', '産地CSVを取込むと、品種ごとの規格構成と価格推移を確認できます。', '取込へ進む', 'import');
    }
    // 品目全体データを使わない品目へ切り替えたら、品種の側へ戻す
    if(!hasZentai && isZentaiView(State.selectedVariety)) State.selectedVariety = MAJOR_VARIETY_KEY;
    // 品種の既定＝主要5品種。単一品種が消えた場合のみリセット
    if(!isZentaiView(State.selectedVariety) && State.selectedVariety !== MAJOR_VARIETY_KEY && !list.find(v=>v.variety===State.selectedVariety)){
      State.selectedVariety = MAJOR_VARIETY_KEY;
    }
    // 産地データがまだ無い年度では品種の選択肢が空なので、品目全体データを開く
    if(list.length===0) State.selectedVariety = ZENTAI_PRICE_KEY;
    const zentaiView = hasZentai && isZentaiView(State.selectedVariety);
    const isMajor = !zentaiView && State.selectedVariety === MAJOR_VARIETY_KEY;

    // 表示セレクタ。プルダウン上部を指定順に並べ、残りは既存順のまま。
    const VARIETY_TOP_ORDER = ['バンコクスプリーム','ホワイト','ピアノホワイト','シャローム','エメラルドチョコゼブラ','チェリープリンセスデーン','パルビフローラ','リボン'];
    const isMix = (name)=> name.includes('ミックス'); // 「ミックス」を含む品種は最下部へ
    const restList = list.filter(v=>!VARIETY_TOP_ORDER.includes(v.variety));
    const orderedList = [
      ...VARIETY_TOP_ORDER.map(name=>list.find(v=>v.variety===name)).filter(Boolean),
      ...restList.filter(v=>!isMix(v.variety)),
      ...restList.filter(v=>isMix(v.variety))
    ];
    /* セレクタの中身。品目全体データを使う品目では、品種ではない2項目が混ざるので
       グループに分けて「上＝全体／下＝品種別」を目で分かるようにする。 */
    const varietyGroup =
      `<option value="${MAJOR_VARIETY_KEY}" ${isMajor?'selected':''}>主要5品種</option>` +
      orderedList.map(v=>`<option value="${Fmt.esc(v.variety)}" ${v.variety===State.selectedVariety?'selected':''}>${Fmt.esc(v.variety)}</option>`).join('');
    const varietyOptions = hasZentai
      ? `<optgroup label="品目全体">
            <option value="${ZENTAI_PRICE_KEY}" ${State.selectedVariety===ZENTAI_PRICE_KEY?'selected':''}>箱単価 ${ZENTAI_YEARS}カ年比較</option>
            <option value="${ZENTAI_BOXES_KEY}" ${State.selectedVariety===ZENTAI_BOXES_KEY?'selected':''}>箱数</option>
          </optgroup>${list.length ? `<optgroup label="品種別">${varietyGroup}</optgroup>` : ''}`
      : varietyGroup;

    /* 品目に規則が無いものは、カードごと出さない。
       価格推移は基準が無いと全点nullになる＝「間違った図」なので、まだ定義していない品目では
       描かないほうが正しい。ルール（ITEM_RULES の price / sizeBars）を書いた時点で自動的に出る。

       ⚠ 2026-09-08b に日付セレクタとカレンダーを撤去した。日付で中身が変わるカードは
         規格構成ドーナツだけで、そのドーナツを背景の棒に置き換えたため、動かしても
         画面が何も変わらないただの飾りになっていた（ユーザー判断）。 */
    const priceLabel = (rule.price && rule.price.label) ? rule.price.label + ' ' : '';
    const selectorCard = `
      <div class="card">
        <div class="selector-row">
          <label class="field variety-field">${hasZentai ? '表示' : '品種'}
            <div class="select-wrap">
              <select id="variety-select">${varietyOptions}</select>
            </div>
          </label>
        </div>
      </div>`;

    let lineCard;

    if(zentaiView){
      // 品目全体データ（品種も規格も無い）＝背景の規格バーは出せない
      lineCard = UI.zentaiCardHTML(State.selectedVariety);
    } else if(!rule.price){
      // 価格の基準（等級×階級と換算本数）が未定の品目では、価格推移を出さない
      lineCard = '';
    } else if(isMajor){
      // 折れ線＝主要5品種を色分けして重ねる。凡例タップで各品種の表示ON/OFF。
      const allSeries = UI.majorVarieties(list).map((variety,i)=>({variety, color:SERIES_COLORS[i%SERIES_COLORS.length], points:Compute.lineDataDense(variety)}));
      const anyData = allSeries.some(s=>s.points.some(p=>p.price!=null));
      if(!anyData){
        lineCard = `
          <div class="card">
            <div class="card-head"><h2 class="card-title">価格推移（${priceLabel}箱単価・主要5品種）</h2></div>
            <div class="empty-state"><p>主要5品種の価格データがまだありません。</p></div>
          </div>`;
      } else {
        // 凡例タップ＝絞り込み。選択が空なら全表示（初期状態）
        const sel = State.selectedSeries || [];
        const isFiltered = sel.length > 0;
        State.seriesSelectable = allSeries.filter(s=>s.points.some(p=>p.price!=null)).map(s=>s.variety);
        const seriesLegend = allSeries.map(s=>{
          const has = s.points.some(p=>p.price!=null);
          const off = isFiltered && !sel.includes(s.variety);
          return `<div class="legend-item ${has?'':'series-muted'} ${off?'series-off':''}"${has?` data-action="series-toggle" data-variety="${Fmt.esc(s.variety)}" role="button"`:''}>
            <span class="series-dot" style="background:${s.color}"></span>
            <span class="legend-label">${Fmt.esc(s.variety)}</span>
            <span class="legend-val">${has?(off?'非表示':''):'データなし'}</span>
          </div>`;
        }).join('');
        // 軸は常に5品種ぶんで固定し、非選択の品種は線だけ消す
        const chartSeries = allSeries.map(s=>({...s, hidden: isFiltered && !sel.includes(s.variety)}));
        const anyShown = chartSeries.some(s=> !s.hidden && s.points.some(p=>p.price!=null));
        /* ⚠ 主要5品種では背景の規格バーを出さない（2026-09-08b・ユーザー判断で撤去）。
           見づらいだけではなく、読み方が存在しない図だったのが理由：背景の棒は
           【5品種を足し合わせた1つの割合】なのに、線は【品種ごとにバラバラ】なので、
           どの線がどの帯に対応するのか誰にも答えられない。合計の話と1品種ずつの話を
           1枚に重ねてはいけない。棒は単一品種を選んだときだけ出す。 */
        const mix = null;
        let chartInner, isolatedNote='';
        if(anyShown){
          const {svg, isolated, ptMeta, w, yAxis} = Charts.multiLineSVG(chartSeries, {mix});
          State.multiMeta = {ptMeta, w};
          chartInner = `<div class="chart-wrap" data-multiline-wrap><div class="chart-scroll">${svg}</div>${yAxis?`<div class="chart-yaxis">${yAxis}</div>`:''}</div>
            <div class="chart-detail" id="line-detail" data-empty="true">プロットをタップすると詳細を表示します</div>`;
          if(isolated) isolatedNote = `<p class="chart-caption">連続データが少ないため、一部は単独の点のみ表示しています（データ不足）。</p>`;
        } else {
          State.multiMeta = null;
          chartInner = `<div class="empty-state"><p>表示する品種がありません。凡例をタップして表示してください。</p></div>`;
        }
        lineCard = `
          <div class="card">
            <div class="card-head"><h2 class="card-title">価格推移（${priceLabel}箱単価・主要5品種）</h2></div>
            ${chartInner}${UI.sizeBarNote(mix)}
            <div class="series-legend">${seriesLegend}</div>
            ${isolatedNote}
          </div>`;
      }
    } else {
      // 単一品種：折れ線は全期間。その背景に、その日の規格構成を100%の縦棒で敷く。
      const variety = State.selectedVariety;
      const points = Compute.lineDataDense(variety);
      const withData = points.filter(p=>p.price!=null);
      /* 背景の規格構成バーは sizeBars を書いた品目だけ（クルクマ・スイピとも書いてある）。
         書いていない品目では null のまま渡らないので、グラフは従来どおり線だけになる。 */
      const mix = rule.sizeBars ? Compute.sizeMix([variety]) : null;
      let lineBlock;
      if(withData.length===0){
        lineBlock = `<div class="empty-state"><p>この品種の価格データがまだありません。</p></div>`;
      } else {
        const {svg, isolated, yAxis} = Charts.lineSVG(points, {mix});
        lineBlock = `
          <div class="chart-wrap" data-line-wrap data-variety="${Fmt.esc(variety)}"><div class="chart-scroll">${svg}</div>${yAxis?`<div class="chart-yaxis">${yAxis}</div>`:''}</div>
          <div class="chart-detail" id="line-detail" data-empty="true">プロットをタップすると詳細を表示します</div>${UI.sizeBarNote(mix)}
          ${isolated ? `<p class="chart-caption">連続データが少ないため、一部は単独の点のみ表示しています（データ不足）。</p>` : ''}
        `;
      }
      lineCard = `
        <div class="card">
          <div class="card-head"><h2 class="card-title">価格推移（${priceLabel}箱単価）</h2></div>
          ${lineBlock}
        </div>`;
    }

    // 見出しの年度は、どの表示でも選択中の年度をそのまま出す
    // （以前は選択日から逆算していたが、日付セレクタを撤去したので年度バーの値が唯一の正）
    const seasonYear = String(State.selectedYear || '');
    return `
      <h1 class="screen-title">産地分析${seasonYear ? ` <span class="muted" style="font-weight:400">${seasonYear}</span>` : ''}</h1>
      ${selectorCard}
      ${lineCard}
    `;
  },

  /* 品目全体データのカード（箱単価の5カ年比較／箱数）。
     この2つは品種も規格も無い資料なので、ドーナツ・日付セレクタ・規格の背景バーは出さない。
     横軸は日付ではなく「基準日から数えて何回目の出荷日か」＝年をまたいで重ねられる物差し。 */
  zentaiCardHTML(view){
    const item = State.selectedItem || DEFAULT_ITEM;
    const rule = itemRule(item);
    const year = String(State.selectedYear || '');
    const isPrice = view === ZENTAI_PRICE_KEY;
    const title = isPrice ? `箱単価 ${ZENTAI_YEARS}カ年比較` : '箱数';
    const own = Compute.zentaiSeries(); // 表示中の年度ぶん
    const series = isPrice ? Compute.zentaiYearSeries(item, year, ZENTAI_YEARS) : [];
    const hasAny = isPrice ? series.some(s=>s.points.some(p=>p.ma!=null)) : own.some(p=>p.boxes>0);
    if(!hasAny){
      return `<div class="card">
          <div class="card-head"><h2 class="card-title">${title}</h2></div>
          <div class="empty-state">
            <p>${Fmt.esc(year)}年度の品目全体データがまだありません。</p>
            <div class="btn-row" style="justify-content:center"><button class="btn btn-secondary" style="width:auto" data-action="switch-tab" data-tab="import">取込へ進む</button></div>
          </div>
        </div>`;
    }
    if(!isPrice){
      /* 箱数（JAの資料）と、その下の規格の割合（品種別の市況CSV）を上下に並べる。
         ⚠ 横軸の範囲は【2つのデータの和】で決める。片方の範囲で描くと、もう片方にしか
            無い日が黙って消えるか、同じ日が別の位置に来る。和にしておけば、
            資料が片方しか無い日は「空き」として見えるだけで済む。 */
      const mixData = rule.sizeBars ? Compute.zentaiMixPoints() : null;
      const mixPts = (mixData && mixData.points.length) ? mixData.points : null;
      const boxPts = own.filter(p=>p.i!=null && p.boxes>0);
      const allI = boxPts.map(p=>p.i).concat(mixPts ? mixPts.map(p=>p.i) : []);
      const iMin = allI.length ? Math.min(...allI) : null;
      const iMax = allI.length ? Math.max(...allI) : null;

      // 棒は3点移動平均。火曜だけ落ち込むギザギザを均す（ユーザー指定 2026-09-08b）
      const {svg, ptMeta, w, yAxis} = Charts.zentaiBarsSVG(Compute.zentaiBoxMA(own), {iMin, iMax});
      State.zentaiMeta = {ptMeta, w, kind:'boxes'};

      let mixCard = '';
      if(mixPts){
        const m = Charts.zentaiMixSVG(mixPts, mixData.mix, iMin, iMax);
        State.mixMeta = {ptMeta:m.ptMeta, w:m.w, mix:mixData.mix};
        const stack = mixData.mix.order.filter(k=>k!==Compute.SIZE_BAR_OTHER)
          .map(k=>mixData.mix.labels[k]).join('・');
        /* 詳細は大きなカードを置かず、見出しの右の空きに日付と箱数だけ出す（ユーザー指定）。
           タップするまでは空。棒をタップすると UI.wireMixTooltip が中身を書き込む。 */
        mixCard = `
        <div class="card">
          <div class="card-head"><h2 class="card-title">規格比率</h2><span class="tap-readout tnum" id="mix-tap"></span></div>
          <div class="chart-wrap" data-mix-wrap><div class="chart-scroll">${m.svg}</div></div>
          <p class="chart-note">その日の箱数を規格で分けた割合です（下から ${Fmt.esc(stack)}、一番上がその他）。どの日も高さは100%にそろえてあります。棒をタップすると日付と箱数が見出しの右に出ます。</p>
          <p class="chart-note">⚠ この割合は【品種別の市況CSV】から、上の箱数は【JAの品目別市況】から出しています。別の資料ですが、箱数が一致することを原本で確かめてあります。</p>
        </div>`;
      } else {
        State.mixMeta = null;
      }
      return `
        <div class="card">
          <div class="card-head"><h2 class="card-title">箱数</h2><span class="tap-readout tnum" id="zentai-tap"></span></div>
          <div class="chart-wrap" data-zentai-wrap><div class="chart-scroll">${svg}</div>${yAxis?`<div class="chart-yaxis">${yAxis}</div>`:''}</div>
          <p class="chart-note">産地全体の出荷箱数です。棒が立っていない所は資料が無い日です。棒の高さは前後の出荷日と合わせた3点の平均（火曜は少なくなる傾向があり、生のままだとギザギザして流れが読めないため）。資料が抜けている日はまたがず、あるぶんだけで平均します。<b>棒をタップすると、その日の実際の箱数</b>が見出しの右に出ます。</p>
        </div>${mixCard}`;
    }

    /* 月名のラベルは【表示中の年度】の暦で置く。年によってひと月の出荷日数が1日ぶん違うので、
       重ねた別の年の実際の月替わりは最大1コマずれる（実測。お盆前の最終出荷は毎年45回目で揃う）。
       基準日と物日が揃っていればラベルはざっくりでよい、というユーザー判断に沿っている。 */
    const idx = series.flatMap(s=>s.points).map(p=>p.i).filter(v=>v!=null);
    const labels = Compute.shipAxisLabels(Compute.shipCalendar(item, year, Math.min(...idx), Math.max(...idx)));

    // 凡例タップ＝年ごとのON/OFF（主要5品種と同じ操作）。選択が空なら全表示。
    const sel = State.selectedZentaiYears || [];
    const isFiltered = sel.length > 0;
    const chartSeries = series.map(s=>({...s, hidden: isFiltered && !sel.includes(s.year)}));
    const anyShown = chartSeries.some(s=> !s.hidden && s.points.some(p=>p.ma!=null));
    let inner;
    if(anyShown){
      const {svg, ptMeta, w, yAxis} = Charts.zentaiLineSVG(chartSeries, {labels});
      State.zentaiMeta = {ptMeta, w, kind:'price'};
      inner = `<div class="chart-wrap" data-zentai-wrap><div class="chart-scroll">${svg}</div>${yAxis?`<div class="chart-yaxis">${yAxis}</div>`:''}</div>
        <div class="chart-detail" id="line-detail" data-empty="true">プロットをタップすると詳細を表示します</div>`;
    } else {
      State.zentaiMeta = null;
      inner = `<div class="empty-state"><p>表示する年度がありません。凡例をタップして表示してください。</p></div>`;
    }
    const legend = series.map(s=>{
      const off = isFiltered && !sel.includes(s.year);
      return `<div class="legend-item ${off?'series-off':''}" data-action="zentai-year-toggle" data-year="${Fmt.esc(s.year)}" role="button">
        <span class="series-dot" style="background:${s.color}"></span>
        <span class="legend-label">${Fmt.esc(s.year)}年度</span>
        <span class="legend-val">${off?'非表示':''}</span>
      </div>`;
    }).join('');
    return `
      <div class="card">
        <div class="card-head"><h2 class="card-title">箱単価 ${ZENTAI_YEARS}カ年比較</h2></div>
        ${inner}
        <div class="series-legend">${legend}</div>
        <p class="chart-note">線は3点移動平均（前後1点を含む3点の売立金額 ÷ 箱数）です。横軸は${itemRule(item).zentai.baseMonth}月最初の出荷日から数えた出荷回数（日・火・木）で、年が違っても同じ位置が同じ時期になります。</p>
      </div>`;
  },

  // 自分出荷手入力の日付ピッカー（アプリで唯一のカレンダー。全日付が選択可＝出荷日は自由）。
  // ※ 産地タブ側のカレンダーは 2026-09-08b に撤去した（日付で動くカードが無くなったため）。
  mineCalendarHTML(){
    const today = new Date();
    const todayYm = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
    const ym = State.mineCalMonth || (State.mineDate||'').slice(0,7) || todayYm;
    const parts = ym.split('-');
    const y = parseInt(parts[0],10), m = parseInt(parts[1],10);
    if(!y || !m) return '';
    const first = new Date(y, m-1, 1);
    const startWD = first.getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const wds = ['日','月','火','水','木','金','土'];
    const wdColor = (wd)=> wd===0 ? 'cal-sun' : wd===6 ? 'cal-sat' : '';
    let cells = '';
    for(let i=0;i<startWD;i++) cells += `<span class="cal-day empty"></span>`;
    for(let d=1; d<=daysInMonth; d++){
      const wd = new Date(y, m-1, d).getDay();
      const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isSel = iso === State.mineDate;
      const wc = wdColor(wd);
      cells += `<button type="button" class="cal-day enabled ${wc} ${isSel?'selected':''}" data-action="mine-cal-pick" data-date="${iso}">${d}</button>`;
    }
    const wdRow = wds.map((w,i)=>`<div class="cal-wd ${wdColor(i)}">${w}</div>`).join('');
    return `
      <div class="cal-backdrop" data-action="close-mine-calendar"></div>
      <div class="cal-pop">
        <div class="cal-head">
          <button type="button" data-action="mine-cal-prev" aria-label="前の月">‹</button>
          <span class="cal-title">${y}年${m}月</span>
          <button type="button" data-action="mine-cal-next" aria-label="次の月">›</button>
        </div>
        <div class="cal-grid">${wdRow}${cells}</div>
      </div>`;
  },

  /* ---------- 出荷明細一覧の材料 ---------- */
  // 規格の表示（別なら「別N本」）。出荷明細・割り当て行・各モーダルで共通に使う。
  specTextOf(r){ return (r.betsuCount>0) ? `別 ${r.betsuCount}本` : App.specToStr(r.size, r.count); },
  // 規格の並び順（2L30→2L50→L→M→別）。クルクマの表記に合わせた化粧なので、
  // 表に無い規格は中間（50）に置く＝並びが揃わないだけで壊れはしない。
  _specOrder: {'2L30':0, '2L50':1, 'L':2, 'M':3},
  specRank(r){ return r.betsuCount>0 ? 99 : (UI._specOrder[App.specToStr(r.size, r.count)] ?? 50); },

  /* 出荷明細の材料（色番号・日ごと・月ごとの集計）。突合と集計と同じ鍵で覚えておく。
     月を開くたび・凡例をタップするたびに並べ直していると、件数に比例した時間が
     そのまま残ってしまう（実測：8,000件で1操作あたり55ms）。 */
  _shipModel: {key:null, model:null},
  shipModel(){
    const key = Compute.scopeKey();
    if(UI._shipModel.key !== key) UI._shipModel = {key, model: UI.buildShipModel()};
    return UI._shipModel.model;
  },
  /* 出荷明細の材料を実際に組み立てる。HTMLはここでは作らない
     ＝閉じている月のぶんを組み立てないための分離。 */
  buildShipModel(){
    const {matched} = Compute.mineView();
    // 日付は新しい順。同じ日の中は取込順（配列順）のまま＝品種の出現順を崩さない。
    // ※以前は addedAt の降順で並べていたが、取込中のミリ秒差で日内の順序が入れ替わることがあった。
    const sorted = matched.slice().sort((a,b)=> b.date.localeCompare(a.date));
    // 品種→色番号。7色で循環し、マーカー(--mkN)・ドーナツ(--dnN)・凡例で共用する。
    // 採番は表示順から。取込順で採ると画面上の色が 1,2,3… の順に並ばず、
    // 古いCSVを後から取り込むだけで既存の品種の色が動いてしまう。
    const orderSeq = [], seenV = new Set();
    sorted.forEach(r=>{ if(r.variety && !seenV.has(r.variety)){ seenV.add(r.variety); orderSeq.push(r.variety); } });
    const markMap = {}; orderSeq.forEach((v,i)=>{ markMap[v] = (i%7)+1; });
    // 日ごと → 月ごと。件数が増えていくので、配列の総なめ（find）ではなく Map で引く。
    const days = [], byDate = new Map();
    sorted.forEach(r=>{
      let g = byDate.get(r.date);
      if(!g){ g = {date:r.date, rows:[], boxes:0, stems:0, total:0}; byDate.set(r.date, g); days.push(g); }
      g.rows.push(r);
      g.boxes += (r.boxQty||0);
      // その日の総本数（箱数の下に出す）。r.stems は matchJibun が Compute.rowStems で入れた値
      g.stems += (r.stems||0);
      if(r.matched && !r.pending) g.total += r.amount; // pendingは金額nullなので売上合計に足さない
    });
    const months = [], byYm = new Map();
    days.forEach(d=>{
      const ym = d.date.slice(0,7);
      let m = byYm.get(ym);
      if(!m){ m = {ym, days:[], boxes:0, total:0}; byYm.set(ym, m); months.push(m); }
      m.days.push(d); m.boxes += d.boxes; m.total += d.total;
    });
    return {orderSeq, markMap, months};
  },
  // 1日ぶんのカード（品種ごとの枠＋規格の明細行）
  shipDayCardHTML(g, markMap){
    const byVar = [], byName = new Map();
    g.rows.forEach(r=>{
      let v = byName.get(r.variety);
      if(!v){ v = {variety:r.variety, rows:[], amount:0}; byName.set(r.variety, v); byVar.push(v); }
      v.rows.push(r);
      if(r.matched && !r.pending) v.amount += r.amount;
    });
    const blocks = byVar.map(v=>{
      v.rows.sort((a,b)=> UI.specRank(a)-UI.specRank(b));
      const specLines = v.rows.map(r=>`
          <div class="sv-spec">
            <div class="sv-spec-main">
              <span class="sv-grade">${UI.specTextOf(r)}</span>
              <span class="sv-boxes tnum">${r.boxQty}箱</span>
            </div>
            ${r.matched && r.pending
              ? `<div class="sv-spec-sub"><span class="badge badge-pending">未確定</span><button class="btn-fill" data-action="fill-price" data-key="${Fmt.esc(r.sanchiKey)}">金額入力</button></div>`
              : r.matched
                ? `<div class="sv-spec-sub"><span>${Fmt.yen(r.boxPrice)}<span class="u">/箱</span></span><span class="sv-dot">・</span><span>${Fmt.yen(r.perStem)}<span class="u">/本</span></span></div>`
                : `<div class="sv-spec-sub"><span class="badge badge-nomatch">未マッチ</span></div>`}
            <button class="sv-del" data-action="delete-mine-row" data-id="${r.id}" aria-label="この規格を削除">${Icon.trash}</button>
          </div>`).join('');
      return `
          <div class="ship-variety-block">
            <div class="sv-head">
              <span class="ship-name mk mk${markMap[v.variety]||1}">${Fmt.esc(v.variety)}</span>
              ${v.amount>0 ? `<span class="ship-amount tnum">${Fmt.yen(v.amount)}</span>` : ''}
            </div>
            <div class="sv-specs">${specLines}</div>
          </div>`;
    }).join('');
    // 見出しの曜日（土=青／日=赤）＋その日の箱数と売上合計（マッチ分）
    return `
        <div class="ship-day-card">
          <div class="ship-date-head">
            <span class="ship-date-md">${Fmt.date(g.date)}</span>
            <span class="ship-date-wd ${Fmt.wdClass(g.date)}">(${Fmt.wd(g.date)})</span>
            <span class="ship-date-boxes tnum">${Fmt.num(g.boxes)}箱${g.stems>0 ? `<small>${Fmt.num(g.stems)}本</small>` : ''}</span>
            ${g.total>0 ? `<span class="ship-date-total tnum">${Fmt.yen(g.total)}</span>` : ''}
          </div>
          ${blocks}
        </div>`;
  },
  // 1ヶ月ぶんの中身。閉じている月では呼ばれず、開いた瞬間に afterRender が差し込む。
  shipMonthHTML(ym){
    const {markMap, months} = UI.shipModel();
    const m = months.find(x=>x.ym===ym);
    return m ? m.days.map(d=>UI.shipDayCardHTML(d, markMap)).join('') : '';
  },
  // 未マッチの中身。これも既定で閉じているので、開いた瞬間にだけ作る。
  unmatchedRowsHTML(){
    const rows = Compute.mineView().summary.unmatchedRows;
    return `<p class="muted" style="font-size:0.8125rem">産地データに一致する行（別行は同日・同品種の「別」）が見つからない行です。表記ゆれや産地データ未取込の可能性があります。</p>
          ${rows.map(r=>`
            <div class="ship-row">
              <div class="ship-main">
                <span class="ship-date tnum">${Fmt.date(r.date)}</span>
                <span class="ship-name">${Fmt.esc(r.variety)}${r.betsuCount>0?' <span class="tag-betsu">別</span>':''}</span>
                <span class="ship-detail">${UI.specTextOf(r)}　箱数${r.boxQty}</span>
              </div>
              <button class="ship-del" data-action="delete-mine-row" data-id="${r.id}" aria-label="この行を削除">${Icon.trash}</button>
            </div>`).join('')}`;
  },

  /* ---------- Screen: 自分の分析 ---------- */
  screenMine(){
    if(Compute.scopedJibun().length===0){
      return `<h1 class="screen-title">自分の分析</h1>` + UI.emptyState('出荷データがまだありません', '自分の出荷をCSVまたは手入力で追加すると、売上を自動集計します。', '取込へ進む', 'import');
    }
    // 突合と集計はデータが変わるまで使い回す（月の開閉・凡例タップ・削除で再計算しない）
    const sum = Compute.mineView().summary;
    const allocOn = Compute.allocEnabled(); // 作型（新植／据置）を使う品目か

    // 今季作付設定の坪（総坪＋品種別坪）。未入力なら坪あたり系は「-」表示。
    const totalTsubo = Compute.scopedSakutsuke().reduce((s,r)=>s+(Number(r.tsubo)||0),0);
    const tsuboByVariety = {};
    Compute.scopedSakutsuke().forEach(r=>{ tsuboByVariety[r.variety]=(tsuboByVariety[r.variety]||0)+(Number(r.tsubo)||0); });

    // ドーナツ・凡例・品種別内訳の並びは「出荷明細の出現順（日付降順→日内は取込順）」で固定＝金額順で入れ替えない。
    // 並び順と色番号は出荷明細と同じものを使う＝UI.shipModel() が正本（2箇所で採番するとズレる）。
    const {orderSeq, markMap, months:shipMonths} = UI.shipModel();
    const varietyRows = sum.varietyRows.slice().sort((a,b)=> orderSeq.indexOf(a.variety) - orderSeq.indexOf(b.variety));
    const cats = {};
    varietyRows.forEach((r)=>{ cats[r.variety] = r.amount; });
    const colorMap = {}; varietyRows.forEach((r)=>{ colorMap[r.variety] = `var(--dn${markMap[r.variety]||1})`; });
    const donutSvg = varietyRows.length ? Charts.donutSVG(cats, sum.total, colorMap, 150, true) : '';
    const varietyLegend = varietyRows.map(r=>{
      return `<div class="legend-item">
        <span class="legend-dot" style="background:${colorMap[r.variety]}"></span>
        <span class="legend-label">${Fmt.esc(r.variety)}</span>
        <span class="legend-val legend-val-strong tnum">${Fmt.yen(r.amount)}</span>
      </div>`;
    }).join('');

    // 一覧が単一年に収まっている間は見出しから年を省く（「8月」）。年をまたぐ時だけ「2026年8月」に戻す。
    // ＝スマホ幅で見出しを1行に収めるため。冗長な年を落とすのが一番効く。
    const singleYear = new Set(shipMonths.map(m=>m.ym.slice(0,4))).size <= 1;
    /* 月ごとのアコーディオン。既定は全て閉じる（開閉は State.shipMonthsOpen に控えてあり、
       削除などの再描画をまたいで保たれる）。
       ⚠ 閉じている月の中身は組み立てない。以前は見えていないHTMLまで毎回作って挿入しており、
       出荷件数にそのまま比例していた（実測：3,000件で 8.0MB／182ms）。
       中身は開いた瞬間に UI.afterRender が UI.shipMonthHTML(ym) を呼んで差し込む。
       見出しの「N日・X箱・¥合計」は今までどおり全件から集計しているので数字は変わらない。 */
    const shipRows = shipMonths.map(m=>{
      const [y, mo] = m.ym.split('-');
      const open = State.shipMonthsOpen.includes(m.ym);
      return `
        <details class="collapse ship-month" data-ym="${m.ym}"${open?' open':''}>
          <summary>
            <span class="sm-title">${singleYear ? '' : `${Number(y)}年`}${Number(mo)}月</span>
            <span class="sm-meta tnum">${m.days.length}日・${Fmt.num(m.boxes)}箱</span>
            ${m.total>0 ? `<span class="sm-total tnum">${Fmt.yen(m.total)}</span>` : ''}
          </summary>
          <div class="stack lazy-body" style="margin-top:var(--sp3)">${open ? UI.shipMonthHTML(m.ym) : ''}</div>
        </details>`;
    }).join('');

    // 未マッチも既定で閉じているので、中身は開いた瞬間に作る（上と同じ仕組み）
    const unmatchedBlock = sum.unmatchedRows.length ? `
      <details class="collapse" data-lazy="unmatched">
        <summary>未マッチ（${sum.unmatchedRows.length}件）<span class="badge badge-nomatch">合計から除外</span></summary>
        <div class="stack lazy-body" style="margin-top:var(--sp3)"></div>
      </details>
    ` : '';

    // 金額未確定（要入力）カード：市況の箱単価が未確定の出荷を一覧。埋め忘れ防止＋その場で金額入力へ。
    const pendingBlock = sum.pendingRows.length ? `
      <div class="card card-pending">
        <div class="card-head"><h2 class="card-title">金額未確定（要入力）<span class="badge badge-pending">${sum.pendingRows.length}件</span></h2></div>
        <p class="muted" style="font-size:0.8125rem">市況の箱単価がまだ「未確定」の出荷です。箱数・本数には算入していますが、売上・平均単価には未反映です。精算書で金額が分かったら入力してください。</p>
        <div class="stack" style="margin-top:var(--sp3)">
          ${sum.pendingRows.map(r=>`
            <div class="ship-row">
              <div class="ship-main">
                <span class="ship-date tnum">${Fmt.date(r.date)}</span>
                <span class="ship-name">${Fmt.esc(r.variety)}${r.betsuCount>0?' <span class="tag-betsu">別</span>':''}</span>
                <span class="ship-detail">${UI.specTextOf(r)}　箱数${r.boxQty}</span>
              </div>
              <button class="btn-fill" data-action="fill-price" data-key="${Fmt.esc(r.sanchiKey)}">金額入力</button>
            </div>`).join('')}
        </div>
      </div>
    ` : '';

    // 作型 未割当カード（両区分を作っている品種の未割当出荷。日付×規格ごとに質問）
    const unassignedGroups = Compute.unassignedAllocGroups();
    const allocBlock = unassignedGroups.length ? `
      <div class="card card-alloc">
        <div class="card-head"><h2 class="card-title">作型 未割当（要割り当て）<span class="badge badge-alloc">${unassignedGroups.length}件</span></h2></div>
        <p class="muted" style="font-size:0.8125rem">新植と据置の両方を作っている品種の出荷です。日付・規格ごとに、どちらから作ったかを割り当ててください。混在は据置の本数を入力。</p>
        <div class="stack" style="margin-top:var(--sp3)">${UI.allocRowsHTML(unassignedGroups)}</div>
      </div>
    ` : '';

    return `
      <h1 class="screen-title">自分の分析</h1>
      <div class="card kpi-card">
        <span class="kpi-label">今シーズン累計 売り立て</span>
        <span class="kpi-value tnum">${Fmt.yen(sum.total)}</span>
        ${sum.avgPerStem!=null ? `<div class="kpi-secondary">
          <span class="kpi-sec-label">平均1本単価</span>
          <span class="kpi-sec-value tnum">${Fmt.yen(sum.avgPerStem)}<small>/本</small></span>
        </div>` : ''}
        <div class="kpi-secondary">
          <span class="kpi-sec-label">坪あたり売上</span>
          <span class="kpi-sec-value tnum">${totalTsubo>0 ? `${Fmt.yen(sum.total/totalTsubo)}<small>/坪</small>` : '-'}</span>
        </div>
        <div class="kpi-sub">
          <span>出荷箱数計 <b class="tnum">${Fmt.num(sum.totalBoxes)}</b>箱</span>
          <span>総本数 <b class="tnum">${Fmt.num(sum.totalStems)}</b>本</span>
        </div>
      </div>
      ${pendingBlock}
      ${allocBlock}
      <div class="card">
        <div class="card-head"><h2 class="card-title">品種別売上内訳</h2></div>
        ${varietyRows.length ? `
        <div class="donut-col">${donutSvg}<div class="legend">${varietyLegend}</div></div>
        <ul class="vm-list">${varietyRows.map(r=>{
          const vt=tsuboByVariety[r.variety]||0;
          const perT=vt>0?Fmt.yen(r.amount/vt):null;
          const mk=markMap[r.variety]||1;
          // 作型を使わない品目では区分そのものを出さない（見開きも無くなる）
          const category=allocOn ? r.category : null;
          const isKon=category==='混植';
          // 区分インジケータ（品種名行の右）：混植=色丸「混」（=見開きトグル）／新植・据置=薄い楕円チップ
          // 文字色は --ink。--dnN を --mkN に乗せると全色でコントラストが 1.9〜3.1:1 しか出ず読めない。
          // どの品種かは下地（--mkN）が示すので、文字を黒にしても情報は失われない。
          const indicator = isKon
            ? `<span class="vm-kon" style="color:var(--ink);background:var(--mk${mk})">混</span>`
            : category==='新植' ? `<span class="plant-cat plant-cat-shin">新植</span>`
            : category==='据置' ? `<span class="plant-cat plant-cat-sue">据置</span>`
            : '';
          // 見出し＝1段目：品種名（1行・末尾は見切れ）＋右に区分。2段目：右詰の金額。下に指標カード。
          const head=`<div class="vm-head">
              <div class="vm-titlerow"><span class="ship-name mk mk${mk}">${Fmt.esc(r.variety)}</span>${indicator}</div>
              <div class="vm-amountrow"><span class="vm-amount tnum">${Fmt.yen(r.amount)}</span></div>
            </div>
            <div class="vm-grid">
              <div class="vm-cell"><span class="vm-label">箱数</span><span class="vm-val">${Fmt.num(r.boxes)}<span class="vm-unit">箱</span></span></div>
              <div class="vm-cell"><span class="vm-label">累計本数</span><span class="vm-val">${Fmt.num(r.stems)}<span class="vm-unit">本</span></span></div>
              <div class="vm-cell"><span class="vm-label">坪売上</span><span class="vm-val${perT?'':' is-empty'}">${perT?`${perT}<span class="vm-unit">/坪</span>`:'-'}</span></div>
              <div class="vm-cell"><span class="vm-label">単価</span><span class="vm-val${r.perStem!=null?'':' is-empty'}">${r.perStem!=null?`${Fmt.yen(r.perStem)}<span class="vm-unit">/本</span>`:'—'}</span></div>
            </div>`;
          if(!isKon){ return `<li class="vm-item"><div class="vm-summary">${head}</div></li>`; }
          // 混植：区分別カード（本数/坪売上/1本単価）
          const sp=r.split, shin=sp.shinshoku, sue=sp.sueoki, un=sp.unassigned;
          const card=(label,cls,s,metrics)=>`<div class="pt-cardrow">
              <span class="plant-cat ${cls}">${label}</span>
              <div class="pt-ccells">
                <div class="vm-cell"><span class="vm-label">本数</span><span class="vm-val">${Fmt.num(Math.round(s.stems))}<span class="vm-unit">本</span></span></div>
                <div class="vm-cell"><span class="vm-label">坪売上</span><span class="vm-val${metrics&&s.perTsubo!=null?'':' is-empty'}">${metrics&&s.perTsubo!=null?`${Fmt.yen(s.perTsubo)}<span class="vm-unit">/坪</span>`:'-'}</span></div>
                <div class="vm-cell"><span class="vm-label">1本単価</span><span class="vm-val${metrics&&s.perStem!=null?'':' is-empty'}">${metrics&&s.perStem!=null?`${Fmt.yen(s.perStem)}<span class="vm-unit">/本</span>`:'-'}</span></div>
              </div>
            </div>`;
          const cards=`<div class="pt-cards">${card('新植','plant-cat-shin',shin,true)}${card('据置','plant-cat-sue',sue,true)}${un.stems>0?card('未割当','plant-cat-kon',un,false):''}</div>`;
          const detail=`${cards}${un.stems>0?`<p class="pt-unassigned">未割当分は下の「未割当」カードから割り当てできます</p>`:''}`;
          return `<li class="vm-item"><details class="vm-details"><summary class="vm-summary">${head}</summary><div class="vm-detail">${detail}</div></details></li>`;
        }).join('')}</ul>` : `<p class="muted">一致した出荷がまだありません。</p>`}
      </div>
      <div class="card">
        <div class="card-head"><h2 class="card-title">出荷明細一覧</h2></div>
        <div class="stack">${shipRows}</div>
        ${unmatchedBlock}
      </div>
      ${UI.sakutsukeBlocksHTML()}
    `;
  },

  /* ---------- Screen: 取込 ---------- */
  screenImport(){
    const zeroData = Store.sanchi.size===0 && Store.jibun.length===0 && Store.zentai.size===0;
    const onboard = zeroData ? `
      <div class="card">
        <h2 class="card-title">はじめに（3ステップ）</h2>
        <div class="stack">
          <div class="onboard-step"><span class="onboard-num">1</span><div class="onboard-text"><b>産地CSVを取込む</b><span>市場から届いた産地全体データ（日付,品目,品種,規格,本数,箱数量,箱単価）</span></div></div>
          <div class="onboard-step"><span class="onboard-num">2</span><div class="onboard-text"><b>自分の出荷を追加</b><span>CSV取込、または手入力フォームで1件ずつ追加</span></div></div>
          <div class="onboard-step"><span class="onboard-num">3</span><div class="onboard-text"><b>分析タブで確認</b><span>「産地」「自分」タブで規格構成・価格推移・売上が見られます</span></div></div>
        </div>
      </div>` : '';

    // 手入力の品種プルダウン＝この品目で登録した作付の品種（全年度・＋末尾に「その他（自由入力）」）
    const mineVarieties = Compute.itemSakutsukeVarieties();
    const selMineV = State.mineVariety; // 直前に選んだ品種を復元（連続入力のため）
    const varietyOpts = mineVarieties.map(v=>`<option value="${Fmt.esc(v)}" ${v===selMineV?'selected':''}>${Fmt.esc(v)}</option>`).join('')
      + `<option value="__other__">その他（自由入力）</option>`;

    // 品種名の入力補助。取込タブは年度を持たないので、その品目の全年度から拾う。
    const varietyDatalist = `<datalist id="variety-suggest">${
      Compute.itemDataVarieties().map(v=>`<option value="${Fmt.esc(v)}"></option>`).join('')}</datalist>`;

    return `
      <div class="title-row"><h1 class="screen-title">データ取込</h1>${UI.importErrorMark()}</div>
      ${onboard}
      <div class="card">
        <div class="card-head"><h2 class="card-title">産地データCSV</h2></div>
        <p class="card-caption">ヘッダ: 日付,品目,品種,等級,階級,本数,箱数量,箱単価（別扱いは 等級=別・階級は空欄・本数0）</p>
        <label class="dropzone" for="sanchi-file-input">
          ${Icon.upload}
          <strong>タップしてCSVを選択</strong>
        </label>
        <!-- ファイル選択は onChange が id で拾う（data-action の委譲は通らない） -->
        <input type="file" id="sanchi-file-input" accept=".csv,text/csv">
        <div class="paste-row">
          <textarea class="csv-text csv-edit csv-paste" id="sanchi-paste" placeholder="またはCSVを貼り付け（ヘッダ行を含めてOK）"></textarea>
          <button type="button" class="btn btn-secondary btn-sm" data-action="import-sanchi-paste">貼り付けた内容を取込</button>
        </div>
        <div id="sanchi-import-summary">${State.sanchiImportSummary || ''}</div>
      </div>
      ${itemRule(State.selectedItem || DEFAULT_ITEM).zentai ? `
      <div class="card">
        <div class="card-head"><h2 class="card-title">品目全体データCSV</h2></div>
        <p class="card-caption">JAの「花き共選共販市況」から起こしたもの。ヘッダ: 日付,品目,箱数,売立金額,箱平均価格（産地データとは別のものです）</p>
        <label class="dropzone" for="zentai-file-input">
          ${Icon.upload}
          <strong>タップしてCSVを選択</strong>
        </label>
        <input type="file" id="zentai-file-input" accept=".csv,text/csv">
        <div class="paste-row">
          <textarea class="csv-text csv-edit csv-paste" id="zentai-paste" placeholder="またはCSVを貼り付け（ヘッダ行を含めてOK）"></textarea>
          <button type="button" class="btn btn-secondary btn-sm" data-action="import-zentai-paste">貼り付けた内容を取込</button>
        </div>
        <div id="zentai-import-summary">${State.zentaiImportSummary || ''}</div>
      </div>` : ''}
      <div class="card">
        <div class="card-head"><h2 class="card-title">自分の出荷</h2></div>
        <div class="segmented" role="tablist">
          <button role="tab" aria-selected="${State.mineMode==='csv'}" data-action="toggle-mine-mode" data-mode="csv">CSVで取込</button>
          <button role="tab" aria-selected="${State.mineMode==='manual'}" data-action="toggle-mine-mode" data-mode="manual">手入力で追加</button>
        </div>
        <div id="mine-mode-csv-panel">
          <p class="card-caption">ヘッダ: 出荷日,品目,品種名,等級,階級,本数,箱数,別本数（等級は省略すると「秀」。別扱いの箱は別本数に本数を入れる。旧形式の 規格=2L30 も読めます）</p>
          <label class="dropzone" for="mine-file-input">
            ${Icon.upload}
            <strong>タップしてCSVを選択</strong>
          </label>
          <input type="file" id="mine-file-input" accept=".csv,text/csv">
          <div class="paste-row">
            <textarea class="csv-text csv-edit csv-paste" id="mine-paste" placeholder="またはCSVを貼り付け（ヘッダ行を含めてOK）"></textarea>
            <button type="button" class="btn btn-secondary btn-sm" data-action="import-mine-paste">貼り付けた内容を取込</button>
          </div>
          <div id="mine-import-summary">${State.mineImportSummary || ''}</div>
        </div>
        <form id="mine-mode-manual-panel" data-action="submit-manual" class="stack">
          <div class="field date-field">日付
            <button type="button" class="date-trigger" id="mine-date-trigger" data-action="toggle-mine-calendar">
              <span id="mine-date-label">${State.mineDate ? Fmt.esc(Fmt.mmdd(State.mineDate)) : '日付を選択'}</span><span class="caret">▾</span>
            </button>
            <div id="mine-cal-mount"></div>
          </div>
          <input type="hidden" name="date" id="mine-date-value" value="${State.mineDate||''}">
          <label class="field">品種
            <div class="select-wrap"><select name="variety" required>${varietyOpts}</select></div>
          </label>
          <div id="variety-other-wrap" class="${mineVarieties.length ? 'hidden' : ''}">
            <label class="field">品種名（自由入力）
              <input type="text" name="varietyOther" list="variety-suggest" placeholder="例: シャローム" autocomplete="off">
            </label>
            ${varietyDatalist}
          </div>
          <label class="field">規格
            <div class="select-wrap"><select name="spec" required>
              <option value="2L30">2L30</option>
              <option value="2L50">2L50</option>
              <option value="L">L</option>
              <option value="M">M</option>
              <option value="別">別</option>
            </select></div>
          </label>
          <div id="betsu-wrap" class="hidden"><label class="field">別本数（1箱あたりの本数）<input type="number" name="betsuCount" inputmode="numeric" min="1" placeholder="例: 30"></label></div>
          <label class="field">箱数
            <div class="stepper">
              <button type="button" data-action="step-boxqty" data-dir="-1" aria-label="減らす">−</button>
              <input type="number" name="boxQty" value="1" min="1" inputmode="numeric">
              <button type="button" data-action="step-boxqty" data-dir="1" aria-label="増やす">＋</button>
            </div>
          </label>
          <button type="submit" class="btn btn-primary">追加する</button>
        </form>
      </div>
      ${UI.importErrorsHTML()}
    `;
  },

  /* 取り込めなかった行の置き場（2026-09-07 新設）。取込1回＝1枠で新しい順。
     上で選んでいる品目の分だけ出す（ユーザー判断＝季節ごとに片方しか使わないため）。 */
  importErrorsHTML(){
    const item = State.selectedItem || DEFAULT_ITEM;
    const list = Store.importErrors.filter(e=>(e.item||DEFAULT_ITEM) === item);
    if(!list.length) return '';
    // 同じ日に2回以上あるときだけ、見出しに時刻も添える（いつのぶんか見分けるため）
    const dayCount = {};
    list.forEach(e=>{ const d = String(e.at||'').slice(0,10); dayCount[d] = (dayCount[d]||0) + 1; });
    const rows = list.map(e=>{
      const d = new Date(e.at);
      const day = String(e.at||'').slice(0,10);
      const time = (dayCount[day] > 1 && !isNaN(d)) ? ' ' + d.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) : '';
      const kept = e.rows ? e.rows.length : 0;
      const cut = e.total > kept ? `（うち${kept}行を保存）` : '';
      // 何がダメだったかは残す（行番号はユーザー指示で外した＝そのまま直せる形にするため）
      const why = Array.from(new Set((e.rows||[]).flatMap(r=>r.reasons||[])));
      const text = (e.rows||[]).map(r=>r.raw||'').join('\n');
      return `<details class="collapse import-errors">
          <summary><span>${Fmt.esc(day)}${time}　${Fmt.esc(e.kind)}・${e.total}行${cut}</span></summary>
          <p class="card-caption" style="margin-top:var(--sp2)">読めなかった項目: <b>${Fmt.esc(why.join('・') || '不明')}</b>${e.header ? `<br><code>${Fmt.esc(e.header)}</code>` : ''}</p>
          <textarea class="csv-text csv-edit" id="err-text-${Fmt.esc(e.id)}" spellcheck="false">${Fmt.esc(text)}</textarea>
          <div class="btn-row" style="margin-top:var(--sp2)">
            <button class="btn btn-sm btn-primary" data-action="reimport-import-error" data-id="${Fmt.esc(e.id)}">取込</button>
            <button class="btn btn-sm btn-ghost" data-action="clear-import-error" data-id="${Fmt.esc(e.id)}">この枠を消す</button>
          </div>
        </details>`;
    }).join('');
    return `
      <div class="card">
        <div class="card-head"><h2 class="card-title">取り込めなかった行<span class="card-sub">${Fmt.esc(item)}</span></h2></div>
        <p class="card-caption">取込1回ぶんが1枠です。<b>枠の中の文字はそのまま直せます。</b>直したら「取込」を押してください。取り込めた行は消え、まだ読めない行だけ残ります。最新${IMPORT_ERR_KEEP}回分まで残ります。</p>
        <div class="stack" style="margin-top:var(--sp2)">${rows}</div>
        <button class="btn btn-sm btn-secondary" data-action="clear-import-errors-all" style="margin-top:var(--sp3)">全部消す</button>
      </div>`;
  },
  // 取込タブの見出しに出す警告マーク（控えが残っている品目のときだけ）
  importErrorMark(){
    const item = State.selectedItem || DEFAULT_ITEM;
    const n = Store.importErrors.filter(e=>(e.item||DEFAULT_ITEM) === item)
                                .reduce((s,e)=>s + (e.total||0), 0);
    return n ? `<span class="err-mark" title="取り込めなかった行が残っています">● ${n}行</span>` : '';
  },

  /* 作付の2ブロック（内容カード＋設定フォーム）。年度×品目に紐づくので、
     年度バーのある自分タブの末尾に出す（2026-09-07 に取込タブから移設）。 */
  sakutsukeBlocksHTML(){
    const allocOn = Compute.allocEnabled(); // 作型（新植／据置）を使う品目か
    const fmtTsubo = (n)=> (Number(n)||0).toLocaleString('ja-JP');

    // 編集用の登録済み行（追加順）
    const sakuEditRows = Compute.scopedSakutsuke().map(r=>`
      <div class="ship-row">
        <div class="ship-main">
          <span class="ship-name">${Fmt.esc(r.variety)}${allocOn ? ` <span class="tag-betsu">${Fmt.esc(r.type)}</span>` : ''}</span>
          <span class="ship-detail">${fmtTsubo(r.tsubo)}坪</span>
        </div>
        <button class="ship-del" data-action="delete-sakutsuke-row" data-id="${r.id}" aria-label="削除">${Icon.trash}</button>
      </div>`).join('');

    // 内容カード用：品種ごとに新植/据置を集計（表示は品種単位でまとめる）
    const sakuByVariety = [];
    Compute.scopedSakutsuke().forEach(r=>{
      let g = sakuByVariety.find(x=>x.variety===r.variety);
      if(!g){ g = {variety:r.variety, shinshoku:0, sueoki:0}; sakuByVariety.push(g); }
      if(r.type==='据置') g.sueoki += (Number(r.tsubo)||0); else g.shinshoku += (Number(r.tsubo)||0);
    });
    const sakuTotal = sakuByVariety.reduce((s,g)=>s + g.shinshoku + g.sueoki, 0);
    const sakuContentRows = sakuByVariety.map(g=>{
      // 作型を使わない品目では新植/据置の内訳を出さない（右の「計 N坪」だけで足りる）
      const parts = [];
      if(g.shinshoku>0) parts.push(`新植 ${fmtTsubo(g.shinshoku)}坪`);
      if(g.sueoki>0) parts.push(`据置 ${fmtTsubo(g.sueoki)}坪`);
      const detail = allocOn ? (parts.join(' ・ ') || '—') : '';
      return `
      <div class="ship-row">
        <div class="ship-main">
          <span class="ship-name">${Fmt.esc(g.variety)}</span>
          ${detail ? `<span class="ship-detail">${detail}</span>` : ''}
        </div>
        <div class="ship-amount tnum">計 ${fmtTsubo(g.shinshoku + g.sueoki)}坪</div>
      </div>`;
    }).join('');

    return `
      <div class="card">
        <div class="card-head"><h2 class="card-title">${Fmt.esc(String(State.selectedYear))}年の作付内容<span class="card-sub">${Fmt.esc(String(State.selectedItem))}</span></h2></div>
        ${(()=>{ const rng = Compute.seasonRange(State.selectedYear, State.selectedItem);
          // 暦年と違うシーズン（年をまたぐ品目）のときだけ、何月から何月までを指すのかを明示する
          return rng ? `<p class="card-caption" style="margin-bottom:var(--sp2)">この年度が指す期間: <b>${Fmt.esc(rng)}</b></p>` : ''; })()}
        ${sakuByVariety.length ? `
          <div class="stack">${sakuContentRows}</div>
          <div class="row-between" style="margin-top:var(--sp3)">
            <span class="card-caption">合計作付面積</span>
            <span class="tnum" style="font-size:0.9375rem;font-weight:600">${fmtTsubo(sakuTotal)}坪</span>
          </div>
        ` : '<p class="muted">この年度・品目の登録はまだありません。下の「作付設定」から追加してください。</p>'}
      </div>
      <details class="card collapse">
        <summary style="font-size:1rem"><span>${Fmt.esc(String(State.selectedYear))}年の作付設定（${Fmt.esc(String(State.selectedItem))}）</span></summary>
        <p class="card-caption" style="margin-top:var(--sp2)">この年度・この品目の品種と作付面積（坪）を登録します。<b>作付は年度ごと</b>なので、年度を切り替えると別の内容になります（新しい年度は空から入力）。${allocOn ? '同じ品種で新植分・据置分が両方ある場合は、それぞれ1行ずつ登録してください。' : ''}</p>
        <form id="sakutsuke-form" data-action="submit-sakutsuke" class="stack">
          <label class="field">品種
            <input type="text" name="variety" placeholder="例: バンコクスプリーム" autocomplete="off" required>
          </label>
          ${allocOn ? `<label class="field">区分
            <div class="select-wrap"><select name="type" required>
              <option value="新植">新植</option>
              <option value="据置">据置</option>
            </select></div>
          </label>` : ''}
          <label class="field">面積（坪）
            <input type="number" name="tsubo" inputmode="decimal" min="0" step="0.1" placeholder="例: 30" required>
          </label>
          <button type="submit" class="btn btn-primary">作付を追加</button>
        </form>
        ${Compute.scopedSakutsuke().length ? `<div class="stack" style="margin-top:var(--sp3)">${sakuEditRows}</div>` : ''}
      </details>`;
  },

      ${Icon.import}
      <p style="font-weight:600;color:var(--ink)">${Fmt.esc(title)}</p>

  toast(msg, opts){
    opts = opts || {};
    const region = document.getElementById('toast-region');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span>${Fmt.esc(msg)}</span>${opts.actionLabel ? `<button data-toast-action>${Fmt.esc(opts.actionLabel)}</button>` : ''}`;
    region.appendChild(el);
    if(opts.actionLabel && opts.onAction){
      el.querySelector('[data-toast-action]').addEventListener('click', ()=>{
        opts.onAction();
        el.remove();
      });
    }
    setTimeout(()=>{ el.remove(); }, opts.duration || 4000);
  },

  /* 確認モーダル。opts.altLabel / onAlt を渡すと、勧めたい選択肢を【上に全幅で1つ】足す。
     3つを横に並べるとスマホの幅で文字が潰れるので、段を分けて
     「上＝たぶんこちらが正しい」「下＝キャンセル／それでもこのまま」の形にしてある。 */
  modal(title, bodyHtml, opts){
    opts = opts || {};
    const hasAlt = !!opts.altLabel;
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-sheet">
          <button class="modal-close" id="modal-x-btn" aria-label="閉じる">×</button>
          <h2 class="modal-title">${Fmt.esc(title)}</h2>
          <div class="modal-body">${bodyHtml}</div>
          ${hasAlt ? `<div class="btn-row" style="margin-bottom:var(--sp3)">
            <button class="btn btn-primary" id="modal-alt-btn">${Fmt.esc(opts.altLabel)}</button>
          </div>` : ''}
          <div class="btn-row">
            <button class="btn btn-ghost" id="modal-cancel-btn">キャンセル</button>
            <button class="btn ${opts.danger?'btn-danger':(hasAlt?'btn-secondary':'btn-primary')}" id="modal-confirm-btn">${Fmt.esc(opts.confirmLabel||'確認')}</button>
          </div>
        </div>
      </div>`;
    const backdrop = root.querySelector('.modal-backdrop');
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) UI.closeModal(); });
    root.querySelector('#modal-x-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-cancel-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-confirm-btn').addEventListener('click', ()=>{
      if(opts.onConfirm) opts.onConfirm();
      UI.closeModal();
    });
    if(hasAlt){
      root.querySelector('#modal-alt-btn').addEventListener('click', ()=>{
        // 先に閉じる＝この後の取り込みが画面を描き直すので、閉じるのを後にすると一瞬ちらつく
        UI.closeModal();
        if(opts.onAlt) opts.onAlt();
      });
    }
  },
  closeModal(){
    document.getElementById('modal-root').innerHTML = '';
  },
  /* CSV書き出しモーダル。保存タブには年度バーが無いので、書き出す年度はここで選ぶ（2026-09-07）。
     年度を変えたら中身を組み立て直す＝モーダルを開き直す（作りは他のモーダルと同じ）。 */
  csvExportModal(item, year){
    const sections = App.csvSectionsFor(item, year);
    const years = Compute.yearsWithData(item);
    const yearOpts = [{v:'', label:'全年度まとめて'}].concat(years.map(y=>({v:y, label:`${y}年度`})))
      .map(o=>`<option value="${Fmt.esc(o.v)}" ${o.v===String(year||'')?'selected':''}>${Fmt.esc(o.label)}</option>`).join('');
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-sheet">
          <button class="modal-close" id="modal-x-btn" aria-label="閉じる">×</button>
          <h2 class="modal-title">CSVで書き出し</h2>
          <label class="field">書き出す範囲（品目: ${Fmt.esc(item)}）
            <div class="select-wrap"><select id="csv-year-select">${yearOpts}</select></div>
          </label>
          <div class="modal-body"><b>ダウンロード</b>を押すと保存の確認が出ます。使えない環境では、テキストを<b>コピー</b>して表計算ソフトに貼り付けてください。</div>
          ${sections.length ? '' : '<div class="modal-body">この年度には書き出すデータがありません。</div>'}
          ${sections.map((s,i)=>`
            <div class="stack" style="gap:var(--sp2)">
              <div class="row-between">
                <strong>${Fmt.esc(s.name)}（${s.rows}行）</strong>
                <div class="btn-row" style="width:auto; flex:0 0 auto">
                  <button class="btn btn-sm btn-secondary" data-csv-copy="${i}">コピー</button>
                  <button class="btn btn-sm btn-ghost" data-csv-dl="${i}">ダウンロード</button>
                </div>
              </div>
              <textarea class="csv-text" id="csv-text-${i}" readonly>${Fmt.esc(s.text)}</textarea>
            </div>`).join('')}
          <div class="modal-status" id="csv-status"></div>
          <div class="btn-row"><button class="btn btn-ghost" id="modal-cancel-btn">閉じる</button></div>
        </div>
      </div>`;
    const backdrop = root.querySelector('.modal-backdrop');
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) UI.closeModal(); });
    root.querySelector('#modal-x-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-cancel-btn').addEventListener('click', ()=>UI.closeModal());
    const status = root.querySelector('#csv-status');
    const setStatus = (msg, cls)=>{ status.textContent = msg; status.className = 'modal-status ' + (cls||'ok'); };
    // 年度を変えたら開き直す（中身・ファイル名・行数がまとめて入れ替わる）
    root.querySelector('#csv-year-select').addEventListener('change', (e)=>{
      UI.csvExportModal(item, e.target.value);
    });
    sections.forEach((s,i)=>{
      root.querySelector(`[data-csv-dl="${i}"]`).addEventListener('click', async (e)=>{
        const btn = e.currentTarget;
        btn.disabled = true;
        setStatus('保存を確認しています…');
        const res = await App.saveFile(s.filename, s.text, {
          bom:true, mime:'text/csv;charset=utf-8',
          altName: s.filename.replace(/\.csv$/i, '.txt') // csv不可の環境では.txtで保存
        });
        btn.disabled = false;
        if(res.ok){
          setStatus(res.savedAs
            ? `⤓ 「${s.name}」を ${res.savedAs} として保存しました（拡張子を .csv に変えるとExcelで開けます）`
            : `⤓ 「${s.name}」を保存しました（保存先をご確認ください）`);
          UI.toast('保存しました');
        } else {
          setStatus(App.saveErrorMessage(res.code), 'warn');
        }
      });
      root.querySelector(`[data-csv-copy="${i}"]`).addEventListener('click', async ()=>{
        const ta = root.querySelector(`#csv-text-${i}`);
        ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try{ await navigator.clipboard.writeText(s.text); ok = true; }
        catch(_){ try{ ok = document.execCommand('copy'); }catch(__){ ok = false; } }
        if(ok){ setStatus(`✓ 「${s.name}」をコピーしました。表計算ソフトに貼り付けてください`); UI.toast('コピーしました'); }
        else{ setStatus('全選択しました。Ctrl+C（長押し→コピー）で取得してください', 'warn'); }
      });
    });
  },

  // 未確定だった市況行の箱単価を後から確定入力するモーダル
  fillPriceModal(key){
    const rec = Store.sanchi.get(key);
    if(!rec){ UI.toast('対象の市況行が見つかりませんでした（産地データが未取込の可能性）', {duration:5000}); return; }
    const specLabel = (rec.grade==='別') ? '別' : App.specToStr(rec.size, rec.count);
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-sheet">
          <button class="modal-close" id="modal-x-btn" aria-label="閉じる">×</button>
          <h2 class="modal-title">箱単価を入力</h2>
          <div class="modal-body">
            <div class="fill-target">
              <span class="fill-date tnum">${Fmt.date(rec.date)}</span>
              <span class="fill-name">${Fmt.esc(rec.variety)}</span>
              <span class="fill-spec">${Fmt.esc(specLabel)}${rec.grade==='別'?'':`　本数${rec.count}`}</span>
            </div>
            <p class="muted" style="font-size:0.8125rem">精算書などで分かった<b>箱単価（円）</b>を入力してください。保存すると、この行に紐づく自分の売上・平均単価・価格推移に反映されます。</p>
            <label class="fill-input-row">
              <span class="fill-input-label">箱単価</span>
              <input type="number" id="fill-price-input" class="fill-input" inputmode="numeric" min="1" step="1" placeholder="例: 7500" />
              <span class="fill-input-unit">円/箱</span>
            </label>
          </div>
          <div class="modal-status" id="fill-status"></div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="modal-cancel-btn">キャンセル</button>
            <button class="btn btn-primary" id="fill-save-btn">保存</button>
          </div>
        </div>
      </div>`;
    const backdrop = root.querySelector('.modal-backdrop');
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) UI.closeModal(); });
    root.querySelector('#modal-x-btn').addEventListener('click', ()=>UI.closeModal());
    root.querySelector('#modal-cancel-btn').addEventListener('click', ()=>UI.closeModal());
    const status = root.querySelector('#fill-status');
    const input = root.querySelector('#fill-price-input');
    const setStatus = (msg, cls)=>{ status.textContent = msg; status.className = 'modal-status ' + (cls||'warn'); };
    setTimeout(()=>{ try{ input.focus(); }catch(_){} }, 30);
    const save = ()=>{
      const n = Norm.num(input.value);

      UI.renderMain();
      UI.toast(`箱単価 ${Fmt.yen(n)} を保存しました`);
