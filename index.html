<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color-meta" name="theme-color" content="#F6F8F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="出荷分析">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>🌸 出荷分析</title>
<style>
/* ---- 配色トークン ----
   ライトが既定で、ダークは下の2ブロックが上書きする。
   ⚠ 色を1つ足すときに編集するのは【ライトの :root】と【ダークの2ブロック】。
   ダークが2箇所あるのは、素のCSSではメディアクエリの内と外で1つのルール本体を
   共有できないため（プリプロセッサ無しの制約）。ライト側はここ1箇所だけ。 */
:root{
  --bg:#F6F8F4; --surface:#FFFFFF; --surface-2:#EFF3EC; --ink:#17201B; --ink-muted:#4C574E;
  --border:#E2E8DD; --primary:#2E7D5B; --primary-soft:#DCEDE3; --accent:#C2568A; --accent-soft:#F6E2ED;
  --warn:#C77A2A; --warn-soft:#F7E9D4; --danger:#C0453B; --danger-soft:#F8DEDB;
  --accent-text:#9E3F70; --warn-text:#9A5B18; --danger-text:#A6392F;
  --chart-2l30:#2E7D5B; --chart-2l50:#7FC4A0; --chart-l50:#E0A458; --chart-other:#B8BDC2;
  /* 価格推移の背景に敷く階級構成バー。折れ線が --primary（緑）なので緑系は避けている。
     割り当ては箱数の多い順で、階級名とは結びつけない（語彙は市況CSVが決める）。 */
  --chart-size1:#2F6DB5; --chart-size2:#E0A458; --chart-size3:#8A72C2;
  /* 棒の一番上に乗る【その他】用。ほかの帯は薄く敷くが、これだけは濃いまま出す
     ＝「いつもと違う規格が出た日」の合図なので目立たないと意味がない。 */
  --chart-alert:#DE2113;
  /* 年ごとの折れ線（箱単価 5カ年比較）。yr1＝選択中の年度で、yr5 に向かって古くなるほど薄い。
     色相は緑で揃える＝「同じものを年違いで並べている」ことを色で言うため（品種色とは別系統）。 */
  --yr1:#1B5E3F; --yr2:#2E7D5B; --yr3:#5FB08A; --yr4:#93CDB2; --yr5:#C3E4D4;
  --cal-sun:#D64541; --cal-sat:#2F6DB5; --chart-blue:#2F6DB5;
  --mk1:#D6EBDF; --mk2:#F6E6C8; --mk3:#F6DCE9; --mk4:#D9E7F4; --mk5:#E7DDF1; --mk6:#C9ECEF; --mk7:#E1E5C7;
  --dn1:#3C9A6B; --dn2:#D89A3C; --dn3:#D06B98; --dn4:#4784C6; --dn5:#8A72C2; --dn6:#31B9C6; --dn7:#7A7822;
  --shadow:0 1px 2px rgba(20,40,30,.06), 0 4px 16px rgba(20,40,30,.05);
  /* 色以外（余白・角丸・書体）はテーマで変わらないのでここだけ */
  --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --font: -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
  --dur:190ms;
  /* data-theme が付く前の1フレームだけ OS 設定に追従させる */
  color-scheme: light dark;
}
/* OSがダーク かつ アプリ内でライトを明示していない時。
   :not([data-theme="light"]) が無いと、OSダークの端末でライトを選んでも
   このブロックが勝ち続ける（下の [data-theme] 側と詳細度が同じため）。 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10130F; --surface:#191E18; --surface-2:#212820; --ink:#E8EDE6; --ink-muted:#9AA79C;
    --border:#2C342B; --primary:#5BB98A; --primary-soft:#1E3A2C; --accent:#E58BB6; --accent-soft:#3A2430;
    --warn:#E0A458; --warn-soft:#3A2E1B; --danger:#E27469; --danger-soft:#3A211E;
    --accent-text:#E58BB6; --warn-text:#E0A458; --danger-text:#E27469;
    --chart-2l30:#4FA97C; --chart-2l50:#8FD4B4; --chart-l50:#E0A458; --chart-other:#8A9088;
    --chart-size1:#6FA8E0; --chart-size2:#E0A458; --chart-size3:#B79BE8;
    --chart-alert:#F84B36;
    --yr1:#7FE3AF; --yr2:#5BB98A; --yr3:#43906B; --yr4:#356E53; --yr5:#2B5340;
    --cal-sun:#E27469; --cal-sat:#6FA8E0; --chart-blue:#6FA8E0;
    --mk1:#24402F; --mk2:#3A2E1B; --mk3:#3A2430; --mk4:#1E3140; --mk5:#2E2741; --mk6:#123A3D; --mk7:#38381E;
    --dn1:#5BB98A; --dn2:#E0A458; --dn3:#E58BB6; --dn4:#6FA8E0; --dn5:#B79BE8; --dn6:#5DC2C9; --dn7:#969B41;
    --shadow:none;
  }
}
/* アプリ内でダークを選んだ時（OSがライトでも効く）。上のメディアブロックと同じ値。 */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#10130F; --surface:#191E18; --surface-2:#212820; --ink:#E8EDE6; --ink-muted:#9AA79C;
  --border:#2C342B; --primary:#5BB98A; --primary-soft:#1E3A2C; --accent:#E58BB6; --accent-soft:#3A2430;
  --warn:#E0A458; --warn-soft:#3A2E1B; --danger:#E27469; --danger-soft:#3A211E;
  --accent-text:#E58BB6; --warn-text:#E0A458; --danger-text:#E27469;
  --chart-2l30:#4FA97C; --chart-2l50:#8FD4B4; --chart-l50:#E0A458; --chart-other:#8A9088;
  --chart-size1:#6FA8E0; --chart-size2:#E0A458; --chart-size3:#B79BE8;
  --chart-alert:#F84B36;
  --yr1:#7FE3AF; --yr2:#5BB98A; --yr3:#43906B; --yr4:#356E53; --yr5:#2B5340;
  --cal-sun:#E27469; --cal-sat:#6FA8E0; --chart-blue:#6FA8E0;
  --mk1:#24402F; --mk2:#3A2E1B; --mk3:#3A2430; --mk4:#1E3140; --mk5:#2E2741; --mk6:#123A3D; --mk7:#38381E;
  --dn1:#5BB98A; --dn2:#E0A458; --dn3:#E58BB6; --dn4:#6FA8E0; --dn5:#B79BE8; --dn6:#5DC2C9; --dn7:#969B41;
  --shadow:none;
}
/* アプリ内でライトを選んだ時。色は :root がそのまま効く（上のメディアブロックを
   :not([data-theme="light"]) で外してあるため）ので、固定するのは color-scheme だけ。
   これが無いと OS がダークの端末でネイティブ select のドロップダウンだけ暗いまま残る。 */
:root[data-theme="light"]{ color-scheme: light; }
*{box-sizing:border-box;}
/* 一番上／一番下で、それ以上引っぱっても余白が伸びない（ゴムのように跳ねない）。
   引っぱりで再読み込みが走るのも止まる。年度バーを指で払う操作と、ページを
   上下に引っぱる操作が混ざるようになったので、縦は跳ねずに止めておく。 */
html,body{margin:0; padding:0; overscroll-behavior-y:none;}
html{font-size:112.5%; -webkit-text-size-adjust:100%; text-size-adjust:100%;} /* 既定16px→18px。文字の自動リサイズで再レイアウトが起きないよう固定 */
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  font-size:0.9375rem; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit; color:inherit;}
h1,h2,h3,p{margin:0;}
.tnum{font-variant-numeric:tabular-nums;}
::selection{background:var(--primary-soft);}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* svh はキーボード開閉で値が変わらない（vh は環境により変動しページが揺れる） */
#app{min-height:100vh; min-height:100svh; padding-bottom:calc(64px + env(safe-area-inset-bottom) + 12px);}
/* 入力へフォーカスした時の自動スクロールが、上のヘッダー/下のタブバーと干渉して
   行ったり来たりしないよう、あらかじめ余白を確保しておく */
/* アプリバーは2段で約100px。入力へスクロールした時にバーの裏へ潜らない余白を取る */
input, textarea, select{scroll-margin-top:116px; scroll-margin-bottom:96px;}

/* ---- App bar（2段） ---- */
/* PWAでは safe-area 分だけ上に伸ばし、ステータスバーの裏もバーと同じ色で塗る */
#appbar{
  position:sticky; top:0; z-index:20; display:flex; flex-direction:column; gap:var(--sp2);
  padding:var(--sp2) var(--sp4) var(--sp3); padding-top:calc(var(--sp2) + env(safe-area-inset-top));
  background:var(--surface); border-bottom:1px solid var(--border);
}
.appbar-row{display:flex; align-items:center; justify-content:space-between; gap:var(--sp2);}
/* 品目セレクタを必ず操作できるようにする。幅が足りない時に削るのは飾りであるアプリ名の側。 */
.wordmark{font-weight:700; font-size:1rem; display:flex; align-items:center; gap:var(--sp2); white-space:nowrap;
  flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;}
.appbar-right{display:flex; align-items:center; gap:var(--sp2); flex:0 0 auto;}

/* ---- 年度バー（アプリバー2段目） ----
   真ん中に来ている年度が選択中。指で払っても、ゆっくり動かしても選べる。
   ⚠ ブラウザ任せの横スクロールは使っていない。使うと勢いを止められず、強く払った時に
   2つ3つ流れてしまい、あとから引き戻すしかない＝「行って戻る」動きが見えてしまうため。
   指の動きは JS が受け取り（UI.wireYearBar）、帯を transform でずらす。
   動きの滑らかさは、下の .is-animating（CSSのtransition）に任せる。
   位置は「年度は必ず4桁＝幅は全部同じ」を使って計算で出す。 */
.year-bar{
  position:relative; overflow:hidden;
  /* アプリバーの左右パディングを打ち消して全幅で流す */
  margin:0 calc(var(--sp4) * -1);
  /* 取込・保存タブでは中身を空にするが、高さはここで確保したまま残す。
     消して詰めるとタブを行き来するたびにアプリバーの高さが変わり、画面が上下に跳ねる。 */
  min-height:34px;
  /* このバーの上の指の動きは、縦も含めて全部こちらで受け取る。
     ⚠ pan-y（縦だけブラウザに任せる）にしてはいけない。速く払うと指はわずかに縦へも
     ぶれるので、ブラウザが「縦スクロールだ」と判断して操作を横取りする。すると
     ①払っている途中で操作が打ち切られ、指を離さず動かしても戻ってこない
     ②同時に中身が少し縦にスクロールする（2026-09-06 に実際に起きた両方の症状）。 */
  touch-action:none;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.year-track{display:flex; align-items:stretch; will-change:transform;}
.year-track.is-animating{transition:transform 220ms cubic-bezier(.22,.61,.36,1);}
.year-item{
  flex:0 0 96px;
  position:relative; padding:2px 0 9px; border:0; background:none; cursor:pointer;
  font-family:inherit; font-size:16px; font-weight:600; line-height:1.4;
  color:var(--ink-muted); white-space:nowrap; text-align:center;
  /* 押した瞬間に灰色の四角がかぶって濁るのを消す（スマホの標準の押下表示） */
  -webkit-tap-highlight-color:transparent;
  /* 選択中と同じ太さで場所を取っておく。太字に変わった時に列が伸び縮みしない */
  letter-spacing:0.01em;
}
.year-item.is-on{color:var(--primary); font-weight:700;}
/* 中央に来た年度の下の短い線。「離したらこれになる」の予告として、
   指で動かしている間も中央に一番近いものへ付け替える。 */
.year-item.is-on::after{
  content:''; position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  width:44px; height:3px; border-radius:2px; background:var(--primary);
}
.data-chip{
  font-size:0.75rem; color:var(--ink-muted); background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--r-pill); padding:4px 10px; white-space:nowrap;
}
/* アプリバーのセレクタ。フォーム用の select より小さく、指では押しやすい高さを確保する。
   font-size は 16px を下回らせないこと。iOS Safari は 16px 未満の入力欄にフォーカスすると
   ページ全体をズームするため、0.875rem(=15.75px) だとセレクタを触るたびに本文が動いていた。
   1rem(18px) にすると全角7文字が幅に収まらなくなるので、ちょうど 16px で止める。
   scroll-margin も打ち消す：下の input/textarea 用の 116px は「アプリバーの裏に潜らせない」
   ための余白だが、アプリバー自身（高さ約101px・sticky）の中にいるこのセレクタに適用すると
   常に「はみ出している」判定になり、フォーカスのたびにページが上へ引き戻される。 */
.scope-sel{flex:0 0 auto; min-width:0;}
.scope-sel select{
  width:auto; min-height:36px; padding:0 28px 0 12px; font-size:16px; font-weight:700;
  color:var(--ink); border-radius:var(--r-pill); text-overflow:ellipsis;
  scroll-margin-top:0; scroll-margin-bottom:0;
}
.scope-sel.select-wrap::after{right:11px; width:6px; height:6px;}
/* 品目は全角7文字が入る幅で固定し、名前を中央に置く（2026-09-08b にユーザー指定で右詰めから変更）。
   幅を可変にすると品目名の長さで右端が動き、テーマボタンとの間隔が名前ごとに変わる。

   ⚠⚠ 閉じている <select> の中の文字は text-align では動かせない（iOS Safari で効かない）。
      実際 2026-09-08b に text-align:center を当てて「中央寄せになっていない」と指摘された。
      以前この欄が direction:rtl で右寄せしてあったのも同じ理由（コメントに残っていた）。
      そこで【見た目はこちらで描き、<select> は透明にして操作だけ受け持つ】形にした。
      これならどのブラウザでも必ず中央に来る。
   ⚠ <select> の font-size は 16px のまま残すこと。透明でも、16px未満の入力欄に
      フォーカスすると iOS はページ全体をズームする（この欄で一度踏んだ罠）。
   ⚠ 見えているのはラベルなので、品目を切り替えたら UI.renderAppBar 側で書き換える。 */
.scope-sel{position:relative; width:156px; height:36px;
  border-radius:var(--r-pill); background:var(--surface-2); border:1px solid var(--border);}
#item-select{position:absolute; inset:0; width:100%; height:100%; min-height:0; opacity:0;}
.scope-sel-label{
  position:absolute; left:22px; right:22px; top:0; bottom:0;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:700; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;
}
.icon-btn{
  width:36px; height:36px; border-radius:var(--r-pill); border:1px solid var(--border); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.icon-btn svg{width:18px; height:18px;}
.storage-banner{
  background:var(--danger-soft); color:var(--danger-text); font-size:0.8125rem; padding:8px var(--sp4);
  text-align:center; border-bottom:1px solid var(--border);
}

/* ---- Main / layout ---- */
main{max-width:640px; margin:0 auto; padding:var(--sp4); display:flex; flex-direction:column; gap:var(--sp4);}
/* 一番上でさらに上へ引いた時に、中身だけが少しだけ伸びる（約3mm＝18px が上限）。
   ブラウザ標準の大きな伸び（と引っぱって再読み込み）は overscroll-behavior で止めてあり、
   代わりにこの小さな伸びだけを出す。指を離すと下の transition でなめらかに戻る。 */
main.is-bouncing{transition:transform 260ms cubic-bezier(.22,.61,.36,1);}

/* ---- Cards ---- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--sp4); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:var(--sp3);
}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:var(--sp2);}
.card-title{font-size:1rem; font-weight:600;}
/* 見出しに添える補足（表示中の品目名など） */
.card-sub{margin-left:8px; font-size:0.8125rem; font-weight:600; color:var(--ink-muted);}
/* 棒をタップした時の読み出し。見出しの右の空きに置くだけの小さなもので、
   大きな詳細カードの代わり（ユーザー指定 2026-09-08b）。タップするまでは空。
   ⚠ 縮ませない（flex:0 0 auto）。縮ませると 320px 幅の端末で「5/12　28箱」が
     途中で切れて数字が読めなくなる（実測）。狭い時に折り返すのは見出しの側でよい。
   ⚠ 枠と地の色は .chart-detail（グラフ下の大きい詳細）と同じものを使う。
     白いままだと「そこに詳細が出ている」と気づけない（ユーザー指摘）。
     :empty で、タップ前は枠ごと消しておく＝空の箱が浮かない。 */
.tap-readout{margin-left:auto; flex:0 0 auto; white-space:nowrap;
  font-size:0.8125rem; font-weight:700; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-pill);
  padding:3px 8px;
  /* ⚠ 幅は固定。日付や桁数で伸び縮みすると、タップするたび見出しの右が動いて落ち着かない
     （ユーザー指摘 2026-09-08b）。いちばん長い「12/18(火)　9,999箱」を実測して 134.3px。
     ＋左右padding16＋border2＝152.3 なので 154px 取り、中身は中央に置く。 */
  width:154px; text-align:center;}
.tap-readout:empty{display:none;}
.card-caption{font-size:0.75rem; color:var(--ink-muted);}
.screen-title{font-size:1.25rem; font-weight:700;}
/* 見出しの右にチップを添える行（保存タブの件数など） */
.title-row{display:flex; align-items:center; justify-content:space-between; gap:var(--sp3);}
.title-row .screen-title{flex:0 0 auto;}
.title-row .data-chip{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;}
/* 取り込めなかった行が残っていることの合図。見出しの右端に警告色で出す。 */
.err-mark{flex:0 0 auto; margin-left:auto; color:var(--warn-text); background:var(--warn-soft);
  font-size:0.8125rem; font-weight:600; padding:3px 10px; border-radius:999px; white-space:nowrap;}

/* ---- Buttons ---- */
.btn{
  min-height:48px; border-radius:var(--r-md); border:1px solid transparent; padding:0 var(--sp4);
  font-size:0.9375rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  gap:var(--sp2); transition:transform var(--dur) ease-out, opacity var(--dur) ease-out; width:100%;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-secondary{background:var(--primary-soft); color:var(--primary);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-sm{min-height:36px; width:auto; padding:0 var(--sp3); font-size:0.8125rem;}
.btn-row{display:flex; gap:var(--sp3);}

/* ---- Segmented control ---- */
.segmented{display:flex; background:var(--surface-2); border-radius:var(--r-md); padding:3px; gap:3px;}
.segmented button{
  flex:1; border:none; background:transparent; padding:10px; border-radius:var(--r-sm); font-size:0.875rem;
  font-weight:600; color:var(--ink-muted); cursor:pointer;
}
.segmented button[aria-selected="true"]{background:var(--surface); color:var(--primary); box-shadow:var(--shadow);}

/* ---- Chips / badges ---- */
.badge{display:inline-flex; align-items:center; gap:4px; border-radius:var(--r-pill); padding:3px 10px; font-size:0.75rem; font-weight:600;}
.badge-matched{background:var(--primary-soft); color:var(--primary);}
.badge-unmatched{background:var(--warn-soft); color:var(--warn-text);}
.badge-nomatch{background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--border);}

/* ---- Toast ---- */
#toast-region{position:fixed; left:0; right:0; bottom:calc(64px + env(safe-area-inset-bottom) + 8px); z-index:90; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
.toast{
  pointer-events:auto; background:var(--ink); color:var(--bg); border-radius:var(--r-md); padding:10px 14px;
  font-size:0.875rem; display:flex; align-items:center; gap:var(--sp3); box-shadow:var(--shadow);
  max-width:90vw; animation:toast-in var(--dur) ease-out;
}
.toast button{background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:0.875rem;}
@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---- Modal ---- */
.modal-backdrop{position:fixed; inset:0; background:rgba(10,15,10,.45); z-index:70; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{
  background:var(--surface); width:100%; max-width:640px; border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:var(--sp5); padding-bottom:calc(var(--sp5) + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:var(--sp4);
  animation:sheet-in var(--dur) ease-out; max-height:90vh; overflow-y:auto; position:relative;
}
.modal-close{position:absolute; top:8px; right:8px; width:40px; height:40px; border:none; background:transparent; color:var(--ink-muted); font-size:1.625rem; line-height:1; cursor:pointer; border-radius:var(--r-pill); display:inline-flex; align-items:center; justify-content:center;}
@keyframes sheet-in{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-title{font-size:1.0625rem; font-weight:700;}
.modal-body{color:var(--ink-muted); font-size:0.875rem;}
.modal-status{font-size:0.8125rem; font-weight:700; min-height:1.2em; text-align:center;}
.modal-status.ok{color:var(--primary);}
.modal-status.warn{color:var(--warn-text);}
/* font-size は 16px 以上を維持（iOSは16px未満の入力にフォーカスすると自動ズームする） */
.csv-text{width:100%; min-height:110px; max-height:200px; resize:vertical; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16px; line-height:1.5; white-space:pre; overflow:auto; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface-2); color:var(--ink); padding:8px;}
/* ---- 自分で打ち直す欄（貼り付け・取り込めなかった行の直し）は折り返す ----
   ⚠ 横スクロールする入力欄は iOS でカーソルの当たり判定が壊れる。実機で
   ①押した場所と違う所にカーソルが入る ②画面外の左下が選ばれて辞書やペーストが出る
   ③一番長い行の右端（箱単価）にどうしても届かない、の3つが起きた（2026-09-07 報告）。
   右に余白を足す手も試したが、横スクロールする箱では右の余白がスクロールできる範囲に
   入らないため、長い行ほど届かなくなって逆効果だった。
   折り返せば横に流れる場所が無くなり、どの文字も必ず画面の中に来る。 */
/* 高さは中身に合わせて JS(App.autoGrowCsv) が伸ばす。
   ⚠ max-height を当ててはいけない＝欄の中でスクロールできるようになった途端、
     指がページではなく欄の中身を動かしてしまう（キーボード中は特にひどい）。 */
.csv-edit{white-space:pre-wrap; overflow-wrap:anywhere; overflow:hidden;
  max-height:none; resize:none;}

/* ---- Forms ---- */
label.field{display:flex; flex-direction:column; gap:6px; font-size:0.8125rem; color:var(--ink-muted); font-weight:500;}
.select-wrap{position:relative;}
select, input[type="date"], input[type="text"], input[type="number"]{
  width:100%; min-height:48px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2);
  color:var(--ink); padding:0 var(--sp3); font-size:0.9375rem; appearance:none; -webkit-appearance:none;
}
select{padding-right:36px; background-image:none;}
.select-wrap::after{
  content:""; position:absolute; right:14px; top:50%; width:8px; height:8px; border-right:2px solid var(--ink-muted);
  border-bottom:2px solid var(--ink-muted); transform:translateY(-70%) rotate(45deg); pointer-events:none;
}
.stepper{display:flex; align-items:center; gap:var(--sp2);}
.stepper button{width:44px; height:44px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2); font-size:1.25rem; cursor:pointer;}
.stepper input{text-align:center;}
.dropzone{
  display:flex; flex-direction:row; align-items:center; justify-content:center; gap:8px; text-align:center;
  border:1.5px dashed var(--border); border-radius:var(--r-md); padding:10px var(--sp3); cursor:pointer; color:var(--ink-muted);
  min-height:44px;
}
.dropzone strong{color:var(--ink); font-size:0.9375rem;}
.dropzone svg{width:20px; height:20px; color:var(--primary); flex-shrink:0;}
input[type="file"]{display:none;}

/* ---- Tabs (bottom nav) ---- */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50; height:calc(64px + env(safe-area-inset-bottom));
  background:var(--surface); border-top:1px solid var(--border); display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border:none; background:none; color:var(--ink-muted); cursor:pointer; min-height:44px;
}
.tab svg{width:22px; height:22px;}
.tab span{font-size:0.6875rem; font-weight:500;}
.tab[aria-selected="true"]{color:var(--primary);}
.tab[aria-selected="true"] span{font-weight:700;}
/* 入力中もタブバーの位置は動かさない（キーボードに覆われるだけにする）。
   持ち上がり分の打ち消しは JS が transform で行う。
   ⚠ #appbar をここに足さないこと＝アプリバーは動かさない（App.bindKeyboardShift のコメント参照） */
#tabbar{will-change:transform;}

/* ペースト取込欄（コンパクト・常時表示） */
.paste-row{display:flex; flex-direction:column; gap:var(--sp2); margin-top:var(--sp2);}
.csv-paste{min-height:72px;}

/* ---- KPI ---- */
.kpi-card{border:1.5px solid var(--accent); background:var(--surface); position:relative; overflow:hidden;}
.kpi-label{font-size:0.75rem; color:var(--ink-muted); font-weight:600;}
.kpi-value{font-size:clamp(2rem,8vw,2.75rem); font-weight:700; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.kpi-sub{display:flex; gap:var(--sp4); font-size:0.8125rem; color:var(--ink-muted); flex-wrap:wrap;}
.kpi-sub b{color:var(--ink); font-weight:600;}
.kpi-secondary{display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp3); padding-top:var(--sp2); border-top:1px dashed var(--border);}
.kpi-sec-label{font-size:0.8125rem; color:var(--ink-muted); font-weight:600;}
.kpi-sec-value{font-size:1.5rem; font-weight:700; color:var(--accent-text);}
.kpi-sec-value small{font-size:0.875rem; font-weight:600; color:var(--ink-muted); margin-left:2px;}
.tag-betsu{display:inline-block; font-size:0.6875rem; font-weight:700; color:var(--warn-text); background:var(--warn-soft); border-radius:var(--r-sm); padding:1px 6px; vertical-align:middle;}

/* ---- Empty state ---- */
.empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; gap:var(--sp3); padding:var(--sp6) var(--sp4); color:var(--ink-muted);}
.empty-state svg{width:40px; height:40px; color:var(--border);}

/* ---- Legend ---- */
.legend{display:flex; flex-direction:column; gap:var(--sp2);}
.legend-item{display:flex; align-items:center; gap:var(--sp3); font-size:0.9375rem; padding:8px 6px; border-radius:var(--r-sm); cursor:pointer; border:1px solid transparent;}
.legend-item[data-active="true"]{border-color:var(--border); background:var(--surface-2);}
.legend-dot{width:16px; height:16px; border-radius:4px; flex-shrink:0;}
.legend-label{flex:1; font-weight:600;}
.legend-val{color:var(--ink-muted); font-size:0.875rem; white-space:nowrap;}
.legend-val-strong{color:var(--ink); font-weight:700;}
.donut-col{display:flex; flex-direction:column; align-items:center; gap:var(--sp3);}
.donut-col .legend{width:100%; gap:2px;}
.donut-col .legend-item{padding:4px 6px;}
.donut-col .legend-val{font-size:0.9375rem; font-weight:600;}
.donut-col .legend-val-strong{color:var(--ink-muted); font-weight:600;}

/* ---- Donut / chart wrap ---- */
.chart-wrap{position:relative; width:100%;}
.chart-wrap svg{width:100%; height:auto; display:block; overflow:visible;}
.chart-scroll{overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;}
.chart-wrap .chart-scroll svg{width:auto; max-width:none;}
/* 横スクロールしても左端に固定するY軸ラベル */
.chart-yaxis{position:absolute; left:0; top:0; z-index:2; pointer-events:none; background:var(--surface); border-right:1px solid var(--border);}
.chart-yaxis svg{display:block;}
.donut-svg{width:150px; height:150px; flex-shrink:0; max-width:100%;}
.donut-center-num{font-size:1.25rem; font-weight:700; fill:var(--ink);}
.donut-center-lbl{font-size:0.625rem; fill:var(--ink-muted);}

.chart-caption{font-size:0.75rem; color:var(--warn-text); background:var(--warn-soft); border-radius:var(--r-sm); padding:6px 10px;}
/* グラフの読み方の説明。chart-caption は「データ不足」等の注意書き用（警告色）なので、
   ただの説明にそれを使うと警告に見える。こちらは色を付けない。 */
.chart-note{font-size:0.75rem; color:var(--ink-muted); padding:2px 2px; margin:0;}
/* 折れ線の詳細表示（固定位置。タップしたプロットの内容を表示） */
.chart-detail{display:flex; align-items:center; gap:10px; min-height:72px; padding:8px 12px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--border); color:var(--ink);}
.chart-detail[data-empty="true"]{color:var(--ink-muted); font-size:0.8125rem;}
.chart-detail .cd-dot{width:12px; height:12px; border-radius:3px; flex-shrink:0;}
.chart-detail .cd-body{display:flex; flex-direction:column; gap:2px; min-width:0;}
.chart-detail .cd-name{font-weight:700; font-size:0.9375rem;}
.chart-detail .cd-info{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:0.875rem; color:var(--ink-muted);}
.chart-detail .cd-price{font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
/* その日の箱数。値段より控えめに（主役は値段で、箱数は「どれだけの量の話か」の補足） */
.chart-detail .cd-boxes{color:var(--ink-muted);}
.chart-detail .cd-tag{font-size:0.75rem; color:var(--ink-muted); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-pill); padding:2px 8px;}
.selector-row{display:flex; gap:var(--sp3);}
.selector-row .field{min-width:0;}
.selector-row .variety-field{flex:1; font-size:0.9375rem; color:var(--ink); font-weight:400; gap:0;}
.date-field{position:relative;}
.date-trigger{
  width:100%; min-height:48px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2);
  color:var(--ink); padding:0 var(--sp3); font-size:0.9375rem; cursor:pointer; text-align:left;
  display:flex; align-items:center; justify-content:space-between; gap:6px; font-variant-numeric:tabular-nums;
}
.date-trigger .caret{color:var(--ink-muted); font-size:0.75rem;}
.cal-backdrop{position:fixed; inset:0; z-index:39;}
.cal-pop{
  position:absolute; top:calc(100% + 6px); left:0; z-index:40; width:330px; max-width:calc(100vw - 32px);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow); padding:var(--sp3);
}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp2);}
.cal-head button{width:44px; height:44px; border:none; background:var(--surface-2); border-radius:var(--r-sm); cursor:pointer; font-size:1.375rem; color:var(--ink);}
.cal-title{font-weight:700; font-size:1.0625rem;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
.cal-wd{text-align:center; font-size:0.8125rem; font-weight:600; color:var(--ink-muted); padding:5px 0;}
.cal-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:var(--r-sm); font-size:1.0625rem; font-weight:600; font-variant-numeric:tabular-nums; border:none; background:transparent; color:var(--ink); cursor:pointer; padding:0;}
.cal-day.enabled{color:var(--ink);}
.cal-day.enabled:active{background:var(--primary-soft);}
.cal-day.disabled{color:var(--ink-muted); opacity:0.4; font-weight:400; cursor:default;}
.cal-wd.cal-sun, .cal-day.cal-sun{color:var(--cal-sun);}
.cal-wd.cal-sat, .cal-day.cal-sat{color:var(--cal-sat);}
.cal-day.selected{background:var(--primary); color:#fff; font-weight:700;}
.cal-day.empty{visibility:hidden;}
.series-legend{display:flex; flex-direction:column; gap:2px;}
.series-legend .legend-item{cursor:default; font-size:0.9375rem; padding:6px; min-height:32px; border-radius:var(--r-sm);}
.series-legend .legend-item[data-action]{cursor:pointer;}
.series-legend .legend-item[data-action]:active{background:var(--surface-2);}
.series-legend .legend-item.series-off{opacity:0.4;}
.series-legend .legend-item.series-off .legend-label{text-decoration:line-through;}
.series-dot{width:28px; height:6px; border-radius:3px; flex-shrink:0;}
.series-muted{opacity:0.5;}

/* ---- Shipment list ---- */
.ship-row{display:flex; align-items:center; justify-content:space-between; gap:var(--sp3); padding:var(--sp3); border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface-2);}
.ship-row + .ship-row{margin-top:var(--sp2);}
/* 日別カードは月の枠（--surface-2）の中に入るので、地の色を変えて入れ子を見せる */
.ship-day-card{padding:var(--sp3); border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface);}
.ship-day-card + .ship-day-card{margin-top:var(--sp3);}
/* 月ごとの格納（既定は閉じる）。開くとその月の日別カードが並ぶ */
.ship-month{border:1px solid var(--border); border-radius:var(--r-md); padding:var(--sp3); background:var(--surface-2);}
.ship-month + .ship-month{margin-top:var(--sp2);}
/* 見出しは折り返さず1行に収める。幅が足りない時は中央の meta だけを … で切り、
   年月と金額は最後まで削らない（flex:0 0 auto で固定、meta のみ 0 1 auto で縮む）。 */
.ship-month > summary{font-size:1rem; min-height:44px; gap:6px; flex-wrap:nowrap;}
.ship-month > summary > span{white-space:nowrap; overflow:hidden;}
/* 月の見出しは一覧の中で一番の目印なので、はっきり大きくする（ユーザー指摘 2026-09-08b）。
   ここだけ本文（0.9375rem）の1.25倍にして、右の集計（0.8125rem）との差をはっきりさせる。 */
.ship-month .sm-title{font-size:1.1875rem; font-weight:800; color:var(--ink); flex:0 0 auto; letter-spacing:0.01em;}
.ship-month .sm-meta{margin-left:auto; font-size:0.8125rem; font-weight:600; color:var(--ink-muted); flex:0 1 auto; min-width:0; text-overflow:ellipsis;}
.ship-month .sm-total{font-size:0.9375rem; font-weight:700; color:var(--ink); flex:0 0 auto;}
/* 開閉マーカーは指で狙える大きさに（既定の小さい ▸ を上書き） */
.ship-month > summary::before{font-size:1.125rem; line-height:1; color:var(--ink-muted); flex:0 0 auto;}
/* 箱数の下に総本数を出すので、行の揃えは baseline ではなく下端に合わせる
   （baseline のままだと2段になった箱数だけが上にずれる）。 */
.ship-date-head{display:flex; align-items:flex-end; gap:8px; font-variant-numeric:tabular-nums; padding-bottom:6px; margin-bottom:var(--sp2); border-bottom:2px solid var(--border);}
.ship-date-md{font-size:1.3125rem; font-weight:800; color:var(--ink);}
.ship-date-wd{font-size:0.9375rem; font-weight:700; color:var(--ink-muted);}
/* 箱数は2段（上＝箱数／下＝その日の総本数）。下段は狭いので一段小さくする（ユーザー指定 2026-09-08b）。
   右揃えにしておくと、桁が増えても金額との間隔が動かない。 */
.ship-date-boxes{margin-left:auto; font-size:0.9375rem; font-weight:600; color:var(--ink-muted);
  display:flex; flex-direction:column; align-items:flex-end; line-height:1.25;}
.ship-date-boxes small{font-size:0.75rem; font-weight:600; color:var(--ink-muted);}
.ship-date-total{margin-left:var(--sp3); font-size:1.125rem; font-weight:700; color:var(--ink);}
.ship-variety-block + .ship-variety-block{margin-top:6px; padding-top:6px; border-top:1px solid var(--border);}
.sv-head{display:flex; align-items:center; justify-content:space-between; gap:var(--sp3);}
.sv-head .ship-name{font-size:1.0625rem;}
.sv-head .ship-amount{font-size:1.0625rem;}
.ship-name.mk{padding:.08em .36em; border-radius:5px; box-decoration-break:clone; -webkit-box-decoration-break:clone; color:var(--ink);}
.ship-name.mk1{background:var(--mk1);}
.ship-name.mk2{background:var(--mk2);}
.ship-name.mk3{background:var(--mk3);}
.ship-name.mk4{background:var(--mk4);}
.ship-name.mk5{background:var(--mk5);}
.ship-name.mk6{background:var(--mk6);}
.ship-name.mk7{background:var(--mk7);}
.sv-specs{margin-top:4px;}
.sv-spec{position:relative; padding:8px 44px 8px 0; border-top:1px solid var(--border);}
.sv-spec:first-child{border-top:0; padding-top:2px;}
.sv-spec-main{display:flex; align-items:baseline; gap:10px; font-size:0.9375rem; color:var(--ink);}
.sv-grade{font-weight:600;}
.sv-boxes{margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums;}
.sv-spec-sub{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; margin-top:2px; font-size:0.8125rem; color:var(--ink-muted); font-variant-numeric:tabular-nums;}
.sv-spec-sub .u{font-size:0.6875rem; margin-left:1px;}
.sv-dot{opacity:.5;}
.sv-del{position:absolute; top:50%; right:0; transform:translateY(-50%); width:44px; height:44px; display:flex; align-items:center; justify-content:center; padding:0; border:0; background:transparent; color:var(--ink-muted); cursor:pointer; border-radius:8px;}
.sv-del svg{width:18px; height:18px;}
.sv-del:active{background:var(--surface-2);}
.ship-main{display:flex; flex-direction:column; gap:2px; min-width:0;}
.ship-date{font-size:0.75rem; color:var(--ink-muted);}
.ship-name{font-weight:600; font-size:0.9375rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ship-detail{font-size:0.75rem; color:var(--ink-muted);}
.ship-amount{font-weight:700; font-variant-numeric:tabular-nums; text-align:right; flex-shrink:0;}
.ship-del{width:44px; height:44px; border-radius:var(--r-pill); border:none; background:transparent; color:var(--ink-muted); cursor:pointer; flex-shrink:0;}
.ship-del svg{width:18px; height:18px;}

/* 未確定（要入力）：金額が後日確定する行のバッジ＋入力ボタン */
.badge-pending{background:var(--warn-soft); color:var(--warn-text);}
.btn-fill{min-height:32px; padding:0 12px; border-radius:var(--r-pill); border:1px solid var(--warn); background:var(--warn-soft); color:var(--warn-text); font-size:0.8125rem; font-weight:700; cursor:pointer; flex-shrink:0; white-space:nowrap;}
.btn-fill:active{background:var(--warn); color:#fff;}
.card-pending{border-color:var(--warn); background:var(--warn-soft);}
.card-pending .card-title{color:var(--warn-text);}
.card-pending .ship-row{background:var(--surface); border-radius:var(--r-sm); padding:8px 10px;}
/* 箱単価入力モーダル */
.fill-target{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px; padding:10px 12px; margin-bottom:var(--sp3); background:var(--surface-2); border-radius:var(--r-md); font-variant-numeric:tabular-nums;}
.fill-target .fill-date{font-weight:700; color:var(--ink);}
.fill-target .fill-name{font-weight:700; color:var(--ink);}
.fill-target .fill-spec{color:var(--ink-muted); font-size:0.9375rem;}
.fill-input-row{display:flex; align-items:center; gap:8px; margin-top:var(--sp3);}
.fill-input-label{font-weight:600; color:var(--ink); flex-shrink:0;}
.fill-input{flex:1; min-width:0; min-height:48px; padding:0 12px; font-size:1.125rem; text-align:right; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); color:var(--ink); font-variant-numeric:tabular-nums;}
.fill-input:focus{outline:2px solid var(--primary); outline-offset:1px;}
.fill-input-unit{color:var(--ink-muted); flex-shrink:0;}

/* 品種別指標：品種ごとの label:value スタック（桁数が増えても崩れない） */
.vm-list{list-style:none; margin:0; padding:0;}
.vm-item{padding:12px 0; border-top:1px solid var(--border);}
/* 見出し：1段目=品種名（1行・末尾見切れ）＋右に区分／2段目=右詰の金額 */
.vm-head{margin-bottom:8px;}
.vm-titlerow{display:flex; align-items:center; gap:8px; min-width:0;}
/* 色マーカーは品種名の文字の裏だけ（右へ伸ばさない）。長い名前は末尾を見切れさせる */
.vm-titlerow .ship-name{flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:1.0625rem; font-weight:600;}
.vm-titlerow .plant-cat, .vm-titlerow .vm-kon{margin-left:auto;}
.vm-amountrow{text-align:right; margin-top:4px;}
.vm-amount{font-size:1.1875rem; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
.vm-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px;}
.vm-cell{display:flex; flex-direction:column; gap:2px; padding:6px 10px; border-radius:8px; background:var(--surface-2);}
.vm-label{font-size:0.6875rem; color:var(--ink-muted);}
.vm-val{font-size:1rem; font-weight:600; line-height:1.2; font-variant-numeric:tabular-nums; white-space:nowrap;}
.vm-val.is-empty{color:var(--ink-muted); font-weight:500;}
.vm-unit{font-size:0.75rem; font-weight:500; color:var(--ink-muted); margin-left:1px;}
@media (min-width:480px){ .vm-grid{grid-template-columns:repeat(4,1fr);} }

/* 品種別内訳の展開（混植のみ：新植/据置の内訳） */
.vm-details > summary{list-style:none; cursor:pointer;}
.vm-details > summary::-webkit-details-marker{display:none;}
/* 区分ラベル（薄い楕円チップ・共通）。色は後で差し替え予定。今は全てグレーで統一 */
.plant-cat{flex:0 0 auto; font-size:0.6875rem; font-weight:700; padding:2px 9px; border-radius:var(--r-pill); line-height:1.5; white-space:nowrap; background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--border);}
.plant-cat-shin, .plant-cat-sue, .plant-cat-kon{background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--border);}
/* 混植インジケータ＝色丸「混」（=見開きトグル・その品種の色） */
.vm-kon{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:var(--r-pill); font-size:0.8125rem; font-weight:800;}
.vm-detail{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
/* 区分別カード（本数 / 坪売上 / 1本単価）。数値は折り返さず、長ければ左へ伸びる */
.pt-cards{display:flex; flex-direction:column; gap:10px;}
.pt-cardrow{display:flex; flex-direction:column; gap:6px;}
.pt-cardrow > .plant-cat{align-self:flex-start;}
.pt-ccells{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
.pt-ccells .vm-cell{align-items:flex-end;}
.pt-ccells .vm-label{align-self:flex-start;}
.pt-unassigned{margin-top:10px; font-size:0.8125rem; color:var(--warn-text);}

/* 新植/据置 割り当てカード・行 */
.badge-alloc{background:var(--accent-soft); color:var(--accent-text);}
.card-alloc{border-color:var(--accent); background:var(--accent-soft);}
.card-alloc .card-title{color:var(--accent-text);}
.alloc-row{display:flex; flex-direction:column; gap:8px; padding:10px; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface);}
.alloc-main{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; font-variant-numeric:tabular-nums;}
.alloc-btns{display:flex; gap:6px;}
.btn-plant{flex:1; min-height:40px; padding:0 8px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:0.875rem; font-weight:700; cursor:pointer; white-space:nowrap;}
.btn-plant:active{background:var(--border);}

details.collapse summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:var(--sp2); font-weight:600; font-size:0.875rem;}
details.collapse summary::-webkit-details-marker{display:none;}
details.collapse summary::before{content:"▸"; color:var(--ink-muted); transition:transform var(--dur);}
details.collapse[open] summary::before{transform:rotate(90deg);}

/* 保存タブ「保存の仕組み」の説明ブロック */
.save-how{display:flex; flex-direction:column; gap:var(--sp3); font-size:0.875rem; line-height:1.6; color:var(--ink);}
.save-how .muted{color:var(--ink-muted); font-size:0.8125rem;}
.save-how code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:0.8125em; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm); padding:1px 5px;}
/* 保存タブ末尾の版数。本番に新しい版が届いたかを目視で確かめるためだけのもの */
.app-build{text-align:center; font-size:0.75rem; color:var(--ink-muted); margin:var(--sp2) 0 var(--sp4);}

.onboard-step{display:flex; gap:var(--sp3); align-items:flex-start;}
.onboard-num{width:26px; height:26px; border-radius:var(--r-pill); background:var(--primary-soft); color:var(--primary); font-weight:700; font-size:0.8125rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.onboard-text{font-size:0.875rem;}
.onboard-text b{display:block; margin-bottom:2px;}
.onboard-text span{color:var(--ink-muted); font-size:0.8125rem;}

.summary-box{background:var(--primary-soft); color:var(--primary); border-radius:var(--r-md); padding:var(--sp3); font-size:0.8125rem; display:flex; flex-direction:column; gap:4px;}
.summary-box.warn{background:var(--warn-soft); color:var(--warn-text);}
.err-box{background:var(--danger-soft); color:var(--danger-text); border-radius:var(--r-md); padding:var(--sp3); font-size:0.75rem;}
/* 取込エラーの明細。件数だけでは何を直せばいいか分からないので、項目名と原文を出す */
.import-errors{margin-top:var(--sp2);}
.import-errors summary{font-size:0.8125rem;}
.import-err{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; padding:6px 8px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);}
.ie-line{flex:0 0 auto; font-size:0.75rem; font-weight:700; color:var(--ink);}
.ie-why{flex:1 1 auto; min-width:0; font-size:0.75rem; font-weight:700; color:var(--danger-text);}
.ie-raw{flex:1 1 100%; min-width:0; font-size:0.6875rem; color:var(--ink-muted); word-break:break-all;}

.hidden{display:none !important;}
.muted{color:var(--ink-muted);}
.stack{display:flex; flex-direction:column; gap:var(--sp3);}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:var(--sp3);}
</style></head><body>


<div id="app">
  <!-- 2段構成。1段目＝アプリ名／品目＋テーマ、2段目＝年度バー。
       品目が親で年度が子。年度の選択肢は品目ごとに別なので（Store.years(item)）、
       上下の入れ子で親子を表す。年度バーは中身が品目と年度の両方にかかる
       タブ（産地・自分）でだけ出す＝renderAppBar が出し分ける。 -->
  <header id="appbar">
    <div class="appbar-row">
      <div class="wordmark">🌸 出荷分析</div>
      <div class="appbar-right">
        <div class="select-wrap scope-sel"><select id="item-select" aria-label="品目を選ぶ"></select><span class="scope-sel-label" id="item-select-label" aria-hidden="true"></span></div>
        <button class="icon-btn" id="theme-btn" data-action="theme-cycle" aria-label="テーマ切替"></button>
      </div>
    </div>
    <div class="year-bar" id="year-bar" role="tablist" aria-label="年度を選ぶ"></div>
  </header>
  <div id="storage-banner-region"></div>
  <main id="main"></main>
  <nav id="tabbar" role="tablist" aria-label="画面切替"></nav>
  <div id="toast-region" aria-live="polite"></div>
  <div id="modal-root"></div>
</div>

<script type="module">
'use strict';

/* ============================== Icon ============================== */
const Icon = {
  origin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8" stroke="currentColor" stroke-width="2"/></svg>',
  mine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="19" x2="5" y2="10"/><line x1="12" y1="19" x2="12" y2="5"/><line x1="19" y1="19" x2="19" y2="13"/></svg>',
  import:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/><polyline points="7 9 12 14 17 9"/><line x1="12" y1="14" x2="12" y2="3"/></svg>',
  backup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v6c0 5-3 8-7 11-4-3-7-6-7-11V5z"/><polyline points="9 12 11 14 15 10"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'
};

/* ============================== Fmt ============================== */
const Fmt = {
  yen(n){ if(n==null||Number.isNaN(n)) return '¥0'; return '¥' + Math.round(n).toLocaleString('ja-JP'); },
  num(n){ if(n==null||Number.isNaN(n)) return '0'; return Math.round(n).toLocaleString('ja-JP'); },
  date(iso){
    if(!iso) return '';
    const p = iso.split('-'); if(p.length!==3) return iso;
    return `${parseInt(p[1],10)}/${parseInt(p[2],10)}`;
  },
  mmdd(iso){
    if(!iso) return '--/--';
    const p = iso.split('-'); if(p.length!==3) return iso;
    return `${p[1]}/${p[2]}`;
  },
  wd(iso){
    if(!iso) return '';
    const dt = new Date(iso + 'T00:00:00');
    if(Number.isNaN(dt.getTime())) return '';
    return ['日','月','火','水','木','金','土'][dt.getDay()];
  },
  wdClass(iso){
    if(!iso) return '';
    const dt = new Date(iso + 'T00:00:00');
    if(Number.isNaN(dt.getTime())) return '';
    const d = dt.getDay();
    return d===0 ? 'cal-sun' : d===6 ? 'cal-sat' : '';
  },
  esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
};

/* ============================== Norm ============================== */
const Norm = {
  text(s){ return (s==null?'':String(s)).normalize('NFKC').trim(); },
  // 等級（秀 / 4P / 別 …）。v2 までは「秀」を自動で付けていたが、それは
  // 等級と階級が1列に連結されていた時代の名残で、スイートピーの階級 '2L' を
  // '秀2L' に化けさせる地雷だった。いまは正規化するだけで語彙には触らない。
  // 大文字化は階級（Norm.size）と揃える。揃えないと市況CSVの '4P' と自分CSVの '4p' が
  // 別の等級とみなされ、突合に失敗してその行の売上が黙って 0 になる。
  // クルクマの「秀」は漢字なので影響ゼロ（SelfTest 7630.71 と matched 18 が担保）。
  grade(s){ return Norm.text(s).toUpperCase(); },
  // 階級（2L / L / M / S …）。全角や小文字の揺れだけ吸収する。
  size(s){ return Norm.text(s).toUpperCase(); },
  date(s){
    let t = Norm.text(s);
    if(t==='') return '';
    const parts = t.split(/[\/\-.年月]/).map(p=>p.replace(/日$/,'').trim()).filter(p=>p!=='');
    if(parts.length===3){
      const y = parts[0].padStart(4,'0');
      const m = parts[1].padStart(2,'0');
      const d = parts[2].padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    return t;
  },
  // YYYY-MM-DD が実在する日付か。桁数だけを見る /^\d{4}-\d{2}-\d{2}$/ では
  // 2026-13-99 のような存在しない日付が通ってしまい、どのシーズンにも属さない
  // 見えないレコードとして保存されてしまう。
  validDate(iso){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d;
  },
  num(s){
    if(typeof s === 'number') return s;
    let t = Norm.text(s).replace(/[,，]/g,'');
    if(t==='') return NaN;
    const n = Number(t);
    return n;
  },
  // 産地レコードの一意キー。先頭に品目を含めるのが必須。
  // 含めないと、同じ(日付・品種・等級・階級・本数)を持つ別品目の行が Store.sanchi の Map で衝突し、
  // 後から取り込んだ側が先の品目のレコードを黙って上書きする（上書きされた側は画面から消える）。
  // このキーは永続化されない派生値で、load / importBackup が起動のたびに計算し直している
  // ＝形を変えてもデータ移行は不要。検証は Store.sanchi.size が不変であること。
  key(item, date, variety, grade, size, count){
    return JSON.stringify([Norm.text(item) || DEFAULT_ITEM, Norm.date(date), Norm.text(variety),
                           Norm.grade(grade), Norm.size(size), Norm.num(count)]);
  },
  // レコード1個からキーを作る。引数の並び間違いを防ぐため、可能な限りこちらを使う。
  keyOf(rec){ return Norm.key(rec.item, rec.date, rec.variety, rec.grade, rec.size, rec.count); },
  /* 品目全体データのキー。その日・その品目で1行しかない資料なので 品目＋日付 で足りる。
     同じ日を取り込み直したら後勝ちで上書き（資料が訂正されることがあるため）。 */
  zentaiKey(rec){ return JSON.stringify([Norm.text(rec.item) || DEFAULT_ITEM, Norm.date(rec.date)]); }
};

/* ============================== Parse ============================== */
const Parse = {
  async readFileSmart(file){
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    let encoding = 'UTF-8';
    if(text.includes('\uFFFD')){
      try{
        const alt = new TextDecoder('shift_jis').decode(buf);
        text = alt; encoding = 'Shift_JIS';
      }catch(e){ /* keep utf-8 fallback */ }
    }
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    return {text, encoding};
  },
  csv(text){
    const norm = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    const rows = []; let row = []; let field = ''; let inQ = false;
    for(let i=0;i<norm.length;i++){
      const c = norm[i];
      if(inQ){
        if(c === '"'){
          if(norm[i+1] === '"'){ field += '"'; i++; } else { inQ = false; }
        } else field += c;
      } else {
        if(c === '"') inQ = true;
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else field += c;
      }
    }
    if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
    return rows.filter(r => !(r.length===1 && Norm.text(r[0])===''));
  },
  headerIndex(headerRow){
    const idx = {};
    headerRow.forEach((h,i)=>{ idx[Norm.text(h)] = i; });
    return idx;
  },
  /* 産地CSV。列は 日付,品目,品種,等級,階級,本数,箱数量,箱単価。
     等級と階級は別の列で受け取る（市場ごとに規格の体系が違うため、連結された1列だと
     「等級を問わず2Lだけ見る」といった操作が文字列の切り貼りになる）。
     戻り値の unknownSpecs＝取り込みには成功したが、その品目の price/sizeBars の
     規則に載っていない 等級×階級。壊れた入力ではないので行は保存し、警告だけ出す。 */
  sanchiCSV(text, item){
    const rows = Parse.csv(text);
    if(rows.length===0) return {records:[], errors:[], dupCount:0, unknownSpecs:[]};
    const idx = Parse.headerIndex(rows[0]);
    // 見出し行は控えておく。取り込めなかった行をあとで直して取り込み直すとき、
    // 同じ並びで読み直せないと列がずれる（列の順番はファイルごとに違いうる）。
    const header = rows[0].join(',');
    const need = ['日付','品種','等級','階級','本数','箱数量','箱単価'];
    const missing = need.filter(k=>!(k in idx));
    if(missing.length) throw new Error('必須列が見つかりません: ' + missing.join('、'));
    const records = []; const errors = []; const seen = new Set(); let dupCount = 0;
    const known = Parse.knownSpecs(item);
    const unknown = new Map();
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      if(row.every(f=>Norm.text(f)==='')) continue;
      // 日付は完全な YYYY-MM-DD であることを要求する。Norm.date は3要素に分解できない値
      // （「5/14」など）を原文のまま返すので、ここで弾かないと年度のどこにも属さない
      // 見えないレコードとして保存されてしまう。
      const dateRaw = Norm.date(row[idx['日付']]);
      const date = Norm.validDate(dateRaw) ? dateRaw : '';
      const variety = Norm.text(row[idx['品種']]);
      const grade = Norm.grade(row[idx['等級']]);
      const size = Norm.size(row[idx['階級']]);
      const count = Norm.num(row[idx['本数']]);
      const boxQty = Norm.num(row[idx['箱数量']]);
      // 箱単価は「未確定」(文字列)を許容＝pendingとしてnullで保持。空欄・ゴミ数値は従来どおりエラー。
      const priceRaw = Norm.text(row[idx['箱単価']]);
      const boxPrice = (priceRaw === '未確定') ? null : Norm.num(priceRaw);
      // 「別」は階級を持たず本数0。それ以外は階級が要る。
      const isBetsu = (grade === '別');
      // どの項目が原因かを残す。件数だけだと「何を直せばいいか」が分からない。
      const reasons = [];
      if(!date) reasons.push('日付');
      if(!variety) reasons.push('品種');
      if(!grade) reasons.push('等級');
      if(!isBetsu && !size) reasons.push('階級');
      if(Number.isNaN(count)) reasons.push('本数');
      if(Number.isNaN(boxQty)) reasons.push('箱数量');
      if(boxPrice !== null && Number.isNaN(boxPrice)) reasons.push('箱単価');
      if(reasons.length){
        errors.push({line:r+1, raw:row.join(','), reasons});
        continue;
      }
      // CSV内の重複検出用のキー。1つのCSVは1つの品目に取り込まれるので、ここは品目抜きで足りる。
      // 保存先の Map のキーは mergeSanchi が品目込みで作り直す。
      const dupKey = JSON.stringify([date, variety, grade, size, count]);
      if(seen.has(dupKey)) dupCount++;
      seen.add(dupKey);
      if(!isBetsu && known && !known.has(grade + '|' + size)){
        const k = grade + ' × ' + size;
        unknown.set(k, (unknown.get(k) || 0) + 1);
      }
      // csvItem＝CSVの品目列（あれば）。保存には使わず、選択中の品目との食い違い警告にだけ使う。
      records.push({date, variety, grade, size, count, boxQty, boxPrice,
                    csvItem: ('品目' in idx) ? Norm.text(row[idx['品目']]) : ''});
    }
    return {records, errors, dupCount, header,
            unknownSpecs: Array.from(unknown, ([spec, n])=>({spec, n}))};
  },
  /* その品目で「扱いが決まっている」等級×階級の集合。判定できなければ null＝警告を出さない。
     ⚠ blend:'all'（その日の全部を平均する品目）では、どんな等級×階級も価格に入るので
        「価格の基準に無い＝価格推移に反映されない」という警告自体が成り立たない。
        いつもと違う規格が出たことは、背景の棒の一番上に赤で出る（sizeBars の その他）。
     ※ 2026-09-08b：規格構成ドーナツを撤去したので、語彙の出どころを donut から sizeBars に
        付け替えた。クルクマの集合は 秀|2L・秀|L で以前と変わらない（バケツは同じものを移しただけ）。 */
  knownSpecs(item){
    const rule = itemRule(item);
    if(rule.price && rule.price.blend === 'all') return null;
    if(!rule.price && !rule.sizeBars) return null;
    const s = new Set();
    (rule.price ? (rule.price.basis || []) : []).forEach(([g, sz])=> s.add(g + '|' + sz));
    ((rule.sizeBars && rule.sizeBars.buckets) || []).forEach(b=> s.add(b.grade + '|' + b.size));
    return s;
  },
  /* 品目全体データのCSV。列は 日付,品目,箱数,売立金額,箱平均価格。
     出どころはJAの「花き共選共販市況」で、その日・その品目の産地全体が1行になっている
     ＝品種も規格も無い（前提メモ A-13）。産地CSV（品種×等級×階級×本数）とは別系統で、
     数字も一致しない前提なので、突合も比較もしない。

     箱平均価格は 売立金額÷箱数 の端数切り＝派生値。列があれば原文のまま持つが、
     グラフの計算には使わない（移動平均は必ず 金額の合計÷箱数の合計 で出す）。
     列が無ければこちらで割って埋める。

     ⚠ 必須列が1つでも欠けたら例外を投げる＝産地CSVをここに貼っても黙って通らない。
        列の形が違うCSVを貼ったときに気づけるのが、この口の一番大事な仕事。 */
  zentaiCSV(text, item){
    const rows = Parse.csv(text);
    if(rows.length===0) return {records:[], errors:[], dupCount:0, header:''};
    const idx = Parse.headerIndex(rows[0]);
    const header = rows[0].join(',');
    const need = ['日付','箱数','売立金額'];
    const missing = need.filter(k=>!(k in idx));
    if(missing.length) throw new Error('必須列が見つかりません: ' + missing.join('、'));
    const hasAvg = '箱平均価格' in idx;
    const records = []; const errors = []; const seen = new Set(); let dupCount = 0;
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      if(row.every(f=>Norm.text(f)==='')) continue;
      const dateRaw = Norm.date(row[idx['日付']]);
      const date = Norm.validDate(dateRaw) ? dateRaw : '';
      const boxes = Norm.num(row[idx['箱数']]);
      const amount = Norm.num(row[idx['売立金額']]);
      const avgRaw = hasAvg ? Norm.num(row[idx['箱平均価格']]) : NaN;
      const reasons = [];
      if(!date) reasons.push('日付');
      if(Number.isNaN(boxes) || boxes <= 0) reasons.push('箱数');
      if(Number.isNaN(amount)) reasons.push('売立金額');
      if(hasAvg && Norm.text(row[idx['箱平均価格']]) !== '' && Number.isNaN(avgRaw)) reasons.push('箱平均価格');
      if(reasons.length){
        errors.push({line:r+1, raw:row.join(','), reasons});
        continue;
      }
      if(seen.has(date)) dupCount++;
      seen.add(date);
      // 資料に箱平均価格が無いときだけ、こちらで割って端数を切る（資料と同じ出し方）。
      const avgPrice = Number.isNaN(avgRaw) ? Math.floor(amount / boxes) : avgRaw;
      records.push({date, boxes, amount, avgPrice,
                    csvItem: ('品目' in idx) ? Norm.text(row[idx['品目']]) : ''});
    }
    return {records, errors, dupCount, header};
  },
  /* 自分CSVの「規格」列（階級＋本数の省略記法）を分解する。
     「2L30」→{2L,30}, 「2L50」→{2L,50}, 「L」→{L,50}, 「M」→{M,50}
     等級は持たないので、呼び出し側が品目の defaultGrade を補う。 */
  parseSpec(raw){
    const t = Norm.text(raw).toUpperCase().replace(/秀/g,'').replace(/\s/g,'');
    const m = t.match(/^(2L|L|M|S)(\d+)?$/);
    if(!m) return null;
    return {size:m[1], count: m[2] ? parseInt(m[2],10) : 50};
  },
  /* 出荷日は年つきの完全な日付だけを受け付ける（産地CSVと同じ扱い）。
     以前は「5/14」のような月日だけの日付を表示中の年度で補っていたが、取込タブから年度を
     外したので「何年で補ったのか」が画面のどこにも出なくなる＝黙って1年ずれても気づけない。
     年が無い行は呼び出し側でエラー行に落とす。 */
  resolveShipDate(raw){
    return Norm.date(Norm.text(raw));
  },
  /* 自分の出荷CSV。産地と同じ 等級／階級／本数 の分割形式を正とする。
       出荷日,品目,品種名,等級,階級,本数,箱数,別本数
     等級の列が無ければ品目の defaultGrade で補う（自分の出荷は必ず「秀」という運用）。
     移行期の事故を防ぐため、旧「規格」列（2L30 形式）も読めるフォールバックを残す。 */
  jibunCSV(text, item){
    const rows = Parse.csv(text);
    if(rows.length===0) return {records:[], errors:[], header:''};
    const idx = Parse.headerIndex(rows[0]);
    const header = rows[0].join(',');           // 直して取り込み直すときに同じ並びで読むため
    const hasSplit = ('階級' in idx);           // 分割形式か
    const hasLegacy = ('規格' in idx);          // 旧形式（階級＋本数の省略記法）
    const need = ['出荷日','品種名','箱数'].concat(hasSplit ? ['階級','本数'] : ['規格']);
    const missing = need.filter(k=>!(k in idx));
    if(missing.length) throw new Error('必須列が見つかりません: ' + missing.join('、'));
    if(!hasSplit && !hasLegacy) throw new Error('必須列が見つかりません: 階級（または規格）');
    const hasBetsu = '別本数' in idx;
    const defGrade = itemRule(item || State.selectedItem || DEFAULT_ITEM).defaultGrade || '秀';
    const records = []; const errors = [];
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      if(row.every(f=>Norm.text(f)==='')) continue;
      const dateRaw = Parse.resolveShipDate(row[idx['出荷日']]);
      const date = Norm.validDate(dateRaw) ? dateRaw : '';
      const variety = Norm.text(row[idx['品種名']]);
      const boxQty = Norm.num(row[idx['箱数']]);
      const betsuRaw = hasBetsu ? Norm.num(row[idx['別本数']]) : NaN;
      let grade = '', size = '', count = NaN, betsuCount = 0;
      if(!Number.isNaN(betsuRaw) && betsuRaw>0){
        // 別扱い：産地の「別（階級なし・本数0）」の箱単価にマッチさせる
        grade = '別'; size = ''; count = 0; betsuCount = betsuRaw;
      } else if(hasSplit){
        grade = ('等級' in idx) ? (Norm.grade(row[idx['等級']]) || defGrade) : defGrade;
        size = Norm.size(row[idx['階級']]);
        count = Norm.num(row[idx['本数']]);
      } else {
        const spec = Parse.parseSpec(row[idx['規格']]);
        if(spec){ grade = defGrade; size = spec.size; count = spec.count; }
      }
      const reasons = [];
      if(!date) reasons.push('出荷日');
      if(!variety) reasons.push('品種名');
      if(!grade) reasons.push('等級');
      if(grade !== '別' && !size) reasons.push(hasSplit ? '階級' : '規格');
      if(Number.isNaN(count)) reasons.push(hasSplit ? '本数' : '規格');
      if(Number.isNaN(boxQty) || boxQty<=0) reasons.push('箱数');
      if(reasons.length){
        errors.push({line:r+1, raw:row.join(','), reasons});
        continue;
      }
      // csvItem＝CSVの品目列（あれば）。産地CSVと同じく、保存には使わず食い違い警告にだけ使う。
      records.push({date, variety, grade, size, count, boxQty, betsuCount,
                    csvItem: ('品目' in idx) ? Norm.text(row[idx['品目']]) : ''});
    }
    return {records, errors, header};
  }
};
