      // 取り込めなかった行の控え。無ければ空（＝旧データからの移行は起きない）
      Store.importErrors = Array.isArray(data.importErrors) ? data.importErrors.slice(0, IMPORT_ERR_KEEP) : [];
      // 旧データの data.items（品目マスタ）は読み捨てる。品目の定義は ITEM_RULES が持つので、
      // 次の persist で保存からも自然に消える。
      Store.meta = data.meta || {lastBackupAt:null};
      Store.dirtyCount = data.dirtyCount || 0;
      // 移行が走ったならその場で保存し直す（次回起動から version 2 で読める）
      if(Store.migratedFrom) Store.persist();
    }catch(e){
      console.warn('load failed', e);
      // 壊れたデータを無言で失わないよう、別キーへ退避してから警告（次の保存で上書きされる前に保全）
      try{ if(raw) localStorage.setItem(STORAGE_KEY + '.corrupt', raw); }catch(_){}
      Store.loadError = true;
    }
  },
  persist(){
    // localStorage が使えない端末（メモリ運用）でも絞り込みキャッシュは必ず無効化する
    Store.rev++;
    if(!Store.available) return;
    try{
      const payload = {
        version: SCHEMA_VERSION,
        sanchi: Array.from(Store.sanchi.values()),
        jibun: Store.jibun,
        sakutsuke: Store.sakutsuke,
        // 品目全体データ。置き場を1つ足しただけなので SCHEMA_VERSION は据え置き＝移行なし
        zentai: Array.from(Store.zentai.values()),
        // 取り込めなかった行の控え。古い保存には無いので、読むときは空として扱う（移行なし）
        importErrors: Store.importErrors,
        meta: Store.meta,
        dirtyCount: Store.dirtyCount
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      Store.saveError = false;
    }catch(e){
      console.warn('persist failed', e);
      const firstTime = !Store.saveError;
      Store.saveError = true;
      // 無反応でデータ喪失に化けないよう、最初の失敗時にはっきり通知する
      if(firstTime){ try{ UI.toast('⚠ 自動保存に失敗しました（端末の空き容量オーバーの可能性）。「保存」タブからバックアップを書き出してください', {duration:7000}); }catch(_){} }
    }
  },
  /* ---- 取り込めなかった行の控え ----
     枠は最新 IMPORT_ERR_KEEP 件まで、1枠に残す行は IMPORT_ERR_ROWS まで。
     エラーが千行出ても保存が膨らまないようにするための上限。 */
  addImportErrors(kind, item, errors, header){
    if(!errors || !errors.length) return;
    Store.importErrors.unshift({
      id: String(Date.now()) + '-' + Math.random().toString(36).slice(2,7),
      at: new Date().toISOString(),
      kind, item: item || DEFAULT_ITEM,
      header: header || '',   // 直して取り込み直すときに、元と同じ列の並びで読むため
      total: errors.length,
      rows: errors.slice(0, IMPORT_ERR_ROWS)
    });
    if(Store.importErrors.length > IMPORT_ERR_KEEP) Store.importErrors.length = IMPORT_ERR_KEEP;
    Store.persist();
  },
  // 取り込み直したあとの枠の中身を差し替える（残ったエラーだけにする。空なら枠ごと消す）
  updateImportErrors(id, rows){
    const e = Store.importErrors.find(x=>x.id === id);
    if(!e) return;
    if(!rows || !rows.length){ Store.importErrors = Store.importErrors.filter(x=>x.id !== id); }
    else { e.rows = rows.slice(0, IMPORT_ERR_ROWS); e.total = rows.length; e.at = new Date().toISOString(); }
    Store.persist();
  },
  removeImportErrors(id){
    const before = Store.importErrors.length;
    Store.importErrors = Store.importErrors.filter(e=>e.id !== id);
    if(Store.importErrors.length !== before) Store.persist();
  },
  // item を渡すとその品目の分だけ消す（画面に出ているものと消える範囲を一致させる）
  clearImportErrors(item){
    const before = Store.importErrors.length;
    Store.importErrors = item ? Store.importErrors.filter(e=>(e.item||DEFAULT_ITEM) !== item) : [];
    if(Store.importErrors.length !== before) Store.persist();
  },
  mergeSanchi(records){
    let added=0, updated=0;
    // 品目は「取込時に選択中の品目」を正とする（CSVの品目列は取込前の食い違い警告にのみ使う）
    const item = State.selectedItem || DEFAULT_ITEM;
    records.forEach(rec=>{
      const row = {date:rec.date, variety:rec.variety, grade:rec.grade, size:rec.size||'', count:rec.count, boxQty:rec.boxQty, boxPrice:rec.boxPrice, item};
      const key = Norm.keyOf(row);
      if(Store.sanchi.has(key)) updated++; else added++;
      Store.sanchi.set(key, row);
    });
    if(added+updated>0){ Store.dirtyCount += (added+updated); Store.persist(); }
    return {added, updated};
  },
  /* 品目全体データの取り込み。1日1行なので同じ日は後勝ちで上書きする
     （資料が訂正されて配り直されることがあるため）。 */
  mergeZentai(records){
    let added=0, updated=0;
    const item = State.selectedItem || DEFAULT_ITEM;
    records.forEach(rec=>{
      const row = {date:rec.date, item, boxes:rec.boxes, amount:rec.amount, avgPrice:rec.avgPrice};
      const key = Norm.zentaiKey(row);
      if(Store.zentai.has(key)) updated++; else added++;
      Store.zentai.set(key, row);
    });
    if(added+updated>0){ Store.dirtyCount += (added+updated); Store.persist(); }
    return {added, updated};
  },
  // 未確定だった市況行の箱単価を後から確定させる（keyで特定→数値をセット）。以降の再描画でmySalesが自動再計算される。
  setSanchiPrice(key, price){
    const rec = Store.sanchi.get(key);
    if(!rec) return false;
    rec.boxPrice = price;
    Store.dirtyCount += 1;
    Store.persist();
    return true;
  },
  // 取込済みかどうかの判定。品目を見ないと、別品目に同じ内容の出荷を入れようとしたときに
  // 全件「スキップ」になって1件も登録できない。
  jibunExists(rec){
    const item = rec.item || State.selectedItem || DEFAULT_ITEM;
    return Store.jibun.some(r => (r.item||DEFAULT_ITEM)===item && r.date===rec.date && r.variety===rec.variety
      && r.grade===rec.grade && (r.size||'')===(rec.size||'') && r.count===rec.count && r.boxQty===rec.boxQty
      && (r.betsuCount||0)===(rec.betsuCount||0));
  },
  mergeJibun(records, source){
    let added=0, skipped=0;
    records.forEach(rec=>{
      if(Store.jibunExists(rec)){ skipped++; return; }
      Store.jibun.push({
        id: 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        date:rec.date, variety:rec.variety, grade:rec.grade, size:rec.size||'', count:rec.count, boxQty:rec.boxQty, betsuCount:rec.betsuCount||0,
        source, addedAt: new Date().toISOString(),
        item: State.selectedItem || DEFAULT_ITEM, // 産地と同じく取込時の選択品目を付ける
        plant: (rec.plant==='新植'||rec.plant==='据置'||rec.plant==='mix') ? rec.plant : null, sueokiStems: rec.sueokiStems||0
      });
      added++;
    });
    if(added>0){ Store.dirtyCount += added; Store.persist(); }
    return {added, skipped};
  },
  removeJibun(id){
    const i = Store.jibun.findIndex(r=>r.id===id);
    if(i<0) return null;
    const [removed] = Store.jibun.splice(i,1);
    Store.dirtyCount += 1;
    Store.persist();
    return {rec:removed, index:i};
  },
  restoreJibun(rec, index){
    // 元の位置に戻す（末尾に足すと日内の品種の出現順・マーカー色が変わってしまうため）
    const i = (typeof index === 'number' && index >= 0 && index <= Store.jibun.length) ? index : Store.jibun.length;
    Store.jibun.splice(i, 0, rec);
    Store.persist();
  },
  // 日付×品種×規格のグループ単位で割り当て（plant='新植'|'据置'|'mix'、mixのみ sueokiStems=据置の本数）。
  // mixのときは据置本数を各行へ本数按分。
  setJibunPlantGroup(ids, plant, sueokiStems){
    const recs = ids.map(id=>Store.jibun.find(r=>r.id===id)).filter(Boolean);
    if(recs.length===0) return false;
    // 本数の計算式は Compute.rowStems が正本。ここで書き直すと、画面に出る本数と
    // 混在の按分が食い違う（片方だけ直したときに黙ってズレる）。
    const total = recs.reduce((s,r)=>s+Compute.rowStems(r), 0);
    let left = Math.max(0, Math.min(Number(sueokiStems)||0, total));
    recs.forEach((r,i)=>{
      r.plant = plant;
      if(plant==='mix'){
        // 端数は最終行で吸収し、合計が入力値と一致するようにする
        const share = (i===recs.length-1) ? left : Math.min(left, Math.round(total>0 ? (Number(sueokiStems)||0)*Compute.rowStems(r)/total : 0));
        r.sueokiStems = share; left -= share;
      } else {
        r.sueokiStems = 0;
      }
      delete r.sueokiRatio;
    });
    Store.dirtyCount += 1;
    Store.persist();
    return true;
  },
  addSakutsuke(rec){
    const row = {
      id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      variety: rec.variety, type: rec.type, tsubo: rec.tsubo,
      // 作付は年度ごと・品目ごと。登録時に選択中の年度×品目へ紐づける
      item: State.selectedItem || DEFAULT_ITEM, year: String(State.selectedYear || Store.currentYear())
    };
    Store.sakutsuke.push(row);
    Store.dirtyCount += 1;
    Store.persist();
    return row;
  },
  removeSakutsuke(id){
    const i = Store.sakutsuke.findIndex(r=>r.id===id);
    if(i<0) return null;
    const [removed] = Store.sakutsuke.splice(i,1);
    Store.dirtyCount += 1;
    Store.persist();
    return removed;
  },
  restoreSakutsuke(rec){
    Store.sakutsuke.push(rec);
    Store.dirtyCount += 1;
    Store.persist();
  },
  resetAll(){
    Store.sanchi = new Map();
    Store.jibun = [];
    Store.sakutsuke = [];
    Store.zentai = new Map();
    Store.importErrors = [];
    Store.meta = {lastBackupAt:null};
    Store.dirtyCount = 0;
    Store.persist();
    if(!Store.available){ /* memory mode: nothing to clear in localStorage */ }
  },
  exportBackup(){
    // JSONは正本なので常に全年度・全品目を出す（importBackup が全置換のため、部分JSONは復元が破壊的になる）。
    // 作型（新植/据置/混植）はCSVには無くアプリ内で付けるデータ。JSONには実効値も含めて出力する。
    // 作型の判定は作付設定に依るので、年度×品目のグループごとに集計し直す。
    const infoCache = new Map();
    const infoFor = (year, item)=>{
      const k = year + '|' + item;
      if(!infoCache.has(k)){
        infoCache.set(k, Compute.allocInfoFrom(
          Store.sakutsuke.filter(r=> String(r.year||'')===year && (r.item||DEFAULT_ITEM)===item)));
      }
      return infoCache.get(k);
    };
    const jibun = Store.jibun.map(r=>{
      const item = r.item || DEFAULT_ITEM;
      const stems = Compute.rowStems(r);
      // 作型を使わない品目には作型の内訳を付けない（全部「新植」と書くと嘘になる）
      if(!Compute.allocEnabled(item)) return {...r, stems};
      const {typesByVariety} = infoFor(Compute.seasonYear(r.date, item), item);
      const {f, unassigned} = Compute.allocFraction(r, typesByVariety);
      const sueokiStems = unassigned ? null : Math.round(f*stems);
      return {...r, stems,
        // 区分の判定は varietyCategory が正本（画面と食い違わせない）
        varietyCategory: Compute.varietyCategory(typesByVariety.get(r.variety)),
        // 作型別の本数内訳（未割当は null）。混植品種のみ入力対象、単区分は自動確定。
        sueokiStems, shinshokuStems: unassigned ? null : (stems - sueokiStems),
        plantUnassigned: !!unassigned};
    });
    const payload = {
      version: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      sanchi: Array.from(Store.sanchi.values()),
      jibun,
      sakutsuke: Store.sakutsuke,
      // 品目全体データ（JAの共選共販市況）。産地データとは別系統なのでそのまま並べる。
      zentai: Array.from(Store.zentai.values()),
      // 取り込めなかった行の控えも持ち越す（直しかけの行を機種変更でも失わないため）
      importErrors: Store.importErrors
    };
    return payload;
  },
  importBackup(raw){
    // 旧版(version 1・品目なし)のバックアップも読めるよう、保存時と同じ移行を通す。
    // migratedFrom は「起動時の移行」を知らせる旗なので、復元では立てっぱなしにしない。
    const flag = Store.migratedFrom;
    const data = Store.migrateIfNeeded(raw, null);
    Store.migratedFrom = flag;
    const sanchi = new Map();
    (data.sanchi||[]).forEach(rec=>{
      const date = Norm.date(rec.date), variety = Norm.text(rec.variety);
      const grade = Norm.grade(rec.grade), size = Norm.size(rec.size), count = Norm.num(rec.count);
      // 箱単価は未確定(null/「未確定」)をnullのまま保持。NaN化させない。
      const boxPrice = (rec.boxPrice==null || rec.boxPrice==='未確定') ? null : Norm.num(rec.boxPrice);
      const row = {date, variety, grade, size, count, boxQty:Norm.num(rec.boxQty), boxPrice, item: Norm.text(rec.item) || DEFAULT_ITEM};
      sanchi.set(Norm.keyOf(row), row);
    });
    const jibun = (data.jibun||[]).map((r,i)=>({
      id: r.id || ('j'+Date.now().toString(36)+i),
      date: Norm.date(r.date), variety: Norm.text(r.variety),
      grade: Norm.grade(r.grade), size: Norm.size(r.size), count: Norm.num(r.count),
      boxQty: Norm.num(r.boxQty), betsuCount: Norm.num(r.betsuCount)||0, source: r.source||'csv', addedAt: r.addedAt || new Date().toISOString(),
      item: Norm.text(r.item) || DEFAULT_ITEM,
      // 作型の割り当て（未割当は null）。混在は据置の本数で保持する。
      plant: (r.plant==='新植'||r.plant==='据置'||r.plant==='mix') ? r.plant : null,
      sueokiStems: Norm.num(r.sueokiStems)||0,
      // 旧形式の比率は「値が入っている時だけ」引き継ぐ。0 を書き込むと、
      // setJibunPlantGroup が delete しているのに復元のたびに生え直して保存され続ける
      // （読む側の allocFraction は undefined でも Number(undefined)||0 で 0 になるので挙動は同じ）。
      ...(Norm.num(r.sueokiRatio) ? {sueokiRatio: Norm.num(r.sueokiRatio)} : {})
    }));
    const sakutsuke = (data.sakutsuke||[]).map((r,i)=>({
      id: r.id || ('s'+Date.now().toString(36)+i),
      variety: Norm.text(r.variety),
      type: (r.type==='据置') ? '据置' : '新植',
      tsubo: Norm.num(r.tsubo)||0,
      item: Norm.text(r.item) || DEFAULT_ITEM,
      year: String(r.year || Store.currentYear())
    })).filter(r=>r.variety);
    // 品目全体データ。旧バックアップには無いので、その時は空（全置換なので残さない）。
    const zentai = new Map();
    (data.zentai||[]).forEach(rec=>{
      const row = {date: Norm.date(rec.date), item: Norm.text(rec.item) || DEFAULT_ITEM,
                   boxes: Norm.num(rec.boxes), amount: Norm.num(rec.amount), avgPrice: Norm.num(rec.avgPrice)};
      if(!Norm.validDate(row.date)) return;
      zentai.set(Norm.zentaiKey(row), row);
    });
    // 旧バックアップの data.items（品目マスタ）は読み捨てる。品目の定義は ITEM_RULES が持つ。
    Store.sanchi = sanchi;
    Store.jibun = jibun;
    Store.sakutsuke = sakutsuke;
    Store.zentai = zentai;
    // 取り込めなかった行の控え。旧バックアップには無いので、その時は空にする（全置換なので残さない）。
    Store.importErrors = Array.isArray(data.importErrors) ? data.importErrors.slice(0, IMPORT_ERR_KEEP) : [];
    Store.dirtyCount = 0;
    Store.meta.lastBackupAt = new Date().toISOString();
    Store.persist();
  },
  markBackedUp(){
    Store.meta.lastBackupAt = new Date().toISOString();
    Store.dirtyCount = 0;
    Store.persist();
  },
  loadSample(){
    Store.resetAll();
    // サンプルは2026年のクルクマ。取込と同じく「選択中の品目」が付くので、先に対象を合わせておく。
    State.selectedItem = DEFAULT_ITEM;
    State.selectedYear = '2026';
    const {records} = Parse.sanchiCSV(SAMPLE_SANCHI_CSV);
    Store.mergeSanchi(records);
    Store.mergeJibun(SAMPLE_JIBUN.map(r=>({...r})), 'sample');
  }
};

/* ============================== Compute ============================== */
const Compute = {
  /* ---- シーズン（年度）の判定 ----
     年度＝品目ごとの「管理上の開始月」から1年間。開始月は品目マスタの宣言値。
       クルクマ（開始月1）  : 2026-01-01〜2026-12-31 ＝暦年。従来と完全に同じ。
       冬品目（開始月11）   : 2026-11-01〜2027-10-31 が「2026年」＝11月〜翌3月の出荷が1つに収まる。
     開始月が固定なので時間軸は隙間なく敷き詰められる＝どのシーズンにも入らない日付は存在しない。 */
  seasonYear(date, item){
    const s = String(date||'');
    if(!/^\d{4}-\d{2}/.test(s)) return '';
    const y = parseInt(s.slice(0,4),10);
    const m = parseInt(s.slice(5,7),10);
    const start = itemSeasonStart(item || DEFAULT_ITEM);
    return String(m >= start ? y : y-1);
  },
  // シーズンの期間（表示用）。開始月が1月なら暦年なので範囲表示は不要＝null を返す。
  seasonRange(year, item){
    const start = itemSeasonStart(item || DEFAULT_ITEM);
    if(start === 1) return null;
    const y = parseInt(year,10);
    if(!Number.isFinite(y)) return null;
    // ここへ来る時点で start は2〜12。開始月から1年間なので、終わりは必ず翌暦年の (start-1) 月。
    return `${y}年${start}月〜${y+1}年${start-1}月`;
  },

  /* ---- 年度×品目の絞り込み ----
     集計はすべてこの3つを経由して読む（Store を直接見ない）。
     年度は date の先頭4桁＝暦年。品目は各レコードの item（旧データは移行でクルクマが入る）。
     毎描画で作り直すと 2800 件超を何度も走査するので、rev（データ更新カウンタ）と
     選択中の年度・品目をキーにキャッシュする。 */
  _scope: {key:null, sanchi:null, jibun:null, sakutsuke:null, zentai:null},
  scopeKey(){ return `${State.selectedYear}|${State.selectedItem}|${Store.rev}`; },
  _rescope(){
    const key = Compute.scopeKey();
    if(Compute._scope.key === key) return Compute._scope;
    const y = String(State.selectedYear || '');
    const it = State.selectedItem || DEFAULT_ITEM;
    const inScope = (r)=> Compute.seasonYear(r.date, r.item || DEFAULT_ITEM) === y && (r.item || DEFAULT_ITEM) === it;
    const sanchi = new Map();
    Store.sanchi.forEach((rec, k)=>{ if(inScope(rec)) sanchi.set(k, rec); });
    // 品目全体データは日付順の配列で持つ（移動平均が「実際にデータのある隣の点」を要るため）
    const zentai = Array.from(Store.zentai.values()).filter(inScope)
      .sort((a,b)=> a.date.localeCompare(b.date));
    Compute._scope = {
      key,
      sanchi,
      zentai,
      jibun: Store.jibun.filter(inScope),
      // 作付設定は日付を持たないので year フィールドで絞る
      sakutsuke: Store.sakutsuke.filter(r=> String(r.year||'') === y && (r.item || DEFAULT_ITEM) === it)
    };
    return Compute._scope;
  },
  scopedSanchi(){ return Compute._rescope().sanchi; },
  scopedJibun(){ return Compute._rescope().jibun; },
  scopedSakutsuke(){ return Compute._rescope().sakutsuke; },
  scopedZentai(){ return Compute._rescope().zentai; },

  /* 取込タブは年度を持たない（年度バーを出していない）ので、手入力の品種候補は
     「その品目で今までに登録した作付設定の品種」＝全年度から拾う。
     並びは年度の新しい順→その年度内は登録順。 */
  itemSakutsukeVarieties(item){
    const it = item || State.selectedItem || DEFAULT_ITEM;
    const rows = Store.sakutsuke
      .map((r, i)=>({r, i}))
      .filter(({r})=> (r.item || DEFAULT_ITEM) === it && r.variety)
      .sort((a,b)=> String(b.r.year||'').localeCompare(String(a.r.year||'')) || (a.i - b.i));
    return Array.from(new Set(rows.map(({r})=>r.variety)));
  },
  /* CSV書き出し用。保存タブには年度バーが無いので、書き出す範囲は年度を明示して取り出す。
     year が空文字なら全年度。Store から直に集めるので、表示中の年度には左右されない。 */
  rowsForExport(item, year){
    const it = item || State.selectedItem || DEFAULT_ITEM;
    const y = String(year || '');
    const hit = (r)=> (r.item || DEFAULT_ITEM) === it &&
                      (!y || Compute.seasonYear(r.date, it) === y);
    return {
      sanchi: Array.from(Store.sanchi.values()).filter(hit),
      jibun: Store.jibun.filter(hit),
      zentai: Array.from(Store.zentai.values()).filter(hit)
    };
  },
  /* 書き出しの年度セレクタに並べる年度＝実際にデータが入っている年度だけ（降順）。
     Store.years は「今年」を必ず足すが、書き出しでは空の年を選べても空振りするだけなので足さない。 */
  yearsWithData(item){
    const it = item || State.selectedItem || DEFAULT_ITEM;
    const s = new Set();
    const add = (r)=>{
      if((r.item || DEFAULT_ITEM) !== it) return;
      const y = Compute.seasonYear(r.date, it); if(y) s.add(y);
    };
    Store.sanchi.forEach(add);
    Store.jibun.forEach(add);
    Store.zentai.forEach(add);
    return Array.from(s).sort().reverse();
  },
  /* 品種名の入力補助（手入力フォームの自由入力欄）。こちらも取込タブから使うので年度で絞らない。 */
  itemDataVarieties(item){
    const it = item || State.selectedItem || DEFAULT_ITEM;
    const mine = (r)=> (r.item || DEFAULT_ITEM) === it;
    return Array.from(new Set([
      ...Array.from(Store.sanchi.values()).filter(mine).map(r=>r.variety),
      ...Store.jibun.filter(mine).map(r=>r.variety)
    ].filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ja'));
  },

  /* ================= 品目全体データ（JAの共選共販市況）=================
     産地データ（品種×等級×階級）とは別系統。数字は一致しない前提で、突合も比較もしない。

     ---- 横軸＝基準日から数えて何回目の出荷日か ----
     出荷は日・火・木の週3回で、間隔が2日と3日で不揃い（前提メモ A-14）。
     だから軸は「日付」でも「前後1日」でもなく、この通算回数で取る。

     ⚠ 番号は必ずカレンダーから振る。取り込んだデータの並びから振ってはいけない。
        資料が1回抜けた年だけ以降が1つずつ手前にずれ、5年重ねたときにその年の線だけ
        左に寄る——しかも見た目では気づけない。
     ⚠ 年末年始の休市も数え続ける（ユーザー判断）。データの無い日は点が無いだけで線はつなぐ
        ＝空いた区間の長さが「ここは休みだった」の合図になる。

     基準日＝ITEM_RULES の zentai.baseMonth の最初の 日・火・木。そこが1回目で、以降 2,3,…。
     基準日より前は 0・−1・−2…（「4月」「11月」を別枠にしない＝別枠は年ごとに件数も
     日付も違うので重ねられない）。
     クルクマは5月始まりで、お盆前の最終出荷が毎年45回目に揃う（前提メモ A-17）。 */
  SHIP_WDS: [0, 2, 4], // 日・火・木
  // 1970-01-01 を 0 とする通し番号。時差や夏時間の影響を受けないよう UTC で数える。
  dayNum(iso){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));
    return m ? Date.UTC(+m[1], +m[2]-1, +m[3]) / 86400000 : null;
  },
  isoOfDayNum(n){
    const d = new Date(n * 86400000);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  },
  wdOfDayNum(n){ return (((n + 4) % 7) + 7) % 7; }, // 1970-01-01 は木曜(4)
  isShipDay(n){ return Compute.SHIP_WDS.includes(Compute.wdOfDayNum(n)); },
  // 基準日の通し番号。品目に zentai を書いていなければ null＝この機能ごと出ない。
  shipBase(item, year){
    const rule = itemRule(item || DEFAULT_ITEM).zentai;
    const y = parseInt(year, 10);
    if(!rule || !Number.isFinite(y)) return null;
    const m = Math.min(12, Math.max(1, Number(rule.baseMonth) || 1));
    let n = Date.UTC(y, m-1, 1) / 86400000;
    while(!Compute.isShipDay(n)) n++;
    return n;
  },
  // [a,b] に含まれる 日・火・木 の数（両端を含む）。1日ずつ数えず週で割る。
  countShipDays(a, b){
    if(b < a) return 0;
    let n = 0;
    Compute.SHIP_WDS.forEach(w=>{
      const first = a + ((((w - Compute.wdOfDayNum(a)) % 7) + 7) % 7);
      if(first <= b) n += Math.floor((b - first) / 7) + 1;
    });
    return n;
  },
  /* 日付 → 何回目か。基準日が1、その1つ前が0、さらに前が−1…
     ※ 日・火・木以外の日は「直前の出荷日」と同じ番号になる。資料は日・火・木しか
        出ないので実務では起こらないが、起きても点が重なるだけで数字は壊れない。 */
  shipIndex(date, item, year){
    const base = Compute.shipBase(item, year);
    const d = Compute.dayNum(date);
    if(base === null || d === null) return null;
    return (d >= base) ? Compute.countShipDays(base, d)
                       : -Compute.countShipDays(d + 1, base - 1);
  },
  // 何回目か → その日の通し番号（基準日から数え直す）
  shipDayNumAt(i, item, year){
    const base = Compute.shipBase(item, year);
    if(base === null || !Number.isFinite(i)) return null;
    let n = base, k = 1;
    const step = (i >= 1) ? 1 : -1;
    while(k !== i){
      do { n += step; } while(!Compute.isShipDay(n));
      k += step;
    }
    return n;
  },
  // iMin..iMax の各番号に対応する実際の日付。ラベルとプロット詳細の両方から使う。
  shipCalendar(item, year, iMin, iMax){
    const map = new Map();
    let n = Compute.shipDayNumAt(iMin, item, year);
    if(n === null) return map;
    for(let i=iMin; i<=iMax; i++){
      map.set(i, Compute.isoOfDayNum(n));
      do { n++; } while(!Compute.isShipDay(n));
    }
    return map;
  },
  /* 横軸のラベル＝月の変わり目にだけ月名を出す（番号も物日の縦線も出さない＝ユーザー判断）。
     5年を重ねる図では年ごとに暦が違うので、表示中の年度のカレンダーで置く。 */
  shipAxisLabels(cal){
    const out = []; let lastM = '';
    cal.forEach((iso, i)=>{
      const m = iso.slice(0,7);
      if(m !== lastM){ out.push({i, label: parseInt(iso.slice(5,7),10) + '月'}); lastM = m; }
    });
    return out;
  },

  /* ---- 3点移動平均 ----
     前後1点を含む3点の【売立金額の合計 ÷ 箱数の合計】。箱平均価格の算術平均ではない
     （箱数の少ない日が同じ重みで効いてしまうため）。
     前後1点＝実際にデータのある隣の点なので、休みや欠測はまたいでつなぐ。
     先頭と末尾は隣が片側しか無いので2点だけで計算する。 */
  zentaiSeriesFrom(rows, item, year){
    const src = rows.slice().sort((a,b)=> a.date.localeCompare(b.date));
    return src.map((r, k)=>{
      const win = [src[k-1], r, src[k+1]].filter(Boolean);
      const boxes = win.reduce((s,x)=> s + (Number(x.boxes)||0), 0);
      const amount = win.reduce((s,x)=> s + (Number(x.amount)||0), 0);
      return {
        date: r.date,
        i: Compute.shipIndex(r.date, item, year),
        boxes: Number(r.boxes)||0,
        amount: Number(r.amount)||0,
        avgPrice: Number(r.avgPrice)||0,   // 資料の生の箱平均価格。グラフには出さない。
        ma: boxes>0 ? amount/boxes : null, // 移動平均（この線だけを描く）
        span: win.length                   // 2なら端の点（3点そろっていない）
      };
    });
  },
  // 表示中の年度×品目ぶん
  /* 箱数の3点移動平均。火曜は箱数が少なくなる傾向（前提メモ A-14）があり、生のままだと
     一日おきにギザギザして流れが読めない（ユーザー指摘 2026-09-08b）。

     ⚠ 5カ年比較の移動平均とは規則が違う。あちらは「配列上の隣」を使う＝資料の抜けをまたいで
        つなぐが、こちらは【出荷回数が1つ違う日】を見て、そこに資料が無ければ使わない
        （ユーザー指定「歯抜けがあったらまたがずに2点平均で」）。
        両隣が揃えば3点、片側だけなら2点、どちらも無ければその日だけの1点。
     ⚠ 平均するのは箱数そのもの（金額は関係しない）＝単純平均でよい。
     ⚠⚠ 名前を ma にしないこと。zentaiSeriesFrom が既に ma を持っていて、それは
        【箱単価の移動平均】＝桁がまるで違う（6,800 と 996）。同じ名前にすると棒の高さに
        値段が入り、たて軸が7,000箱まで伸びる（2026-09-08b に実際にやってテストが捕まえた）。 */
  zentaiBoxMA(points){
    const byI = new Map();
    points.forEach(p=>{ if(p.i != null && p.boxes > 0) byI.set(p.i, p); });
    return points.map(p=>{
      if(p.i == null || !(p.boxes > 0)) return {...p, boxMA:null, boxSpan:0};
      const near = [byI.get(p.i - 1), p, byI.get(p.i + 1)].filter(Boolean);
      const sum = near.reduce((s, q)=> s + q.boxes, 0);
      return {...p, boxMA: sum / near.length, boxSpan: near.length};
    });
  },
  zentaiSeries(){
    return Compute.zentaiSeriesFrom(Compute.scopedZentai(),
      State.selectedItem || DEFAULT_ITEM, State.selectedYear);
  },
  /* 5カ年比較の材料＝選択中の年度＋その前4年。データのある年だけ返す。
     色は新しい年ほど濃い（--yr1 が選択中の年度）。 */
  zentaiYearSeries(item, year, span){
    const it = item || State.selectedItem || DEFAULT_ITEM;
    const y0 = parseInt(year, 10);
    if(!Number.isFinite(y0)) return [];
    const n = span || 5;
    const byYear = new Map();
    Store.zentai.forEach(r=>{
      if((r.item || DEFAULT_ITEM) !== it) return;
      const y = Compute.seasonYear(r.date, it);
      if(!byYear.has(y)) byYear.set(y, []);
      byYear.get(y).push(r);
    });
    const out = [];
    for(let k=0; k<n; k++){
      const y = String(y0 - k);
      const rows = byYear.get(y);
      if(!rows || !rows.length) continue;
      out.push({year:y, color:`var(--yr${k+1})`, points: Compute.zentaiSeriesFrom(rows, it, y)});
    }
    return out;
  },
  varietyList(){
    const agg = new Map(); // variety -> {boxes, days:Set}
    Compute.scopedSanchi().forEach(rec=>{
      if(!agg.has(rec.variety)) agg.set(rec.variety, {boxes:0, days:new Set()});
      const a = agg.get(rec.variety);
      a.boxes += rec.boxQty;
      a.days.add(rec.date);
    });
    return Array.from(agg.entries()).map(([variety,a])=>({variety, boxes:a.boxes, days:a.days.size}))
      .sort((a,b)=>b.boxes-a.boxes);
  },
  datesWithData(){
    // 産地データで出荷情報が取れた日付の集合（＝市場日。折れ線の横軸を作るのに使う）
    const s = new Set();
    Compute.scopedSanchi().forEach(rec=> s.add(rec.date));
    return s;
  },
  /* その日・その品種の箱数。プロットをタップしたときの詳細に出す。
     規格構成ドーナツを撤去したとき、中央に出ていた「総箱数」の行き先としてここへ移した
     （2026-09-08b ユーザー判断）。varieties は配列＝主要5品種でもその品種1つでも同じ形で呼べる。 */
  boxesOn(varieties, date){
    const set = new Set(varieties);
    let n = 0;
    Compute.scopedSanchi().forEach(rec=>{
      if(rec.date === date && set.has(rec.variety)) n += Number(rec.boxQty) || 0;
    });
    return n;
  },
  marketDatesInRange(firstD, lastD){
    // 産地データに存在する日付（＝市場日）のうち [firstD, lastD] の範囲を昇順で返す
    return Array.from(Compute.datesWithData()).sort().filter(d=> d>=firstD && d<=lastD);
  },
  lineDataDense(variety){
    // lineData（出荷のあった日のみ）を、初出荷日〜最終出荷日の全市場日に密化。
    // 出荷の無い市場日は price=null（プロット無し・線は接続側で跨ぐ）。
    const base = Compute.lineData(variety);
    if(base.length===0) return [];
    const byDate = new Map(base.map(p=>[p.date, p]));
    const axis = Compute.marketDatesInRange(base[0].date, base[base.length-1].date);
    return axis.map(d=>{
      const p = byDate.get(d);
      return p ? {date:d, price:p.price, marker:p.marker} : {date:d, price:null, marker:null};
    });
  },
  // 選択中の年度×品目での価格推移。計算そのものは lineDataFrom にある。
  // 品目ごとの差分は「規則」として引数で渡す＝lineDataFrom の中は品目を知らない。
  lineData(variety){
    return Compute.lineDataFrom(Compute.scopedSanchi(), variety,
      itemRule(State.selectedItem || DEFAULT_ITEM).price);
  },
  // 【保護対象】価格推移の計算本体。Store も State も読まない純粋関数で、rows は Map でも配列でもよい。
  // lineData から切り出してあるのは、SelfTest がサンプルデータを直接流し込んで
  // 全18品種82点を基準値と突き合わせられるようにするため（旧SelfTestは表示中の年度×品目に依存し、
  // 品目を切り替えていると何も検証せず正常終了していた）。
  //
  // rule = {basis:[[等級,階級],…], per:換算本数}。この順で最初に価格の出た組を採用する。
  // 既定はクルクマの現行値なので、rule を省くと従来と1円も変わらない
  // （＝SELFTEST_ANCHOR 7630.71 がこの関数の不変条件であり続ける）。
  lineDataFrom(rows, variety, rule){
    const r0 = rule || {basis:[['秀','2L'], ['秀','L']], per:50};
    const byDate = new Map(); // date -> array of records
    rows.forEach(rec=>{
      if(rec.variety !== variety) return;
      if(!byDate.has(rec.date)) byDate.set(rec.date, []);
      byDate.get(rec.date).push(rec);
    });
    const dates = Array.from(byDate.keys()).sort();
    const points = dates.map(date=>{
      const rows = byDate.get(date);
      const calc = (grade, size)=>{
        // 価格未確定(boxPrice=null)は平均計算から除外。数量集計(背景の規格バー/varietyList)には別途算入される。
        // ※ 入り本数では絞らない＝同じ等級×階級なら30本行と50本行が合算される（従来どおり）。
        const rs = rows.filter(r=>r.grade===grade && r.size===size && r.boxPrice!=null);
        if(rs.length===0) return null;
        const numerator = rs.reduce((s,r)=>s + r.boxPrice*r.boxQty, 0);
        const denomBoxes = rs.reduce((s,r)=>s + r.count*r.boxQty, 0) / r0.per;
        if(!(denomBoxes > 0)) return null;
        return numerator / denomBoxes;
      };
      /* blend＝「先に見つかったほうを採る優先リスト」ではなく
         【その日の行をまとめて1つに平均する】モード（スイートピー）。
         入り本数が規格によらず一定の品目でだけ意味を持つ。クルクマのように
         30入りと50入りが混在する品目でこれをやると平均の意味が壊れるので、
         書いた品目でだけ有効にする（＝rule に blend が無ければ以下は素通り）。
         blend:'all' は等級・階級で絞らない＝その日の全部の平均＝実際の手取りそのもの。
         ⚠ 本数0の行（クルクマの『別』のような形）は必ず外す。分子だけ増えて分母が
           増えないので、混ぜると平均が跳ね上がる。 */
      if(r0.blend){
        const inRange = (r)=> r0.blend==='all' ? true
          : (r0.basis||[]).some(([g, sz])=> r.grade===g && r.size===sz);
        const rs = rows.filter(r=> r.boxPrice!=null && (Number(r.count)||0) > 0 && inRange(r));
        if(rs.length===0) return {date, price:null, marker:null};
        const numerator = rs.reduce((s,r)=>s + r.boxPrice*r.boxQty, 0);
        const denomBoxes = rs.reduce((s,r)=>s + r.count*r.boxQty, 0) / r0.per;
        if(!(denomBoxes > 0)) return {date, price:null, marker:null};
        return {date, price: numerator/denomBoxes, marker:'blend'};
      }
      for(const [g, sz] of r0.basis){
        const price = calc(g, sz);
        if(price != null) return {date, price, marker: sz}; // マーカーは階級名＝従来と同じ '2L'/'L'
      }
      return {date, price:null, marker:null};
    });
    return points;
  },
  /* ---- 価格推移の背景に敷く規格構成 ----
     日付ごとに、バケツ別の箱数と合計を返す。バケツは品目のルール（sizeBars.buckets）が正本で、
     どれにも当てはまらない行は OTHER にまとめて【棒の一番上】に赤で乗る
     ＝赤が見えたら「いつもと違う等級（3P など）が出た日」と一目で分かる。
     価格未確定（boxPrice=null）の行も数える（数量の集計なので値段の有無は関係ない）。
     varieties は配列＝複数を渡せば合計した割合になる。
     lineDataFrom と同じく Store も State も読まない純粋関数（テストが直接呼ぶ）。 */
  SIZE_BAR_OTHER: '__other__',
  BAR_FILL: 0.22,   // 背景に敷く帯の既定の薄さ（折れ線を邪魔しない濃さ）
  // varieties に null を渡すと【品種で絞らない＝その品目の全部】になる。
  // 品目全体の規格の割合（産地タブの「箱数」の下に出す図）がこれを使う。
  sizeMixFrom(rows, varieties, sb){
    if(!sb || !sb.buckets) return null; // ルールが無い品目では棒を描かない
    const OTHER = Compute.SIZE_BAR_OTHER;
    const want = varieties ? new Set(varieties) : null;
    const byDate = new Map();       // date -> Map(バケツ -> 箱数)
    const totals = new Map();       // バケツ -> シーズン合計の箱数
    rows.forEach(rec=>{
      if(want && !want.has(rec.variety)) return;
      const q = Number(rec.boxQty) || 0;
      if(!(q > 0)) return;
      /* バケツに count（入り本数）を書いた品目では、そこまで一致した行だけが入る。
         クルクマの 秀2L を 30本入り／50本入りに分けるためのもので、書いていないバケツ
         （スイピの 4P2L など）は従来どおり 等級×階級 だけで拾う＝挙動は変わらない。 */
      const hit = sb.buckets.find(b=> b.grade===rec.grade && b.size===rec.size
                                   && (b.count == null || b.count === rec.count));
      const key = hit ? hit.key : OTHER;
      if(!byDate.has(rec.date)) byDate.set(rec.date, new Map());
      const m = byDate.get(rec.date);
      m.set(key, (m.get(key)||0) + q);
      totals.set(key, (totals.get(key)||0) + q);
    });
    // 積む順はルールの並び（下から）＋ その他は必ず一番上。日ごとに並べ替えないこと
    //（日によって色の段が入れ替わると比較できなくなる）。
    const order = sb.buckets.map(b=>b.key).concat([OTHER]);
    const colors = {}; const labels = {}; const opacity = {};
    // 帯の濃さ。書かなければ従来どおり薄敷き（BAR_FILL）。ルールに書いた分だけ濃くなる。
    sb.buckets.forEach(b=>{
      colors[b.key] = b.colorVar; labels[b.key] = b.label;
      opacity[b.key] = (b.opacity == null) ? Compute.BAR_FILL : b.opacity;
    });
    colors[OTHER] = sb.otherColorVar || 'var(--danger)';
    labels[OTHER] = sb.otherLabel || 'その他';
    opacity[OTHER] = (sb.otherOpacity == null) ? Compute.BAR_FILL : sb.otherOpacity;
    const mix = new Map();
    byDate.forEach((m, date)=>{
      let total = 0; m.forEach(v=> total += v);
      mix.set(date, {sizes:m, total});
    });
    return {order, colors, labels, opacity, totals, byDate:mix};
  },
  // 選択中の年度×品目での規格構成（画面はこちら）。varieties は配列。
  sizeMix(varieties){
    return Compute.sizeMixFrom(Compute.scopedSanchi(), varieties,
      itemRule(State.selectedItem || DEFAULT_ITEM).sizeBars);
  },
  /* 品目全体の規格の割合＝品種で絞らず、その年度の産地市況を全部合わせたもの。
     ⚠ 出どころは【品種別の市況CSV】であって、上に出る箱数（JAの共選共販市況）とは別の資料。
        2026-09-08 に原本で突き合わせて【箱数は完全に一致する】ことを確認したので、
        同じ横軸に並べてよい（前提メモ A-19）。金額だけは丸めのぶんズレるので使わない。 */
  sizeMixAll(){
    return Compute.sizeMixFrom(Compute.scopedSanchi(), null,
      itemRule(State.selectedItem || DEFAULT_ITEM).sizeBars);
  },
  /* 上の割合を、品目全体データと同じ「何回目の出荷日か」の軸に載せ替える。
     資料の無い日は入らない＝図では空きになる（嘘をつくより空けておく）。 */
  zentaiMixPoints(){
    const item = State.selectedItem || DEFAULT_ITEM;
    const year = String(State.selectedYear || '');
    const mix = Compute.sizeMixAll();
    if(!mix) return null;
    const points = [];
    mix.byDate.forEach((d, date)=>{
      if(!(d.total > 0)) return;
      const i = Compute.shipIndex(date, item, year);
      if(i == null) return;
      points.push({date, i, sizes:d.sizes, total:d.total});
    });
    points.sort((a,b)=> a.i - b.i);
    return {mix, points};
  },
  /* ---- 作型（新植／据置／混植）----
     クルクマ固有の要求なので、品目のルールに alloc を書いた品目でだけ有効にする
     （price / sizeBars と同じ「書かなければ効かない」作法）。無効な品目では
     作付設定の区分欄・未割当カード・割り当てモーダル・区分チップがすべて出ない。
     坪あたり売上は区分を見ないので、無効な品目でも今までどおり使える。 */
  allocEnabled(item){ return !!itemRule(item || State.selectedItem || DEFAULT_ITEM).alloc; },
  // 作付設定の登録状況から品種の区分を決める。画面（品種別売上内訳の区分チップ）と
  // JSON書き出しの両方がここを通る。2箇所に同じ判定を書くと、片方だけ直したときに
  // 「画面では混植なのに書き出したJSONでは新植」という食い違いが起きる。
  varietyCategory(t){
    if(!t) return null;
    return (t.新植 && t.据置) ? '混植' : (t.据置 ? '据置' : '新植');
  },
  // 作付設定から、品種ごとの区分有無と区分別坪を集計
  // 任意の作付設定リストから集計する（allocInfo の中身を切り出したもの）。
  // JSON書き出しは全年度・全品目が対象なので、年度×品目ごとにこれを呼び分ける必要がある。
  allocInfoFrom(rows){
    const typesByVariety = new Map(); // variety -> {新植:bool, 据置:bool}
    const tsuboByType = new Map();    // variety -> {新植:tsubo, 据置:tsubo}
    rows.forEach(r=>{
      const v = r.variety; if(!v) return;
      const t = (r.type==='据置') ? '据置' : '新植';
      if(!typesByVariety.has(v)) typesByVariety.set(v, {新植:false, 据置:false});
      if(!tsuboByType.has(v)) tsuboByType.set(v, {新植:0, 据置:0});
      typesByVariety.get(v)[t] = true; // 坪の大小は見ない。行が登録されていれば区分ありとみなす
      tsuboByType.get(v)[t] += (Number(r.tsubo)||0);
    });
    return {typesByVariety, tsuboByType};
  },
  // 選択中の年度×品目の作付設定から集計（画面表示はすべてこちら）
  allocInfo(){ return Compute.allocInfoFrom(Compute.scopedSakutsuke()); },
  // 品種が両区分ありのとき、割り当てが要る（plant=null）行を返す。単区分・未登録品種は対象外＝入力不要。
  unassignedAllocRows(){
    if(!Compute.allocEnabled()) return [];  // 作型を使わない品目では聞かない
    const {typesByVariety} = Compute.allocInfo();
    return Compute.scopedJibun().filter(r=>{
      const t = typesByVariety.get(r.variety);
      return t && t.新植 && t.据置 && !(r.plant==='新植'||r.plant==='据置'||r.plant==='mix');
    });
  },
  // 出荷行の総本数（別行は別本数×箱数、通常は規格本数×箱数）
  rowStems(row){
    return ((row.betsuCount>0 ? row.betsuCount : row.count) || 0) * (row.boxQty||0);
  },
  // 未割当を「日付×品種×規格」でまとめる（割り当ての質問単位）。各グループに合計本数を持たせる。
  unassignedAllocGroups(){
    const groups = [];
    const byKey = new Map();
    Compute.unassignedAllocRows().forEach(r=>{
      const key = [r.date, r.variety, r.grade, r.size||'', r.count, r.betsuCount>0?r.betsuCount:0].join('|');
      let g = byKey.get(key);
      if(!g){ g = {key, date:r.date, variety:r.variety, grade:r.grade, size:r.size||'', count:r.count, betsuCount:r.betsuCount||0, ids:[], boxQty:0, stems:0}; byKey.set(key,g); groups.push(g); }
      g.ids.push(r.id); g.boxQty += (r.boxQty||0); g.stems += Compute.rowStems(r);
    });
    return groups;
  },
  // 行の実効「据置比率」f を返す。{f, unassigned}
  //  両区分: 新植→0 / 据置→1 / mix→据置本数÷総本数 / null→未割当  単区分: その区分に自動確定  未登録: 未分類
  //  作型を使わない品目では常に {f:0, unassigned:false}（区分は画面にも書き出しにも出さない）。
  allocFraction(row, typesByVariety){
    if(!Compute.allocEnabled(row.item)) return {f:0, unassigned:false};
    const t = typesByVariety.get(row.variety);
    if(!t) return {f:0, unassigned:false};        // 作付設定なし＝分割対象外
    if(t.新植 && t.据置){
      if(row.plant==='据置') return {f:1, unassigned:false};
      if(row.plant==='新植') return {f:0, unassigned:false};
      if(row.plant==='mix'){
        const st = Compute.rowStems(row);
        // 本数で保持（旧データは比率 sueokiRatio をフォールバックで使用）
        const f = (row.sueokiStems!=null && st>0) ? (Number(row.sueokiStems)||0)/st : (Number(row.sueokiRatio)||0);
        return {f:Math.max(0,Math.min(1,f)), unassigned:false};
      }
      return {f:0, unassigned:true};               // 両区分だが未割当
    }
    if(t.据置) return {f:1, unassigned:false};      // 据置のみ→自動
    return {f:0, unassigned:false};                // 新植のみ→自動
  },
  matchJibun(){
    return Compute.scopedJibun().map(row=>{
      const isBetsu = row.betsuCount>0;
      // 別行は産地の「別（階級なし・本数0）」の箱単価にマッチ。標準行は 等級×階級×本数 でマッチ
      const key = isBetsu
        ? Norm.key(row.item || DEFAULT_ITEM, row.date, row.variety, '別', '', 0)
        : Norm.key(row.item || DEFAULT_ITEM, row.date, row.variety, row.grade, row.size, row.count);
      const stemsPerBox = isBetsu ? row.betsuCount : row.count; // 1箱あたりの本数
      const s = Compute.scopedSanchi().get(key);
      if(s){
        const pending = (s.boxPrice==null); // 市況の箱単価が未確定＝金額は出せない
        const stems = stemsPerBox * row.boxQty;
        const perStem = (!pending && stemsPerBox>0) ? s.boxPrice / stemsPerBox : null; // 1本単価＝箱単価÷1箱本数
        return {...row, isBetsu, matched:true, pending, sanchiKey:key, boxPrice: pending?null:s.boxPrice, amount: pending?null:(s.boxPrice * row.boxQty), stems, perStem};
      }
      return {...row, isBetsu, matched:false, pending:false, sanchiKey:key, boxPrice:null, amount:0, stems: stemsPerBox * row.boxQty, perStem:null};
    });
  },
  jibunSummary(matched){
    // matched を confirmed(金額確定) / pending(市況が未確定) / unmatched に3分割
    const ok = matched.filter(r=>r.matched && !r.pending);   // 売上・平均・内訳は confirmed のみ
    const pend = matched.filter(r=>r.matched && r.pending);  // 数量には算入、売上は未確定
    const bad = matched.filter(r=>!r.matched);
    const total = ok.reduce((s,r)=>s+r.amount,0);
    const confirmedStems = ok.reduce((s,r)=>s+(r.stems||0),0);
    // KPIの出荷量（箱数・本数）は実出荷量なので pending も算入
    const totalBoxes = ok.reduce((s,r)=>s+r.boxQty,0) + pend.reduce((s,r)=>s+r.boxQty,0);
    const totalStems = confirmedStems + pend.reduce((s,r)=>s+(r.stems||0),0);
    const avgPerStem = confirmedStems>0 ? total/confirmedStems : null; // 平均1本単価＝確定売上÷確定本数
    // 未確定行は同一市況行(sanchiKey)ごとに1件へ重複排除（複数出荷が同じ市況価格に紐づく場合）
    const pendingSeen = new Set();
    const pendingRows = [];
    pend.forEach(r=>{ if(pendingSeen.has(r.sanchiKey)) return; pendingSeen.add(r.sanchiKey); pendingRows.push(r); });
    // 新植/据置の区分別按分（stems・amount）。既存の品種合計は維持しつつ split を追加。
    const {typesByVariety, tsuboByType} = Compute.allocInfo();
    const zeroSplit = ()=>({shinshoku:{stems:0,amount:0}, sueoki:{stems:0,amount:0}, unassigned:{stems:0,amount:0}});
    const byVariety = new Map();
    ok.forEach(r=>{
      if(!byVariety.has(r.variety)) byVariety.set(r.variety, {amount:0, boxes:0, stems:0, split:zeroSplit()});
      const v = byVariety.get(r.variety);
      v.amount += r.amount; v.boxes += r.boxQty; v.stems += (r.stems||0);
      const st = r.stems||0, am = r.amount||0;
      const {f, unassigned} = Compute.allocFraction(r, typesByVariety);
      if(unassigned){ v.split.unassigned.stems += st; v.split.unassigned.amount += am; }
      else {
        v.split.sueoki.stems += f*st;      v.split.sueoki.amount += f*am;
        v.split.shinshoku.stems += (1-f)*st; v.split.shinshoku.amount += (1-f)*am;
      }
    });
    const varietyRows = Array.from(byVariety.entries()).map(([variety,v])=>{
      const tt = tsuboByType.get(variety) || {新植:0, 据置:0};
      const perT = (amount, tsubo)=> tsubo>0 ? amount/tsubo : null;
      const perS = (amount, stems)=> stems>0 ? amount/stems : null;
      // 作付設定に基づく区分：両方=混植／片方=その区分／未登録=null（判定は varietyCategory が正本）
      const tv = typesByVariety.get(variety);
      const category = Compute.varietyCategory(tv);
      return {variety, amount:v.amount, boxes:v.boxes, stems:v.stems, perStem: v.stems>0 ? v.amount/v.stems : null, category,
        split:{
          shinshoku:{...v.split.shinshoku, tsubo:tt.新植, perTsubo:perT(v.split.shinshoku.amount, tt.新植), perStem:perS(v.split.shinshoku.amount, v.split.shinshoku.stems)},
          sueoki:   {...v.split.sueoki,    tsubo:tt.据置, perTsubo:perT(v.split.sueoki.amount, tt.据置),       perStem:perS(v.split.sueoki.amount, v.split.sueoki.stems)},
          unassigned: v.split.unassigned,
          hasBoth: !!(tv && tv.新植 && tv.据置)
        }};
    });
    // ここでは並べ替えない。表示順は「出荷明細の出現順」で、それを知っているのは
    // screenMine 側（orderSeq）だけ。以前は金額降順に並べていたが、呼び出し側が
    // 必ず並べ直すので毎回捨てられており、並び順の仕様が2箇所に散っていた。
    return {total, totalBoxes, totalStems, avgPerStem, varietyRows, pendingRows, unmatchedRows:bad};
  },

  /* ---- 自分タブの突合＋集計をデータが変わるまで使い回す ----
     matchJibun と jibunSummary は削除・凡例タップ・月の開閉・タブ切替のたびに走っていた
     （実測：出荷3,000件で64ms、8,000件で168ms）。依存は scopedJibun / scopedSanchi /
     scopedSakutsuke の3つで、いずれも scopeKey（年度｜品目｜Store.rev）に含まれるので、
     絞り込みキャッシュとまったく同じ鍵で覚えておける。
     Store.persist() が rev++ するため、データが変わった瞬間に確実に無効化される
     （setSanchiPrice も setJibunPlantGroup も persist を通る）。
     ※ matchJibun / jibunSummary 自身は純粋関数のまま残す（SelfTest と回帰テストが直接呼ぶため）。 */
  _mine: {key:null, matched:null, summary:null},
  mineView(){
    const key = Compute.scopeKey();
    if(Compute._mine.key !== key){
      const matched = Compute.matchJibun();
      Compute._mine = {key, matched, summary: Compute.jibunSummary(matched)};
    }
    return Compute._mine;
  }
};

/* ============================== SelfTest ============================== */
// 価格計算の回帰チェック。サンプルCSVを直接流し込むので Store も State も読まない
// ＝どの品目・どの年度を表示していても必ず走る。
// （旧版は Compute.lineData 経由でスコープ済みデータを読んでいたため、クルクマ以外を選択中や
//   2026年以外を表示中だと console.assert に到達せず無言で正常終了した。つまり
//   「OKが出ない」と「不合格」が区別できなかった。）
//
// 基準値＝サンプルCSV(153件)を現行の計算に通した実測値。1品種1行で
//   [品種名, 点数, 価格が出た点数, 価格合計(小数4桁), マーカー列]
// マーカー列は日付順の '2L'(秀2L基準) / 'L'(秀Lへフォールバック) / '-'(価格なし)。
// これで「30本行と50本行の合算」「秀Lへのフォールバック」「未確定(boxPrice=null)の除外」が
// すべて1つの表で守られる。合計値が変わればどの品種で変わったかが即座に分かる。
const SELFTEST_GOLDEN = [
  ['エメラルドチョコゼブラ', 6, 6, '59188.6468', '2L2L2L2L2L2L'],
  ['エメラルドパゴタ', 3, 3, '19998.5315', '2L2L2L'],
  ['クルクマミックス(ミニ)', 1, 1, '5000.0000', 'L'],
  ['グリーンアイス', 3, 3, '37000.0000', '2L2L2L'],
  ['シャローム', 4, 4, '37300.0000', '2L2L2L2L'],
  ['チェリープリンセスデーン', 5, 5, '34552.5882', '2L2L2L2L2L'],
  ['バンコクスプリーム', 6, 6, '58600.0000', '2L2L2L2L2L2L'],
  ['パルビフローラ', 10, 10, '75810.7487', 'LLL2L2L2LL2L2L2L'],
  ['ピアノホワイト', 1, 0, '0.0000', '-'],
  ['プラートーン', 2, 2, '14200.0000', '2L2L'],
  ['プーディンレッド', 6, 4, '38791.6667', '--2L2L2L2L'],
  ['ホワイト', 6, 6, '61833.3333', '2L2L2L2LL2L'],
  ['ホワイトジャスミン', 6, 6, '63800.9220', '2L2L2L2L2L2L'],
  ['ミックス', 7, 3, '27500.0000', '-2L-2L2L--'],
  ['メージョーインプレッシブピンク', 3, 3, '34190.0000', '2L2L2L'],
  ['メージョージャスミン', 2, 2, '17600.0000', '2L2L'],
  ['リボン', 6, 6, '65920.0000', '2L2L2L2L2L2L'],
  ['ロージーレッド', 5, 5, '41550.0000', '2L2L2L2L2L']
];
const SELFTEST_ANCHOR = 7630.714285714285; // パルビフローラ 2026-05-14（表示は 7630.71）
const SelfTest = {
  run(){
    try{
      const {records} = Parse.sanchiCSV(SAMPLE_SANCHI_CSV);
      const fails = [];
      let points = 0;
      SELFTEST_GOLDEN.forEach(([variety, nPts, nPriced, sumStr, markers])=>{
        const pts = Compute.lineDataFrom(records, variety);
        const priced = pts.filter(p=>p.price!=null);
        const sum = priced.reduce((s,p)=>s+p.price, 0).toFixed(4);
        const mk = pts.map(p=>p.marker==null?'-':p.marker).join('');
        points += pts.length;
        if(pts.length!==nPts || priced.length!==nPriced || sum!==sumStr || mk!==markers){
          fails.push({品種:variety, 点数:`${pts.length}/${nPts}`, 価格あり:`${priced.length}/${nPriced}`,
                      合計:`${sum} / ${sumStr}`, マーカー:`${mk} / ${markers}`});
        }
      });
      const anchor = Compute.lineDataFrom(records, 'パルビフローラ').find(p=>p.date==='2026-05-14');
      if(!(anchor && anchor.price!=null && Math.abs(anchor.price - SELFTEST_ANCHOR) < 1e-9)){
        fails.push({品種:'パルビフローラ 2026-05-14（アンカー）', 実測: anchor ? anchor.price : null, 期待: SELFTEST_ANCHOR});
      }
      if(fails.length){
        console.error(`[SelfTest] NG: 価格計算が基準値と一致しません（${fails.length}件）`);
        console.table(fails);
        return false;
      }
      console.info(`[SelfTest] OK: ${SELFTEST_GOLDEN.length}品種${points}点すべて基準値と一致 / パルビフローラ 2026-05-14 = ${anchor.price.toFixed(2)}`);
      return true;
    }catch(e){
      console.error('[SelfTest] NG: 検査そのものが失敗しました', e);
      return false;
    }
  }
};

/* ============================== Charts ============================== */
const PX_PER_1000 = 44; // 1000円あたりの縦ピクセル（品種が変わっても固定。変動幅が大きいほど縦に伸びる）
const Charts = {
  // 実データの最小～最大を1000円単位に丸めて、キリのよい目盛りとチャート高さを返す
  niceYAxis(prices, padT, padB){
    const dMin = Math.min(...prices), dMax = Math.max(...prices);
    let loY = Math.floor(dMin/1000)*1000;
    let hiY = Math.ceil(dMax/1000)*1000;
    if(hiY<=loY) hiY = loY + 1000;
    const innerH = ((hiY-loY)/1000) * PX_PER_1000;
    const H = padT + innerH + padB;
    const yScale = (v)=> padT + innerH - ((v-loY)/(hiY-loY))*innerH;
    return {loY, hiY, innerH, H, yScale};
  },
  /* ゼロを底にした目盛り（箱数など「量」用）。量は必ずゼロから測る＝高さがそのまま量になる。
     刻みは【500箱で固定】・1目盛り34pxも据え置き（ユーザー指定 2026-09-08）。
     ＝箱数が増えるほど図が縦に伸びる。
     ⚠ 以前は数の大きさに合わせて刻みを選んでいたが、それだと箱数が増えると刻みも一緒に
        大きくなって図の高さがほとんど変わらず、シーズンが進んで数が増えるほど山が平らに
        見えていた（価格の 1000円刻み固定と同じ考え方に揃えた）。
     ⚠ 500刻み×34px をそのまま当てると、箱数が1000程度の時期は目盛り3本＝68pxにしかならず
        【いまより低くなる】。「縦に伸ばしたい」という目的のほうを採って下限を200pxにした
        （刻み自動だった頃は170px＝これより少し高い）。
     上限420px＝スマホの1画面に棒と目盛りが収まる範囲。ここに当たるのは8,000箱を超えてから。 */
  COUNT_STEP: 500,
  PX_PER_COUNT_STEP: 34,
  COUNT_MIN_H: 200,
  COUNT_MAX_H: 420,
  niceCountAxis(maxV, padT, padB){
    const step = Charts.COUNT_STEP;
    const hiY = Math.max(step, Math.ceil(Math.max(1, maxV)/step)*step);
    const innerH = Math.max(Charts.COUNT_MIN_H,
                            Math.min(Charts.COUNT_MAX_H, (hiY/step) * Charts.PX_PER_COUNT_STEP));
    const H = padT + innerH + padB;
    const yScale = (v)=> padT + innerH - (Math.max(0, v)/hiY)*innerH;
    return {loY:0, hiY, step, innerH, H, yScale};
  },
  // 横スクロールしても左端に固定するY軸ラベル（別レイヤーSVG）。刻みは既定で1000円。
  yAxisSVG(loY, hiY, yScale, padL, H, step){
    let g = '';
    for(let v=loY; v<=hiY+0.5; v+=(step || 1000)){
      const y = yScale(v);
      g += `<text x="${padL-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--ink-muted)">${Fmt.num(v)}</text>`;
    }
    return `<svg class="yaxis-svg" viewBox="0 0 ${padL} ${H}" width="${padL}" height="${H}" style="width:${padL}px;height:${H}px">${g}</svg>`;
  },
  isSunday(iso){ return new Date(iso+'T00:00:00').getDay()===0; },
  // 日曜の列に薄赤の縦線＋日付ラベルの薄赤背景（週の起点マーカー）
  sundayMarks(isoAt, n, xScale, padT, innerH, H){
    let s = '';
    for(let i=0;i<n;i++){
      if(!Charts.isSunday(isoAt(i))) continue;
      const x = xScale(i);
      s += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${(padT+innerH).toFixed(1)}" stroke="var(--cal-sun)" stroke-width="1.5" stroke-opacity="0.4"/>`;
      s += `<rect x="${(x-16).toFixed(1)}" y="${H-19}" width="32" height="15" rx="4" fill="var(--cal-sun)" fill-opacity="0.15"/>`;
    }
    return s;
  },
  /* 割合のドーナツ。⚠ 2026-09-08b に産地タブの規格構成ドーナツを撤去したので、
     いまの呼び出しは【自分タブの品種別売上内訳】1箇所だけ。
     読み上げ用のラベルもそれに合わせてある（「規格構成ドーナツ」は嘘になった）。 */
  donutSVG(cats, total, colorMap, size, hideCenter){
    size = size || 150;
    const r = size*0.36, cx = size/2, cy = size/2, sw = size*0.22;
    const circumference = 2*Math.PI*r;
    let offset = 0;
    const order = Object.keys(cats);
    let arcs = '';
    let labels = '';
    let cumFrac = 0;
    order.forEach(cat=>{
      const val = cats[cat];
      if(val<=0) return;
      const frac = total>0 ? val/total : 0;
      let len = frac*circumference;
      if(len>0 && len<2) len = 2;
      const gap = circumference - len;
      arcs += `<circle class="donut-seg" data-cat="${Fmt.esc(cat)}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorMap[cat]}" stroke-width="${sw}" stroke-dasharray="${len} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" />`;
      // スライス上に%を表示（小さすぎるスライスは凡例に任せる）
      const pct = frac*100;
      if(pct >= 7){
        const midFrac = cumFrac + frac/2;
        const ang = (-90 + midFrac*360) * Math.PI/180;
        const lx = cx + r*Math.cos(ang);
        const ly = cy + r*Math.sin(ang);
        labels += `<text x="${lx.toFixed(1)}" y="${(ly+size*0.03).toFixed(1)}" text-anchor="middle" class="donut-slice-lbl" fill="#fff" stroke="rgba(0,0,0,.38)" stroke-width="${(size*0.018).toFixed(1)}" paint-order="stroke" style="font-size:${(size*0.085).toFixed(1)}px;font-weight:700">${Math.round(pct)}%</text>`;
      }
      offset += len;
      cumFrac += frac;
    });
    return `<svg class="donut-svg" style="width:${size}px;height:${size}px" viewBox="0 0 ${size} ${size}" role="img" aria-label="品種別売上の内訳">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/>
      ${arcs}
      ${labels}
      ${hideCenter ? '' : `<text x="${cx}" y="${cy-2}" text-anchor="middle" class="donut-center-num tnum" style="font-size:${(size*0.16).toFixed(1)}px">${Fmt.num(total)}</text>
      <text x="${cx}" y="${(cy+size*0.11).toFixed(1)}" text-anchor="middle" class="donut-center-lbl" style="font-size:${(size*0.06).toFixed(1)}px">総箱数</text>`}
    </svg>`;
  },
  /* 価格推移の背面に敷く、規格構成の100%積み上げバー。mix = Compute.sizeMix() の出力。
     mix が無ければ空文字＝従来のグラフと1バイトも変わらない。
     dates は日付の配列（単一品種は points の日付、主要5品種は軸の日付）。 */
  SIZE_BAR_W: 20,   // 折れ線の背景に敷く帯の幅。lineSVG の COLGAP がこれを基準に決まる
  sizeBarsSVG(mix, dates, xScale, padT, innerH){
    if(!mix || !mix.order || mix.order.length===0) return '';
    const BW = Charts.SIZE_BAR_W;
    let s = '';
    dates.forEach((date,i)=>{
      const d = mix.byDate.get(date);
      if(!d || !(d.total > 0)) return;
      const x = xScale(i) - BW/2;
      let y = padT + innerH; // 下から積む（order の先頭が一番下、その他が一番上）
      mix.order.forEach(key=>{
        const v = d.sizes.get(key) || 0;
        if(!(v > 0)) return;
        const h = innerH * (v / d.total);
        y -= h;
        const op = (mix.opacity && mix.opacity[key] != null) ? mix.opacity[key] : Compute.BAR_FILL;
        s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${BW}" height="${h.toFixed(1)}" fill="${mix.colors[key]}" fill-opacity="${op}"/>`;
      });
    });
    return s;
  },
  /* ---- 品目全体データのグラフ（横軸＝基準日から数えた出荷回数）----
     日付を等間隔に並べる既存の2つのグラフとは軸の作り方が違う。あちらは
     「データのある日を左から順に置く」ので、資料が抜けた年は詰まってしまい年をまたいで
     重ねられない。こちらはカレンダーで振った番号を座標にするので、5年ぶんが同じ
     物差しの上に乗る（お盆が毎年45回目に来る＝前提メモ A-17）。 */
  shipFrame(iMin, iMax, padL, padR, COLGAP){
    const n = iMax - iMin + 1;
    const INSET = 18, TAIL = 4; // 最初の点をY軸から離す／最後の点を右端から離す
    /* ⚠ 幅は「両端の余白も足した合計」で決める。padL+padR+(n-1)*COLGAP にすると、
       あとで x0/x1 に余白を取るぶんだけ実際の間隔が COLGAP より詰まる
       （19点で 19px 指定が 17.8px になった）。COLGAP は指定どおりの間隔にする。 */
    const W = Math.max(320, padL + INSET + Math.max(1, n-1)*COLGAP + TAIL + padR);
    const x0 = padL + INSET, x1 = W - padR - TAIL;
    // 点が少ないときは 320px いっぱいに広げる（カードが半分空くのを避ける）＝そのぶん間隔は広がる
    return {n, W, x0, x1, xScale:(i)=> n<=1 ? (x0+x1)/2 : x0 + ((x1-x0)*(i-iMin))/(n-1)};
  },
  /* 月の変わり目にだけ薄い縦線と月名を置く（番号は出さない／物日の縦線も出さない＝ユーザー判断）。
     ⚠ 位置は【表示中の年度】の暦で決めている。年によってひと月の出荷日数が1日ぶん違うので、
        重ねた別の年の実際の月替わりは最大1コマずれる（2022〜2030で実測：6月始まりが14か15、
        7月が27か28、8月が40か41）。お盆前の最終出荷は9年とも45回目でぴったり揃う。
        ＝「基準日と物日さえ合っていればラベルはざっくりでよい」というユーザー判断に沿った作り。 */
  shipMonthMarks(labels, xScale, padT, innerH, H){
    let s = '';
    labels.forEach(({i, label})=>{
      const x = xScale(i);
      s += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${(padT+innerH).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
      s += `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${'var(--ink-muted)'}">${label}</text>`;
    });
    return s;
  },
  /* 日付のラベル。棒を詰めると全部は入らないので、重ならない間隔まで間引く（先頭は必ず出す）。
     間引きは「何個おき」ではなく【前のラベルからの距離】で決める＝資料が抜けて間隔が
     不揃いになっても、詰まった所だけが間引かれる。日曜は赤（ほかのグラフと同じ）。 */
  thinnedDateLabels(pts, xScale, H, minGap){
    let s = '', lastX = -Infinity;
    pts.forEach(p=>{
      const x = xScale(p.i);
      if(x - lastX < minGap) return;
      lastX = x;
      const sun = Charts.isSunday(p.date);
      s += `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${sun?'var(--cal-sun)':'var(--ink-muted)'}">${Fmt.date(p.date)}</text>`;
    });
    return s;
  },
  /* 箱単価の5カ年比較。描くのは3点移動平均だけ（生の箱平均価格は線にしない＝ユーザー判断）。
     hidden の年は線を消すが、軸の計算には残す＝凡例で絞っても目盛りが動かない。 */
  zentaiLineSVG(series, opts){
    opts = opts||{};
    // COLGAP は既存の2つのグラフ（36）より詰めてある。5年ぶんを1画面で見比べる図なので、
    // 1点ずつ読むより形の違いが見えるほうが大事（ユーザー指定 2026-09-08＝従来の1/4）。
    const padL = 46, padR = 16, padT = 16, padB = 30, COLGAP = 9;
    let iMin = Infinity, iMax = -Infinity;
    const vals = [];
    series.forEach(s=> s.points.forEach(p=>{
      if(p.i == null || p.ma == null) return;
      if(p.i < iMin) iMin = p.i;
      if(p.i > iMax) iMax = p.i;
      vals.push(p.ma);
    }));
    if(vals.length===0){
      const H = 160, W = 320;
      return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--ink-muted)" font-size="13">データがありません</text></svg>`, ptMeta:[], w:W, yAxis:'', iMin:0, iMax:0};
    }
    const {n, W, xScale} = Charts.shipFrame(iMin, iMax, padL, padR, COLGAP);
    const {loY, hiY, innerH, H, yScale} = Charts.niceYAxis(vals, padT, padB);
    let grid = '';
    for(let v=loY; v<=hiY+0.5; v+=1000){
      const y = yScale(v);
      grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    }
    const months = Charts.shipMonthMarks(opts.labels||[], xScale, padT, innerH, H);
    let paths = '', markers = '';
    const ptMeta = [];
    series.forEach(s=>{
      if(s.hidden) return;
      const pts = s.points.filter(p=>p.i!=null && p.ma!=null).sort((a,b)=>a.i-b.i);
      if(pts.length>=2){
        const d = pts.map((p,k)=>`${k===0?'M':'L'} ${xScale(p.i).toFixed(1)} ${yScale(p.ma).toFixed(1)}`).join(' ');
        paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
      pts.forEach(p=>{
        const x = xScale(p.i), y = yScale(p.ma);
        // 点は小さめ。間隔を詰めた（COLGAP 9）ので大きいと隣とくっついて線が読めなくなる。
        markers += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${s.color}"/>`;
        ptMeta.push({x, y, year:s.year, color:s.color, ...p});
      });
    });
    const highlight = `<circle class="pt-highlight" r="9" fill="none" stroke="var(--ink)" stroke-width="2.5" style="opacity:0" pointer-events="none"/>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="箱単価の5カ年比較" data-zentai-chart data-w="${W}">
      ${grid}${months}${paths}${markers}${highlight}<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg>`;
    return {svg, ptMeta, w:W, yAxis:Charts.yAxisSVG(loY, hiY, yScale, padL, H), iMin, iMax, n};
  },
  /* 箱数。選択中の年度だけ・生の数字・棒。
     量なので必ずゼロからの高さで比べる。線にすると出していない日をまたいでつながり、
     「出していない」と「少し出した」の区別が消えるので棒にしてある（ユーザー設計）。 */
  /* 品目全体データの棒（箱数）と、その下に敷く規格の割合の棒は、同じ物差しの上に置く。
     ⚠ 2つの図の横軸を揃えるには【幅の出し方も範囲も完全に同じ】である必要がある。
        だから枠の寸法をここに1つだけ置き、両方がこれを読む。片方だけ直すと
        上下の棒が1本ずつずれ、しかも見た目では気づけない。 */
  /* 棒グラフで「いま選んでいる棒」を示す枠。⚠ 折れ線と同じ丸い印にしてはいけない＝
     棒を細くするほど丸が棒からはみ出して、どれを選んだのか分からなくなる（ユーザー指摘 2026-09-08b）。
     棒そのものを黒い長方形で囲むと、幅がいくつでも必ず読める。 */
  barHighlight(){
    return `<rect class="pt-highlight-bar" rx="3" fill="none" stroke="var(--ink)" stroke-width="2"`
      + ` width="0" height="0" style="opacity:0" pointer-events="none"/>`;
  },
  // BW は 2026-09-08b に 16→8（ユーザー指定「棒の幅をもう半分」）。棒どうしの余白は
  // 引き続き棒の幅の1/5なので COLGAP も半分になり、同じ日数がこれまでの半分の幅に収まる。
  ZENTAI_BAR: {padL:46, padR:16, BW:8, get COLGAP(){ return this.BW * 1.2; }},
  zentaiBarsSVG(points, opts){
    opts = opts||{};
    /* 棒どうしの余白は棒の幅の1/5（ユーザー指定 2026-09-08）＝COLGAP は BW×1.2。
       選択中の年度1本ぶんの図なので、横軸のラベルは月名ではなく日付を出す。 */
    const {padL, padR, BW, COLGAP} = Charts.ZENTAI_BAR;
    const padT = 16, padB = 30;
    const pts = points.filter(p=>p.i!=null && p.boxes>0);
    if(pts.length===0){
      const H = 160, W = 320;
      return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--ink-muted)" font-size="13">データがありません</text></svg>`, ptMeta:[], w:W, yAxis:'', iMin:0, iMax:0};
    }
    // 範囲は外から渡せる＝下の割合の図と横軸を揃えるため（渡さなければ自分のデータの範囲）
    const iMin = (opts.iMin != null) ? opts.iMin : Math.min(...pts.map(p=>p.i));
    const iMax = (opts.iMax != null) ? opts.iMax : Math.max(...pts.map(p=>p.i));
    const {n, W, xScale} = Charts.shipFrame(iMin, iMax, padL, padR, COLGAP);
    /* 棒の高さは箱数の移動平均（boxMA）。渡されていなければ生の箱数のまま。
       ⚠ p.ma を見てはいけない＝あれは箱単価の移動平均で、桁が違う（Compute.zentaiBoxMA のコメント）。 */
    const hOf = (p)=> (p.boxMA != null) ? p.boxMA : p.boxes;
    const {hiY, step, innerH, H, yScale} = Charts.niceCountAxis(Math.max(...pts.map(hOf)), padT, padB);
    let grid = '';
    for(let v=0; v<=hiY+0.5; v+=step){
      const y = yScale(v);
      grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    }
    // 日付は「5/12」で4文字ぶん≒24px。棒を詰めたので30px間隔まで間引く。
    const dates = Charts.thinnedDateLabels(pts, xScale, H, 30);
    let bars = '';
    const ptMeta = [];
    const y0 = padT + innerH;
    pts.forEach(p=>{
      const x = xScale(p.i), y = yScale(hOf(p));
      bars += `<rect x="${(x-BW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${BW}" height="${(y0-y).toFixed(1)}" rx="2" fill="var(--primary)" fill-opacity="0.85"/>`;
      // 選んだ時に囲む枠の寸法も持たせる（棒が細いので、丸い印では見えない＝ユーザー指摘）
      ptMeta.push({x, y, bx:x-BW/2-3, by:y-3, bw:BW+6, bh:(y0-y)+6, color:'var(--primary)', ...p});
    });
    const highlight = Charts.barHighlight();
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="箱数" data-zentai-chart data-w="${W}">
      ${grid}${bars}${highlight}${dates}<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg>`;
    return {svg, ptMeta, w:W, yAxis:Charts.yAxisSVG(0, hiY, yScale, padL, H, step), iMin, iMax, n};
  },
  /* 品目全体の規格の割合。上の箱数と同じ枠・同じ範囲に、高さを揃えた100%の棒を並べる
     （ユーザー指定＝実数の積み上げではなく割合。量の山は上の図が見せている）。
     たて軸は無い＝どの棒も100%なので目盛りに意味が無く、そのぶん横に広く使う。
     高さは 2026-09-08b に 96→240（ユーザー指定「今の2.5倍」＝96では帯が潰れて読めなかった）。 */
  ZENTAI_MIX_H: 240,
  zentaiMixSVG(points, mix, iMin, iMax){
    const {padL, padR, BW, COLGAP} = Charts.ZENTAI_BAR;
    const padT = 8, padB = 26, innerH = Charts.ZENTAI_MIX_H;
    const H = padT + innerH + padB;
    const {W, xScale} = Charts.shipFrame(iMin, iMax, padL, padR, COLGAP);
    const OTHER = Compute.SIZE_BAR_OTHER;
    let bars = ''; const ptMeta = [];
    points.forEach(p=>{
      const x = xScale(p.i) - BW/2;
      let y = padT + innerH; // 下から積む（order の先頭が一番下、その他が一番上）
      mix.order.forEach(key=>{
        const v = p.sizes.get(key) || 0;
        if(!(v > 0)) return;
        const h = innerH * (v / p.total);
        y -= h;
        bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${BW}" height="${h.toFixed(1)}" fill="${mix.colors[key]}" fill-opacity="0.9"/>`;
      });
      // 選んだ時は棒の柱ぜんぶを枠で囲む（丸い印だと細い棒では見えない＝ユーザー指摘）
      ptMeta.push({x:xScale(p.i), y:padT + innerH/2,
                   bx:x-3, by:padT-3, bw:BW+6, bh:innerH+6, ...p});
    });

    const frame = `<line x1="${padL}" y1="${padT}" x2="${W-padR}" y2="${padT}" stroke="var(--border)" stroke-width="1"/>`

    const highlight = Charts.barHighlight();
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="規格比率" data-mix-chart data-w="${W}">
      ${frame}${bars}${highlight}${dates}<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg>`;
    return {svg, ptMeta, w:W};
  },
  lineSVG(points, opts){
    opts = opts||{};
    /* COLGAP は 2026-09-08b に 36→25.33（ユーザー指定「背景の棒の余白を今の1/3に」）。
       背景の棒は幅20px（Charts.sizeBarsSVG の BW）なので、棒どうしの余白は
       36−20＝16px だった。その1/3＝5.33px にすると COLGAP は 20+5.33＝25.33。
       ⚠ 棒の幅は変えていない＝細くするのではなく、詰めて図全体を縮める指示。 */
    const padL = 46, padR = 16, padT = 16, padB = 30;
    const COLGAP = Charts.SIZE_BAR_W + (36 - Charts.SIZE_BAR_W) / 3;
    const n = points.length;
    const INSET = 18, TAIL = 4; // 最初の点をY軸から離す／最後の点を右端から離す
    /* ⚠ 幅には両端の余白（INSET・TAIL）も足す。padL+padR+(n-1)*COLGAP だと、

       （指定25.33に対して40点で24.77になっていた）。shipFrame で同じ直しを済ませてある。 */
    const W = Math.max(320, padL + INSET + Math.max(1,n-1)*COLGAP + TAIL + padR);
    const withPrice = points.filter(p=>p.price!=null);
    if(withPrice.length===0){

      return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--ink-muted)" font-size="13">価格データがありません</text></svg>`, isolated:false, yAxis:''};
    }

    const {loY, hiY, innerH, H, yScale} = Charts.niceYAxis(prices, padT, padB);
    const x0 = padL + INSET, x1 = W - padR - TAIL;
    const xScale = (i)=> n<=1 ? (x0+x1)/2 : x0 + ((x1-x0)*i)/(n-1);

    // gridlines（1000円刻み。Y軸ラベルは固定レイヤー側で描画）
    let grid = '';
    for(let v=loY; v<=hiY+0.5; v+=1000){

    }
    // 日曜マーカー（縦線＋ラベル背景）
    const sunday = Charts.sundayMarks((i)=>points[i].date, n, xScale, padT, innerH, H);
    /* x labels（全ての日付を出す。日曜は赤）。
       ⚠ 2026-09-08b に COLGAP を 36→25.33 へ詰めたので、11px のままだと

    let xlabels = '';

      xlabels += `<text x="${xScale(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="${sun?'var(--cal-sun)':'var(--ink-muted)'}">${Fmt.date(points[i].date)}</text>`;
    }
    // 背景の階級構成バー（opts.mix を渡した品目だけ）。高さは毎日プロット領域いっぱいに
    // 揃えるので、読めるのは【比率】だけ＝その日の量の多少は出ない。
    // 線とマーカーより先に描いて背面に回す。
    const bars = Charts.sizeBarsSVG(opts.mix, points.map(p=>p.date), xScale, padT, innerH);
    // 価格のある点を全て一本の線でつなぐ（出荷の無い日／2L・L欠測日は跨いで接続）
    const pricedIdx = [];
    points.forEach((p,i)=>{ if(p.price!=null) pricedIdx.push(i); });
    let paths = '';
    let isolated = pricedIdx.length===1;
    if(pricedIdx.length>=2){
      const d = pricedIdx.map((i,k)=>`${k===0?'M':'L'} ${xScale(i).toFixed(1)} ${yScale(points[i].price).toFixed(1)}`).join(' ');
      paths += `<path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    let markers = '';
    points.forEach((p,i)=>{
      if(p.price==null) return;
      const x = xScale(i), y = yScale(p.price);
      // ◇は「その日2Lが無いのでLで代替した」印。階級をまとめて平均する品目（blend）には
      // 代替という概念が無いので丸になる。クルクマは 2L→丸 / L→◇ で従来どおり。
      if(p.marker==='L'){
        markers += `<rect x="${x-6}" y="${y-6}" width="12" height="12" fill="var(--surface)" stroke="var(--warn)" stroke-width="2.5" transform="rotate(45 ${x} ${y})" data-pt="${i}" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}"/>`;
      } else {
        markers += `<circle cx="${x}" cy="${y}" r="6" fill="var(--primary)" stroke="var(--surface)" stroke-width="2" data-pt="${i}" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}"/>`;
      }
    });
    // 選択中プロットの縁取り（初期は非表示。タップ時に位置を移動して表示）
    const highlight = `<circle class="pt-highlight" r="10" fill="none" stroke="var(--ink)" stroke-width="2.5" style="opacity:0" pointer-events="none"/>`;
    const hitLayer = `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" data-hit="line"/>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="価格推移" data-line-chart data-padl="${padL}" data-padr="${padR}" data-w="${W}" data-n="${n}" data-x0="${x0}" data-x1="${x1}">
      ${bars}${grid}${sunday}${paths}${markers}${highlight}${xlabels}${hitLayer}
    </svg>`;
    return {svg, isolated, yAxis:Charts.yAxisSVG(loY, hiY, yScale, padL, H)};
  },
  multiLineSVG(series, opts){
    // series = [{variety, color, points, hidden}], points = Compute.lineData output
    // hidden:true の系列は線を描かないが、日付軸・価格軸の計算には含める（絞り込みで軸が動かないように）
    opts = opts||{};
    const padL = 46, padR = 16, padT = 16, padB = 30, COLGAP = 36;
    const dateSet = new Set();
    series.forEach(s=> s.points.forEach(p=> dateSet.add(p.date)));
    const dates = Array.from(dateSet).sort();
    const n = dates.length;
    const W = Math.max(320, padL + padR + Math.max(1,n-1)*COLGAP);
    const dateIndex = new Map(dates.map((d,i)=>[d,i]));
    const allPrices = [];
    series.forEach(s=> s.points.forEach(p=>{ if(p.price!=null) allPrices.push(p.price); }));
    if(allPrices.length===0){
      const H = 160;
      return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--ink-muted)" font-size="13">価格データがありません</text></svg>`, isolated:false, ptMeta:[], w:W, yAxis:''};
    }
    const {loY, hiY, innerH, H, yScale} = Charts.niceYAxis(allPrices, padT, padB);
    // 最初の点をY軸（固定ラベル）から離すため左に18pxインセット
    const x0 = padL + 18, x1 = W - padR - 4;
    const xScale = (i)=> n<=1 ? (x0+x1)/2 : x0 + ((x1-x0)*i)/(n-1);

    let grid = '';
    for(let v=loY; v<=hiY+0.5; v+=1000){
      const y = yScale(v);
      grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    }
    // 日曜マーカー（縦線＋ラベル背景）
    const sunday = Charts.sundayMarks((i)=>dates[i], n, xScale, padT, innerH, H);
    let xlabels = '';
    for(let i=0;i<n;i++){
      const sun = Charts.isSunday(dates[i]);
      xlabels += `<text x="${xScale(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${sun?'var(--cal-sun)':'var(--ink-muted)'}">${Fmt.date(dates[i])}</text>`;
    }
    // 背景の規格構成バー（品目に sizeBars を書いた場合のみ）。
    // 5品種を合計した割合＝「その日の市場全体がどの規格に寄っていたか」。
    // 凡例で品種を絞っても棒は動かさない（棒は合計の話で、個々の線の話ではないため）。
    const bars = Charts.sizeBarsSVG(opts.mix, dates, xScale, padT, innerH);
    let paths = '', markers = '', isolated = false;
    const ptMeta = [];
    series.forEach(s=>{
      if(s.hidden) return; // 軸は維持したまま線・点だけ非表示
      const pts = s.points.filter(p=>p.price!=null).map(p=>({i:dateIndex.get(p.date), p})).sort((a,b)=>a.i-b.i);
      // 価格のある点を全て一本の線でつなぐ（欠測日は跨いで接続）
      if(pts.length>=2){
        const d = pts.map((it,k)=>`${k===0?'M':'L'} ${xScale(it.i).toFixed(1)} ${yScale(it.p.price).toFixed(1)}`).join(' ');
        paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
      } else if(pts.length===1){ isolated = true; }
      pts.forEach(({i,p})=>{
        const x = xScale(i), y = yScale(p.price);
        // ◇はL代替の印。blend の品目には代替が無いので丸（lineSVG と同じ規則）。
        if(p.marker==='L') markers += `<rect x="${x-6}" y="${y-6}" width="12" height="12" fill="var(--surface)" stroke="${s.color}" stroke-width="2.5" transform="rotate(45 ${x} ${y})"/>`;
        else markers += `<circle cx="${x}" cy="${y}" r="6" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
        ptMeta.push({x, y, date:p.date, price:p.price, marker:p.marker, variety:s.variety, color:s.color});
      });
    });
    // 選択中プロットの縁取り
    const highlight = `<circle class="pt-highlight" r="10" fill="none" stroke="var(--ink)" stroke-width="2.5" style="opacity:0" pointer-events="none"/>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px" role="img" aria-label="主要5品種の価格推移" data-multiline-chart data-w="${W}">
      ${bars}${grid}${sunday}${paths}${markers}${highlight}${xlabels}<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg>`;
    return {svg, isolated, ptMeta, w:W, yAxis:Charts.yAxisSVG(loY, hiY, yScale, padL, H)};
  }
};
