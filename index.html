  showLineDetail(name, infoHtml, color){
    const detail = document.getElementById('line-detail');
    if(!detail) return;
    detail.setAttribute('data-empty','false');
    detail.innerHTML = `<span class="cd-dot" style="background:${color||'var(--primary)'}"></span>`
      + `<div class="cd-body"><div class="cd-name">${Fmt.esc(name)}</div><div class="cd-info">${infoHtml}</div></div>`;
  },
  // 「プロットをタップ」と「スクロールのために掴む」を区別する。
  // 以前は touchstart で即発火していたため、横スクロールしようと指を置いた時点で
  // 日付が切り替わり→全再描画→右端（最新日）へ戻る、で左へ遡れなかった。
  // pointerdown で起点を覚え、指がほとんど動かないまま離された時だけタップとみなす。
  // スクロールが始まると iOS/Chrome は pointercancel を出すので、そこで確実に取り消す。
  tapOnly(el, cb){
    const TAP_MOVE = 10;   // px：これ以上動いたら「掴んで動かす」＝スクロール操作
    const TAP_MS = 700;    // ms：長押しはタップ扱いしない
    let st = null;
    const cancel = ()=>{ st = null; };
    el.addEventListener('pointerdown', e=>{
      if(e.pointerType === 'mouse' && e.button !== 0){ st = null; return; }
      st = {x:e.clientX, y:e.clientY, t:Date.now(), id:e.pointerId};
    });
    el.addEventListener('pointermove', e=>{
      if(!st || e.pointerId !== st.id) return;
      if(Math.abs(e.clientX-st.x) > TAP_MOVE || Math.abs(e.clientY-st.y) > TAP_MOVE) cancel();
    });
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('pointerleave', cancel);
    el.addEventListener('pointerup', e=>{
      if(!st || e.pointerId !== st.id) return;
      const moved = Math.abs(e.clientX-st.x) > TAP_MOVE || Math.abs(e.clientY-st.y) > TAP_MOVE;
      const quick = (Date.now() - st.t) <= TAP_MS;
      cancel();
      if(moved || !quick) return;
      cb(e);
    });
  },
  moveHighlight(svg, x, y){
    const hl = svg.querySelector('.pt-highlight');
    if(!hl) return;
    hl.setAttribute('cx', x);
    hl.setAttribute('cy', y);
    hl.style.opacity = '1';
  },
  // 棒グラフ用。選んだ棒を黒い枠で囲む（丸い印は細い棒では見えない＝Charts.barHighlight のコメント）
  moveBarHighlight(svg, m){
    const hl = svg.querySelector('.pt-highlight-bar');
    if(!hl || m.bx == null) return;
    hl.setAttribute('x', m.bx.toFixed(1));
    hl.setAttribute('y', m.by.toFixed(1));
    hl.setAttribute('width', m.bw.toFixed(1));
    hl.setAttribute('height', m.bh.toFixed(1));
    hl.style.opacity = '1';
  },
  /* 見出しの右に添える読み出し（大きな詳細カードの代わり）。日付＋曜日＋数値。
     曜日は日曜赤・土曜青で、ほかの画面（出荷明細の日付）と同じ色分けにそろえる。 */
  setTapReadout(id, date, tail){
    const box = document.getElementById(id);
    if(!box) return;
    box.innerHTML = `${Fmt.esc(Fmt.date(date))}<span class="${Fmt.wdClass(date)}">(${Fmt.esc(Fmt.wd(date))})</span>`
      + `　${Fmt.esc(tail)}`;
  },
  /* プロット詳細（グラフ下）の右端に出すタグ。
     出すのは【基準どおりでない日】だけ＝クルクマで L の値段を代替に採った日の「L代替」。
     基準どおり（2L）の日は断り書きが要らないので何も出さない（ユーザー判断 2026-09-07。
     以前は 2L の日にも換算の断り書きを出していたが、常に出るので情報になっていなかった）。
     その日の全部を平均する品目（blend）には代替という概念が無く、規格の割合は背景の棒が
     見せているので、こちらもタグごと出さない。 */
  lineDetailTag(marker){
    // 断り書きが要るのは【基準どおりでない日】だけ＝L で代替した日のみ（ユーザー判断 2026-09-07）。
    // 基準どおりの 2L の日／blend の品目／値段の無い日は、何も付けない。
    if(marker !== 'L') return '';
    return `<span class="cd-tag">L代替</span>`;
  },
  wireLineTooltip(wrap){
    const svg = wrap.querySelector('svg[data-line-chart]');
    if(!svg) return;
    const variety = wrap.getAttribute('data-variety');
    const points = Compute.lineDataDense(variety);
    const W = parseFloat(svg.getAttribute('data-w'));
    const x0 = parseFloat(svg.getAttribute('data-x0'));
    const x1 = parseFloat(svg.getAttribute('data-x1'));
    const n = points.length;
    const xScale = (i)=> n<=1 ? (x0+x1)/2 : x0 + ((x1-x0)*i)/(n-1);
    /* 箱数は 2026-09-08b に追加。規格構成ドーナツを撤去したので、その真ん中に出ていた
       「総箱数」の行き先がここになった（ユーザー判断）。背景の棒は割合しか見せないため、
       この数字が無いと「3箱の日」と「267箱の日」が同じ高さの帯に見えてしまう。 */
    const detailHtml = (p)=> `<span class="cd-date">${Fmt.date(p.date)}</span><span class="cd-price">${Fmt.yen(p.price)}／箱</span>`
      + `<span class="cd-boxes tnum">${Fmt.num(Compute.boxesOn([variety], p.date))}箱</span>${UI.lineDetailTag(p.marker)}`;
    const showAt = (i)=>{
      const m = svg.querySelector(`[data-pt="${i}"]`);
      if(m) UI.moveHighlight(svg, m.getAttribute('data-x'), m.getAttribute('data-y'));
      UI.showLineDetail(variety, detailHtml(points[i]), 'var(--primary)');
    };
    const handle = (evt)=>{
      const rect = svg.getBoundingClientRect();
      const svgX = ((evt.clientX - rect.left) / rect.width) * W;
      let nearestI = -1, best = Infinity;
      points.forEach((p,i)=>{
        if(p.price==null) return;
        const d = Math.abs(xScale(i) - svgX);
        if(d<best){ best=d; nearestI=i; }
      });
      if(nearestI<0) return;
      evt.stopPropagation();
      /* 2026-09-08b：全画面の描き直しをやめ、詳細だけ差し替える形に統一した。
         以前は「タップした日に日付セレクタとドーナツを連動させる」ために描き直していたが、
         その2つを撤去したので連動する相手がいない。描き直さないぶん、
         グラフの横スクロール位置を覚えておく仕掛け（chartScrollLeft）も不要になった。 */
      showAt(nearestI);
    };
    UI.tapOnly(svg, handle);
  },

  /* ⛔ 上下2つのグラフの横スクロールを連動させない（2026-09-08b に入れて、同日に撤去）。
     理由は2つ。①ユーザー判断＝連動は要らない、それぞれ独立に動かしたい。
     ②【実機で払いがぎこちなくなる】＝指を離したあとの惰性で流れている最中に
       相手の scrollLeft を代入すると、その代入がブラウザの慣性スクロールを打ち切る。
       「箱数だけ滑らかに払えない（5カ年比較は滑らか）」の正体がこれだった。
     ＝スクロール中に scrollLeft を書き込む仕掛けは、二度と足さないこと。 */
  /* 規格の割合の棒をタップしたとき。その日の日付と箱数だけを見出しの右に出す
     （ユーザー指定＝大きな詳細カードは置かない）。 */
  wireMixTooltip(wrap){
    const svg = wrap.querySelector('svg[data-mix-chart]');
    if(!svg || !State.mixMeta) return;
    const {ptMeta, w:W, mix} = State.mixMeta;
    if(!ptMeta || ptMeta.length===0) return;
    const handle = (evt)=>{
      const rect = svg.getBoundingClientRect();
      const svgX = ((evt.clientX - rect.left) / rect.width) * W;
      let nearest = null, best = Infinity;
      ptMeta.forEach(m=>{ const d = Math.abs(m.x - svgX); if(d<best){ best=d; nearest=m; } });
      if(!nearest) return;
      evt.stopPropagation();
      UI.moveBarHighlight(svg, nearest);
      // 見出しの右の空きに収まる分だけ＝日付（曜日つき）と箱数のみ（ユーザー指定）
      UI.setTapReadout('mix-tap', nearest.date, `${Fmt.num(nearest.total)}箱`);
    };
    UI.tapOnly(svg, handle);
  },
  wireMultiLineTooltip(wrap){
    const svg = wrap.querySelector('svg[data-multiline-chart]');
    if(!svg || !State.multiMeta) return;
    const {ptMeta, w:W} = State.multiMeta;
    if(!ptMeta || ptMeta.length===0) return;
    const vb = svg.viewBox.baseVal;
    const handle = (evt)=>{
      const rect = svg.getBoundingClientRect();
      const svgX = ((evt.clientX - rect.left) / rect.width) * W;
      const svgY = ((evt.clientY - rect.top) / rect.height) * vb.height;
      let nearest = null, best = Infinity;
      ptMeta.forEach(m=>{
        const d = Math.hypot(m.x - svgX, m.y - svgY);
        if(d<best){ best=d; nearest=m; }
      });
      if(!nearest) return;
      UI.moveHighlight(svg, nearest.x, nearest.y);
      UI.showLineDetail(nearest.variety, `<span class="cd-date">${Fmt.date(nearest.date)}</span><span class="cd-price">${Fmt.yen(nearest.price)}／箱</span>`
        + `<span class="cd-boxes tnum">${Fmt.num(Compute.boxesOn([nearest.variety], nearest.date))}箱</span>${UI.lineDetailTag(nearest.marker)}`, nearest.color);
      evt.stopPropagation();
    };
    UI.tapOnly(svg, handle);
  },

  /* 品目全体データのグラフのタップ。プロット（または棒）を押すと、その点の
     実際の年月日を出す。移動平均の点は、その日が3点の真ん中。 */
  wireZentaiTooltip(wrap){
    const svg = wrap.querySelector('svg[data-zentai-chart]');
    if(!svg || !State.zentaiMeta) return;
    const {ptMeta, w:W, kind} = State.zentaiMeta;
    if(!ptMeta || ptMeta.length===0) return;
    const vb = svg.viewBox.baseVal;
    const handle = (evt)=>{
      const rect = svg.getBoundingClientRect();
      const svgX = ((evt.clientX - rect.left) / rect.width) * W;
      const svgY = ((evt.clientY - rect.top) / rect.height) * vb.height;
      let nearest = null, best = Infinity;
      ptMeta.forEach(m=>{
        // 棒は縦に長いので横位置だけで選ぶ。折れ線は上下も見て一番近い点を選ぶ。
        const d = (kind==='boxes') ? Math.abs(m.x - svgX) : Math.hypot(m.x - svgX, m.y - svgY);
        if(d<best){ best=d; nearest=m; }
      });
      if(!nearest) return;
      if(kind==='boxes'){
        /* 箱数は見出しの右に小さく出す（ユーザー指定＝大きな詳細カードは置かない）。
           ⚠ 出すのは【その日の実際の箱数】。棒の高さは移動平均なので、棒の高さとは一致しない。
              棒は流れを見るためのもの、この数字はその日の事実、と役割を分けてある
              （グラフ下の説明文にもそう書いてある）。 */
        UI.moveBarHighlight(svg, nearest);
        UI.setTapReadout('zentai-tap', nearest.date, `${Fmt.num(nearest.boxes)}箱`);
      } else {
        UI.moveHighlight(svg, nearest.x, nearest.y);
        const info = `<span class="cd-date">${Fmt.date(nearest.date)}</span><span class="cd-price">${Fmt.yen(Math.round(nearest.ma))}／箱</span>`
          // 端の点は隣が片側しか無いので2点だけの平均。黙って混ぜず、その旨を出す。
          + (nearest.span===2 ? `<span class="cd-tag">端・2点</span>` : '');
        UI.showLineDetail(`${nearest.year}年度`, info, nearest.color);
      }
      evt.stopPropagation();
    };
    UI.tapOnly(svg, handle);
  }
};

/* ============================== App / events ============================== */
const App = {
  init(){
    UI.applyTheme();
    Store.load();
    UI.ensureScope(); // 集計は年度×品目の絞り込み経由なので、SelfTest より先に対象を決めておく
    SelfTest.run();
    UI.renderTabs();
    UI.renderMain();
    App.bindEvents();
    if(Store.migratedFrom){
      UI.toast('年度・品目に対応しました。既存のデータはすべて「クルクマ」として引き継いでいます', {duration:7000});
    }
  },
  bindEvents(){
    document.addEventListener('click', App.onClick);
    document.addEventListener('change', App.onChange);
    document.addEventListener('submit', App.onSubmit);
    // 打ち込むたびに欄の高さを中身へ合わせる（欄の中でスクロールさせないため）
    document.addEventListener('input', (e)=>{
      if(e.target.classList && e.target.classList.contains('csv-edit')) App.autoGrowCsv(e.target);
    });
    // 年度バーの指の動き。バー本体は作り直さないので1回付ければ足りる。
    UI.wireYearBar();
    // 一番上でさらに上へ引いた時の、小さな伸び
    UI.bindTopBounce();
    // モバイル: キーボードが出ると固定タブバーが持ち上げられるので、その分だけ下に押し戻す。
    // ＝タブの位置は変わらず、キーボードがタブの上に重なるだけになる。
    App.bindKeyboardShift();
  },
  /* 打ち込む欄は中身の高さぴったりに伸ばす。上限は付けない。
     ⚠ 上限を付けてはいけない（2026-09-07 に実機で2回失敗した）。
        欄の中でスクロールできる状態にすると、指を置いた場所が欄だとページが動かず
        「スクロールがごっちゃになる」。さらに上限を画面の高さから決めていたため、
        キーボードが出て画面が縮むと上限も縮み、まさにキーボード中に必ず起きていた。
        中身ぴったりなら欄の中に動かせる余地が無く、指は常にページを動かす＝
        画面の中でスクロールするものが1つだけになる。 */
  autoGrowCsv(el){
    if(!el) return;
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  },
  /* ⚠⚠ アプリバーには絶対に手を出さないこと（2026-09-07・実機で2回失敗して本番を壊した）。
     「キーボード中もアプリバーを画面上部に残す」を、①vv.offsetTop ぶん下げる ②実際の位置を
     測って押し戻す、の2通りで試して両方だめだった。②に至ってはアプリバーが画面の真ん中に
     浮くという、元より悪い壊れ方をした。
     理由＝iOSはページをずらすのではなく画面そのものを持ち上げることがあり、その分は
     アプリ側からは観測できない。見えない量は計算で埋められない。
     小細工では無理で、直すなら「本体はスクロールさせず中身だけを動かす」形に画面の組み方を
     変えるしかない。ユーザー判断＝**入力中にアプリバーを見る場面は無いので追いかけない**。
     ここで動かすのはタブバーだけにしておくこと。 */
  bindKeyboardShift(){
    const vv = window.visualViewport;
    const tabbar = document.getElementById('tabbar');
    if(!vv || !tabbar) return; // 非対応環境は従来どおり
    let focused = false;
    const sync = ()=>{
      if(!focused){ tabbar.style.transform = ''; return; }
      // 競り上がり量 = レイアウト高 −(可視高 + 可視領域の上オフセット)
      const gap = Math.round(window.innerHeight - vv.height - vv.offsetTop);
      // キーボードと言える大きさの時だけ補正（誤検知でタブを飛ばさない）
      tabbar.style.transform = (gap > 120) ? `translateY(${gap}px)` : '';
    };
    // アプリバーのセレクタは対象外。キーボードは出ないのに、iOSのピッカー開閉中は
    // visualViewport の resize/scroll が連発するため、gap が 120 の前後を往復して
    // タブバーがガタついていた。
    const isTarget = (el)=> el.closest('input, textarea, select') && !el.closest('#appbar');
    document.addEventListener('focusin', (e)=>{
      if(isTarget(e.target)){ focused = true; sync(); }
    });
    document.addEventListener('focusout', (e)=>{
      if(isTarget(e.target)){
        focused = false;
        tabbar.style.transform = ''; // 位置を必ず戻す
      }
    });
    vv.addEventListener('resize', sync);
    vv.addEventListener('scroll', sync);
  },
  onClick(e){
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.getAttribute('data-action');
    switch(action){
      case 'switch-tab':
        UI.route(t.getAttribute('data-tab'));
        break;
      // 年度バーのタップ。同じ年度でも中央へ寄せ直す（端の年度を押した時に真ん中へ来る）。
      case 'pick-year': {
        const y = t.getAttribute('data-year');
        if(!y) break;
        if(y === String(State.selectedYear)) UI.centerYear(y, true);
        else App.applyScopeChange(()=>{ State.selectedYear = y; });
        break;
      }
      case 'theme-cycle':
        UI.cycleTheme();
        break;
      case 'series-toggle': {
        // 全表示→1品種のみ→タップごとに追加→全部そろったら全表示に戻る
        const v = t.getAttribute('data-variety');
        const sel = (State.selectedSeries || []).slice();
        const at = sel.indexOf(v);
        const selectableCount = (State.seriesSelectable && State.seriesSelectable.length) || MAJOR_VARIETIES.length;
        if(sel.length === 0){
          State.selectedSeries = [v];
        } else if(at >= 0){
          sel.splice(at, 1);
          State.selectedSeries = sel; // 空になれば全表示（初期状態）へ
        } else {
          sel.push(v);
          State.selectedSeries = (sel.length >= selectableCount) ? [] : sel;
        }
        UI.renderMain();
        break;
      }
      case 'zentai-year-toggle': {
        // 5カ年比較の凡例。品種の凡例（series-toggle）と同じ作法にそろえてある。
        const y = t.getAttribute('data-year');
        const sel = (State.selectedZentaiYears || []).slice();
        const at = sel.indexOf(y);
        const total = Compute.zentaiYearSeries(State.selectedItem, State.selectedYear, ZENTAI_YEARS).length;
        if(sel.length === 0){
          State.selectedZentaiYears = [y];
        } else if(at >= 0){
          sel.splice(at, 1);
          State.selectedZentaiYears = sel; // 空になれば全表示（初期状態）へ
        } else {
          sel.push(y);
          State.selectedZentaiYears = (sel.length >= total) ? [] : sel;
        }
        UI.renderMain();
        break;
      }
      case 'import-sanchi-paste': {
        const ta = document.getElementById('sanchi-paste');
        const txt = ta ? ta.value : '';
        App.importSanchiText(txt, '貼り付け');
        break;
      }
      case 'import-zentai-paste': {
        const ta = document.getElementById('zentai-paste');
        const txt = ta ? ta.value : '';
        App.importZentaiText(txt, '貼り付け');
        break;
      }
      case 'import-mine-paste': {
        const ta = document.getElementById('mine-paste');
        const txt = ta ? ta.value : '';
        App.importMineText(txt, '貼り付け');
        break;
      }
      case 'toggle-mine-mode':
        State.mineMode = t.getAttribute('data-mode');
        UI.renderMain();
        break;
      case 'toggle-mine-calendar': {
        // 手入力フォームの他項目を保持するため、再描画せずポップアップを直接開閉
        const mount = document.getElementById('mine-cal-mount');
        if(!mount) break;
        if(mount.innerHTML.trim()){ mount.innerHTML = ''; }
        else {
          const now = new Date();
          State.mineCalMonth = (State.mineDate || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`).slice(0,7);
          mount.innerHTML = UI.mineCalendarHTML();
        }
        break;
      }
      case 'close-mine-calendar': {
        const mount = document.getElementById('mine-cal-mount');
        if(mount) mount.innerHTML = '';
        break;
      }
      case 'mine-cal-prev':
      case 'mine-cal-next': {
        const now = new Date();
        const base = State.mineCalMonth || (State.mineDate||'').slice(0,7) || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        const ym = base.split('-');
        const d = new Date(parseInt(ym[0],10), parseInt(ym[1],10)-1 + (action==='mine-cal-next'?1:-1), 1);
        State.mineCalMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        const mount = document.getElementById('mine-cal-mount');
        if(mount) mount.innerHTML = UI.mineCalendarHTML();
        break;
      }
      case 'mine-cal-pick': {
        State.mineDate = t.getAttribute('data-date');
        const label = document.getElementById('mine-date-label');
        const val = document.getElementById('mine-date-value');
        if(label) label.textContent = Fmt.mmdd(State.mineDate);
        if(val) val.value = State.mineDate;
        const mount = document.getElementById('mine-cal-mount');
        if(mount) mount.innerHTML = '';
        break;
      }
      case 'delete-mine-row': {
        const id = t.getAttribute('data-id');
        const removed = Store.removeJibun(id);
        UI.renderMain();
        if(removed){
          UI.toast('削除しました', {actionLabel:'元に戻す', onAction:()=>{ Store.restoreJibun(removed.rec, removed.index); UI.renderMain(); }, duration:5000});
        }
        break;
      }
      case 'reimport-import-error': {
        const id = t.getAttribute('data-id');
        const ta = document.getElementById('err-text-' + id);
        const body = ta ? ta.value : '';
        if(!Norm.text(body)){ UI.toast('中身が空です'); break; }
        const n = body.split(/\r?\n/).filter(l=>Norm.text(l)).length;
        UI.modal('この内容で取り込みますか？',
          `${n}行を読み込みます。読めた行はここから消え、まだ読めない行だけ残ります。`,
          {confirmLabel:'取り込む', onConfirm:()=>App.reimportErrorBlock(id, body)});
        break;
      }
      case 'clear-import-error': {
        Store.removeImportErrors(t.getAttribute('data-id'));
        UI.renderMain();
        UI.toast('消しました');
        break;
      }
      case 'clear-import-errors-all': {
        // 画面に出ている分＝いま選んでいる品目の分だけを消す（見えていないものは消さない）
        const item = State.selectedItem || DEFAULT_ITEM;
        UI.modal('取り込めなかった行を全部消す',
          `「${Fmt.esc(item)}」の控えをすべて消します。取り込めなかった行の記録が無くなるだけで、取り込み済みのデータには影響しません。`,
          {confirmLabel:'消す', onConfirm:()=>{ Store.clearImportErrors(item); UI.renderMain(); UI.toast('消しました'); }});
        break;
      }
      case 'fill-price': {
        // 未確定だった市況行の箱単価を後から入力するモーダルを開く
        UI.fillPriceModal(t.getAttribute('data-key'));
        break;
      }
      case 'alloc-set': {
        // 日付×品種×規格のグループを新植/据置に確定
        const g = Compute.unassignedAllocGroups().find(x=>x.key===t.getAttribute('data-key'));
        if(g) Store.setJibunPlantGroup(g.ids, t.getAttribute('data-plant'), 0);
        UI.renderMain();
        if(document.querySelector('.alloc-modal')) UI.allocModal(); // モーダル表示中なら残りへ更新
        break;
      }
      case 'alloc-mix': {
        // 混在の据置本数入力モーダル（モーダル起点なら保存後に一覧へ戻す）
        const fromModal = !!document.querySelector('.alloc-modal');
        UI.mixStemsModal(t.getAttribute('data-key'), fromModal);
        break;
      }
      case 'delete-sakutsuke-row': {
        const id = t.getAttribute('data-id');
        const removed = Store.removeSakutsuke(id);
        UI.renderMain();
        if(removed){
          UI.toast('作付を削除しました', {actionLabel:'元に戻す', onAction:()=>{ Store.restoreSakutsuke(removed); UI.renderMain(); }, duration:5000});
        }
        break;
      }
      case 'export-backup':
        App.exportBackup();
        break;
      case 'export-csv':
        App.exportCSV();
        break;
      case 'open-reset-modal':
        UI.modal('全消去の確認', '産地データ・自分の出荷データを両方とも完全に削除します。この操作は取り消せません。事前にバックアップを書き出すことをおすすめします。', {
          danger:true, confirmLabel:'完全に消去する',
          onConfirm:()=>{ Store.resetAll(); UI.toast('全データを消去しました'); State.selectedVariety=MAJOR_VARIETY_KEY; UI.route('import'); }
        });
        break;
      case 'step-boxqty': {
        const input = document.querySelector('input[name="boxQty"]');
        if(input){
          const dir = parseInt(t.getAttribute('data-dir'),10);
          const v = Math.max(1, (parseInt(input.value,10)||1) + dir);
          input.value = v;
        }
        break;
      }
    }
  },
  /* 年度・品目が変わった時の後始末。表示中の年度・品目に無い品種や日付が選ばれたまま
     残らないよう、画面の選択状態をたたんでから描き直す。品目セレクタからも年度バーからも
     必ずここを通す（片方だけ直す事故を防ぐため、切り替えの入口はこの1本に集約してある）。 */
  applyScopeChange(mutate){
    mutate();
    // 次に開いたときも同じ品目から始められるように控えておく（年度は覚えない＝
    // 新しいシーズンのデータが入ったら、その最新年度が開いてほしいため）
    Store.rememberItem(State.selectedItem);
    State.selectedVariety = MAJOR_VARIETY_KEY;
    State.selectedSeries = [];
    State.shipMonthsOpen = [];
    State.mineDate = null; State.mineVariety = null; State.mineCalMonth = null;
    UI.renderMain();
    // 中身が丸ごと入れ替わるので先頭へ。そうしないと、前の画面より短い画面に
    // なったときにブラウザがスクロール位置を勝手に切り詰め、下から中途半端な
    // 位置へ飛ばされる（＝「勝手に動く」の一種）。
    window.scrollTo(0, 0);
  },
  onChange(e){
    if(e.target.id==='item-select'){
      const v = e.target.value;
      App.applyScopeChange(()=>{
        State.selectedItem = v;
        // 年度の選択肢は品目ごとに違う。切り替えた品目に無い年度を持ち越すと空の画面が開くので、
        // 年度を一度捨てて UI.ensureScope に「その品目のデータがある最新年度」を選ばせる。
        State.selectedYear = null;
      });
      return;
    }
    if(e.target.id==='variety-select'){
      State.selectedVariety = e.target.value;
      UI.renderMain();
      return;
    }
    if(e.target.id==='sanchi-file-input' && e.target.files[0]){
      App.handleSanchiFile(e.target.files[0]);
      e.target.value=''; // 同名ファイルを修正して選び直しても再取込できるように
      return;
    }
    if(e.target.id==='zentai-file-input' && e.target.files[0]){
      App.handleZentaiFile(e.target.files[0]);
      e.target.value='';
      return;
    }
    if(e.target.id==='mine-file-input' && e.target.files[0]){
      App.handleMineFile(e.target.files[0]);
      e.target.value='';
      return;
    }
    if(e.target.id==='backup-file-input' && e.target.files[0]){
      App.handleBackupFile(e.target.files[0]);
      e.target.value='';
      return;
    }
    if(e.target.name==='spec'){
      // 「別」を選んだ時だけ別本数の入力を表示
      document.getElementById('betsu-wrap').classList.toggle('hidden', e.target.value!=='別');
    }
    if(e.target.name==='variety'){
      // 「その他（自由入力）」を選んだ時だけ品種名の入力欄を表示
      const wrap = document.getElementById('variety-other-wrap');
      if(wrap) wrap.classList.toggle('hidden', e.target.value!=='__other__');
    }
  },
  onSubmit(e){
    const act = e.target.getAttribute('data-action');
    if(act==='submit-manual'){
      e.preventDefault();
      App.submitManual(e.target);
    } else if(act==='submit-sakutsuke'){
      e.preventDefault();
      App.submitSakutsuke(e.target);
    }
  },

  async handleSanchiFile(file){
    const {text, encoding} = await Parse.readFileSmart(file);
    App.importSanchiText(text, encoding);
  },
  // 産地CSV取込の中核（ファイル・ペースト共通）。encoding は表示用ラベル
  /* 取り込もうとしているCSVの品目列が、いま選んでいる品目と食い違うときの確認。
     産地・品目全体・自分の3つの取込が同じものを使う（以前は同じ文面が2箇所にあった）。
     CSVの品目がアプリの知っている品目なら【そこへ切り替えて取り込む】を第一候補として出す。
     選び間違いはここで気づくのだから、いったんキャンセルして上のセレクタを触り直させる
     必要はない（ユーザー要望 2026-09-08）。 */
  itemMismatchModal(others, count, run){
    // 切り替え先を出すのは、食い違いが1品目だけで、それがアプリの知っている品目のときだけ。
    // 表記ゆれや打ち間違いの名前に切り替えると、行き先の無い品目へ移ってしまう。
    const target = (others.length === 1 && Store.itemNames().includes(others[0])) ? others[0] : null;
    UI.modal('品目が違うようです',
      `このCSVの品目は「${Fmt.esc(others.join('／'))}」ですが、いま選んでいる品目は「${Fmt.esc(State.selectedItem)}」です。`
      + `<br><br>このまま取り込むと、${count}件すべてが「${Fmt.esc(State.selectedItem)}」として保存されます。`
      + (target ? '' : `<br>違う場合は、キャンセルして上の品目を切り替えてからやり直してください。`),
      {confirmLabel:'このまま取り込む', onConfirm:run,
       altLabel: target ? `「${target}」に切り替えて取り込む` : '',
       onAlt: target ? ()=>App.switchItemAndImport(target, run) : null});
  },
  /* 品目を切り替えてから取り込む。
     ⚠ 順番が肝心＝Store.merge* は State.selectedItem を見て品目を付けるので、
       切り替えは必ず取り込みより先。年度は捨てて ensureScope に選び直させる
       （切り替え前の年度を持ち越すと、取り込んだ行が入らない年度が開いて空に見える）。 */
  switchItemAndImport(item, run){
    App.applyScopeChange(()=>{
      State.selectedItem = item;
      State.selectedYear = null;
      run();
    });
  },
  importSanchiText(text, encoding){
    try{
      if(!text || !Norm.text(text)){ throw new Error('CSVが空です'); }
      const {records, errors, dupCount, unknownSpecs, header} = Parse.sanchiCSV(text, State.selectedItem);
      // 品目は選択中のものを付ける。CSVに品目列があって食い違う時だけ、取り込む前に確認する。
      const other = Array.from(new Set(records.map(r=>r.csvItem).filter(v=>v && v!==State.selectedItem)));
      const run = ()=>App.finishSanchiImport(records, errors, dupCount, encoding, unknownSpecs, header);
      if(other.length){ App.itemMismatchModal(other, records.length, run); return; }
      run();
    }catch(err){
      State.sanchiImportSummary = `<div class="err-box">取込エラー: ${Fmt.esc(err.message)}</div>`;
      UI.renderMain();
    }
  },
  /* 取込エラーの明細。件数だけだと「何を直せばいいか」が分からないので、
     どの項目が原因かと元の1行を折りたたみで出す。 */
  errorDetailHTML(errors){
    if(!errors || !errors.length) return '';
    return `<details class="collapse import-errors">
        <summary>エラー行の内訳（${errors.length}件）</summary>
        ${App.errorRowsHTML(errors)}
      </details>`;
  },
  /* エラー行そのものの並び（行番号・理由・原文）。取込直後の要約と、
     取込タブの「取り込めなかった行」の控えの両方から使う。 */
  errorRowsHTML(errors, total){
    const n = total || errors.length;
    return `<div class="stack" style="margin-top:var(--sp2)">
          ${errors.slice(0, 50).map(e=>`<div class="import-err">
            <span class="ie-line tnum">${e.line}行目</span>
            <span class="ie-why">${Fmt.esc((e.reasons||[]).join('・') || '不正な行')}</span>
            <code class="ie-raw">${Fmt.esc(e.raw || '')}</code>
          </div>`).join('')}
          ${n>50 ? `<p class="muted" style="font-size:0.75rem">※ 先頭50件のみ表示しています（全${n}件）</p>` : ''}
        </div>`;
  },
  // 産地CSV取込の後半（品目の確認をはさむ場合があるので分けてある）
  finishSanchiImport(records, errors, dupCount, encoding, unknownSpecs, header){
    const {added, updated} = Store.mergeSanchi(records);
    Store.addImportErrors('産地', State.selectedItem, errors, header); // リロードしても残る控えへ積む
    SelfTest.run();
    // 取込タブは特定の年度を指さない（年度バーを出していない）ので、
    // 「表示中の年度の外にあります」の案内は役目を終えている。
    // 取り込み元と品目は画面を見れば分かるので要約には出さない（ユーザー指示 2026-09-07）。
    const unk = unknownSpecs || [];
    State.sanchiImportSummary = `<div class="summary-box ${errors.length||unk.length?'warn':''}">
        <span>取込行数: ${records.length}／更新: ${updated}／新規: ${added}${dupCount?`／ファイル内重複: ${dupCount}件（後勝ち上書き）`:''}${errors.length?`／エラー行: ${errors.length}件`:''}</span>
        ${unk.length?`<span>※ 価格の基準に無い等級×階級が含まれています: ${Fmt.esc(unk.map(u=>`${u.spec}（${u.n}件）`).join('、'))}。データは取り込んでいますが、価格推移には反映されません。</span>`:''}
        ${App.errorDetailHTML(errors)}
      </div>`;
    UI.renderMain();
    UI.toast(`産地CSVを取込みました（新規${added}・更新${updated}）`);
  },
  async handleZentaiFile(file){
    const {text, encoding} = await Parse.readFileSmart(file);
    App.importZentaiText(text, encoding);
  },
  /* 品目全体データの取込（ファイル・ペースト共通）。
     産地CSVをここに貼ると必須列が足りず例外になる＝間違いに気づける。逆も同じ。 */
  importZentaiText(text, encoding){
    try{
      if(!text || !Norm.text(text)){ throw new Error('CSVが空です'); }
      const {records, errors, dupCount, header} = Parse.zentaiCSV(text, State.selectedItem);
      const other = Array.from(new Set(records.map(r=>r.csvItem).filter(v=>v && v!==State.selectedItem)));
      const run = ()=>App.finishZentaiImport(records, errors, dupCount, header);
      if(other.length){ App.itemMismatchModal(other, records.length, run); return; }
      run();
    }catch(err){
      State.zentaiImportSummary = `<div class="err-box">取込エラー: ${Fmt.esc(err.message)}<br>この欄は「品目全体データ」用です（日付・箱数・売立金額の列が要ります）。産地データは1つ上の欄へ。</div>`;
      UI.renderMain();
    }
  },
  finishZentaiImport(records, errors, dupCount, header){
    const {added, updated} = Store.mergeZentai(records);
    Store.addImportErrors('品目全体', State.selectedItem, errors, header);
    State.zentaiImportSummary = `<div class="summary-box ${errors.length?'warn':''}">
        <span>取込行数: ${records.length}／更新: ${updated}／新規: ${added}${dupCount?`／ファイル内重複: ${dupCount}件（後勝ち上書き）`:''}${errors.length?`／エラー行: ${errors.length}件`:''}</span>
        ${App.errorDetailHTML(errors)}
      </div>`;
    UI.renderMain();
    UI.toast(`品目全体データを取込みました（新規${added}・更新${updated}）`);
  },
  async handleMineFile(file){
    const {text, encoding} = await Parse.readFileSmart(file);
    App.importMineText(text, encoding);
  },
  // 自分CSV取込の中核（ファイル・ペースト共通）
  importMineText(text, encoding){
    try{
      if(!text || !Norm.text(text)){ throw new Error('CSVが空です'); }
      const {records, errors, header} = Parse.jibunCSV(text, State.selectedItem);
      // 産地CSVと同じく、CSVの品目列が選択中と食い違う時は取り込む前に確認する。
      const other = Array.from(new Set(records.map(r=>r.csvItem).filter(v=>v && v!==State.selectedItem)));
      const run = ()=>App.finishMineImport(records, errors, encoding, header);
      if(other.length){ App.itemMismatchModal(other, records.length, run); return; }
      run();
    }catch(err){
      State.mineImportSummary = `<div class="err-box">取込エラー: ${Fmt.esc(err.message)}</div>`;
      UI.renderMain();
    }
  },
  // 自分CSV取込の後半（品目の確認をはさむ場合があるので分けてある）
  finishMineImport(records, errors, encoding, header){
    const {added, skipped} = Store.mergeJibun(records, 'csv');
    Store.addImportErrors('自分', State.selectedItem, errors, header); // リロードしても残る控えへ積む
    // 取り込み元と品目は画面を見れば分かるので要約には出さない（ユーザー指示 2026-09-07）。
    State.mineImportSummary = `<div class="summary-box ${errors.length||skipped?'warn':''}">
        <span>取込行数: ${records.length}／追加: ${added}${skipped?`／重複スキップ: ${skipped}件`:''}${errors.length?`／エラー行: ${errors.length}件`:''}</span>
        ${App.errorDetailHTML(errors)}
      </div>`;
    UI.renderMain();
    UI.toast(`自分の出荷CSVを取込みました（追加${added}）`);
    // 取込直後：新植/据置の両方を作っている品種に未割当があれば、その場で割り当てを促す
    if(added>0 && Compute.unassignedAllocRows().length>0){ UI.allocModal(); }
  },
  /* 取り込めなかった行を、その場で直して取り込み直す（2026-09-07）。
     元の見出し行をくっつけて、同じ並びで読む。読めた行は消え、まだ読めない行だけ枠に残す。 */
  reimportErrorBlock(id, body){
    const e = Store.importErrors.find(x=>x.id === id);
    if(!e) return;
    const text = (e.header ? e.header + '\n' : '') + body;
    let res;
    try{
      res = (e.kind === '産地')     ? Parse.sanchiCSV(text, e.item)
          : (e.kind === '品目全体') ? Parse.zentaiCSV(text, e.item)
          :                           Parse.jibunCSV(text, e.item);
    }catch(err){
      UI.toast('取り込めませんでした: ' + err.message, {duration:6000});
      return;
    }
    if(e.kind === '産地') Store.mergeSanchi(res.records);
    else if(e.kind === '品目全体') Store.mergeZentai(res.records);
    else Store.mergeJibun(res.records, 'csv');
    const took = res.records.length;
    // 残ったエラー行だけを枠に戻す（行番号は見出し行のぶんだけずれるので付け直さない）
    Store.updateImportErrors(id, res.errors);
    if(e.kind === '産地') SelfTest.run();
    UI.renderMain();
    if(res.errors.length){
      UI.toast(`${took}行を取り込みました。${res.errors.length}行はまだ読めないので残しています`, {duration:6000});
    } else {
      UI.toast(`${took}行を取り込みました`);
    }
  },
  async handleBackupFile(file){
    try{
      const {text} = await Parse.readFileSmart(file);
      const data = JSON.parse(text);
      State.pendingBackup = data;
      const sCount = (data.sanchi||[]).length, jCount = (data.jibun||[]).length;
      UI.modal('バックアップから復元', `産地データ ${sCount}件・自分の出荷 ${jCount}件を読み込みます。現在の端末内データはすべて置き換えられます。よろしいですか？`, {
        confirmLabel:'復元する',
        onConfirm:()=>{
          Store.importBackup(State.pendingBackup);
          SelfTest.run();
          State.selectedVariety = MAJOR_VARIETY_KEY;
          UI.route('sanchi');
          UI.toast('バックアップから復元しました');
        }
      });
    }catch(err){
      UI.toast('読み込みに失敗しました: ' + err.message);
    }
  },
  exportBackup(){
    const payload = Store.exportBackup();
    const text = JSON.stringify(payload, null, 2);
    const ts = payload.exportedAt.slice(0,10);
    // ダウンロードはサンドボックス（Artifactプレビュー）では無言でブロックされるため、
    // コピー/ダウンロードのモーダルを出し、実際に取得できた時だけ「バックアップ済み」にする。
    UI.backupExportModal(text, `curcuma-backup-${ts}.json`);
  },
  // ファイル保存の共通ルート。
  // Artifact内では <a download> が黙って無視されるため、あればホストの保存機能を使う。
  // 戻り値: {ok:true} / {ok:false, code:'declined'|'unavailable'|...}
  async saveFile(name, text, opts){
    opts = opts || {};
    const data = opts.bom ? '﻿' + text : text;
    const dl = (typeof window !== 'undefined') && window.claude && window.claude.downloads;
    if(dl && typeof dl.save === 'function'){
      try{
        await dl.save({filename:name, data});
        return {ok:true};
      }catch(err){
        const code = (err && err.code) || 'unavailable';
        // csv等は環境により未対応。拡張子違いの代替名があれば一度だけ再試行
        if(code === 'extension_not_enabled' && opts.altName){
          try{
            await dl.save({filename:opts.altName, data});
            return {ok:true, savedAs:opts.altName};
          }catch(err2){
            return {ok:false, code:(err2 && err2.code) || 'unavailable'};
          }
        }
        return {ok:false, code};
      }
    }
    // ファイルを直接開いている場合の従来ルート
    try{
      const blob = new Blob([data], {type: opts.mime || 'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      return {ok:true};
    }catch(e){
      return {ok:false, code:'unavailable'};
    }
  },
  // 保存失敗時の案内文（コピー導線に誘導）
  saveErrorMessage(code){
    switch(code){
      case 'declined': return 'キャンセルしました';
      case 'rate_limited': return '保存の確認が混み合っています。少し待ってからもう一度お試しください';
      case 'too_large': return 'ファイルが大きすぎて保存できません。コピーをお使いください';
      case 'extension_not_enabled':
      case 'rejected_extension': return 'この形式は保存できません。コピーをお使いください';
      default: return 'この環境では保存できませんでした。コピーをお使いください';
    }
  },
  csvCell(v){
    const s = (v==null ? '' : String(v));
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  },
  // 階級＋本数を画面表示用の短い規格表記にする（2Lは常に本数付き、他は50以外のみ付与）。
  // 等級は表示しない＝クルクマは常に「秀」なので出しても情報が増えないため。
  // ※ 出荷明細・モーダルの見た目を変えないための関数。内部の分類には使わない。
  specToStr(size, count){
    const letter = String(size||'');
    if(letter==='2L') return '2L' + count;
    return letter + (Number(count)!==50 ? count : '');
  },
  // 書き出しCSVには必ず品目列を入れる。入れずに書き出すと、別の品目を選んだ状態で
  // 読み戻したときに食い違い確認が働かず、丸ごと別品目のデータに化ける。
  buildSanchiCSV(rows){
    const head = '日付,品目,品種,等級,階級,本数,箱数量,箱単価';
    const out = rows.slice()
      .sort((a,b)=> a.date.localeCompare(b.date) || a.variety.localeCompare(b.variety))
      .map(r=>[r.date, (r.item||DEFAULT_ITEM), r.variety, r.grade, (r.size||''), r.count, r.boxQty, (r.boxPrice==null ? '未確定' : r.boxPrice)].map(App.csvCell).join(','));
    return {text:[head, ...out].join('\r\n'), rows:out.length};
  },
  buildJibunCSV(rows){
    const head = '出荷日,品目,品種名,等級,階級,本数,箱数,別本数';
    const out = rows.slice()
      .sort((a,b)=> a.date.localeCompare(b.date) || a.variety.localeCompare(b.variety))
      .map(r=>{
        const betsu = r.betsuCount>0 ? r.betsuCount : '';
        return [r.date, (r.item||DEFAULT_ITEM), r.variety, r.grade, (r.size||''), r.count, r.boxQty, betsu].map(App.csvCell).join(',');
      });
    return {text:[head, ...out].join('\r\n'), rows:out.length};
  },
  // 品目全体データの書き出し。取り込んだ形（資料と同じ列）でそのまま出す。
  buildZentaiCSV(rows){
    const head = '日付,品目,箱数,売立金額,箱平均価格';
    const out = rows.slice()
      .sort((a,b)=> a.date.localeCompare(b.date))
      .map(r=>[r.date, (r.item||DEFAULT_ITEM), r.boxes, r.amount, r.avgPrice].map(App.csvCell).join(','));
    return {text:[head, ...out].join('\r\n'), rows:out.length};
  },
  /* 書き出すファイルを組み立てる。year が空文字なら全年度。
     保存タブには年度バーが無いので、年度はモーダルの中で選ぶ（2026-09-07）。 */
  csvSectionsFor(item, year){
    const {sanchi, jibun, zentai} = Compute.rowsForExport(item, year);
    const ts = new Date().toISOString().slice(0,10);
    // ファイル名に品目と年度を入れる。入れないと年度を続けて書き出したとき同じ名前になる。
    const tag = `${item}-${year ? year+'年度' : '全年度'}`;
    const sections = [];
    if(sanchi.length){ const s = App.buildSanchiCSV(sanchi); sections.push({name:'産地データ', filename:`curcuma-産地-${tag}-${ts}.csv`, text:s.text, rows:s.rows}); }
    if(zentai.length){ const z = App.buildZentaiCSV(zentai); sections.push({name:'品目全体データ', filename:`curcuma-品目全体-${tag}-${ts}.csv`, text:z.text, rows:z.rows}); }
    if(jibun.length){ const j = App.buildJibunCSV(jibun); sections.push({name:'自分の出荷', filename:`curcuma-自分-${tag}-${ts}.csv`, text:j.text, rows:j.rows}); }
    return sections;
  },
  exportCSV(){
    const item = State.selectedItem || DEFAULT_ITEM;
    const years = Compute.yearsWithData(item);
    if(!years.length){ UI.toast(`「${item}」には書き出すデータがありません`); return; }
    // 既定＝表示中の年度。その年度にデータが無ければ一番新しい年度から始める。
    const year = years.includes(String(State.selectedYear)) ? String(State.selectedYear) : years[0];
    UI.csvExportModal(item, year);
  },
  submitManual(form){
    const fd = new FormData(form);
    let variety = Norm.text(fd.get('variety'));
    if(variety==='__other__'){ variety = Norm.text(fd.get('varietyOther')); } // 「その他」選択時は自由入力欄を採用
    const specRaw = Norm.text(fd.get('spec'));
    const date = Norm.date(fd.get('date'));
    const boxQty = Norm.num(fd.get('boxQty'));
    let grade = '', size = '', count = NaN, betsuCount = 0;
    if(specRaw==='別'){
      grade = '別'; size = ''; count = 0; betsuCount = Norm.num(fd.get('betsuCount'));
      if(!(betsuCount>0)){ UI.toast('別本数を入力してください'); return; }
    } else {
      const spec = Parse.parseSpec(specRaw);
      // 手入力の規格プルダウンは階級＋本数だけを持つので、等級は品目の既定で補う
      if(spec){ grade = itemRule(State.selectedItem || DEFAULT_ITEM).defaultGrade || '秀'; size = spec.size; count = spec.count; }
    }
    if(!date || !variety || !grade || Number.isNaN(count) || Number.isNaN(boxQty) || boxQty<=0){
      UI.toast('入力内容を確認してください');
      return;
    }
    const {added, skipped} = Store.mergeJibun([{date, variety, grade, size, count, boxQty, betsuCount}], 'manual');
    // 追加後も日付と品種は保持（同じ日・同じ品種で規格違いを連続入力しやすく）。規格・箱数は再描画で既定に戻る。
    if(added){
      // プルダウンにある品種のみ復元（「その他」自由入力は既定へ戻す）
      const registered = new Set(Compute.itemSakutsukeVarieties());
      State.mineVariety = registered.has(variety) ? variety : null;
    }
    UI.renderMain();
    UI.toast(added ? '追加しました' : '同じ内容が既に登録されています');
  },
  submitSakutsuke(form){
    const fd = new FormData(form);
    const variety = Norm.text(fd.get('variety'));
    const type = Norm.text(fd.get('type'))==='据置' ? '据置' : '新植';
    const tsubo = Norm.num(fd.get('tsubo'));
    if(!variety || !(tsubo>0)){
      UI.toast('品種と面積（坪）を入力してください');
      return;
    }
    Store.addSakutsuke({variety, type, tsubo});
    UI.renderMain();
    UI.toast('作付を追加しました');
  }
};

App.init();

// 開発用の隠しフック（画面には出ない）。
// 使い方（DevToolsコンソール）:
//   __curcumaDev.selfTest()   → 価格計算の回帰チェック。[SelfTest] OK が出れば正常。
//   __curcumaDev.diag()       → 件数の一覧。改修の前後でこの数値が動かないことを確認する。
//   __curcumaDev.loadSample() → サンプル読込（※本番データを全消去するので注意）
window.__curcumaDev = {
  loadSample(){
    Store.loadSample();
    SelfTest.run();
    State.selectedVariety = MAJOR_VARIETY_KEY;
    State.sanchiImportSummary = '';
    State.mineImportSummary = '';
    UI.route('sanchi');
    return 'サンプルを読み込みました（開発用）';
  },
  selfTest(){ return SelfTest.run(); },
  // 改修の前後で突き合わせる基準値。matched/unmatched は表示中の年度×品目に対する値なので、
  // 比較するときは scope が同じであることを必ず確認する。
  diag(){
    const byItem = {};
    const bump = (kind, name)=>{
      const k = name || DEFAULT_ITEM;
      if(!byItem[k]) byItem[k] = {産地:0, 自分:0, 作付:0, 品目全体:0};
      byItem[k][kind]++;
    };
    Store.itemNames().forEach(n=>{ if(!byItem[n]) byItem[n] = {産地:0, 自分:0, 作付:0, 品目全体:0}; });
    Store.sanchi.forEach(r=>bump('産地', r.item));
    Store.jibun.forEach(r=>bump('自分', r.item));
    Store.sakutsuke.forEach(r=>bump('作付', r.item));
    Store.zentai.forEach(r=>bump('品目全体', r.item));
    const m = Compute.matchJibun();
    const d = {
      build: APP_BUILD,
      schema: SCHEMA_VERSION,
      scope: `${State.selectedYear} / ${State.selectedItem}`,
      'sanchi.size': Store.sanchi.size,
      'jibun.length': Store.jibun.length,
      'sakutsuke.length': Store.sakutsuke.length,
      'zentai.size': Store.zentai.size,
      matched: m.filter(r=>r.matched).length,
      unmatched: m.filter(r=>!r.matched).length,
      pending: m.filter(r=>r.matched && r.pending).length
    };
    console.info('[diag]', d);
    console.table(byItem);
    return d;
  }
};
